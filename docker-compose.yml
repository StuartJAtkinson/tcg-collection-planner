services:
  postgres:
    image: postgres:17-alpine
    container_name: card-collection-db
    environment:
      POSTGRES_USER: cards
      POSTGRES_PASSWORD: cards
      POSTGRES_DB: cards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cards"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
