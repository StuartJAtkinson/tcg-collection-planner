<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Collector — UI format draft</title>
<link rel="stylesheet" href="./draft.css">
</head>
<!-- The app owns the viewport: header and subheader are fixed-height rows and
     whichever pane is active scrolls inside itself. That's what lets an open
     selector fill the window and take over the scrollbar. -->
<!-- The whole UI renders at 0.8. `zoom` rather than a transform, because zoom is
     a layout property: the boxes really are smaller, so everything still flows,
     wraps and scrolls as itself. The height is divided back out — vh units are
     viewport-relative and zoom does NOT scale them, so a plain h-screen inside
     would render at 80% of the window and leave a fifth of it blank. -->
<body class="h-[125vh] overflow-hidden bg-neutral-950 text-neutral-100 [zoom:0.8]">
<div id="app" class="flex h-full flex-col"></div>

<script src="sets.js"></script>
<script>
/* ============================================================================
   UI FORMAT DRAFT — no data, no queries, no server. Every number is fake.

   FOUR SURFACES. That's the whole app.

     ⚙ Config        top-left, standard app position
     Printings       the set list (scryfall.com/sets shape: sub-sets indented
                     under their parent). Fixed sort — block date, then sub-set
                     date, newest first. Click a set → Search, scoped to it.
     Search          ONE page. Everything that isn't Config/Printings/Import is
                     this page with a different scope:
                         Game → (Set | Binder | Deck | All) → card anatomy
                     Binders and Decks in the nav call the same function.
     Import          one alias table, not nine parsers. Export is the same map
                     run backwards, and lives in each page's subheader.

   SORT carries a BREAK element. Everything left of the break is the grouping;
   the layout decides what a break means:
     grid → new row · compact/text → rule · binder → new page · deck → section
   ========================================================================= */

/* ---- design tokens: verbatim from app/components/chip.ts -------------- */
const CHIP_NEUTRAL = 'inline-flex items-center justify-between gap-1 cursor-pointer whitespace-nowrap rounded-full border border-neutral-700 px-3 py-1 text-xs text-neutral-300 hover:border-neutral-500';
const CHIP_PLUS    = 'inline-flex items-center justify-between gap-1 cursor-pointer whitespace-nowrap rounded-full border border-emerald-500 bg-emerald-500/10 px-3 py-1 text-xs text-emerald-300';
const CHIP_MINUS   = 'inline-flex items-center justify-between gap-1 cursor-pointer whitespace-nowrap rounded-full border border-rose-500 bg-rose-500/10 px-3 py-1 text-xs text-rose-300';
const BTN_PRIMARY  = 'cursor-pointer rounded-full border border-emerald-600 bg-emerald-600 px-3 py-1 text-xs font-semibold text-white hover:bg-emerald-500';
const BTN_SECONDARY= 'cursor-pointer rounded-full border border-neutral-700 px-3 py-1 text-xs text-neutral-300 hover:border-neutral-500';
const BTN_PRIMARY_LG   = 'cursor-pointer rounded-full border border-emerald-600 bg-emerald-600 px-4 py-1.5 text-sm font-semibold text-white hover:bg-emerald-500';
const BTN_SECONDARY_LG = 'cursor-pointer rounded-full border border-neutral-700 px-4 py-1.5 text-sm text-neutral-300 hover:border-neutral-500';
const BTN_DANGER   = 'cursor-pointer rounded-full border border-red-900/60 bg-red-900/60 px-3 py-1 text-xs text-red-200 hover:border-red-700 hover:bg-red-800/70';
const FIELD        = 'rounded border border-neutral-700 bg-neutral-950 px-2 py-1.5 text-sm text-neutral-100';
const PANEL        = 'rounded-xl border border-neutral-800 bg-neutral-900/50';

/* Counts are exact while an exact count is worth reading, and abbreviated once
   it isn't: nobody reconciles 107,565 against a bar, and the comma grouping was
   costing more width than the extra digits were worth. */
const num = n => n < 10000 ? String(n) : `${Math.round(n / 100) / 10}k`;

/* One entry per game — this is the whole "ready for another TCG" claim. The
   anatomy is a spec, not markup: adding a game is data, not a new component.
   `sort` differs too (mana/colour vs hp/type); the selector, break and the
   display types are universal. */
const GAMES = {
  mtg: {
    label: 'Magic', total: num(MTG_CARDS),
    sets: `${num(SETS.length)} sets &middot; ${num(MTG_CARDS)} cards`,
    sort: ['name','set','release','number','rarity','mana','colour','price','language'],
    anatomy: [
      ['chips', 'Legality', [['Standard',41],['Pioneer',68],['Modern',92],['Legacy',131],['Vintage',134],['Commander',129],['Pauper',54],['Brawl',44]], { cols: 2, note: 'legal in' }],
      ['combos'],
      ['range', 'Mana value', null, { symbols: true }],
      ['chips', 'Type', [['Creature',58],['Instant',22],['Sorcery',18],['Artifact',12],['Enchantment',9],['Planeswalker',3],['Land',15],['Battle',0]], { cols: 3 }],
      ['chips', 'Subtype', [['Human',14],['Elf',9],['Goblin',7],['Equipment',4],['Aura',6],['Saga',0]], { cols: 3, note: 'from the type line' }],
      ['chips', 'Keywords', [['Flying',8],['Trample',5],['Exalted',6],['Landfall',3]], { cols: 2 }],
      ['chips', 'Rarity', [['Common',60],['Uncommon',40],['Rare',35],['Mythic',10]], { cols: 2 }],
      ['chips', 'Language', [['en',131],['de',9],['ja',5]], { cols: 3, other: true }],
      ['range', 'Power', null, { other: true }],
      ['range', 'Toughness', null, { other: true }],
      ['chips', 'Finish', [['Nonfoil',138],['Foil',41],['Etched',0]], { cols: 3, other: true }],
      ['chips', 'Artist', [['Wayne Reynolds',4],['Jesper Ejsing',3],['Chris Rahn',3]], { cols: 2, other: true }],
    ],
  },
  pokemon: {
    label: 'Pok&eacute;mon', total: num(21904), sets: `162 sets &middot; ${num(21904)} cards`,
    sort: ['name','set','number','rarity','hp','type','price','language'],
    anatomy: [
      ['chips', 'Legality', [['Standard',74],['Expanded',148],['Unlimited',252]], { cols: 2, note: 'legal in' }],
      ['chips', 'Type', [['Grass',41],['Fire',38],['Water',45],['Lightning',30],['Psychic',34],['Fighting',36],['Darkness',21],['Metal',19],['Colorless',52],['Dragon',6]], { cols: 3, note: 'energy' }],
      ['range', 'HP'],
      ['chips', 'Card type', [['Pok&eacute;mon',186],['Trainer',48],['Energy',18]], { cols: 3 }],
      ['chips', 'Stage', [['Basic',94],['Stage 1',52],['Stage 2',28],['V',12],['ex',9]], { cols: 3, note: 'evolution' }],
      ['chips', 'Rarity', [['Common',88],['Uncommon',54],['Rare',31],['Holo Rare',18],['Illustration Rare',6]], { cols: 2 }],
      ['chips', 'Language', [['en',164],['ja',38]], { cols: 3, other: true }],
      ['range', 'Retreat cost', null, { other: true }],
      ['chips', 'Finish', [['Normal',151],['Holofoil',33],['Reverse holo',18]], { cols: 3, other: true }],
      ['chips', 'Illustrator', [['Mitsuhiro Arita',9],['Ken Sugimori',7],['Atsuko Nishida',4]], { cols: 2, other: true }],
    ],
  },
};

/* Magic's mark is the real one, out of the Mana font the repo already ships
   (public/fonts/mana.woff2) — the planeswalker symbol, Magic's icon-form logo.
   The MAGIC wordmark is in there too (ms-watermark-mtg) but it's a wide lockup
   that turns to mush at 32px. Pokémon has no glyph in that font, so its
   pokéball is drawn in CSS. */
const GameMark = (g, size = 'h-8 w-8 text-2xl') => g === 'pokemon'
  ? `<span class="${size} inline-flex shrink-0 items-center justify-center rounded-full border-2 border-neutral-950 bg-gradient-to-b from-red-500 from-50% to-neutral-100 to-50% shadow"><span class="h-1/4 w-1/4 rounded-full border-2 border-neutral-950 bg-white"></span></span>`
  : `<span class="${size} inline-flex shrink-0 items-center justify-center text-amber-400"><i class="ms ms-watermark-planeswalker"></i></span>`;

/* ---- the one state object --------------------------------------------
   Every browse tab has the same shape: a SELECTOR band under the header, then
   filter / sort / view. The selector is expanded (the list of sets, binders or
   decks) until you pick one, at which point it collapses to a subheader with
   the title and its numbers. Clicking that subheader re-opens it. Search is the
   one tab with nothing to select — it IS all cards. */
const TABS = {
  printings: { label: 'Printings',     one: 'set',    all: 'All sets',    keyed: false },
  binders:   { label: 'Binders',       one: 'binder', all: 'All binders', keyed: true  },
  decks:     { label: 'Decks',         one: 'deck',   all: 'All decks',   keyed: true  },
  io:        { label: 'Import' },
  search:    { label: 'Search' },
};
/* what each tab's selector lists: [name, line1, line2] */
/* Binders carry their page SHAPE as data, not as prose in the description: the
   binder layout lays out that many pockets, and the Zoom row states it. A real
   binder is bought as 3x3 or 4x3 and the collection is arranged to it, so it is
   a property of the binder rather than a display preference. */
/* A binder used to state its own size ("3016 cards &middot; 336 pages") and the
   page then drew 18. A binder has no membership stored anywhere, so its size is
   not a fact about the binder — it is a count of whatever the tab is showing,
   and every binder reports the same pool until membership exists. Written-down
   counts only look right; these move with the data and with the x by y. */
/* What a binder HOLDS, as a rule over the catalogue rather than a stored list.
   Every binder drawing the same 18 mock cards was the tab having no idea what
   was in it; a rule gives each one its own cards, its own count and its own
   page count, and it costs one predicate per binder. It is not the real answer
   — the real answer is holdings, which arrive with the Collectr import — but a
   rule is derived from the catalogue rather than typed in, so it cannot drift
   out of step with it the way "3016" did. Unsorted has no rule of its own: it
   is defined as the remainder, which is what its description already said. */
const DUALS = new Set(['Tundra', 'Underground Sea', 'Badlands', 'Taiga', 'Savannah', 'Scrubland',
  'Volcanic Island', 'Bayou', 'Plateau', 'Tropical Island', 'Flooded Strand', 'Polluted Delta',
  'Bloodstained Mire', 'Wooded Foothills', 'Windswept Heath', 'Marsh Flats', 'Scalding Tarn',
  'Verdant Catacombs', 'Arid Mesa', 'Misty Rainforest']);
const STAPLES = new Set(['Sol Ring', 'Arcane Signet', 'Command Tower', 'Cultivate', "Kodama's Reach",
  'Swords to Plowshares', 'Path to Exile', 'Counterspell', 'Cyclonic Rift', 'Rhystic Study',
  'Smothering Tithe', 'Beast Within', 'Chaos Warp', 'Demonic Tutor', 'Vampiric Tutor',
  'Lightning Greaves', 'Swiftfoot Boots', 'Skullclamp', 'Solemn Simulacrum', 'Eternal Witness',
  "Sensei's Divining Top", 'Blasphemous Act', 'Toxic Deluge', 'Craterhoof Behemoth', 'Mana Crypt']);
const ALARA = ['ALA', 'CON', 'ARB'];
const BINDER_RULE = {
  'Alara block': c => ALARA.includes(c.set),
  'Duals &amp; fetches': c => DUALS.has(c.n),
  'Commander staples': c => STAPLES.has(c.n),
};
const binderHolds = name => BINDER_RULE[name]
  || (c => !Object.values(BINDER_RULE).some(r => r(c)));
const LISTS = {
  binders: [
    ['Alara block', 'sorted colour &rsaquo; rarity', [3, 3]],
    ['Unsorted', 'everything not in another binder', [3, 3]],
    ['Duals &amp; fetches', 'sorted set &rsaquo; number', [2, 2]],
    ['Commander staples', 'sorted colour', [4, 3]],
  ],
  decks: [
    ['Mono-Red Burn', 60, '23 distinct', 'legacy &middot; complete'],
    ['Bant Exalted', 60, '27 distinct', 'modern &middot; 4 missing'],
    ['Jeskai Monks', 60, '31 distinct', 'modern &middot; complete'],
    ['Grixis Control', 75, '44 distinct', 'commander &middot; 11 missing'],
  ],
};

const P = {
  game: null,
  tab: 'search',
  // Selections do NOT survive navigation: clicking a tab always lands you on
  // its full list with nothing chosen. A remembered selection means the tab
  // shows you something different depending on where you'd been, which is the
  // kind of hidden state that makes a page feel like it's arguing with you.
  pick: { printings: null, binders: null, decks: null },
  open: true,      // is the selector band expanded?
  zoom: 1,         // card size, off the Zoom stepper — 1 is the designed size
  dims: [3, 3],    // page shape for binders when none is picked to own it
  across: 4,       // binder pages shown side by side; even, because a page faces one
  sort: [],              // applied — what the results are actually ordered by
  sortDraft: [],         // staged — what you're building on the bar
  view: null,
  ask: null,             // the one question the hovering button asks
  draw: null,            // a drawn pool, or null — set pages only
  card: null,            // the card you clicked through to, or null
  matched: false,        // has that card been matched to a printing yet?
  face: 'frame',         // card page image slot: our drawn frame, or the printed card
  colours: [],           // colour slicer selection — empty means every combination
  cost: [],              // X / Snow / Phyrexian — independent, none applied by default
  comboMode: 'contained',// 'contained' (made of nothing but these) | 'exact'
};
/* A tab is also the way back. Clicking it clears whatever was selected and
   reopens the list — including the two cases an href alone can't reach: you're
   already on that tab (the hash doesn't change, so nothing fires) or you're off
   on a card page (the tab isn't the route, so the href changes it but the
   selection underneath survives). Same effect as Back, from anywhere. */
function goTab(k) {
  clearPicks();
  P.card = null;
  P.tab = k;
  if (location.hash === '#/' + k) render();   // href won't fire; do it ourselves
}
const clearPicks = () => { P.pick = { printings: null, binders: null, decks: null }; P.open = true; };
/* Every source the app pulls from, in ONE shape — because they had drifted into
   three. Card data had bulk/live chips in the data column, card art had
   hotlink/size chips over in the behaviour column, and pack art had no row at
   all. A source is four facts: what it gives, whether it's local or online,
   which variant, and what that variant costs. Local and online are named the
   same for all of them; the side that doesn't exist says why rather than going
   missing, so every row can be read the same way.
   Sizes marked GB/MB against a card count are derived, not typed — the reason
   art is hotlinked is that number, and a typed number would drift off it. */
const bytes = n => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n >= 1e6 ? Math.round(n / 1e6) + ' MB' : Math.round(n / 1e3) + ' KB';
const PACK_COUNT = Object.values(PACK_ART).reduce((n, o) => n + Object.keys(o).length, 0);
const SOURCES = {
  scryfall: { name: 'Scryfall', gives: 'card data &middot; set list', def: ['local', 'all_cards'],
    local: 'data/all_cards.jsonl.gz &middot; 372 MB &middot; pulled 2026-08-06 04:10',
    online: 'api.scryfall.com &middot; 10/s, 2/s on search &mdash; ~15 hours for a 108k catalogue',
    q: [['oracle_cards', '23 MB'], ['default_cards', '74 MB'], ['all_cards', '372 MB &middot; every language'],
        ['unique_artwork', '36 MB'], ['rulings', '5 MB']] },
  sfart: { name: 'Scryfall images', gives: 'card art', def: ['online', 'art_crop'],
    local: () => `${num(MTG_CARDS)} cards &times; the size below &mdash; ${bytes(MTG_CARDS * 1e5)} at normal`,
    online: 'cards.scryfall.io &middot; unrated-limited, and what Scryfall asks for',
    q: [['art_crop', '626&times;457'], ['small', '146&times;204'], ['normal', '488&times;680'],
        ['large', '672&times;936'], ['png', '745&times;1040']] },
  mtgjson: { name: 'MTGJSON', gives: 'printings &middot; booster collation &middot; sealed products', def: ['local', 'AllPrintings'],
    local: 'data/AllPrintings.json.gz &middot; 177 MB &middot; pulled 2026-08-06 04:22',
    online: null, why: 'MTGJSON publishes files, not an API',
    q: [['AllPrintings', 'every set'], ['Standard', ''], ['Modern', ''], ['Legacy', ''], ['psql', 'a Postgres dump']] },
  prices: { name: 'MTGJSON prices', gives: 'price history', def: ['local', 'AllPrices'],
    local: 'data/AllPrices.json.gz &middot; 250 MB &middot; nightly',
    online: null, why: 'same source, same files',
    q: [['AllPrices', '90 days'], ['AllPricesToday', 'today only']] },
  /* The local side costs FOUR TIMES the online one and is still the better
     buy: the CDN's 26 KB is a JPEG on a white card, the 118 KB is a PNG that has
     already been cut out, white balanced, levelled and saturated. The difference
     is the alpha channel and the post-processing — paid once by gen-packs.mjs
     instead of by a canvas pass per picture per page, forever. 118 KB is
     measured over the fetched set, not guessed. */
  tcg: { name: 'TCGplayer', gives: 'booster pack art', def: ['online', '200w'],
    local: () => `packs/ &middot; ${PACK_COUNT} packs over ${Object.keys(PACK_ART).length} sets &mdash; ${
      bytes(PACK_COUNT * 118e3)} at 200w, trimmed on the way in &middot; <code>node gen-packs.mjs</code>`,
    online: 'tcgplayer-cdn.tcgplayer.com &middot; by product id, trimmed live in the browser',
    q: [['200w', '200&times;366 &middot; 26 KB'], ['in_1000x1000', '525&times;1000 &middot; 82 KB']] },
  ptcg: { name: 'pokemon-tcg-data', gives: 'Pok&eacute;mon card data', def: ['local', 'master'],
    local: 'data/pokemon-tcg-data.tar.gz &middot; 3 MB &middot; a GitHub repo, not an API key',
    online: null, why: 'the API needs a key; the repo behind it does not',
    q: [['master', 'the whole repo']] },
  ptcgart: { name: 'pokemontcg.io', gives: 'Pok&eacute;mon card art', def: ['online', 'small'],
    local: () => `21,904 cards &times; the size below &mdash; ${bytes(21904 * 16e4)} at small`,
    online: 'images.pokemontcg.io &middot; whole cards, frame and all &mdash; there is no art crop',
    q: [['small', '245&times;342 &middot; 160 KB'], ['hires', '734&times;1024 &middot; 845 KB']] },
  mana: { name: 'Mana font', gives: 'mana &amp; set symbols', def: ['local', 'woff2'],
    local: 'mana.woff2 &middot; 32 KB &middot; vendored, already in the repo',
    online: null, why: 'a font you serve is a font that always renders',
    q: [['woff2', 'the only build we ship']] },
};
const CFG = { src: Object.fromEntries(Object.entries(SOURCES).map(([k, s]) => [k, { at: s.def[0], q: s.def[1] }])) };
// a side that doesn't exist can't be selected — the chip says why instead
const setSrc = (k, at) => { if (SOURCES[k][at]) CFG.src[k].at = at; render(); };
const setQuality = (k, q) => { CFG.src[k].q = q; render(); };
let DEBUG = false;
const game = () => GAMES[P.game] || GAMES.mtg;
const tab = () => TABS[P.tab] || TABS.search;
const picked = () => P.pick[P.tab] || null;
// the selector is open until you pick something; clicking the subheader reopens it
const selectorOpen = () => !picked() || P.open;
// rows render as the identity key only inside one binder or one deck
const keyed = () => !!tab().keyed && !!picked();
// what the filter/sort/view below are actually looking at
const scopeLabel = () => picked() || (tab().all ?? `All cards in ${game().label}`);

// BREAK is an element in the sort list; everything left of it is the grouping
/* The display switches live: it only decides how the results are drawn, and
   seeing that is the whole point of choosing one. The sort doesn't — it's an
   ordering over the whole result set, so it stages on the bar and lands on
   Apply, the same contract as the filter. */
function addSort(f) { P.sortDraft = [...P.sortDraft, { f, d: 'a' }]; render(); }
/* One control, three states, same as a filter chip: click to put a field in the
   order ascending, again to reverse it, again to take it out. Colour carries
   the direction — emerald up, rose down — so the row reads without squinting at
   arrows, and it's the same vocabulary the include/exclude chips already use. */
function cycleSort(i) {
  const t = P.sortDraft[i];
  if (t.d === 'a') { t.d = 'd'; render(); } else removeSort(i);
}
function removeSort(i) { P.sortDraft = P.sortDraft.filter((_, j) => j !== i); render(); }
/* Drag to reorder. The list IS the order — including where the break sits — so
   moving a term has to be a drag, not a delete and re-add that loses the rest. */
let dragFrom = null;
function dragSort(i) { dragFrom = i; }
function moveSort(to) {
  if (dragFrom === null || dragFrom === to) return;
  const l = [...P.sortDraft];
  l.splice(to, 0, ...l.splice(dragFrom, 1));
  dragFrom = null; P.sortDraft = l; render();
}
function addBreak() { if (breakAt(P.sortDraft) < 0) P.sortDraft = [...P.sortDraft, { f: 'BREAK' }]; render(); }
function applySort() { P.sort = P.sortDraft.map(t => ({ ...t })); render(); }
function clearSort() { P.sortDraft = []; P.sort = []; render(); }
const sortTerms = l => l.map(t => t.f + (t.d || '')).join(',');
const sortDirty = () => sortTerms(P.sortDraft) !== sortTerms(P.sort);

/* How a binder is filed: colour, then rarity high to low, then a page break —
   so a page is one colour at one rarity — and inside the page, release order,
   set, collector number. Release before set because a release is the block, so
   a set and its sub-sets stay together instead of being split by their codes. */
const BINDER_SORT = [{ f: 'colour', d: 'a' }, { f: 'rarity', d: 'd' }, { f: 'BREAK' },
  { f: 'release', d: 'a' }, { f: 'set', d: 'a' }, { f: 'number', d: 'a' }];
const breakAt = (l = P.sort) => l.findIndex(t => t.f === 'BREAK');
const grouping = () => (breakAt() < 0 ? [] : P.sort.slice(0, breakAt()));
const setView = v => { P.view = v; render(); };

/* Zoom is the card size, not the UI's: the chrome is already set at 0.8 and
   holding still is the point of it. Clamped so a card cannot vanish or take
   the whole pane. */
const zoomPx = n => Math.round(n * P.zoom);
function setZoom(v) { P.zoom = Math.min(2, Math.max(0.5, (+v || 100) / 100)); render(); }
/* The page shape belongs to the BINDER, so editing it writes back to that
   binder and not to a display setting — pick another and it keeps its own.
   With none picked there is nothing to write to, so the tab's own default
   takes the edit instead. */
const dimsOwner = () => LISTS.binders.find(b => b[0] === P.pick.binders)?.[2] || P.dims;
const binderDims = () => dimsOwner();
/* The one place pages get counted. The subheader states a page count and the
   view lays pages out; two sums of the same thing drift, and the written-down
   one was already 336 against a view drawing 2. Both call this. */
const binderPages = (gs) => {
  const [cols, rows] = binderDims();
  const per = cols * rows;
  return gs.flatMap(([g, cs]) => {
    const n = Math.max(1, Math.ceil(cs.length / per));
    return Array.from({ length: n }, (_, k) => [g, cs.slice(k * per, (k + 1) * per), k, n]);
  });
};
function setBinderDim(i, v) {
  dimsOwner()[i] = Math.min(6, Math.max(1, Math.round(+v) || 1));
  render();
}
/* Pages across is not a card size, it is how much binder you have open — the
   cards are then whatever fits, which is why the binder needs no Zoom of its
   own. Even only: a page has a facing page, and an odd count would break a
   spread across two rows. */
function setAcross(v) {
  P.across = Math.min(8, Math.max(2, Math.round((+v || 2) / 2) * 2));
  render();
}

function selectItem(name) { P.pick[P.tab] = name; P.open = false; render(); }
function clearItem() { P.pick[P.tab] = null; P.open = true; render(); }
function toggleSelector() { P.open = !P.open; render(); }

/* ---- helpers ---------------------------------------------------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
// the one placeholder: a field that is genuinely unknown, never a default
const UNK = '<span class="opacity-40">&mdash;</span>';
const money = n => n == null ? UNK : '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const chip = (label, state, extra = '') =>
  `<span class="${state === '+' ? CHIP_PLUS : state === '-' ? CHIP_MINUS : CHIP_NEUTRAL}">${
    state === '+' ? '<b>+</b>' : state === '-' ? '<b>−</b>' : ''}${label}${extra}</span>`;
const count = n => `<span class="text-neutral-500"> ${num(n)}</span>`;

/* Magic's five colours: hue is the game's, only lightness/chroma were free.
   Stepped against the dark surface with the dataviz validator until CVD
   separation (worst adjacent dE 11.3 protan), normal-vision floor (15.5) and
   contrast all pass. Lightness-band and chroma-floor fail by design — White
   must read near-white, Black near-grey. Every swatch carries its letter, so
   identity is never colour alone. */
const MTG = { W: '#f0e6cc', U: '#2f8fe0', B: '#a1919e', R: '#d24439', G: '#5dbe86', C: '#8b8b8b' };
const INK = { W: '#1c1917', U: '#f5f5f5', B: '#1c1917', R: '#f5f5f5', G: '#1c1917', C: '#1c1917' };
/* The real marks, not letters standing in for them — public/fonts/mana.woff2
   carries every one. Codepoints confirmed by rendering the font, not guessed. */
const MANA = { W: '', U: '', B: '', R: '', G: '', C: '' };
const pips = s => [...s].map(c => `<span class="inline-flex h-4 w-4 items-center justify-center rounded-full text-[8.5px] leading-none"
  style="background:${MTG[c] || MTG.C};color:${INK[c] || INK.C}"><i class="ms">${MANA[c] || MANA.C}</i></span>`).join('');
