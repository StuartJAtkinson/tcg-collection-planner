/* The real catalogue: 37.5k cards and 107k printings, generated by gen-cards.mjs
   and fetched once. It is too big to inline the way sets.js is (5.3 MB gzipped),
   so it is the one thing this page goes to the network for — serve.py sends it
   with Content-Encoding: gzip, so fetch().json() inflates it and there is no
   gunzip here. Until it lands, and in check.mjs which renders with no network at
   all, CARD_ROWS still answers: the mocks are the offline fallback now rather
   than the only data. */
let CATALOGUE = null;
// "{1}{G/P}{X}" -> ['1','G/P','X'], which is the token list costPip draws
const costTokens = (s) => (s.match(/\{[^}]+\}/g) || []).map(t => t.slice(1, -1));
/* One object per printing, built once. The oracle fields are shared by reference
   — 107k objects pointing at 37.5k strings — so this costs pointers, not text. */
const materialise = ({ o, p }) => p.map(([oi, set, num, rar, art_id, usd]) => {
  const [n, cost, type, text, pt, col, cmc] = o[oi];
  // qty/foil are holdings, not catalogue: you own nothing until something says so
  return { n, set, num, rar, art_id, usd, col, cmc, type, text, pt,
           cost: costTokens(cost), lang: 'en', qty: 0, foil: 0 };
});
// `seed` skips the fetch and takes the payload as given — how check.mjs, which has
// no network, exercises the catalogue paths the mocks can't reach
async function loadCards(seed) {
  // a seed always wins, so a second one replaces the first — the guard below is
  // about not re-fetching, and a harness that could only seed once could not
  // test two different catalogues
  if (seed) { CATALOGUE = materialise(seed); render(); return; }
  if (CATALOGUE) return;
  if (typeof fetch !== 'function') return;
  try {
    const res = await fetch('cards.json.gz');
    if (!res.ok) return;                       // no catalogue generated yet; mocks stand
    CATALOGUE = materialise(await res.json());
    render();
  } catch { /* offline is a supported state, not an error */ }
}
/* Two accessors, because they answer different questions. ALL is the catalogue —
   what a lookup or a count searches. CARDS is what a view may draw: every list
   here renders its whole input, which was free at 18 mocks and is a hung tab at
   107k printings, so the render path takes a slice and the count says so. */
const CARD_LIMIT = 240;
const ALL = () => (CATALOGUE && P.game === 'mtg') ? CATALOGUE : (CARD_ROWS[P.game] || CARD_ROWS.mtg);
/* What the current scope actually contains. Picking a set and being shown the
   first 240 cards of the catalogue is worse than showing mocks: the cards are
   real, so they read as that set's. The set case is a genuine filter — the
   printing carries its set code. Binders and decks have no membership stored
   anywhere, so they stay on the mocks rather than dress arbitrary catalogue
   cards up as their contents. A BINDER is the exception: it carries a rule
   (`BINDER_RULE`), so it can say which catalogue cards are its own. */
const scopedCards = () => {
  const mocks = CARD_ROWS[P.game] || CARD_ROWS.mtg;
  if (P.tab === 'decks') return mocks;
  const all = ALL();
  if (P.tab === 'binders')
    return all === mocks || !picked() ? mocks : all.filter(binderHolds(picked()));
  // the fallback sample is a fixed dozen from a handful of sets, not a catalogue:
  // filtering it by the picked set empties the page instead of narrowing it
  if (all === mocks) return mocks;
  const r = P.tab === 'printings' && picked() ? setRow() : null;
  return r ? all.filter(c => c.set === r[1]) : all;
};
// sorted BEFORE the cap, or the order only rearranges the arbitrary first 240
const CARDS = () => { const s = sortCards(scopedCards()); return s.length > CARD_LIMIT ? s.slice(0, CARD_LIMIT) : s; };

/* The same five plates as app/components/MockCard.tsx, which is the anatomy of
   a real card: name+cost, art window, type line with the rarity symbol, rules
   and flavour, then the collector bar with power/toughness. Vector, font and one
   hotlinked art crop — the frame still draws without it, which is what the
   resolver needs and what a card with no printing gets.

   Grid, the card page and the kit all render THIS. A "mock card" that only the
   kit page uses is a mock of a mock. */
const FRAME = { W: '#f8f6d8', U: '#0e68ab', B: '#4a4a4a', R: '#d3202a', G: '#00733e', C: '#8c8c8c' };
const PKM_FRAME = { Fire: '#e0762f', Water: '#3b7bc4', Grass: '#4caf50', Lightning: '#e5c62f',
  Psychic: '#a8567a', Fighting: '#b5573a', Colorless: '#9a9a9a', Darkness: '#4b4b52',
  Metal: '#8f9aa3', Dragon: '#6a5acd' };
const RARITY_DOT = { 1: '#3a3a3a', 2: '#c0c9d1', 3: '#d4af37', 4: '#f0713a', 5: '#a76fd1' };
/* Ink is measured, not declared. The real component keeps a DARK_FRAMES set of
   {B, Darkness, Dragon} and puts near-black on everything else — but every plate
   is 45% of the frame over black, so the blue, red and green plates are dark too
   and their names come out unreadable. Brightness of a 45%-over-black mix is 45%
   of the original, so both surfaces fall out of one function. */
const lum = h => { const n = parseInt(h.slice(1), 16);
  return (0.2126 * (n >> 16) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255; };
const ink = l => l > 0.5 ? '#1a1a1a' : '#f0f0f0';
// the dot is the same five tiers in both games; only the words differ
const RARITY_NAME = { mtg: ['Common', 'Uncommon', 'Rare', 'Mythic', 'Special'],
  pokemon: ['Common', 'Uncommon', 'Rare', 'Holo Rare', 'Illustration Rare'] };
const rarityName = r => (RARITY_NAME[P.game] || RARITY_NAME.mtg)[r - 1] || '';
// gold for multicolour, the colour itself for mono, grey for colourless — the
// same rule the real frame uses
const frameOf = c => c.energy ? (PKM_FRAME[c.energy] || '#8c8c8c')
  : !c.col ? '#8c8c8c' : c.col.length > 1 ? '#cfa036' : (FRAME[c.col] || '#8c8c8c');

/* Hotlinked, never stored — Scryfall asks for exactly that, and it's also the
   honest shape: the catalogue holds an id, the image is somebody else's server.
   `art_crop` is the illustration alone, no frame and no text, so it drops
   straight into the art window.

   Pokémon has no equivalent: pokemontcg.io serves whole cards, frame and all.
   ponytail: crop the top of the card with object-position instead of an art
   window that fits. Upgrade path is a real crop, if one ever exists. */
const artUrl = c => c.energy
  ? `https://images.pokemontcg.io/${c.art_id}${CFG.src.ptcgart.q === 'hires' ? '_hires' : ''}.png`
  : `https://cards.scryfall.io/${CFG.src.sfart.q}/front/${c.art_id[0]}/${c.art_id[1]}/${c.art_id}.${
      CFG.src.sfart.q === 'png' ? 'png' : 'jpg'}`;

/* The vendored Mana font carries far more than the five colours, and the rest of
   these codepoints were read off it rather than guessed — rendered as a grid and
   looked at. Digits run consecutively from {0} at E605 up to {15}, so a number is
   arithmetic, not a table.

   What is deliberately NOT here: hybrids ({U/P}, {2/W}). The font draws those by
   halving two glyphs in CSS, not with one codepoint, so they keep the grey disc
   and show their text — which is why {U/P} is in the mock data. */
const SYMBOL = { X: '', Y: '', Z: '', P: '', S: '',
                 T: '', Q: '', E: '' };
const glyphOf = t => MANA[t] || SYMBOL[t]
  || (/^\d+$/.test(t) && +t <= 15 ? String.fromCodePoint(0xe605 + +t) : '');
/* One pip renderer for every size. `box` carries the dimensions and the glyph's
   size; `small` is the text size for the fallback, which has up to three
   characters to fit where a glyph would have been. */
const pipOf = (t, box = 'h-4 w-4 text-[8.5px]', small = 'text-[8px]') => {
  const g = glyphOf(t);
  return g
    ? `<span class="inline-flex ${box} shrink-0 items-center justify-center rounded-full border border-black/40 leading-none"
         style="background:${MTG[t] || '#cdc6bf'};color:${INK[t] || '#1c1917'}"><i class="ms">${g}</i></span>`
    : `<span class="inline-flex ${box} ${small} shrink-0 items-center justify-center rounded-full border border-black/40 bg-neutral-300 px-0.5 font-bold leading-none text-neutral-900">${t}</span>`;
};
const costPip = t => pipOf(t);
/* The same pip on the card face, sized off the face rather than off nothing:
   the list rows keep the px default because they have no card box to measure. */
const facePip = t => pipOf(t, 'h-[1.45em] w-[1.45em] text-[0.77em]', 'text-[0.73em]');
/* Rules text is written with the symbols inline — "{T}: Add {G}" — and printing
   the braces is not rendering them. Pips size in em so they follow textFit down
   as the box gets tighter. Only angle brackets are escaped, not ampersands: the
   mock rows carry entities like &mdash; in their text and type lines, and
   escaping those would print them literally. */
const symbolise = s => String(s ?? '')
  .replace(/[<>]/g, m => (m === '<' ? '&lt;' : '&gt;'))
  .replace(/\{([^{}]{1,6})\}/g, (_, t) => pipOf(t.toUpperCase(), 'h-[1.2em] w-[1.2em] text-[0.68em] align-[-0.15em]', 'text-[0.55em]'));
const energyPip = t => `<span class="inline-flex h-[1.45em] w-[1.45em] shrink-0 items-center justify-center rounded-full border border-black/40 text-[0.82em] font-bold text-black/80"
  style="background:${PKM_FRAME[t] || '#8c8c8c'}">${t[0]}</span>`;
// mana value: generic pips count as their number, everything else as one
const manaValue = c => (c.cost || []).reduce((t, x) => t + (/^\d+$/.test(x) ? +x : x === 'X' ? 0 : 1), 0);
/* Shrink to fit without measuring, the way a paper card does — but the steps are
   MEASURED, not guessed. Each threshold is the length at which that size starts
   to overflow the rules box in the grid, read off the rendered page: 12px goes
   over at 144 characters, 11px at 207, 10px at 274, 9px at 372, and the rest
   follow the same 1/size² curve. A first pass pitched by eye put 120 of 240
   cards over their box, which is worse than text that is merely small.
   Roughly a tenth is left as headroom, because the box grows and shrinks with
   the column count and the ladder cannot see it.

   The very longest cards (oracle text reaches 1,489 characters) still clip: no
   readable size fits that in this box, so they bottom out rather than pretend.

   The steps are `em`, not px, and the face anchors one root size to its own
   width in `cqw`. Px meant a card drawn at 200% zoom was twice the box with the
   same 11px type in it — the shrink-to-fit had shrunk to fit a card that no
   longer existed. Sizing off the container makes zoom, the column count and a
   binder pocket all the same question, which is the caveat this comment used to
   carry: the ladder can now see the box. */
const textFit = n => n > 560 ? 'text-[0.55em]' : n > 430 ? 'text-[0.64em]' : n > 300 ? 'text-[0.73em]'
  : n > 240 ? 'text-[0.82em]' : n > 180 ? 'text-[0.91em]' : n > 125 ? 'text-[1em]'
  : n > 108 ? 'text-[1.09em]' : 'text-[1.18em]';
/* The title and type bars shrink the same way rather than ellipsing. A name is
   worth more whole and small than clipped at full size — "Hanweir, the Writhing
   Township" tells you which card it is; "Hanweir, the Writh…" makes you open it.
   Both bars share their row with something else, so the length that matters is
   the text plus what sits beside it: the cost pips on the title, the set symbol
   on the type line. `truncate` stays underneath as the backstop for the name no
   step is small enough for. */
const nameFit = n => n > 40 ? 'text-[0.68em]' : n > 34 ? 'text-[0.77em]' : n > 28 ? 'text-[0.86em]'
  : n > 23 ? 'text-[1em]' : n > 19 ? 'text-[1.09em]' : 'text-[1.18em]';
const typeFit = n => n > 44 ? 'text-[0.59em]' : n > 36 ? 'text-[0.68em]' : n > 30 ? 'text-[0.77em]' : n > 25 ? 'text-[0.82em]' : 'text-[0.91em]';

/* The only field a card must have is its NAME. Everything else — set, number,
   language, finish, cost, type, rarity, artist, art — is unknown until the line
   is matched to a printing, and /resolve proves it: it draws this frame from a
   scanned line before any of that exists. So every slot below degrades on its
   own, and nothing is invented to fill one. A grey frame with a name in it is a
   card; a frame that says "Common" because rarity was missing is a lie. */
/* `fit` sizes the card off its container's HEIGHT instead of its width, for the
   one place that has a fixed amount of room and a fixed number of cards to put
   in it. Everywhere else the card fills its column and the page grows. */
/* Built once: MockCard looks a set up per card, and 240 linear scans of 986 rows
   per render is a scan too many. */
const SET_BY_CODE = new Map(SETS.map(r => [r[1], r]));
const setIconUrl = (code) => {
  const r = code && SET_BY_CODE.get(code.toUpperCase());
  return r ? `https://svgs.scryfall.io/sets/${r[8] || r[1].toLowerCase()}.svg` : '';
};
/* The set symbol, inked by rarity — which is how a real card tells you both at
   once, in the one place on the frame that carries them. It is an external SVG,
   so it cannot be recoloured as an image; it is a MASK over a rarity-coloured
   box instead, which tints the shape and needs no CORS.

   Falls back to the plain disc, which is all Pokémon can have (no Scryfall icon
   exists for those sets) and all an unmatched line deserves: a card whose set is
   unknown must not borrow a symbol. */
const rarityMark = (c) => {
  const url = c.energy ? '' : setIconUrl(c.set);
  const tip = `${c.set ? `${c.set} &middot; ` : ''}${c.rar ? rarityName(c.rar) : 'rarity unknown'}`;
  const ink = c.rar ? RARITY_DOT[c.rar] : '#8c8c8c';
  return url
    ? `<span class="inline-block h-3 w-3 shrink-0 ${c.rar ? '' : 'opacity-40'}" title="${tip}"
         style="background:${ink};-webkit-mask:url('${url}') center/contain no-repeat;mask:url('${url}') center/contain no-repeat"></span>`
    : `<span class="inline-block h-2 w-2 shrink-0 rounded-full border border-black/40 ${c.rar ? '' : 'opacity-40'}"
         title="${tip}" style="${c.rar ? `background:${ink}` : ''}"></span>`;
};

const MockCard = (c, fit) => {
  const bg = frameOf(c);
  const plate = `background:color-mix(in srgb, ${bg} 45%, #000);color:${ink(lum(bg) * 0.45)}`;
  const atk = (c.atk || []).map(a => a.n + (a.t || '')).join(' ');
  const size = textFit((c.text || '').length + atk.length + (c.flav || '').length);
  /* The black edge is padding on a wrapper, not a border: border-width takes no
     percentage, so the real component's fixed 7.84px (3.5% of its fixed w-56) can't
     follow a card that's now as wide as its grid track. Percentage padding resolves
     against width, so it stays 3.5% at any size. */
  return `
  <div title="${jsArg(c.n)}" style="container-type:inline-size"
    class="relative aspect-[5/7] ${fit ? 'h-full w-auto' : 'w-full'} overflow-hidden rounded-lg bg-black/70 p-[3.5%] shadow-lg">
   <div style="background:${bg};color:${ink(lum(bg))}"
    class="flex h-full w-full flex-col overflow-hidden rounded p-1.5 text-[4.91cqw] ${c.foil ? 'foil' : ''}">
    <div class="flex items-center justify-between gap-1 rounded-md px-1.5 py-0.5" style="${plate}">
      <span class="truncate font-bold leading-tight ${nameFit((c.n || '').length + 2 * ((c.cost || []).length + (c.hp ? 3 : 0)))}">${c.n}</span>
      <span class="flex shrink-0 items-center gap-0.5">${c.hp
        ? `<span class="text-[1em] font-bold">${c.hp} HP</span>`
        : (c.cost || []).map(facePip).join('')}</span>
    </div>
    <div class="my-1 aspect-[5/3.52] w-full shrink-0 overflow-hidden rounded border border-black/20 bg-black/10">
      ${!c.art_id ? '<div class="flex h-full w-full items-center justify-center text-[0.82em] italic opacity-50">no art loaded</div>'
        : `<img src="${artUrl(c)}" alt="" loading="lazy" class="h-full w-full ${
            c.energy ? 'object-cover object-[50%_22%]' : 'object-cover'}">`}
    </div>
    <div class="relative z-10 -my-2.5 flex items-center gap-1 rounded-md px-1.5 py-0.5 font-semibold ${
      typeFit((c.type || UNK).length + 3)}" style="${plate}">
      <span class="min-w-0 flex-1 truncate">${c.type || UNK}</span>
      ${rarityMark(c)}
    </div>
    <div class="mt-2.5 flex flex-1 flex-col justify-between overflow-hidden rounded-sm px-1 py-0.5 leading-snug ${size}" style="${plate}">
      <div>
        ${c.text ? `<p class="whitespace-pre-line">${symbolise(c.text)}</p>` : ''}
        ${(c.atk || []).map(a => `
          <div class="mt-0.5 flex items-baseline justify-between gap-1">
            <span class="flex items-center gap-0.5">${(a.cost || []).map(energyPip).join('')}<span class="ml-0.5 font-semibold">${a.n}</span></span>
            ${a.dmg ? `<span class="font-bold">${a.dmg}</span>` : ''}</div>
          ${a.t ? `<p class="opacity-80">${symbolise(a.t)}</p>` : ''}`).join('')}
      </div>
      ${!c.flav ? '' : `<div><hr class="my-1 border-black/50"><p class="italic opacity-70">${c.flav}</p></div>`}
    </div>
    <div class="mt-0 flex items-center justify-between gap-1 rounded-sm px-1 py-0.5 text-[0.73em]" style="${plate}">
      <span class="truncate">${[
        c.set && `<span class="uppercase">${c.set}${c.num ? ` ${c.num}` : ''}</span>`,
        c.lang && `<span class="${c.lang === 'en' ? '' : 'font-bold'}">${c.lang}</span>`,
        c.art && `Illus. ${c.art}`,
      ].filter(Boolean).join(' &middot; ') || '<span class="opacity-40">no printing</span>'}</span>
      ${c.pt ? `<span class="shrink-0 rounded-sm border border-black/30 bg-black/20 px-1 text-[0.95em] font-bold">${c.pt}</span>` : ''}
      ${c.loy ? `<span class="shrink-0 rounded-full border border-black/30 bg-black/40 px-1.5 text-[0.95em] font-bold">${c.loy}</span>` : ''}
      ${c.retreat ? `<span class="flex shrink-0 items-center gap-0.5" title="Retreat cost">${
        Array.from({ length: c.retreat }, () => energyPip('Colorless')).join('')}</span>` : ''}
    </div>
   </div>
  </div>`;
};

const Card = c => `
  <div class="flex flex-col gap-1">
    <a onclick="openCard('${jsArg(c.n)}')" class="cursor-pointer">${MockCard(c)}</a>
    <div class="flex justify-between text-xs text-neutral-400">
      <span class="truncate">${c.qty ? `&times;${c.qty}` : '<span class="text-neutral-700">none</span>'}</span>
      <span class="tabular-nums">${money(c.usd)}</span></div>
  </div>`;

/* Compact is the card's title line and nothing else: the name and the mana
   cost, which is exactly what the top of the mockup draws — plus the count,
   where the scope is a thing that holds copies. It is the layout for reading a
   deck or a binder as a list, not for telling two printings apart.
   Details is the full identity key with the anatomy columns; that's the pair. */
const holdsCopies = () => P.tab === 'binders' || P.tab === 'decks';
/* One compact row is short, so a full-width list of them is mostly empty. The
   column count isn't picked: the widest row the data can produce sets a minimum
   track, and auto-fill divides the pane by it — resize the window and the count
   follows. Measured from the cards themselves, so a game with longer names gets
   wider columns without anyone editing a number. */
const compactWidth = () => {
  const cs = CARDS();
  const name = Math.max(...cs.map(c => c.n.length)) * 7;           // text-sm advance
  const marks = Math.max(...cs.map(c => (c.cost || []).length || (c.col || '').length)) * (PIP + PIP_GAP);
  return Math.ceil(name + marks + (holdsCopies() ? 32 : 0) + 40);  // + qty + padding and gaps
};

const TitleRow = c => `
  <div onclick="openCard('${jsArg(c.n)}')" title="Open ${jsArg(c.n)}"
    class="flex cursor-pointer items-center gap-3 border-b border-neutral-900 px-2 py-1.5 text-sm hover:bg-neutral-900/60">
    <span class="min-w-0 flex-1 truncate text-neutral-200">${c.n}</span>
    <span class="flex shrink-0 gap-0.5">${(c.cost || []).map(costPip).join('') || pips(c.col || '')}</span>
    ${!holdsCopies() ? '' : `<span class="w-8 shrink-0 text-right tabular-nums text-neutral-300">×${c.qty}</span>`}</div>`;


/* Details is the identity key — set, language, collector number, finish —
   plus the anatomy columns you would otherwise open the card to read.
   Everything Compact leaves out. */
const KeyRow = (c, detail = false) => `
  <div onclick="openCard('${jsArg(c.n)}')" title="Open ${jsArg(c.n)}"
    class="flex cursor-pointer items-center gap-3 border-b border-neutral-900 px-2 py-1.5 text-xs hover:bg-neutral-900/60">
    <span class="w-10 shrink-0 font-mono uppercase text-neutral-500">${c.set}</span>
    <span class="w-6 shrink-0 font-mono ${c.lang === 'en' ? 'text-neutral-600' : 'text-amber-400'}">${c.lang}</span>
    <span class="w-9 shrink-0 text-right font-mono tabular-nums text-neutral-500">${c.num}</span>
    <span class="w-14 shrink-0 font-mono text-[10px] ${c.foil ? 'text-amber-300' : 'text-neutral-600'}">${c.foil ? 'foil' : 'nonfoil'}</span>
    <span class="flex shrink-0 gap-0.5">${(c.cost || []).map(costPip).join('') || pips(c.col || '')}</span>
    <span class="min-w-0 flex-1 truncate text-neutral-200">${c.n}</span>
    ${!detail ? '' : `<span class="w-40 shrink-0 truncate text-neutral-400">${c.type}</span>
    <span class="w-20 shrink-0 truncate text-neutral-500">${rarityName(c.rar)}</span>
    <span class="w-8 shrink-0 text-right tabular-nums text-neutral-500" title="${
      c.hp ? 'HP' : 'Mana value'}">${c.hp || manaValue(c)}</span>`}
    <span class="w-8 shrink-0 text-right tabular-nums text-neutral-300">×${c.qty}</span>
    <span class="w-16 shrink-0 text-right tabular-nums text-neutral-500">${money(c.usd)}</span></div>`;

/* ======================= HEADER ======================================= */
/* Search last: Printings, Binders and Decks are where you make a selection, and
   every one of those selections flows into Search. */
/* Search last: Printings, Binders and Decks are where you make a selection, and
   every one of those selections flows into Search. Import isn't here — it's a
   rare one-off, so it sits with the cog on the right. */
const NAV = [['printings','Printings'], ['binders','Binders'], ['decks','Decks'], ['search','Search']];
/* "Card Collector" sits in exactly the same place on every screen, the main
   included — so nothing jumps when you pick a game. The game mark appears to
   its right once chosen, between the wordmark and the tabs; it's square, so it
   occupies the same slot whichever game it is. Clicking either goes back to
   the main, which is the only place the game changes. Cog top-right. */
const TopNav = (section, stats = '') => `
  <header class="shrink-0 border-b border-neutral-800 bg-neutral-900/80">
    <nav class="flex items-center gap-4 px-4">
      <a href="#/home" title="${P.game ? `${GAMES[P.game].label} — back to Card Collector to change game` : 'Card Collector'}"
         class="flex shrink-0 items-center gap-3 py-2">
        <span class="text-lg font-bold tracking-tight text-neutral-100">Card Collector</span>
        ${P.game ? GameMark(P.game) : ''}</a>
      ${!P.game ? '' : NAV.map(([k, l]) => `<a href="#/${k}" onclick="goTab('${k}')" title="${
        l} — clears the current selection" class="border-b-2 px-1 py-3 text-sm font-medium ${k === section
        ? 'border-emerald-500 text-white' : 'border-transparent text-neutral-300 hover:text-white'}">${l}</a>`).join('')}
      ${stats || '<span class="ml-auto"></span>'}
      ${!P.game ? '' : `<a href="#/io" title="Import" class="flex shrink-0 items-center gap-1.5 rounded-full px-2 py-1 text-sm font-medium ${
        section === 'io' ? 'bg-emerald-500/10 text-emerald-300 ring-1 ring-emerald-500' : 'text-neutral-400 hover:bg-neutral-800 hover:text-white'}">Import<span class="rounded-full bg-amber-500 px-1.5 text-[10px] font-bold text-neutral-950">3</span></a>`}
      <a href="#/config" title="Config" aria-label="Config"
         class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-lg
                ${section === 'config' ? 'bg-emerald-500/10 text-emerald-300 ring-1 ring-emerald-500' : 'text-neutral-400 hover:bg-neutral-800 hover:text-white'}">⚙</a>
    </nav></header>`;

const DebugBand = () => !DEBUG ? '' : `
  <pre class="mt-6 overflow-x-auto rounded-xl border border-sky-900/60 bg-sky-950/20 p-4 text-[11px] leading-relaxed text-sky-200">
<span class="text-sky-500">tab</span>      ${P.tab}   <span class="text-sky-500">game</span> ${P.game}
<span class="text-sky-500">scope</span>    ${esc(scopeLabel())}   <span class="text-sky-500">selector</span> ${selectorOpen() ? 'open' : 'collapsed'}
<span class="text-sky-500">sort</span>     ${esc(P.sort.map(t => t.f === 'BREAK' ? '--BREAK--' : t.f + (t.d === 'a' ? ' asc' : ' desc')).join(', ')) || '(none)'}
<span class="text-sky-500">grouping</span> ${esc(grouping().map(t => t.f).join(', ') || '(none)')}
<span class="text-sky-500">view</span>     ${P.view ?? '(none)'}   <span class="text-sky-500">rows</span> ${keyed() ? 'identity key' : 'card'}
<span class="text-sky-500">sql</span>      select c.set_id, c.collector_number, h.finish, h.quantity, c.name
         from cards c join holdings h on h.card_id = c.id
         where h.container_id = $1
         order by cc.value asc, c.rarity_tier desc, c.name asc</pre>`;

/* The app is a flex column filling the viewport: header, subheader, then one
   scrolling pane. Whoever is active owns the scrollbar — which is why an open
   selector can take over the window. */
// `over` is the one thing that isn't in the scrolling pane: an overlay covers
// the window, so it can't live inside a <main> that scrolls under it.
const Frame = (section, { desc = '', stats = '', sub = '', body, over = '' }) => `${TopNav(section, stats)}
  ${sub}
  <main class="min-h-0 flex-1 overflow-y-auto px-6 py-5">
    ${desc ? `<p class="mb-4 max-w-3xl text-sm text-neutral-400">${desc}</p>` : ''}
    ${body}
    ${DebugBand()}
    <button onclick="DEBUG=!DEBUG;render()" class="${BTN_SECONDARY} mt-4">${DEBUG ? 'Hide' : 'Show'} debug</button>
  </main>
  ${over}`;

/* ======================= THE SELECTOR =================================
   A second header, spanning the window like the first. Collapsed it names the
   selection and carries its numbers and Export. Open, it fills the rest of the
   window and takes the scrollbar off the view beneath. Search never opens —
   it has nothing to select — but it keeps the bar, so Export lives in the same
   place on every page. */

/* A set name can carry an apostrophe ("Assassin's Creed"), which ends the
   string early inside an inline handler and silently breaks the row. Escape
   for JS first, then for the attribute. */
const jsArg = v => String(v).replace(/\\/g, '\\\\').replace(/&/g, '&amp;')
  .replace(/"/g, '&quot;').replace(/'/g, "\\&#39;");

const SelectorRow = (name, a, b, on) => `
  <button onclick="selectItem('${jsArg(name)}')"
    class="flex flex-col gap-0.5 rounded-lg border px-3 py-2 text-left ${on
      ? 'border-emerald-500 bg-emerald-500/10' : 'border-neutral-800 bg-neutral-900/60 hover:border-neutral-600'}">
    <span class="text-sm font-medium ${on ? 'text-emerald-200' : 'text-neutral-100'}">${name}</span>
    <span class="text-[11px] text-neutral-500">${a}</span>
    <span class="text-[10px] text-neutral-600">${b}</span></button>`;

/* Binders describe themselves by page shape, decks by their written-down
   counts: a deck list is a list of cards, so 60/23 will be true of it the day
   membership lands. A binder's card count would not be — it holds whatever the
   collection puts in it. */
const listLine = (row) => P.tab === 'binders'
  ? `${row[2][0]} &times; ${row[2][1]} pockets &middot; ${row[2][0] * row[2][1]} a page`
  : `${num(row[1])} cards &middot; ${row[2]}`;
const SelectorList = () => P.tab === 'printings' ? SetList() : `
  <div class="mt-4 grid gap-2 [grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))]">
    ${(LISTS[P.tab] || []).map(row =>
      SelectorRow(row[0], listLine(row), P.tab === 'binders' ? row[1] : row[3],
        row[0] === picked())).join('')}</div>`;

/* Export belongs to a definite thing, so it rides in the bar exactly when the
   scope is definite: Search (all cards) or one selected set/binder/deck. While
   you're still choosing, there is nothing to export. */
/* Import decides what a group BECOMES, once. Everything after that happens
   here, on the binder or deck itself — which is only a true statement if the
   controls exist, so they do. Only on a keyed scope: you don't edit a set. */
const EditInline = () => `
  <span class="flex shrink-0 items-center gap-1.5">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Edit</span>
    <button class="${BTN_SECONDARY}">Add cards</button>
    <button class="${BTN_SECONDARY}">Arrange</button>
    <button class="${BTN_DANGER}">Remove</button></span>`;

// A select, not chips: there are ten formats (docs/import-formats.md) and the
// bar has to stay one line tall next to the name, its numbers and Clear.
const ExportInline = () => `
  <span class="flex shrink-0 items-center gap-1.5">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Export</span>
    <select class="${FIELD} py-0.5 text-xs">${['CSV', ...EXPORTERS].map(f => `<option>${f}</option>`).join('')}</select>
    <button class="${BTN_PRIMARY}">Download</button></span>`;

/* Only the NAME toggles the selector — it can't be one big <button> wrapping
   everything, because a <button>/<select> inside a <button> is invalid and the
   parser closes the outer one early, spilling Export onto a second row. */
const Selector = () => {
  const one = tab().one;
  const sel = picked();
  const open = !!one && selectorOpen();
  const definite = !one || !!sel;   // Search, or something actually picked
  // eyebrow + name (+ chevron where there's something to expand) and nothing
  // else — the numbers live in the top bar, so the bar never contradicts them.
  // Search's bar takes the same classes minus the hover, or it renders 4px
  // shorter than the others and the row visibly steps between tabs.
  const HIT = '-mx-2 flex min-w-0 items-center gap-3 rounded px-2 py-0.5 text-left';
  /* A capped list has to say it is capped, or 240 of 107,214 printings reads as
     the whole catalogue. Silent when everything is on screen, which is every
     view running on the mocks. */
  const CardCount = () => {
    const all = scopedCards().length, shown = CARDS().length;
    if (shown >= all) return '';
    return `<span title="Every view here draws its whole input; the list is capped at ${CARD_LIMIT} until there is a query to narrow it"
      class="shrink-0 text-[11px] text-neutral-500">${num(shown)} <span class="text-neutral-600">of ${num(all)}</span></span>`;
  };
  const label = `
    <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">${one || 'scope'}</span>
    <span class="truncate text-base font-semibold ${sel || !one ? 'text-neutral-100' : 'text-neutral-400'}">${sel || (one ? tab().all : scopeLabel())}</span>
    ${one ? `<span class="shrink-0 text-neutral-500">${open ? '&#9652;' : '&#9662;'}</span>` : ''}`;
  return `
    <div class="shrink-0 border-b border-neutral-800 ${open ? 'bg-neutral-900' : 'bg-neutral-900/40'}">
      <div class="flex w-full flex-nowrap items-center gap-3 px-4 py-2">
        ${one
          ? `<button onclick="toggleSelector()" title="${open ? 'Collapse' : 'Choose another'}"
               class="${HIT} hover:bg-neutral-800/60">${label}</button>`
          : `<span class="${HIT}">${label}</span>`}
        <span class="ml-auto flex shrink-0 items-center gap-3">
          ${CardCount()}
          ${sel && tab().keyed ? EditInline() : ''}
          ${definite ? ExportInline() : ''}
          ${sel ? `<button onclick="clearItem()" class="${BTN_SECONDARY}">Clear</button>` : ''}</span>
      </div>
    </div>
    ${open ? `<div id="pane" class="min-h-0 flex-1 overflow-y-auto px-6 pb-4">${SelectorList()}</div>` : ''}`;
};


/* Colour combos, laid out exactly as app/components/ComboSlicer.tsx already
   does it — its own comment records the column counts as your spec:
     mono (6) 3 cols · dual (10) 2 · tri (10) 2 · quad (5) 1 · all (1) 1
   Colourless sorts first in the mono bucket; every other bucket is canonical
   WUBRG. Enumerating the 32 real combos beats an Exactly/Including/At most
   mode switch: each one is a thing you can point at, with a count. */
/* Every colour combination Magic has, with the name players actually use for
   it — the guilds, shards and wedges. A combo is a facet value (`color_combo`),
   so this is the one filter group that is already real in the schema. */
const COMBOS = [
  ['C','Colourless',12], ['W','White',24], ['U','Blue',22], ['B','Black',19], ['R','Red',21], ['G','Green',20],
  ['WU','Azorius',4], ['WB','Orzhov',3], ['WR','Boros',2], ['WG','Selesnya',5], ['UB','Dimir',4],
  ['UR','Izzet',3], ['UG','Simic',2], ['BR','Rakdos',4], ['BG','Golgari',3], ['RG','Gruul',2],
  ['WUB','Esper',1], ['WUR','Jeskai',1], ['WUG','Bant',0], ['WBR','Mardu',1], ['WBG','Abzan',2],
  ['WRG','Naya',1], ['UBR','Grixis',2], ['UBG','Sultai',1], ['URG','Temur',0], ['BRG','Jund',1],
  ['WUBR','Yore-Tiller',0], ['WUBG','Witch-Maw',0], ['WURG','Ink-Treader',0], ['WBRG','Dune-Brood',0],
  ['UBRG','Glint-Eye',0], ['WUBRG','Five-colour',3],
];
const COLOURS = ['C', 'W', 'U', 'B', 'R', 'G'];

/* Two controls, not one. The six colours pick what you care about; the panel
   underneath is every combination those colours are consistent with, so the
   filter shows its own consequences instead of asking you to imagine them.
   CONTAINED (the default) means the combination is made of nothing but the
   colours you picked — pick WBRG and you get WBRG and every combination inside
   it, which is the question a deck asks. EXACT means that combination and
   nothing else. Colourless is playable in any deck, so it survives contained
   whatever you pick; it only narrows things under exact. The alternate is on
   the button — right-click — rather than in a mode switch you'd have to find
   before the control made sense. */
const comboMatch = c => !P.colours.length ? true
  : P.comboMode === 'exact'
    ? c.length === P.colours.length && [...c].every(x => P.colours.includes(x))
    : c === 'C' || [...c].every(x => P.colours.includes(x));

const COMBO_MODES = ['contained', 'exact'];
// Left-click uses whatever the toggle says; right-click applies the other mode
// without moving the toggle first, which is the whole point of a shortcut.
function pickColour(c, mode = P.comboMode) {
  P.comboMode = mode;
  P.colours = P.colours.includes(c) ? P.colours.filter(x => x !== c) : [...P.colours, c];
  render();
}
function setComboMode(m) { P.comboMode = m; render(); }
function clearColours() { P.colours = []; render(); }
const otherMode = () => COMBO_MODES.find(m => m !== P.comboMode);

/* Grouped by how many colours, the way the old app had it — Mono three across,
   Dual and Tri two, the big ones one to a row. Three rows tall and scrolling:
   the panel is a readout, not the page. */
// [marks in the combination, label, columns]
const BUCKETS = [[5, 'All', 1], [4, 'Quad', 1], [3, 'Tri', 2], [2, 'Dual', 5], [1, 'Mono', 6]];

/* Whether a chip carries its name is measured, not declared. A name clipped to
   three characters is worse than no name — you can't read it and it still eats
   the width — so below six characters' room the chip drops to marks alone and
   the name and count move to the hover, which already carries both. Change a
   column count, a pip size or the sidebar width and the cut-off follows.
   The 336 is w-[21rem] on the sidebar; Tailwind can't take that from a variable,
   so the two are coupled by hand and by this comment. */
const PIP = 16, PIP_GAP = 2, CHIP_GAP = 6, CHIP_PAD = 12, CHIP_BORDER = 1, GRID_GAP = 4, CHAR = 5.3;
// sidebar w-[21rem] − panel border − panel px-3 − combo panel p-1.5 − scrollbar
const PANEL_W = 336 - 2 * 1 - 2 * 12 - 2 * 6 - 10;
const nameRoom = (cols, len) =>              // width one flank column gets, in px
  ((PANEL_W - GRID_GAP * (cols - 1)) / cols - 2 * CHIP_BORDER
    - 2 * CHIP_PAD - 2 * CHIP_GAP - (len * PIP + (len - 1) * PIP_GAP)) / 2;
const namesFit  = (cols, len) => nameRoom(cols, len) >= 6 * CHAR;
// The count is the cheaper half of the label, so it survives one step longer:
// two digits still tell you whether a combination is worth opening.
const countChars = () => Math.max(...COMBOS.map(([, , n]) => num(n).length));
const countsFit = (cols, len) => nameRoom(cols, len) >= countChars() * CHAR;

/* Written straight into the DOM rather than through render(): a tooltip that
   costs a full repaint would fight the pointer, and the native title tip is too
   slow to answer "what is this" while you're sweeping across the pips. */
function hintCombo(t) { const el = document.getElementById('combo-hint'); if (el) el.textContent = t; }
const hover = (name, n) => `onmouseenter="hintCombo('${jsArg(`${name} — ${n} cards`)}')" onmouseleave="hintCombo('')"`;

const ComboSlicer = () => {
  const on = P.colours.length;
  const shown = COMBOS.filter(([c]) => comboMatch(c));
  return `
  <div class="mb-3">
    <div class="mb-1 flex items-baseline gap-2">
      <span class="text-[11px] font-semibold uppercase tracking-wide text-neutral-500">Colour</span>
      <span id="combo-hint" class="min-w-0 flex-1 truncate text-[10px] text-neutral-400"></span>
      ${on ? `<button onclick="clearColours()" class="shrink-0 text-[10px] text-neutral-500 hover:text-neutral-200">clear</button>` : ''}
    </div>
    <div class="mb-2 flex items-center gap-2">
      <span class="inline-flex overflow-hidden rounded-full border border-neutral-700 text-[10px]">
        ${COMBO_MODES.map(m => `<button onclick="setComboMode('${m}')"
          title="${m === 'contained' ? 'Made of nothing but the colours picked' : 'That combination and nothing else'}"
          class="cursor-pointer px-2 py-0.5 capitalize ${m === P.comboMode
            ? 'bg-emerald-500/15 font-semibold text-emerald-300' : 'text-neutral-500 hover:text-neutral-200'}">${m}</button>`).join('')}
      </span>
      <span class="text-[10px] text-neutral-600">${on ? `${shown.length} of ${COMBOS.length}` : 'every combination'} &middot; right-click for the other</span>
    </div>
    <div class="mb-2 grid grid-cols-6 gap-1">
      ${COLOURS.map(c => {
        const [, name, n] = COMBOS.find(x => x[0] === c);
        return `<button onclick="pickColour('${c}')" oncontextmenu="event.preventDefault();pickColour('${c}','${otherMode()}')"
          title="${name} &mdash; ${n} cards" ${hover(name, n)}
          class="flex h-8 cursor-pointer items-center justify-center rounded border ${P.colours.includes(c)
            ? 'border-emerald-500 bg-emerald-500/10' : 'border-neutral-700 hover:border-neutral-500'}">${pips(c)}</button>`;
      }).join('')}
    </div>
    <div class="h-[7.5rem] overflow-y-auto rounded bg-neutral-950/40 p-1.5">
      ${BUCKETS.map(([len, label, cols]) => {
        const items = shown.filter(([c]) => c.length === len);
        // three tiers, each decided by measurement: name + marks + count,
        // then marks + count with an empty flank keeping the marks centred,
        // then marks alone. Whatever is dropped is still on the hover.
        const named = namesFit(cols, len), counted = countsFit(cols, len);
        return !items.length ? '' : `
          <div class="mb-1.5">
            <div class="mb-1 text-[10px] uppercase tracking-wide text-neutral-600">${label}</div>
            <div class="grid gap-1 ${GRID[cols]}">
              ${items.map(([c, name, n]) => `
                <button title="${name} &mdash; ${n} cards" ${hover(name, n)}
                  class="${CHIP_NEUTRAL} justify-center gap-1.5">
                  ${!counted ? '' : named
                    ? `<span class="min-w-0 flex-1 truncate text-left text-[10px] text-neutral-400">${name}</span>`
                    : '<span class="flex-1"></span>'}
                  <span class="flex shrink-0 gap-0.5">${pips(c)}</span>
                  ${!counted ? '' : `<span class="flex-1 text-right tabular-nums text-neutral-600">${num(n)}</span>`}</button>`).join('')}
            </div></div>`;
      }).join('')}
    </div>
  </div>`;
};

/* Card anatomy: the filter is the shape of a card, not a bag of options — so
   it's rendered from the game's spec. No free-text box: every element is an
   enumerated value with a count, because a typed string is a guess and a chip
   is a fact. Rarely-browsed groups collapse into "Other", matching
   FilterSidebar's documented order (slicers, then Other). */
const anatomyGroup = ([kind, label, arg, o = {}]) =>
  kind === 'range' ? RangeField(label, '', '', o.symbols)
  : kind === 'combos' ? ComboSlicer()
  : ChipGroup(label, arg.map(([n, c]) => [n, '', c]), o.note || '', o.cols);

const AnatomyFilter = () => {
  const spec = game().anatomy;
  const main = spec.filter(g => !(g[3] || {}).other);
  const other = spec.filter(g => (g[3] || {}).other);
  return main.map(anatomyGroup).join('') + (!other.length ? '' : `
    <details class="mt-1 mb-3">
      <summary class="cursor-pointer text-[11px] font-semibold uppercase tracking-wide text-neutral-500 hover:text-neutral-300">Other</summary>
      <div class="mt-2">${other.map(anatomyGroup).join('')}</div>
    </details>`);
};

/* The display type lives ON the sort bar, because the sort is what it has to
   interpret: a break means a different thing in each one. Picking the layout
   next to the terms makes that legible instead of a rule you memorise. */
/* [name, icon, what a break means, which tabs offer it]. A binder layout of a
   deck is not a thing, and neither is a deck layout of a set — so those two
   are not offered rather than being offered and quietly meaningless. */
/* A binder has one layout, and it is the binder. Offering it Compact and Grid
   was offering to draw a binder as something that is not a binder — the tab
   exists because pages of pockets are the point. Every other tab keeps the
   full set, and a deck is a deck for the same reason. */
const VIEWS = [
  ['compact', '&#9776;', 'a horizontal rule', ['search', 'printings', 'decks']],
  ['details', '&#8801;', 'a horizontal rule', ['search', 'printings', 'decks']],
  ['grid',    '&#9638;', 'a new row',         ['search', 'printings', 'decks']],
  ['binder',  '&#9707;', 'a new page, headed by the grouping', ['printings', 'binders']],
  ['deck',    '&#9635;', 'a new section', ['decks']],
];
const views = () => VIEWS.filter(([, , , tabs]) => !tabs || tabs.includes(P.tab));
// The one tab with a default, because it has only one choice: a display you
// cannot change is a question not worth asking. Everywhere else stays unpicked.
const defaultView = () => (views().length === 1 ? views()[0][0] : null);

/* SORT — click to add and cycle asc/desc/off, drag to reorder, and BREAK is
   an element in the same list. Everything left of it is the grouping. */
// `capitalize` turns "hp" into "Hp"; acronyms need an explicit label
const FIELD_LABEL = { hp: 'HP', cmc: 'CMC' };
const fieldLabel = f => FIELD_LABEL[f] || f;

/* Every order chip is the same shape whether or not it's in the sort: the rank
   and the direction get their slots either way, so clicking one doesn't shove
   the rest of the row sideways. Solid borders throughout — a dashed chip read
   as disabled next to the display buttons. */
const SORT_SLOT = 'w-3 shrink-0 text-center';
const orderChip = (label, i, dir) => `
  <button class="${i === null ? CHIP_NEUTRAL : `${dir === 'a' ? CHIP_PLUS : CHIP_MINUS} cursor-grab`}"
    ${i === null
      ? `onclick="addSort('${label}')" title="Add to the order"`
      : `draggable="true" ondragstart="dragSort(${i})" ondragover="event.preventDefault()" ondrop="moveSort(${i})"
         onclick="cycleSort(${i})" oncontextmenu="event.preventDefault();removeSort(${i})"
         title="drag to reorder &middot; click to reverse, again to remove"`}>
    <span class="${SORT_SLOT} tabular-nums opacity-60">${i === null ? '' : i + 1}</span>
    <span class="capitalize">${fieldLabel(label)}</span>
    <span class="${SORT_SLOT}">${i === null ? '' : dir === 'a' ? '&uarr;' : '&darr;'}</span>
  </button>`;

/* Two rows: everything you CHOOSE on the first — Display, the Order, Apply and
   Clear — and the numbers that size the layout on its own row underneath.

   The numbers go below because they CHANGE WIDTH as you edit them. Inline, the
   binder's readout goes "9/page &middot; 2 spreads" to "12/page &middot; 3
   spreads" and shoves every Order chip sideways while you are aiming at one; a
   control that moves the control next to it is a control you have to re-find.
   A full-width row of its own is the only arrangement where the numbers cannot
   reach the Order at all — stacking them in a left-hand column, which is where
   they were before, still lets the wider of the two set that column's width.

   Display appears only where there is a choice. On Binders there is one layout,
   so the chooser was a row of a single button that could not be turned off and
   answered a question nobody was asking. */
const SortRow = () => {
  const FIELDS = game().sort;
  const used = new Set(P.sortDraft.filter(t => t.f !== 'BREAK').map(t => t.f));
  return `
    <div class="flex flex-col gap-2">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
      ${views().length < 2 ? '' : `
      <div class="flex shrink-0 flex-wrap items-center gap-1.5" title="Display — decides what a break means">
        <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Display</span>
        ${views().map(([v, icon, what]) =>
          `<button onclick="setView('${v}')" title="break = ${what}"
             class="${v === P.view ? CHIP_PLUS : CHIP_NEUTRAL} capitalize">
             <span class="text-neutral-500">${icon}</span>${v}</button>`).join('')}
      </div>`}
      <div class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5">
        <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Order</span>
        ${P.sortDraft.map((t, i) => t.f === 'BREAK'
          ? `<button draggable="true" ondragstart="dragSort(${i})" ondragover="event.preventDefault()" ondrop="moveSort(${i})"
               onclick="removeSort(${i})" title="drag to reorder, click to remove — everything left of this is the grouping"
               class="inline-flex cursor-grab items-center gap-1 whitespace-nowrap rounded-full border border-amber-500/70 bg-amber-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-amber-300">&#8801; Break</button>`
          : orderChip(t.f, i, t.d)).join('')}
        ${P.sortDraft.length ? '<span class="mx-0.5 h-4 w-px bg-neutral-700"></span>' : ''}
        ${FIELDS.filter(f => !used.has(f)).map(f => orderChip(f, null)).join('')}
        <button onclick="addBreak()" title="Split the layout — everything left of the break becomes the grouping"
          class="inline-flex cursor-pointer items-center gap-1 whitespace-nowrap rounded-full border border-amber-600/60 px-3 py-1 text-xs uppercase tracking-wide text-amber-400/80 hover:border-amber-500">+ Break</button>
      </div>
      <div class="flex shrink-0 items-center gap-1.5">
        <button onclick="applySort()" class="${BTN_PRIMARY_LG} ${sortDirty() ? '' : 'opacity-40'}">Apply</button>
        <button onclick="clearSort()" class="${BTN_SECONDARY_LG}">Clear</button>
      </div>
    </div>
    ${ZoomRow()}
    </div>`;
};

/* Zoom and the binder's page shape are both numbers you set, so they are both
   steppers: type a value or click the arrows. A slider was the wrong control
   for either — you cannot ask one for "exactly 3 across", and a card size worth
   returning to is worth typing. They live on the SORT band's own header line,
   beside Apply and Clear, because they change how the results below are laid
   out rather than what is in them. */
const STEPPER = 'w-11 rounded border border-neutral-700 bg-neutral-950 px-1 py-0.5 text-center text-[11px] tabular-nums text-neutral-200';
const NUM_LABEL = 'text-[10px] font-semibold uppercase tracking-wide text-neutral-600';
/* The binder has no Zoom, because a percentage is the wrong question for it.
   Pages, Columns and Rows say what is open in front of you and how it is
   pocketed, and the card size is then WHATEVER FITS — three integers instead of
   a percentage you nudge until it stops overflowing. Which it did: four pages
   of a 3x3 at 100% wanted 2,576px of a 2,400px pane, so the pane scrolled
   sideways. Nothing here is measured in px any more, so it cannot.

   Keyed on the LAYOUT, not the tab: Printings draws the binder too, and a
   percentage is no more use there. With no binder picked to own the shape, the
   tab's own default takes the edit — same rule `dimsOwner` already follows. */
const ZoomRow = () => {
  const [cols, rows] = binderDims();
  if (P.view !== 'binder') return `
    <span class="flex shrink-0 items-center gap-1.5">
      <span class="${NUM_LABEL}">Zoom</span>
      <input type="number" min="50" max="200" step="5" value="${Math.round(P.zoom * 100)}"
        onchange="setZoom(this.value)" title="Card size as a percentage — the chrome stays put"
        class="${STEPPER}">
      <span class="text-[10px] text-neutral-600">%</span>
    </span>`;
  const owner = P.pick.binders
    ? `Pocket layout of ${jsArg(P.pick.binders)}` : 'Pocket layout for binders with none picked';
  return `
    <span class="flex shrink-0 items-center gap-1.5">
      <span class="${NUM_LABEL}" title="Pages open side by side — two to a spread">Pages</span>
      <input type="number" min="2" max="8" step="2" value="${P.across}" onchange="setAcross(this.value)"
        title="Pages across, in twos — a page has a facing page" class="${STEPPER}">
      <span class="ml-2 ${NUM_LABEL}" title="${owner}">Columns</span>
      <input type="number" min="1" max="6" step="1" value="${cols}" onchange="setBinderDim(0,this.value)"
        title="Pockets across a page" class="${STEPPER}">
      <span class="ml-2 ${NUM_LABEL}" title="${owner}">Rows</span>
      <input type="number" min="1" max="6" step="1" value="${rows}" onchange="setBinderDim(1,this.value)"
        title="Pockets down a page" class="${STEPPER}">
      <span class="text-[10px] text-neutral-600">${cols * rows}/page &middot; ${
        P.across / 2} spread${P.across === 2 ? '' : 's'}</span>
    </span>`;
};



/* fake grouped result — the groups ARE the sort's grouping applied. With no
   sort there is no grouping, so it collapses to one unheaded run. */
/* The sort used to be a picture of a sort: GROUPS chopped the list into equal
   slices and captioned them from a hardcoded list of labels, so "White · Rare"
   headed a page of whatever happened to land in the first third. Every field on
   the bar now has a real key, and the grouping labels come off the cards.

   One key per field, and they are compared in the order the chips are in. Sets
   sort by RELEASE DATE rather than code, because that is the order the Printings
   table is already in and the alphabet is not a chronology. */
const COLOUR_NAME = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
const colourName = s => !s ? 'Colourless' : s.length === 1 ? COLOUR_NAME[s] : `${s.length}-colour`;
// WUBRG order, and fewer colours first, so mono sits above the gold
const colourKey = (s = '') => String(s.length).padStart(2, '0')
  + [...s].map(c => 'WUBRG'.indexOf(c) + 1).sort().join('');
const priceBand = v => !v ? 'no price' : v < 1 ? 'under £1' : v < 5 ? '£1–5'
  : v < 20 ? '£5–20' : v < 100 ? '£20–100' : '£100+';
// a collector number is not a number: 12a, 378, ★5 all sort as text once padded
const numKey = c => String(c.num ?? '').replace(/\d+/, m => m.padStart(6, '0'));

/* A RELEASE is the BLOCK, which is what the Printings gutter groups by: a set
   plus the sub-sets filed under it, which take their parent's date because a
   sub-set can ship months later (Final Fantasy Scene Box, six months after
   Final Fantasy). Same walk as SetList and therefore the same answer — SETS is
   newest-first with each sub-set following its parent, so the block is just the
   last non-sub-set row seen. Sorting by `set` puts MKM and its token set in
   different places; sorting by `release` keeps a release together. */
const BLOCK = (() => {
  const m = new Map();
  let block = null;
  for (const r of SETS) {
    if (!r[5] || !block) block = r;
    m.set(r[1], block);
  }
  return m;
})();
const SORT_KEY = {
  name: c => (c.n || '').toLowerCase(),
  set: c => (SET_BY_CODE.get(c.set)?.[2] || '') + (c.set || ''),
  release: c => { const b = BLOCK.get(c.set); return b ? b[2] + b[1] : ''; },
  number: numKey,
  rarity: c => c.rar || 0,
  mana: c => manaValue(c),
  colour: c => colourKey(c.col),
  price: c => c.usd || 0,
  language: c => c.lang || '',
  hp: c => +c.hp || 0,
  type: c => (c.type || '').split('—')[0].trim().toLowerCase(),
};
const GROUP_LABEL = {
  name: c => (c.n || '?')[0].toUpperCase(),
  set: c => c.set || 'no set',
  release: c => BLOCK.get(c.set)?.[0] || 'unknown release',
  number: c => c.num ?? '—',
  rarity: c => rarityName(c.rar) || 'unknown rarity',
  mana: c => `mana value ${manaValue(c)}`,
  colour: c => colourName(c.col),
  price: c => priceBand(c.usd),
  language: c => c.lang || 'no language',
  hp: c => (c.hp ? `${c.hp} HP` : 'no HP'),
  // catalogue cards carry a real em dash, the mocks carry the entity: matching
  // only one put every full type line in its own group
  type: c => (c.type || '').split(/&mdash;|—/)[0].trim() || 'no type',
};

const sortCards = (cs) => {
  const terms = P.sort.filter(t => t.f !== 'BREAK' && SORT_KEY[t.f]);
  if (!terms.length) return cs;
  // decorate once: the comparator runs O(n log n) times and would otherwise
  // rebuild every key on every comparison
  return cs.map(c => [terms.map(t => SORT_KEY[t.f](c)), c])
    .sort((a, b) => {
      for (let i = 0; i < terms.length; i++) {
        if (a[0][i] === b[0][i]) continue;
        return (a[0][i] < b[0][i] ? -1 : 1) * (terms[i].d === 'd' ? -1 : 1);
      }
      return 0;
    })
    .map(p => p[1]);
};

/* Groups are runs of the sorted list, not slices of it: everything left of the
   break makes a label, and a new label starts a group. That is why the order
   matters — group by colour then rarity and you get White/Common, White/Rare. */
const GROUPS = () => {
  const cs = CARDS();
  const terms = grouping().filter(t => t.f !== 'BREAK' && GROUP_LABEL[t.f]);
  if (!terms.length) return [[null, cs]];
  const out = [];
  for (const c of cs) {
    const label = terms.map(t => GROUP_LABEL[t.f](c)).join(' &middot; ');
    if (!out.length || out[out.length - 1][0] !== label) out.push([label, []]);
    out[out.length - 1][1].push(c);
  }
  return out;
};

const Results = () => {
  if (!P.view) return `
    <div class="rounded-lg border border-dashed border-neutral-800 px-4 py-10 text-center">
      <p class="text-sm text-neutral-400">No display chosen.</p>
      <p class="mx-auto mt-1 max-w-sm text-[11px] text-neutral-600">
        A fresh page applies nothing on your behalf. Pick one on the sort bar &mdash;
        it also decides what a break does.</p>
      <div class="mt-4 flex flex-wrap justify-center gap-1.5">${views().map(([v, icon]) =>
        `<button onclick="setView('${v}')" class="${CHIP_NEUTRAL} capitalize">
           <span class="text-neutral-500">${icon}</span>${v}</button>`).join('')}</div>
    </div>`;
  const gs = GROUPS();
  if (P.view === 'binder') {
    const dims = binderDims();          // pockets per page, from the binder itself
    /* Two pages side by side, the way an open binder actually reads, and each
       pocket is the same `Card` the grid draws — clickable, with its count and
       price under it. A pocket that showed a bare frame was a different card
       from the one three tabs over, for no reason anybody could name. */
    /* The pair of pages is sized by its pockets and then centred: `w-fit` lets
       each page hug its own grid, and the auto margins put the leftover width
       either side rather than all of it on the right. So a 2x2 binder at 80% and
       a 5x3 at 150% both sit in the middle of the pane instead of drifting. */
    /* A GROUP IS NOT A PAGE. A break starts a new page, but a run longer than
       the pockets carries on over as many more as it needs — drawing one page
       per group silently dropped everything past the ninth card in it, and with
       no break at all it drew nine of the whole list and threw the rest away.
       Nine per group was never a coincidence; it was the page size. */
    /* Page 1 is a RIGHT-hand page. A binder opens on its inside front cover, so
       the pages you ever see side by side are 2|3, 4|5 — pairing them 1|2, 3|4
       shows two pages that are never open together. The first spread's left
       slot is the cover, and every later spread is an even|odd pair.

       PAGES ACROSS IS THE INPUT, NOT THE CARD SIZE. Everything below is a
       fraction of the pane: spreads share the width, the two pages share a
       spread, the pockets share a page. Sizing it the other way — a card size
       in px multiplied out — is why four 3x3 pages wanted 2,576px of a 2,400px
       pane and the whole thing scrolled sideways. Nothing here is px, so it
       cannot outgrow the window; ask for more pages and the cards get smaller,
       which is the trade a binder actually makes. */
    const per = dims[0] * dims[1];
    const pages = binderPages(gs);
    const cover = -1;
    const slots = [cover, ...pages.keys()];
    const spreads = Array.from({ length: Math.ceil(slots.length / 2) },
      (_, s) => slots.slice(s * 2, s * 2 + 2));
    const Page = (i) => {
      const [g, cs, k, n] = pages[i];
      return `<div class="${PANEL} w-full min-w-0 p-3">
        <div class="mb-2 flex items-baseline gap-2 border-b border-neutral-800 pb-1">
          <span class="text-xs uppercase tracking-wide text-neutral-500">Page ${i + 1}</span>
          ${g ? `<span class="text-[11px] font-semibold text-amber-400/80">${g}${
            n > 1 ? ` <span class="font-normal text-neutral-600">${k + 1} of ${n}</span>` : ''}</span>` : ''}
          <span class="ml-auto pl-3 text-[10px] text-neutral-600">${cs.length}/${per}</span></div>
        <div class="grid gap-2" style="grid-template-columns:repeat(${dims[0]},minmax(0,1fr))">
          ${Array.from({ length: per }, (_, j) => j < cs.length
            ? Card(cs[j])
            : '<div class="aspect-[5/7] rounded-lg border border-dashed border-neutral-800"></div>').join('')}
        </div></div>`;
    };
    /* A spread is a real element, not four columns and one gap. With one gap the
       join between two facing pages and the join between two different spreads
       are the same distance, so you cannot see which pair is open together. */
    return `<div class="w-full">
      <div class="grid items-start gap-8" style="grid-template-columns:repeat(${P.across / 2},minmax(0,1fr))">
      ${spreads.map(pair => `<div class="grid items-start gap-3"
        style="grid-template-columns:repeat(2,minmax(0,1fr))">
        ${pair.map(i => i === cover ? '<div></div>' : Page(i)).join('')}
      </div>`).join('')}
      </div>
      <p class="mt-3 text-[11px] text-neutral-600">${grouping().length
        ? 'Each break starts a new page; the page header is the grouping at that point.'
        : 'No break, so it fills pages in order. Add a break to the sort to start a new page.'}</p></div>`;
  }
  if (P.view === 'deck') {
    return `<div class="max-w-lg">
      ${gs.map(([g, cs]) => `<div class="mb-4">
        ${g ? `<div class="mb-1 flex items-baseline gap-2 border-b border-neutral-800 pb-1">
          <span class="text-[11px] font-semibold uppercase tracking-wide text-amber-400/80">${g}</span>
          <span class="text-[10px] text-neutral-600">${cs.reduce((n, c) => n + (c.qty || 0), 0)} cards</span></div>` : ''}
        ${cs.map(c => KeyRow(c)).join('')}</div>`).join('')}</div>`;
  }
  if (P.view === 'compact') {
    return `<div class="grid rounded-lg border border-neutral-800 bg-neutral-950/60"
      style="grid-template-columns:repeat(auto-fill,minmax(${zoomPx(compactWidth())}px,1fr))">
      ${gs.map(([g, cs], i) => `
        ${g ? `<div style="grid-column:1/-1" class="flex items-center gap-2 ${i ? 'border-t border-neutral-800' : ''} px-2 py-1.5">
          <span class="text-[11px] font-semibold uppercase tracking-wide text-amber-400/80">${g}</span></div>` : ''}
        ${cs.map(TitleRow).join('')}`).join('')}</div>`;
  }
  if (P.view === 'details') {
    return `<div class="rounded-lg border border-neutral-800 bg-neutral-950/60">
      ${gs.map(([g, cs], i) => `
        ${g ? `<div class="flex items-center gap-2 ${i ? 'border-t border-neutral-800' : ''} px-2 py-1.5">
          <span class="text-[11px] font-semibold uppercase tracking-wide text-amber-400/80">${g}</span></div>` : ''}
        ${cs.map(c => KeyRow(c, true)).join('')}`).join('')}</div>`;
  }
  return `<div class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(${zoomPx(224)}px,1fr))">
    ${gs.map(([g, cs], i) => `
      ${g ? `<div class="col-span-full flex items-center gap-2 ${i ? 'mt-3 border-t border-neutral-800 pt-3' : ''}">
        <span class="text-[11px] font-semibold uppercase tracking-wide text-amber-400/80">${g}</span></div>` : ''}
      ${cs.map(Card).join('')}`).join('')}</div>`;
};

const PAGES = {};

/* One renderer, four routes. The route IS the scope. On Search the scope is
   pickable in the sidebar; on a scoped page it's already decided, so the
   sidebar drops it and the header carries Back + the sub-select instead. */

/* Year and month are the table's own left gutter, one cell spanning every row
   beneath them — not a sidebar list, which can only be near the rows it labels.
   They label, they do not filter: the only clickable thing on this page is a
   set, and it always goes to that set's page. Blocks are gone from the gutter
   too — a block IS its parent set, so listing it made a set name that didn't. */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* Printings' selector keeps the scryfall.com/sets shape: sub-sets indented
   under their parent, fixed sort by block date then sub-set date, newest first,
   no search. A real table, because rowspan is what "this year covers these
   rows" means — faking it with a flex sidebar can only ever approximate the
   alignment. Collected takes a third of the width: a bar you can't read the
   shape of is just a percentage. */
/* The same three answers the hovering button gives, one row at a time: a set you
   can open gets a Draft button that goes straight to the config; a set you could
   open but nobody has collated yet says so; a token or promo set gets nothing,
   because there is no pack. 986 rows, so the "nothing" case has to be nothing. */
const DraftCell = (label) => {
  const packs = packsFor(label);
  if (!packs) return '';
  if (packs.length)
    // stopPropagation: the row has its own onclick that selects the set, and
    // without this the click bubbles up there too — "Draft" then navigates to
    // the set it was supposed to open from. The whole point is to stay put.
    // draftSet(...) goes first so the handler the markup exposes to the test
    // harness is `draftSet` — putting stopPropagation first makes the inline
    // attribute start with `event.stopPropagation()`, which is not a draft call.
    return `<button onclick="draftSet('${jsArg(label)}');event.stopPropagation()" title="Draft boosters from this set${collationNote(label)}"
              class="${CHIP_NEUTRAL} hover:border-emerald-500 hover:text-emerald-300">Draft</button>`;
  // two different silences: nothing collated at all, or collated but not into a draft
  const why = setRow(label)?.[7]
    ? 'This set has collation, but none of it is a booster you draft'
    : 'No booster collation published for this set yet';
  return `<span title="${why}" class="text-[10px] text-neutral-700">no pack data</span>`;
};

/* Where a gutter label goes: the middle of the part of its block you can see.
   A year two screens tall showing only its top quarter wants its label an eighth
   of the way down it — the middle of the whole block is off screen by then, and
   the middle of the window is not a fact about the block at all. That midpoint
   is the intersection of the block and the pane, one of which moves, and CSS has
   no way to say it: sticky can hold an edge, but not a point between two edges
   that both move. So it is arithmetic. `lh` keeps the label inside its own
   block at the extremes, where the visible sliver is thinner than the label. */
const gutterMid = (y, h, lh, top, bot) => {
  const mid = (Math.max(y, top) + Math.min(y + h, bot)) / 2 - y;
  return h <= lh ? h / 2 : Math.min(h - lh / 2, Math.max(lh / 2, mid));
};
/* Measured once per render, because none of it changes while you scroll: the
   blocks keep their offsets and the labels their size. Scrolling re-reads one
   number. Writes are skipped where the value hasn't moved, which is every block
   that's off screen — so a scroll touches the handful you're actually looking
   at, not all 300. */
let GUTTER = null, PACKS = [];
/* getBoundingClientRect reports VISUAL pixels — the body's zoom has already been
   applied to them — while scrollTop, clientHeight and style.top are the element's
   own CSS pixels, which zoom has not touched. Mixing the two is silent until the
   page is scaled: at 0.8 it put the year labels up to 1,000px out of place, five
   of them outside the pane entirely. Every rect below is divided back at the
   point it is read, so the rest of the arithmetic stays in one unit. */
const uiZoom = () => parseFloat(getComputedStyle?.(document.body)?.zoom) || 1;

function measureGutter() {
  const pane = document.querySelector?.('#pane');
  const cells = pane ? [...pane.querySelectorAll('td[rowspan] > div')] : [];
  PACKS = [];
  if (!cells.length) return (GUTTER = null);
  const z = uiZoom();
  const base = pane.getBoundingClientRect().top / z - pane.scrollTop;
  GUTTER = [pane, cells.map(el => {
    const block = el.parentElement.getBoundingClientRect();
    return [el, block.top / z - base, block.height / z, el.getBoundingClientRect().height / z];
  })];
  // The packs measure off the same base. Their first turn is a random part of a
  // cycle away, so a screenful doesn't flip in unison — which is the whole
  // reason for the delay, not a rule about how long a pack should be up.
  for (const img of pane.querySelectorAll('img[data-packs]')) {
    const ids = img.dataset.packs.split(' ');
    if (ids.length < 2) continue;             // one pack: nothing to cycle to
    const block = img.parentElement.getBoundingClientRect();
    // `raw` is the CDN url, which img.src stops being the moment it's trimmed
    PACKS.push({ img, ids, raw: img.src, y: block.top / z - base, h: block.height / z,
                 due: Date.now() + Math.random() * PACK_EVERY });
  }
  placeGutter();
}
/* The wrappers are JPEGs shot on white: no alpha, so a pack lands in a bright
   box on a dark table. Trim it — vote on the four corners for a background
   colour, flood from all four inwards, and clear the alpha of everything that
   matches within tolerance. It only reaches the pixels because the CDN answers
   a CORS request (the headers say nothing until you actually ask as an origin;
   `crossorigin` on the tag is what makes the canvas readable rather than
   tainted), so this is a browser job and not a build step.

   Two ways out, both leaving the picture exactly as it came: corners that don't
   agree aren't a background, and a flood that eats the image was never one. A
   pack whose own artwork bleeds white to the edge would otherwise be erased. */
const TRIM_TOL = 28, PACK_SAT = 1.3, WHITE = 255, MAX_GAIN = 1.7, LEVELS = 0.02, TRIMMED = new Map();
/* A copy already in the HTTP cache from a request that did NOT ask for CORS is
   handed back without the header, and the crossorigin load then fails outright —
   which is how the trim first showed up as a broken image rather than an
   untrimmed one. So ask again off the end of the cache, still as an origin: this
   CDN does answer, it just never put the header on the copy we already had. Only
   if THAT fails is the host really refusing, and then the picture matters more
   than the alpha and it comes back plain and untrimmed. */
function packRetry(img) {
  const step = img.dataset.retry || '';
  if (!step) {
    img.dataset.retry = 'cors';
    img.src += (img.src.includes('?') ? '&' : '?') + 'cors';
  } else if (step === 'cors') {
    img.dataset.retry = 'plain';
    img.removeAttribute('crossorigin');
    img.src += '&plain';
  }
}
function trimPack(img) {
  if (img.dataset.trim || !img.naturalWidth) return;
  img.dataset.trim = 'done';
  const done = TRIMMED.get(img.currentSrc);
  if (done !== undefined) { if (done) img.src = done; return; }
  const raw = img.currentSrc, w = img.naturalWidth, h = img.naturalHeight;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.drawImage(img, 0, 0);
  let px;
  try { px = cx.getImageData(0, 0, w, h); }
  catch { return void TRIMMED.set(raw, null); }        // tainted: not ours to read
  const d = px.data;
  /* Sampled and seeded from the whole outer RING, not the four corners. Corners
     alone are the obvious reading and it threw away a third of the packs: many
     of these photographs are cropped tight enough that a corner is one pixel of
     white above fifteen of artwork, and where the white survives only as a top
     and a bottom strip, a flood from the corners cannot reach the second strip
     at all — the two are not connected. The ring is every border pixel; the
     vote takes every fourth of them.

     And "most frequent" has to mean most AGREED WITH, not most identical.
     Quantising into buckets first looked tidier and cost another third: JPEG
     noise on a white margin lands either side of a bucket edge and splits one
     background in two. Counting neighbours within the tolerance the fill itself
     uses doesn't care where the edges fall. */
  const ring = [];
  for (let x = 0; x < w; x++) { ring.push(x * 4); ring.push(((h - 1) * w + x) * 4); }
  for (let y = 1; y < h - 1; y++) { ring.push(y * w * 4); ring.push((y * w + w - 1) * 4); }
  const vote = ring.filter((_, i) => !(i % 4));
  const near = (a, b) => Math.abs(d[a] - d[b]) <= TRIM_TOL
    && Math.abs(d[a + 1] - d[b + 1]) <= TRIM_TOL && Math.abs(d[a + 2] - d[b + 2]) <= TRIM_TOL;
  let bg = -1, agree = 0;
  for (const a of vote) {
    let n = 0;
    for (const b of vote) if (near(a, b)) n++;
    if (n > agree) { agree = n; bg = a; }
  }
  // less than a quarter of the border agreeing on a colour is not a background
  if (agree < vote.length / 4) return void TRIMMED.set(raw, null);
  const br = d[bg], bgg = d[bg + 1], bb = d[bg + 2];
  const seen = new Uint8Array(w * h), stack = ring.map(i => i / 4);
  let cleared = 0;
  while (stack.length) {
    const at = stack.pop();
    if (seen[at]) continue;
    seen[at] = 1;
    const i = at * 4;
    if (Math.abs(d[i] - br) > TRIM_TOL || Math.abs(d[i + 1] - bgg) > TRIM_TOL
      || Math.abs(d[i + 2] - bb) > TRIM_TOL) continue;
    d[i + 3] = 0; cleared++;
    const x = at % w;
    if (x) stack.push(at - 1);
    if (x < w - 1) stack.push(at + 1);
    if (at >= w) stack.push(at - w);
    if (at < w * (h - 1)) stack.push(at + w);
  }
  if (cleared > w * h * 0.85) return void TRIMMED.set(raw, null);   // it ate the pack
  /* White balance off the very reference the fill just used. That colour WAS
     white when the pack was photographed, so whatever it came back as is the
     cast — this is the eyedropper "this should be white", with the dropper
     already in hand.
     Every channel goes to WHITE — 255, not a shade under it. The reference is a
     sheet of paper that was white, so taking it to anything less leaves the
     whole photograph a step dim; the pixels that overshoot are the ones about
     to be transparent anyway.
     Scaling to its own top only removes the cast, and a quarter of these photos
     (10 of 40 sampled) came back with a white that is merely light grey; those
     stayed grey, correctly balanced and still underexposed. MAX_GAIN is the
     brake: a reference at 147 or below is a photograph this can't rescue, and
     below 64 it was never white at all, so only the saturation applies. */
  const top = Math.max(br, bgg, bb);
  const gain = top < 64 ? [1, 1, 1]
    : [br, bgg, bb].map(c => Math.min(MAX_GAIN, WHITE / Math.max(c, 1)));
  const hist = new Uint32Array(256);
  let opaque = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;                       // trimmed away, don't pay for it
    const r = d[i] = Math.min(255, d[i] * gain[0]);
    const g = d[i + 1] = Math.min(255, d[i + 1] * gain[1]);
    const b = d[i + 2] = Math.min(255, d[i + 2] * gain[2]);
    hist[Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b)]++;
    opaque++;
  }
  /* Then LEVELS, off the pack's own histogram rather than the paper's. White
     balance can only carry a photograph as far as its backdrop, and a wrapper
     with no white in it stays flat: Doctor Who's red channel tops out at 241
     over the entire pack, so there is nothing there for a white point to find.
     So take the top of the near-black and the bottom of the near-white — the
     LEVELS fraction of pixels at each end — and stretch what lies between to the
     full range. Clipping both ends is the point, not a side effect: whatever the
     brightest thing is, usually the text, comes out white. A washed-out wrapper
     gets washed further, which is the trade.
     One brake: a pack with no range to stretch (span under a quarter) is flat
     because it IS flat, and amplifying that only amplifies the JPEG. */
  let lo = 0, hi = 255, acc = 0;
  const edge = opaque * LEVELS;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= edge) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= edge) { hi = v; break; } }
  const stretch = hi - lo >= 64 ? 255 / (hi - lo) : 1;
  const level = v => Math.max(0, Math.min(255, (v - lo) * stretch));
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const r = level(d[i]), g = level(d[i + 1]), b = level(d[i + 2]);
    // last, push the colour out from its own luminance — the same weights the
    // card frames pick their ink by, so grey stays grey and only hue moves
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    d[i] = Math.max(0, Math.min(255, l + (r - l) * PACK_SAT));
    d[i + 1] = Math.max(0, Math.min(255, l + (g - l) * PACK_SAT));
    d[i + 2] = Math.max(0, Math.min(255, l + (b - l) * PACK_SAT));
  }
  cx.putImageData(px, 0, 0);
  cv.toBlob(b => {
    const url = URL.createObjectURL(b);
    TRIMMED.set(raw, url);
    img.src = url;
  });
}

/* Only what's on screen turns over. Off screen it isn't a picture yet — the
   browser hasn't fetched it (loading="lazy") and swapping the src would make it
   go and get one — and a page quietly cycling three hundred images is a page
   doing nothing you asked for. */
const PACK_EVERY = 10000;
function cyclePacks() {
  if (!GUTTER || !PACKS.length) return;
  const [pane] = GUTTER, top = pane.scrollTop, bot = top + pane.clientHeight, now = Date.now();
  for (const p of PACKS) {
    if (p.y + p.h < top || p.y > bot) { p.due = now + PACK_EVERY; continue; }
    if (p.due > now) continue;
    p.due = now + PACK_EVERY;
    const others = p.ids.filter(id => !p.raw.includes('/' + id + '_'));
    const id = others[Math.floor(Math.random() * others.length)];
    p.raw = packUrl(id);
    // new picture, new background
    p.img.dataset.trim = p.img.dataset.retry = '';
    if (packLocal()) {
      // trimmed on disk already: no canvas pass, and no CORS to negotiate
      p.img.removeAttribute('crossorigin');
      p.img.removeAttribute('onload');
      p.img.setAttribute('onerror', `packMissing(this, '${id}')`);
    } else {
      // a fresh go at CORS, which the retry may have taken off this element
      p.img.setAttribute('onload', 'trimPack(this)');
      p.img.setAttribute('onerror', 'packRetry(this)');
      p.img.crossOrigin = 'anonymous';
    }
    p.img.src = p.raw;
  }
}
function placeGutter() {
  if (!GUTTER) return;
  const [pane, cells] = GUTTER;
  const top = pane.scrollTop, bot = top + pane.clientHeight;
  for (const [el, y, h, lh] of cells) {
    const at = gutterMid(y, h, lh, top, bot) + 'px';
    if (el.style.top !== at) el.style.top = at;
