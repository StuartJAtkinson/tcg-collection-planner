     sidebar becomes a wall of zeroes the moment you narrow anything. */
  const pool = new Map();
  const scoped = (skip) => pool.get(skip)
    || (pool.set(skip, cards.filter(c => matchesFilter(c, P.filter, skip))), pool.get(skip));
  const n = (test, skip) => scoped(skip).reduce((t, c) => t + (test(c) ? 1 : 0), 0);

    Legality: FORMATS.map(f => [f, n(c => FACET.Legality(c, f), 'Legality')]),
    Type: CARD_TYPES.map(t => [t, n(c => FACET.Type(c, t), 'Type')]),
    Subtype: topN(scoped('Subtype'), c => typeTail(c).trim().split(/\s+/).filter(Boolean), 12),
    /* Most-printed first, out of the catalogue, the same as Subtype and Artist.
       The four hand-picked words in the anatomy spec were a sample presented as
       a vocabulary - there are 868, and which twelve matter depends on what you
       have already narrowed to. In a Kamigawa binder this reads Ninjutsu. */
    Keywords: topN(scoped('Keywords'), c => c.kw || EMPTY, 12),
    Rarity: RARITIES.map(([label]) => [label, n(c => FACET.Rarity(c, label), 'Rarity')]),

       and Artist (2,527) where any list is a sample - it is wrong here, because
       19 is the whole vocabulary and Language is the one group that arrives
       ALREADY APPLIED. At six, widening to Japanese was possible and widening
       to Korean was not, with nothing on screen saying so. */
    Language: topN(scoped('Language'), c => [c.lang || 'en'], LANGS.length || 19),
    Finish: FINISHES.map(f => [f, n(c => FACET.Finish(c, f), 'Finish')]),

// live only when the catalogue is: the mock rows are 18 cards and counting them
// would replace a plausible fiction with an accurate irrelevance
const facetsLive = () => CATALOGUE && P.game === 'mtg';

const anatomyGroup = ([kind, label, arg, o = {}]) => {
  if (kind === 'range') {
    const [lo, hi] = P.filterDraft.range[label] || [null, null];
    return RangeField(label, lo ?? '', hi ?? '', o.symbols,

     for Artist alone is gone. What replaces it is not a runtime message but a
     check: check.mjs asserts the anatomy spec and facetCounts name the same
     groups, which fails on the build that adds a group rather than on the page
     that draws it with three invented numbers. */
  const live = facetsLive() && facetCounts()[label];

     other game's chips stay the picture they have always been rather than
     filtering by the wrong vocabulary. */
  return ChipGroup(label, (live || arg).map(([nm, c]) => [nm, '', c]), o.note || '', o.cols,

};

const AnatomyFilter = () => {
  const spec = game().anatomy;
  const main = spec.filter(g => !(g[3] || {}).other);
  const other = spec.filter(g => (g[3] || {}).other);
  return main.map(anatomyGroup).join('') + (!other.length ? '' : `
    <details class="mt-1 mb-3">
      <summary class="cursor-pointer text-[11px] font-semibold uppercase tracking-wide text-neutral-500 hover:text-neutral-300">Other</summary>
      <div class="mt-2">${other.map(anatomyGroup).join('')}</div>
    </details>`);
};

/* The display type lives ON the sort bar, because the sort is what it has to
   interpret: a break means a different thing in each one. Picking the layout
   next to the terms makes that legible instead of a rule you memorise. */
/* [name, icon, what a break means, which tabs offer it]. A binder layout of a
   deck is not a thing, and neither is a deck layout of a set - so those two
   are not offered rather than being offered and quietly meaningless. */
/* A binder has one layout, and it is the binder. Offering it Compact and Grid
   was offering to draw a binder as something that is not a binder - the tab
   exists because pages of pockets are the point. Every other tab keeps the
   full set, and a deck is a deck for the same reason. */
/* THE THREE CARD DISPLAYS AND WHAT DRAWS EACH - one map, because they are
   offered in three places now (the sort bar, and the card page's printings and
   holdings bands) and the name, the icon and the renderer were written out
   separately in each. Two lists of the same cards on one page disagreeing about
   what a card looks like is exactly what that costs. `binder` and `deck` are
   layouts of a whole LIST rather than of a card, which is why they are not in
   here and not offered off the list bar. */
const CARD_VIEWS = {
  compact: { icon: '&#9776;', brk: 'a horizontal rule', draw: c => TitleRow(c) },
  details: { icon: '&#8801;', brk: 'a horizontal rule', draw: c => KeyRow(c, true) },
  grid:    { icon: '&#9638;', brk: 'a new row',         draw: c => Card(c) },
};
const VIEWS = [
  ...Object.entries(CARD_VIEWS).map(([v, o]) => [v, o.icon, o.brk, ['search', 'printings', 'decks']]),
  /* BINDER AND DECK BELONG TO THE THING THEY ARE NAMED AFTER, and nowhere else.
     The binder layout was also offered on Printings, where it drew a SET as
     pages of pockets - which looks like a binder and is not one: a binder is a
     container you own with a page shape of its own, and a set is a list of
     every card Wizards printed. Offering the layout there invited you to read
     the catalogue as though it were your collection, which is the confusion
     this app has spent the week deleting.
     Neither has ever been offered on Search, and that stays true: Search is a
     query, and a query has no pages and no sections to fill. */
  ['binder',  '&#9707;', 'a new page, headed by the grouping', ['binders']],
  ['deck',    '&#9635;', 'a new section', ['decks']],
];
const views = () => VIEWS.filter(([, , , tabs]) => !tabs || tabs.includes(P.tab));
/* One display chip, three callers. The list bar's and the card page's were the
   same eleven classes typed twice, so a change to one silently made the page
   inconsistent with itself. */
const DisplayChip = (v, icon, on, click, title = '') => `<button onclick="${click}" title="${title}"
  class="${on ? CHIP_PLUS : CHIP_NEUTRAL} capitalize"><span class="text-neutral-500">${icon}</span>${v}</button>`;
// The one tab with a default, because it has only one choice: a display you
// cannot change is a question not worth asking. Everywhere else stays unpicked.
const defaultView = () => (views().length === 1 ? views()[0][0] : null);

/* SORT - click to add and cycle asc/desc/off, drag to reorder, and BREAK is
   an element in the same list. Everything left of it is the grouping. */
/* `capitalize` turns "hp" into "Hp"; acronyms need an explicit label. The short
   forms are here for the same reason they are in the details header: the bar is
   sized by the characters its chips draw, so "Language" and "Number" were
   spending a fifth of the row on two words nothing else abbreviates. Same names
   in both places - a column called Lang and a chip called Language are two
   names for one field. */
const FIELD_LABEL = { hp: 'HP', cmc: 'CMC', kind: 'Main type', language: 'Lang', number: '#' };
const fieldLabel = f => FIELD_LABEL[f] || f;

/* Every order chip is the same shape whether or not it's in the sort: the rank
   and the direction get their slots either way, so clicking one doesn't shove
   the rest of the row sideways. Solid borders throughout - a dashed chip read
   as disabled next to the display buttons. */
const SORT_SLOT = 'w-3 shrink-0 text-center';
/* What a field IS, where the name is not the whole story. Main type earns one
   because "type" already means the type line: this is the deck-building kinds,
   and everything that is not one of them in a single group at the end. */
const FIELD_HINT = {
  kind: 'Creature, planeswalker, instant, sorcery, enchantment, artifact - tokens, lands, battles and every other misc type file together under Other',
};
const fieldTitle = (f, staged) => [
  FIELD_HINT[f],
  groupable(f) ? '' : `Sort, not category${roleCount(f) ? ` - ${num(roleCount(f))} distinct values` : ''}: it orders cards inside a group rather than making one, so it cannot go left of the break`,
  staged ? 'drag to reorder &middot; click to reverse, again to remove' : 'Add to the order',
].filter(Boolean).join(' &middot; ');
/* THE RANK IS THE POSITION IN ITS ZONE, not in the array. The array still holds
   the break, so a group of three and a sort of three numbered off the array read
   1,2,3 then 5,6,7 - a gap where a chip used to be and now is not. Two ordered
   lists is what the bar is showing, so it counts two ordered lists. */
const orderChip = (label, i, dir, zone = 'sort', rank = i === null ? null : i + 1) => `
  <button class="min-w-0 ${i === null ? CHIP_NEUTRAL : `${dir === 'a' ? CHIP_PLUS : CHIP_MINUS} cursor-grab`}"
    ${i === null
      ? `onclick="addSortTo('${label}','${zone}')" title="${fieldTitle(label, false)}"`
      : `draggable="true" ondragstart="dragSort(${i})" ondragover="event.preventDefault()" ondrop="moveSort(${i})"
         onclick="cycleSort(${i})" oncontextmenu="event.preventDefault();removeSort(${i})"
         title="${fieldTitle(label, true)}"`}>
    <span class="${SORT_SLOT} tabular-nums opacity-60">${i === null ? '' : rank}</span>
    <span class="truncate capitalize">${fieldLabel(label)}</span>
    <span class="${SORT_SLOT}">${i === null ? '' : dir === 'a' ? '&uarr;' : '&darr;'}</span>
  </button>`;

/* Two rows: everything you CHOOSE on the first - Display, the Order, Apply and
   Clear - and the numbers that size the layout on its own row underneath.

   The numbers go below because they CHANGE WIDTH as you edit them. Inline, the
   binder's readout goes "9/page &middot; 2 spreads" to "12/page &middot; 3
   spreads" and shoves every Order chip sideways while you are aiming at one; a
   control that moves the control next to it is a control you have to re-find.
   A full-width row of its own is the only arrangement where the numbers cannot
   reach the Order at all - stacking them in a left-hand column, which is where
   they were before, still lets the wider of the two set that column's width.

   Display appears only where there is a choice. On Binders there is one layout,
   so the chooser was a row of a single button that could not be turned off and
   answered a question nobody was asking. */
/* TWO NAMED ZONES, NOT A CHIP YOU DRAG. The break was a token in the middle of
   one long Order row: you had to know that left of it grouped and right of it
   ordered, and the only way to find out was to move it and watch the page
   change. Worse, it was mobile - the same field meant "a page per value" or
   "within a page" depending on where a draggable had ended up, and that is a
   lot of consequence to hang on a thing you can nudge.
   So the two sides are two labelled zones, after Display and in reading order:
   GROUP ORDER makes pages, SORT ORDER arranges cards inside one. The separator
   is still in the array - every layout reads the split off it - it simply is not
   something you can pick up.
   A ZONE ONLY OFFERS WHAT IT CAN TAKE. Group order lists the category fields
   and Sort order lists the rest, so the impossible arrangement is not refused
   after the fact, it is never on the screen: you cannot put Release date or
   collector number into the grouping because the grouping never offers them. */
const ZONES = {
  group: ['Group order', 'a page per value', t => groupable(t.f)],
  sort:  ['Sort order', 'arranges cards inside a page', () => true],
};
/* EACH FIELD IS OFFERED IN EXACTLY ONE ZONE. Category fields used to be listed
   in both - Group order AND Sort order - so Language appeared twice on the bar
   and the two chips looked like two different fields. Which zone a field
   belongs to is the one question the roles already answer. */
/* THE ZONES ARE SIZED BY WHAT IS IN THEM. They were `flex-1` each, so the zone
   holding two chips took exactly as much of the bar as the one holding ten and
   left a lane of empty bar between the last group chip and the Sort order
   label. The weight is the characters the zone has to draw - its label plus
   each chip's - so the split falls out of the content, and a zone that still
   cannot fit truncates its chips rather than shoving the next zone off the row. */
const CHIP_CHARS = 5;  // rank slot, arrow slot and the padding either side
const zoneWeight = (label, fields) =>
  label.length + fields.reduce((t, f) => t + fieldLabel(f).length + CHIP_CHARS, 0);
const SortZone = (zone, FIELDS, used) => {
  const b = breakAt(P.sortDraft);
  const [label, what] = ZONES[zone];
  const inZone = P.sortDraft
    .map((t, i) => [t, i])
    .filter(([t, i]) => t.f !== 'BREAK' && (zone === 'group' ? i < b : i > b));
  const free = FIELDS.filter(f => !used.has(f) && groupable(f) === (zone === 'group'));
  return `
      <div class="flex min-w-0 flex-wrap items-center gap-1.5" title="${label} - ${what}"
        style="flex:${zoneWeight(label, [...inZone.map(([t]) => t.f), ...free])} 1 0%">
        <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide ${
          zone === 'group' ? 'text-amber-500/80' : 'text-neutral-600'}">${label}</span>
        ${inZone.map(([t, i], n) => orderChip(t.f, i, t.d, zone, n + 1)).join('')
          || `<span class="text-[10px] italic text-neutral-700">${
            zone === 'group' ? 'nothing - one continuous list' : 'nothing - catalogue order'}</span>`}
        ${!free.length ? '' : `<span class="mx-0.5 h-4 w-px bg-neutral-800"></span>
        ${free.map(f => orderChip(f, null, undefined, zone)).join('')}`}
      </div>`;
};
const SortRow = () => {
  const FIELDS = game().sort;
  const used = new Set(P.sortDraft.filter(t => t.f !== 'BREAK').map(t => t.f));
  return `
    <div class="flex flex-col gap-2">
    <div class="flex flex-wrap items-center gap-x-2 gap-y-2">
      ${views().length < 2 ? '' : `
      <div class="flex min-w-0 flex-wrap items-center gap-1.5" title="Display - decides what a break means"
        style="flex:${zoneWeight('Display', views().map(([v]) => v))} 1 0%">
        <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Display</span>
        ${views().map(([v, icon, what]) =>
          DisplayChip(v, icon, v === P.view, `setView('${v}')`, `break = ${what}`)).join('')}
      </div>`}
      ${SortZone('group', FIELDS, used)}
      ${SortZone('sort', FIELDS, used)}
      <div class="flex shrink-0 items-center gap-1.5">
        <button onclick="applySort()" class="${BTN_PRIMARY_LG} ${sortDirty() ? '' : 'opacity-40'}">Apply</button>
        <button onclick="clearSort()" class="${BTN_SECONDARY_LG}">Clear</button>
      </div>
    </div>
    ${LayoutRow()}
    </div>`;
};

/* The column count and the binder's page shape are both numbers you set, so
   they are both steppers: type a value or click the arrows. A slider was the wrong control
   for either - you cannot ask one for "exactly 3 across", and a card size worth
   returning to is worth typing. They live on the SORT band's own header line,
   beside Apply and Clear, because they change how the results below are laid
   out rather than what is in them. */
const STEPPER = 'w-11 rounded border border-neutral-700 bg-neutral-950 px-1 py-0.5 text-center text-[11px] tabular-nums text-neutral-200';
const NUM_LABEL = 'text-[10px] font-semibold uppercase tracking-wide text-neutral-600';
/* The binder counts its own way, because a page shape is more than one number.
   Pages, Columns and Rows say what is open in front of you and how it is
   pocketed, and the card size is then WHATEVER FITS - three integers instead of
   a percentage you nudge until it stops overflowing. Which it did: four pages
   of a 3x3 at 100% wanted 2,576px of a 2,400px pane, so the pane scrolled
   sideways. Nothing here is measured in px any more, so it cannot.

   Keyed on the LAYOUT, not the tab: Printings draws the binder too, and a
   percentage is no more use there. With no binder picked to own the shape, the
   tab's own default takes the edit - same rule `dimsOwner` already follows. */
const LayoutRow = () => {
  const [cols, rows] = binderDims();
  /* Details is a table and a deck list is one column: neither has a count to
     set, so neither gets a control. Zoom was drawn on both and moved nothing. */
  if (P.view !== 'binder') {
    const bounds = LAYOUT_COLS[P.view];
    if (!bounds) return '';
    return `
    <span class="flex shrink-0 items-center gap-1.5">
      <span class="${NUM_LABEL}">Columns</span>
      <input type="number" min="${bounds[0]}" max="${bounds[1]}" step="1" value="${colsOf()}"
        onchange="setCols(this.value)" title="How many across - the cards are then whatever fits"
        class="${STEPPER}">
    </span>`;
  }
  const owner = P.pick.binders
    ? `Pocket layout of ${jsArg(P.pick.binders)}` : 'Pocket layout for binders with none picked';
  return `
    <span class="flex shrink-0 items-center gap-1.5">
      <span class="${NUM_LABEL}" title="Pages open side by side - two to a spread">Pages</span>
      <input type="number" min="2" max="8" step="2" value="${P.across}" onchange="setAcross(this.value)"
        title="Pages across, in twos - a page has a facing page" class="${STEPPER}">
      <span class="ml-2 ${NUM_LABEL}" title="${owner}">Columns</span>
      <input type="number" min="1" max="6" step="1" value="${cols}" onchange="setBinderDim(0,this.value)"
        title="Pockets across a page" class="${STEPPER}">
      <span class="ml-2 ${NUM_LABEL}" title="${owner}">Rows</span>
      <input type="number" min="1" max="6" step="1" value="${rows}" onchange="setBinderDim(1,this.value)"
        title="Pockets down a page" class="${STEPPER}">
      <span class="text-[10px] text-neutral-600">${cols * rows}/page &middot; ${
        P.across / 2} spread${P.across === 2 ? '' : 's'}</span>
    </span>`;
};



/* fake grouped result - the groups ARE the sort's grouping applied. With no
   sort there is no grouping, so it collapses to one unheaded run. */
/* The sort used to be a picture of a sort: GROUPS chopped the list into equal
   slices and captioned them from a hardcoded list of labels, so "White · Rare"
   headed a page of whatever happened to land in the first third. Every field on
   the bar now has a real key, and the grouping labels come off the cards.

   One key per field, and they are compared in the order the chips are in. Sets
   sort by RELEASE DATE rather than code, because that is the order the Printings
   table is already in and the alphabet is not a chronology. */
const COLOUR_NAME = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
const colourName = s => !s ? 'Colourless' : s.length === 1 ? COLOUR_NAME[s] : `${s.length}-colour`;
/* WUBRG order, fewer colours first so mono sits above the gold - and COLOURLESS
   LAST rather than first. It sorted first because it has zero colours and the
   count leads the key, which is arithmetic rather than a decision: it put 18,557
   artifacts, lands and Eldrazi at the top of every colour-ordered list, ahead of
   every card anyone was looking for. It is the absence of the thing being
   ordered, so it goes at the end. */
const colourKey = (s = '') => (s ? String(s.length).padStart(2, '0') : '99')
  + [...s].map(c => 'WUBRG'.indexOf(c) + 1).sort().join('');
const priceBand = v => !v ? 'no price' : v < 1 ? 'under £1' : v < 5 ? '£1–5'
  : v < 20 ? '£5–20' : v < 100 ? '£20–100' : '£100+';
// a collector number is not a number: 12a, 378, ★5 all sort as text once padded
const numKey = c => String(c.num ?? '').replace(/\d+/, m => m.padStart(6, '0'));

/* A RELEASE is the BLOCK, which is what the Printings gutter groups by: a set
   plus the sub-sets filed under it, which take their parent's date because a
   sub-set can ship months later (Final Fantasy Scene Box, six months after
   Final Fantasy). Same walk as SetList and therefore the same answer - SETS is
   newest-first with each sub-set following its parent, so the block is just the
   last non-sub-set row seen. Sorting by `set` puts MKM and its token set in
   different places; sorting by `release` keeps a release together. */
const BLOCK = (() => {
  const m = new Map();
  let block = null;
  for (const r of SETS) {
    if (!r[4] || !block) block = r;
    m.set(r[1], block);
  }
  return m;
})();
const SORT_KEY = {
  name: c => (c.n || '').toLowerCase(),
  set: c => (SET_BY_CODE.get(c.set)?.[2] || '') + (c.set || ''),
  release: c => { const b = BLOCK.get(c.set); return b ? b[2] + b[1] : ''; },
  number: numKey,
  rarity: c => c.rar || 0,
  mana: c => manaValue(c),
  colour: c => colourKey(c.col),
  price: c => c.usd || 0,
  language: c => c.lang || '',
  hp: c => +c.hp || 0,
  type: c => typeHead(c).trim().toLowerCase(),
  kind: c => MAIN_ORDER.indexOf(mainType(c)),
};
const GROUP_LABEL = {
  name: c => (c.n || '?')[0].toUpperCase(),
  set: c => c.set || 'no set',
  release: c => BLOCK.get(c.set)?.[0] || 'unknown release',
  number: c => c.num ?? '-',
  rarity: c => rarityName(c.rar) || 'unknown rarity',
  mana: c => `mana value ${manaValue(c)}`,
  colour: c => colourName(c.col),
  price: c => priceBand(c.usd),
  language: c => c.lang || 'no language',
  hp: c => (c.hp ? `${c.hp} HP` : 'no HP'),
  type: c => typeHead(c).trim() || 'no type',
  kind: c => mainType(c),
};

/* CATEGORY OR CONTINUOUS, DERIVED FROM THE CATALOGUE RATHER THAN DECLARED.
   A page header is only a header if there are few enough of them to be worth
   reading: collector number makes 12,651 groups of one card each, which is not
   a grouping, it is the list with a caption on every row.

   THE LINE WAS 20, THEN IT WAS 94, AND BOTH WERE TYPED. 20 was picked by eye
   and cut through the middle of the categories; 94 was measured, which was
   better, but a number measured once is a number that goes stale the next time
   Wizards prints a mechanic. So the split is COMPUTED off whatever catalogue is
   loaded, and the only thing written down is how to find it.

   HOW, AND WHY NOT "THE BIGGEST JUMP". Sort every field by its distinct group
   labels and the ratios between neighbours are:

       hp 1 -> rarity 5          x5.00
       name 34 -> type 94        x2.76
       type 94 -> release 460    x4.89
       set 986 -> number 12651   x12.83   <- the biggest, and the wrong answer

   Taking the largest jump puts the boundary between `set` and `number`, which
   makes `set` (986) and `release` (460) page groupings: 986 pages of one card.
   The jump has to be judged against the SPREAD either side of it, not on its
   own, so this is a two-cluster split on log(count) - the one that minimises
   total within-cluster variance, which is Jenks natural breaks for k=2. Scored
   over every candidate boundary it has a clean minimum:

       name|type      20.72
       type|release   19.40   <- chosen
       release|set    29.19
       set|number     41.40

   and it lands where the data is actually empty: nothing in this app has a
   distinct count between 94 and 411. A card has a handful of each thing it IS
   and hundreds of each thing that merely IDENTIFIES it, and that is the real
   shape the number is measuring.

   COMPUTED ONCE, OFF THE CATALOGUE, NOT THE SCOPE. The original version counted
   the first 2,000 rows of whatever you were looking at, so `set` was a grouping
   inside a small binder and refused in Search - the same chip moving depending
   on where you stood. This is a fact about the catalogue, so it is memoised on
   the catalogue's identity and costs one 449ms pass per load.

   BELOW `ROLE_MIN` IT CANNOT BE MEASURED and says so instead of guessing: 18
   mock rows put every field in one cluster, which would make collector number a
   grouping. Everything is `sort` until there is a catalogue, which is the safe
   direction - a field nobody has counted cannot become a page grouping. */
/* THE COLD START, and it is the last real measurement rather than a guess. It
   cannot be a boundary number: 18 mock rows put every field under any cut you
   pick, so `number` would come out a grouping. It has to be per field, so it is
   the roles the derivation below produced against the real 107,347-printing
   catalogue, kept for the ~2 seconds before that catalogue lands and for a
   harness that has no network. The live app never reads it. */
const ROLE_COLD = { hp: 'category', rarity: 'category', price: 'category', kind: 'category',
  colour: 'category', mana: 'category', language: 'category', type: 'category',
  name: 'sort', release: 'sort', set: 'sort', number: 'sort' };
const ROLE_MIN = 1000;
let ROLES = null, ROLES_OF = null;
const roles = () => {
  const cards = ALL();
  if (ROLES_OF === cards) return ROLES;
  ROLES_OF = cards;
  ROLES = new Map();
  if (cards.length < ROLE_MIN) {
    for (const [f, r] of Object.entries(ROLE_COLD)) ROLES.set(f, [r, null]);
    return ROLES;
  }
  const counted = Object.entries(GROUP_LABEL).map(([f, fn]) => {
    const seen = new Set();
    for (let i = 0; i < cards.length; i++) seen.add(fn(cards[i]));
    return [f, seen.size];
  }).sort((a, b) => a[1] - b[1]);
  const xs = counted.map(([, n]) => Math.log(n));
  const spread = (a) => { if (a.length < 2) return 0;
    const m = a.reduce((t, v) => t + v, 0) / a.length;
    return a.reduce((t, v) => t + (v - m) ** 2, 0); };
  let cut = 1, best = Infinity;
  for (let k = 1; k < xs.length; k++) {
    const within = spread(xs.slice(0, k)) + spread(xs.slice(k));
    if (within < best) { best = within; cut = k; }
  }
  counted.forEach(([f, n], i) => ROLES.set(f, [i < cut ? 'category' : 'sort', n]));
  /* `name` IS THE ONE OVERRIDE, and it is deliberate rather than a miss. Its
     group label is the INITIAL, so it measures 34 and the split alone puts it
     in the category cluster - but a grouping is a page, and A-Z pages of a
     collection are 26 captions rather than a filing. Overridden on instruction;
     delete this line to give it back. */
  if (ROLES.has('name')) ROLES.set('name', ['sort', ROLES.get('name')[1]]);
  return ROLES;
};
const roleOf = f => roles().get(f)?.[0] || 'sort';
const groupable = f => roleOf(f) === 'category';
const roleCount = f => roles().get(f)?.[1];

// the one rule the bar enforces: nothing continuous may sit left of the break
const legalSort = (l) => {
  const b = l.findIndex(t => t.f === 'BREAK');
  return b < 0 || l.slice(0, b).every(t => groupable(t.f));
};

/* MEMOISED, ON THE INPUT AND THE ORDER TOGETHER - the same rule `filtered()`
   and `facetCounts()` already follow, and it was the one step in the pipeline
   without it. `CARDS()` is called four or five times in a single render (the
   sentinel twice, the "240 of 107,347" count, the grouping, the binder stat)
   and each call re-sorted the whole filtered list from scratch. Measured on
   Search with nothing filtered: one sort of 107,347 printings is **506ms**, and
   a render was **2,398ms** - 4.7 sorts of the same list, for one answer.
   Keyed on the ARRAY IDENTITY of the input rather than its length: `filtered()`
   hands back the same array until the scope or the filter changes, so identity
   is exactly "is this the same list", where a length would call two different
   107k-row lists equal. */
let SORTED = null, SORTED_OF = null, SORTED_BY = null;
const sortCards = (cs) => {
  const by = P.sort.map(t => `${t.f}${t.d || ''}`).join(',');
  if (SORTED_OF === cs && SORTED_BY === by) return SORTED;
  const terms = P.sort.filter(t => t.f !== 'BREAK' && SORT_KEY[t.f]);
  // decorate once: the comparator runs O(n log n) times and would otherwise
  // rebuild every key on every comparison
  SORTED = !terms.length ? cs
    : cs.map(c => [terms.map(t => SORT_KEY[t.f](c)), c])
      .sort((a, b) => {
        for (let i = 0; i < terms.length; i++) {
          if (a[0][i] === b[0][i]) continue;
          return (a[0][i] < b[0][i] ? -1 : 1) * (terms[i].d === 'd' ? -1 : 1);
        }
        return 0;
      })
      .map(p => p[1]);
  SORTED_OF = cs; SORTED_BY = by;
  return SORTED;
};

/* Groups are runs of the sorted list, not slices of it: everything left of the
   break makes a label, and a new label starts a group. That is why the order
   matters - group by colour then rarity and you get White/Common, White/Rare. */
/* A FIELD CAN SPLIT WITHOUT NAMING THE SPLIT. Main type files a collection and
   it is the first term of the default order, but one of its seven values is not
   a value: `mainType` returns "Other" for anything that is not one of the six
   spell types, and measured that is **18,544 printings - 17% of the catalogue**
   and its second-largest bucket, holding lands, tokens, emblems, schemes,
   planes and dungeons together. Printed into a header it reads "Other ·
   Colourless · Common", which names nothing and sits incongruously beside two
   terms that do name something.
   So it still groups - the filing is right, and the pages break where they
   should - it just does not caption them. The header carries the terms that can
   finish the sentence "this page is...". */
const UNNAMED_GROUP = new Set(['kind']);
const GROUPS = () => {
  const cs = CARDS();
  const terms = grouping().filter(t => t.f !== 'BREAK' && GROUP_LABEL[t.f]);
  if (!terms.length) return [[null, cs]];
  const out = [];
  for (const c of cs) {
    // split on every grouping term, caption with only the ones that name
    // something - so main type still breaks the page and stays out of the words
    const key = terms.map(t => GROUP_LABEL[t.f](c)).join(' ');
    const label = terms.filter(t => !UNNAMED_GROUP.has(t.f))
      .map(t => GROUP_LABEL[t.f](c)).join(' &middot; ');
    if (!out.length || out[out.length - 1][2] !== key) out.push([label, [], key]);
    out[out.length - 1][1].push(c);
  }
  return out;
};

/* ONE GROUP HEADER, FOUR LAYOUTS. The amber label was typed out four times with
   four slightly different wrappers; what genuinely differs between them is how
   the header spans its container, which is the only thing left here. */
const GROUP_WRAP = {
  compact: 'px-2 py-1.5 [grid-column:1/-1]',
  details: 'px-2 py-1.5',
  grid: 'col-span-full',
};
const GroupHead = (g, i, cls = '', extra = '') => !g ? '' : `
  <div class="flex items-center gap-2 ${i ? 'border-t border-neutral-800' : ''} ${
    i && cls === GROUP_WRAP.grid ? 'mt-3 pt-3' : ''} ${cls}">
    <span class="text-[11px] font-semibold uppercase tracking-wide text-amber-400/80">${g}</span>${extra}</div>`;

const Results = () => {
  if (!P.view) return `
    <div class="rounded-lg border border-dashed border-neutral-800 px-4 py-10 text-center">
      <p class="text-sm text-neutral-400">No display chosen.</p>
      <p class="mx-auto mt-1 max-w-sm text-[11px] text-neutral-600">
        A fresh page applies nothing on your behalf. Pick one on the sort bar &mdash;
        it also decides what a break does.</p>
      <div class="mt-4 flex flex-wrap justify-center gap-1.5">${views().map(([v, icon]) =>
        DisplayChip(v, icon, false, `setView('${v}')`)).join('')}</div>
    </div>`;
  const gs = GROUPS();
  if (P.view === 'binder') {
    const dims = binderDims();          // pockets per page, from the binder itself
    /* Two pages side by side, the way an open binder actually reads, and each
       pocket is the same `Card` the grid draws - clickable, with its count and
       price under it. A pocket that showed a bare frame was a different card
       from the one three tabs over, for no reason anybody could name. */
    /* The pair of pages is sized by its pockets and then centred: `w-fit` lets
       each page hug its own grid, and the auto margins put the leftover width
       either side rather than all of it on the right. So a 2x2 binder at 80% and
       a 5x3 at 150% both sit in the middle of the pane instead of drifting. */
    /* A GROUP IS NOT A PAGE. A break starts a new page, but a run longer than
       the pockets carries on over as many more as it needs - drawing one page
       per group silently dropped everything past the ninth card in it, and with
       no break at all it drew nine of the whole list and threw the rest away.
       Nine per group was never a coincidence; it was the page size. */
    /* Page 1 is a RIGHT-hand page. A binder opens on its inside front cover, so
       the pages you ever see side by side are 2|3, 4|5 - pairing them 1|2, 3|4
       shows two pages that are never open together. The first spread's left
       slot is the cover, and every later spread is an even|odd pair.

       PAGES ACROSS IS THE INPUT, NOT THE CARD SIZE. Everything below is a
       fraction of the pane: spreads share the width, the two pages share a
       spread, the pockets share a page. Sizing it the other way - a card size
       in px multiplied out - is why four 3x3 pages wanted 2,576px of a 2,400px
       pane and the whole thing scrolled sideways. Nothing here is px, so it
       cannot outgrow the window; ask for more pages and the cards get smaller,
       which is the trade a binder actually makes. */
    const per = dims[0] * dims[1];
    const pages = binderPages(gs);
    const cover = -1;
    const slots = [cover, ...pages.keys()];
    const spreads = Array.from({ length: Math.ceil(slots.length / 2) },
      (_, s) => slots.slice(s * 2, s * 2 + 2));
    const Page = (i) => {
      const [g, cs, k, n] = pages[i];
      return `<div class="${PANEL} w-full min-w-0 p-3">
        <div class="mb-2 flex items-baseline gap-2 border-b border-neutral-800 pb-1">
          <span class="text-xs uppercase tracking-wide text-neutral-500">Page ${i + 1}</span>
          ${g ? `<span class="text-[11px] font-semibold text-amber-400/80">${g}${
            n > 1 ? ` <span class="font-normal text-neutral-600">${k + 1} of ${n}</span>` : ''}</span>` : ''}
          <span class="ml-auto pl-3 text-[10px] text-neutral-600">${cs.length}/${per}</span></div>
        <div class="grid gap-2" style="grid-template-columns:repeat(${dims[0]},minmax(0,1fr))">
          ${Array.from({ length: per }, (_, j) => j < cs.length
            ? Card(cs[j])
            : '<div class="aspect-[5/7] rounded-lg border border-dashed border-neutral-800"></div>').join('')}
        </div></div>`;
    };
    /* A spread is a real element, not four columns and one gap. With one gap the
       join between two facing pages and the join between two different spreads
       are the same distance, so you cannot see which pair is open together. */
    /* OFFSCREEN SPREADS SKIP LAYOUT AGAIN, and the intrinsic size is measured
       rather than picked. `content-visibility: auto` was dropped when the binder
       stopped being sized in px, because it needs a height to stand in for what
       it is not laying out and there was no px height left to declare - and a
       magic number is worse than no optimisation. There is one honest height
       available: the FIRST spread is always on screen, so it is exempted, laid
       out for real, and measured into `--spread-h` for all the others. Every
       spread is the same height by construction - a page always draws `per`
       pockets, empty ones included - so one measurement answers for the lot, and
       it is re-taken on every render and every resize rather than remembered.

       Worth the wiring: measured on the worst case one page allows, a
       240-page binder at 1x1, layout is **267ms** and with this **17.9ms**.
       Building the HTML is 21ms and parsing it 30ms, so layout was not merely
       the largest cost, it was the whole cost - and every click re-renders. */
    return `<div class="w-full">
      <div class="grid items-start gap-8" data-spreads
        style="grid-template-columns:repeat(${P.across / 2},minmax(0,1fr))">
      ${spreads.map((pair, s) => `<div class="grid items-start gap-3" data-spread
        style="grid-template-columns:repeat(2,minmax(0,1fr));${s
          ? 'content-visibility:auto;contain-intrinsic-height:auto var(--spread-h,0px);' : ''}">
        ${pair.map(i => i === cover ? '<div></div>' : Page(i)).join('')}
      </div>`).join('')}
      </div>
      <p class="mt-3 text-[11px] text-neutral-600">${grouping().length
        ? 'Each break starts a new page; the page header is the grouping at that point.'
        : 'No break, so it fills pages in order. Add a break to the sort to start a new page.'}</p></div>`;
  }
  if (P.view === 'deck') {
    return `<div class="max-w-lg">
      ${gs.map(([g, cs]) => `<div class="mb-4">
        ${GroupHead(g, 0, 'mb-1 border-b border-neutral-800 pb-1',
          `<span class="text-[10px] text-neutral-600">${cs.reduce((n, c) => n + (c.qty || 0), 0)} cards</span>`)}
        ${cs.map(c => KeyRow(c)).join('')}</div>`).join('')}</div>`;
  }
  /* THE THREE CARD DISPLAYS DIFFER IN THEIR WRAPPER AND NOTHING ELSE - the row
     itself is CARD_VIEWS' renderer, the same one the card page's bands use. It
     used to be three near-identical branches, each with its own copy of the
     group header, which is how one of them came to keep `mt-3` and another to
     drop `grid-column`. */
  const drawn = gs.map(([g, cs], i) => GroupHead(g, i, GROUP_WRAP[P.view] || GROUP_WRAP.grid)
    + cs.map(CARD_VIEWS[P.view].draw).join('')).join('');
  if (P.view === 'compact') {
    return `<div class="grid rounded-lg border border-neutral-800 bg-neutral-950/60"
      style="grid-template-columns:repeat(${colsOf()},minmax(0,1fr))">${drawn}</div>`;
  }
  if (P.view === 'details') return `<div class="rounded-lg border border-neutral-800 bg-neutral-950/60">
    ${DetailHead()}${drawn}</div>`;
  return `<div class="grid gap-3" style="grid-template-columns:repeat(${colsOf()},minmax(0,1fr))">${drawn}</div>`;
};

const PAGES = {};

/* One renderer, four routes. The route IS the scope. On Search the scope is
   pickable in the sidebar; on a scoped page it's already decided, so the
   sidebar drops it and the header carries Back + the sub-select instead. */

/* Year and month are the table's own left gutter, one cell spanning every row
   beneath them - not a sidebar list, which can only be near the rows it labels.
   They label, they do not filter: the only clickable thing on this page is a
   set, and it always goes to that set's page. Blocks are gone from the gutter
   too - a block IS its parent set, so listing it made a set name that didn't. */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* Printings' selector keeps the scryfall.com/sets shape: sub-sets indented
   under their parent, fixed sort by block date then sub-set date, newest first,
   no search. A real table, because rowspan is what "this year covers these
   rows" means - faking it with a flex sidebar can only ever approximate the
   alignment. Collected takes a third of the width: a bar you can't read the
   shape of is just a percentage. */
/* The same three answers the hovering button gives, one row at a time: a set you
   can open gets a Draft button that goes straight to the config; a set you could
   open but nobody has collated yet says so; a token or promo set gets nothing,
   because there is no pack. 986 rows, so the "nothing" case has to be nothing. */
const DraftCell = (label) => {
  const packs = packsFor(label);
  if (!packs) return '';
  if (packs.length)
    // stopPropagation: the row has its own onclick that selects the set, and
    // without this the click bubbles up there too - "Draft" then navigates to
    // the set it was supposed to open from. The whole point is to stay put.
    // draftSet(...) goes first so the handler the markup exposes to the test
    // harness is `draftSet` - putting stopPropagation first makes the inline
    // attribute start with `event.stopPropagation()`, which is not a draft call.
    return `<button onclick="draftSet('${jsArg(label)}');event.stopPropagation()" title="Draft boosters from this set${collationNote(label)}"
              class="${CHIP_NEUTRAL} hover:border-emerald-500 hover:text-emerald-300">Draft</button>`;
  // two different silences: nothing collated at all, or collated but not into a draft
  const why = setRow(label)?.[6]
    ? 'This set has collation, but none of it is a booster you draft'
    : 'No booster collation published for this set yet';
  return `<span title="${why}" class="text-[10px] text-neutral-700">no pack data</span>`;
};

/* THE SAME BUTTON THE ROW HAS, ON THE BAR, ONCE THE SET IS PICKED. It was a
   trigger hovering bottom-right over the table, labelled "Boosters" - a floating
   control in the one corner of the window that has nothing to do with the set it
   acts on, naming a thing rather than the action, while the rows underneath had
   been saying "Draft" all along. The bar already carries everything you can do
   to the current selection (Edit, Export, Clear); this belongs with them, beside
   the set's own name. Same three answers as the row, because it is the same
   question: draftable, collated-but-not-drafted, or not a set you open. */
const DraftBar = () => {
  const sel = P.tab === 'printings' ? picked() : null;
  const packs = sel ? packsFor(sel) : null;
  if (!packs) return '';
  // "not yet" and "never" are different, and the disabled FAB said so; keep it
  /* No collationNote in the title, unlike the row: the note carries "N cards on
     the sheets", and the bar's one rule is that it never shows a count the top
     bar's stats could contradict. The next screen is the question, which names
     the collation in full. */
  return packs.length
    ? `<button onclick="askDraw('${jsArg(sel)}')" title="Draft boosters from this set"
         class="${BTN_PRIMARY}">Draft</button>`
    : `<span title="No booster collation published for this set yet &mdash; Wizards doesn&#39;t release it, and it gets reverse-engineered from opened packs"
         class="text-[11px] text-neutral-600">no pack data</span>`;
};

/* Where a gutter label goes: the middle of the part of its block you can see.
   A year two screens tall showing only its top quarter wants its label an eighth
   of the way down it - the middle of the whole block is off screen by then, and
   the middle of the window is not a fact about the block at all. That midpoint
   is the intersection of the block and the pane, one of which moves, and CSS has
   no way to say it: sticky can hold an edge, but not a point between two edges
   that both move. So it is arithmetic. `lh` keeps the label inside its own
   block at the extremes, where the visible sliver is thinner than the label. */
const gutterMid = (y, h, lh, top, bot) => {
  const mid = (Math.max(y, top) + Math.min(y + h, bot)) / 2 - y;
  return h <= lh ? h / 2 : Math.min(h - lh / 2, Math.max(lh / 2, mid));
};
/* Measured once per render, because none of it changes while you scroll: the
   blocks keep their offsets and the labels their size. Scrolling re-reads one
   number. Writes are skipped where the value hasn't moved, which is every block
   that's off screen - so a scroll touches the handful you're actually looking
   at, not all 300. */
let GUTTER = null, PACKS = [];
/* getBoundingClientRect reports VISUAL pixels - the body's zoom has already been
   applied to them - while scrollTop, clientHeight and style.top are the element's
   own CSS pixels, which zoom has not touched. Mixing the two is silent until the
   page is scaled: at 0.8 it put the year labels up to 1,000px out of place, five
   of them outside the pane entirely. Every rect below is divided back at the
   point it is read, so the rest of the arithmetic stays in one unit. */
const uiZoom = () => parseFloat(getComputedStyle?.(document.body)?.zoom) || 1;

/* The one honest number for `contain-intrinsic-height`: the first spread is on
   screen, so it is never skipped and its height is real. Read after the render
   that made it and written to the container as a variable, so the spreads that
   ARE skipped stand in at the size of the one that is not. Nothing is
   remembered between renders - a resize re-takes it, which is the whole reason
   it is a measurement and not a constant. */
function measureSpread() {
  const first = document.querySelector?.('[data-spread]');
  if (!first) return;
  const h = Math.round(first.getBoundingClientRect().height / uiZoom());
  // 0 is "not laid out yet", not a height - writing it would collapse the rest
  if (h > 0) first.parentElement.style.setProperty('--spread-h', h + 'px');
}

function measureGutter() {
  const pane = document.querySelector?.('#pane');
  const cells = pane ? [...pane.querySelectorAll('td[rowspan] > div')] : [];
  PACKS = [];
  if (!cells.length) return (GUTTER = null);
  const z = uiZoom();
  const base = pane.getBoundingClientRect().top / z - pane.scrollTop;
  GUTTER = [pane, cells.map(el => {
    const block = el.parentElement.getBoundingClientRect();
    return [el, block.top / z - base, block.height / z, el.getBoundingClientRect().height / z];
  })];
  // The packs measure off the same base. Their first turn is a random part of a
  // cycle away, so a screenful doesn't flip in unison - which is the whole
  // reason for the delay, not a rule about how long a pack should be up.
  for (const img of pane.querySelectorAll('img[data-packs]')) {
    const ids = img.dataset.packs.split(' ');
    if (ids.length < 2) continue;             // one pack: nothing to cycle to
    const block = img.parentElement.getBoundingClientRect();
    // `raw` is the CDN url, which img.src stops being the moment it's trimmed
    PACKS.push({ img, ids, raw: img.src, y: block.top / z - base, h: block.height / z,
                 due: Date.now() + Math.random() * PACK_EVERY });
  }
  placeGutter();
}
/* The wrappers are JPEGs shot on white: no alpha, so a pack lands in a bright
   box on a dark table. Trim it - vote on the four corners for a background
   colour, flood from all four inwards, and clear the alpha of everything that
   matches within tolerance. It only reaches the pixels because the CDN answers
   a CORS request (the headers say nothing until you actually ask as an origin;
   `crossorigin` on the tag is what makes the canvas readable rather than
   tainted), so this is a browser job and not a build step.

   Two ways out, both leaving the picture exactly as it came: corners that don't
   agree aren't a background, and a flood that eats the image was never one. A
   pack whose own artwork bleeds white to the edge would otherwise be erased. */
// the constants and the algorithm live in trim.js; this cache is the browser's own
const TRIMMED = new Map();
/* A copy already in the HTTP cache from a request that did NOT ask for CORS is
   handed back without the header, and the crossorigin load then fails outright -
   which is how the trim first showed up as a broken image rather than an
   untrimmed one. So ask again off the end of the cache, still as an origin: this
   CDN does answer, it just never put the header on the copy we already had. Only
   if THAT fails is the host really refusing, and then the picture matters more
   than the alpha and it comes back plain and untrimmed. */
function packRetry(img) {
  const step = img.dataset.retry || '';
  if (!step) {
    img.dataset.retry = 'cors';
    img.src += (img.src.includes('?') ? '&' : '?') + 'cors';
  } else if (step === 'cors') {
    img.dataset.retry = 'plain';
    img.removeAttribute('crossorigin');
    img.src += '&plain';
  }
}
function trimPack(img) {
  if (img.dataset.trim || !img.naturalWidth) return;
  img.dataset.trim = 'done';
  const done = TRIMMED.get(img.currentSrc);
  if (done !== undefined) { if (done) img.src = done; return; }
  const raw = img.currentSrc, w = img.naturalWidth, h = img.naturalHeight;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.drawImage(img, 0, 0);
  let px;
  try { px = cx.getImageData(0, 0, w, h); }
  catch { return void TRIMMED.set(raw, null); }        // tainted: not ours to read
  // a photograph this could not cut out is still a photograph of a pack: null
  // caches "leave it alone" and it stays on screen untrimmed
  if (trimPixels(px.data, w, h)) return void TRIMMED.set(raw, null);
  cx.putImageData(px, 0, 0);
  cv.toBlob(b => {
    const url = URL.createObjectURL(b);
    TRIMMED.set(raw, url);
    img.src = url;
  });
}

/* Only what's on screen turns over. Off screen it isn't a picture yet - the
   browser hasn't fetched it (loading="lazy") and swapping the src would make it
   go and get one - and a page quietly cycling three hundred images is a page
   doing nothing you asked for. */
const PACK_EVERY = 10000;
function cyclePacks() {
  if (!GUTTER || !PACKS.length) return;
  const [pane] = GUTTER, top = pane.scrollTop, bot = top + pane.clientHeight, now = Date.now();
  for (const p of PACKS) {
    if (p.y + p.h < top || p.y > bot) { p.due = now + PACK_EVERY; continue; }
    if (p.due > now) continue;
    p.due = now + PACK_EVERY;
    const others = p.ids.filter(id => !p.raw.includes('/' + id + '_'));
    const id = others[Math.floor(Math.random() * others.length)];
    p.raw = packUrl(id);
    // new picture, new background
    p.img.dataset.trim = p.img.dataset.retry = '';
    if (packLocal()) {
      // trimmed on disk already: no canvas pass, and no CORS to negotiate
      p.img.removeAttribute('crossorigin');
      p.img.removeAttribute('onload');
      p.img.setAttribute('onerror', `packMissing(this)`);
    } else {
      // a fresh go at CORS, which the retry may have taken off this element
      p.img.setAttribute('onload', 'trimPack(this)');
      p.img.setAttribute('onerror', 'packRetry(this)');
      p.img.crossOrigin = 'anonymous';
    }
    p.img.src = p.raw;
  }
}
function placeGutter() {
  if (!GUTTER) return;
  const [pane, cells] = GUTTER;
  const top = pane.scrollTop, bot = top + pane.clientHeight;
  for (const [el, y, h, lh] of cells) {
    const at = gutterMid(y, h, lh, top, bot) + 'px';
    if (el.style.top !== at) el.style.top = at;
  }
}

/* The pack column is a fixed 186px SQUARE, so every booster presents the same
   target whatever shape its photograph is - the wrapper is 0.525 wide, so it
   fills the square's height at 98px across and the rest is margin. Sized by the
   picture, never by the block: a block with fewer rows than the picture needs
   gets a GAP rather than taller rows, because stretching six sets' worth of row
   height to fit one picture leaves the names floating in nothing.

   ONE GAP ROW, SIZED TO THE SHORTFALL, not N whole rows. Padding a short block
   out to seven 33px rows cost **549 blank rows** and took the table from 986 to
   1535 - a third of it empty - because a block of one set needs six of them and
   most blocks are one set. The shortfall is a number of PIXELS, so it can be one
   row that is exactly that tall: a block of one set gets a single 186px row
   where it used to get six, and a block of six gets one 21px row rather than a
   whole 33px one it did not need. Same picture, same alignment, ~90 blank rows
   instead of 549.

   The height has to be stated, because an empty row collapses to nothing and
   then the image stretches the real rows after all - which is the fault the gap
   exists to prevent. */
const PACK_PX = 186;                        // the square the photograph fits in
const ROW_PX = 33;                          // a set row at its shortest
const PACK_TALL = PACK_PX + ROW_PX;         // ...plus the Draft chip under it
/* The picture IS the Draft button - same call, same argument, a target you can
   hit. stopPropagation because the row underneath selects the set on click, and
   a draft that also navigates is two answers to one press. */
const draftPack = (ev, label) => { ev.stopPropagation(); draftSet(label); };
/* MTGJSON annotates every one of these `category: "booster_pack"`, and then
   separates them by `subtype` - which is the same string as the collation code:
   Theros Beyond Death ships draft (15 cards), collector (14) and five theme
   (35) under that one category, and a theme booster is a rigid 35-card carton
   that photographs like a deck box, not a wrapper. Magic drafts one specific
   thing: Draft Boosters before 2024-04-19, Play Boosters after. So a set you can
   draft shows the packs you would draft it WITH - which is what packsFor already
   names - and everything else is left with whatever it has, since for a
   commander set the collector pack is the only pack there is. */
const packArt = (code, kinds) => {
  const all = PACK_ART[code] || {};
  const drafted = (kinds || []).map(k => all[k]).filter(Boolean);
  return drafted.length ? drafted : kinds ? [] : Object.values(all);
};
/* WHERE THE PACK PHOTOGRAPHS COME FROM, AND WHAT STILL HAS TO BE DONE TO THEM.
   MTGJSON has the product id; TCGplayer's CDN has the photograph. 200w is the
   smallest it serves - four times what the set column shows, and still 26 KB -
   and it is a Config choice like every other source's, not a constant in here.

   Online, they arrive as JPEGs on a white card, so every one has to be trimmed
   IN THE BROWSER: fetched as an origin (or the pixels are unreadable), flood
   filled from its border ring to alpha, handed back as a data URL. That is a
   canvas pass per photograph per page, forever, for a picture that never changes.

   Local, none of it happens. `gen-packs.mjs` does the SAME trim once at download
   time and writes a PNG that already carries the alpha, so the local path is a
   plain <img>: no crossorigin, no onload, no retry dance. Which one you get is
   the Config row's own Local/Online chip and nothing else - and the quality is
   in the filename, so switching size switches file rather than silently serving
   the one that happens to be on disk. */
const packLocal = () => CFG.src.tcg.at === 'local';
const packCdn = id => `https://tcgplayer-cdn.tcgplayer.com/product/${id}_${CFG.src.tcg.q}.jpg`;
const packUrl = id => packLocal() ? `packs/${id}_${CFG.src.tcg.q}.png` : packCdn(id);
const packAttrs = () => packLocal() ? 'onerror="packMissing(this)"'
  : 'crossorigin="anonymous" onload="trimPack(this)" onerror="packRetry(this)"';
/* Set to Local, but that file has not been fetched yet - which is a thing to
   SHOW, not to paper over. This used to swap the attributes and re-fetch from
   the CDN, so a half-run gen-packs looked complete and Local quietly meant
   "local where possible". The wrapper is hidden instead; the pack keeps its
   own shape and colour, and Config's per-size count is where the number lives. */
function packMissing(img) {
  img.onerror = null;
  img.hidden = true;
}

const SetList = () => {
  // The gutter groups by the BLOCK's release date, not each row's own: a
  // sub-set can ship months after its parent (Final Fantasy Scene Box, six
  // months after Final Fantasy), and a rowspan over rows that aren't next to
  // each other overlaps the next one and shears the table sideways. Grouping by
  // the block makes every run contiguous by construction - and it's what the
  // gutter means anyway, since the block is what came out that month.
  const rows = [];
  for (const r of SETS) {
    const prev = rows[rows.length - 1];
    rows.push(r[4] && prev ? { r, key: prev.key, block: prev.block } : { r, key: r[2], block: r[1] });
  }
  // One entry per printed row, gap rows included, so every rowspan is a count.
  // A block's art is its own and its sub-sets': the pack usually belongs to the
  // parent, but a Commander sub-set prints its own.
  const out = [];
  for (let i = 0; i < rows.length;) {
    let j = i;
    while (j < rows.length && rows[j].block === rows[i].block) j++;
    const kinds = packsFor(`${rows[i].r[0]} (${rows[i].r[1]})`);
    const packs = [...new Set(rows.slice(i, j).flatMap(e => packArt(e.r[1], kinds)))];
    // the set the picture drafts: the one in this block that has collation, which
    // is not always the parent - and is nothing at all for a set nobody has
    // collated, where the picture stays a picture
    const label = rows.slice(i, j).map(e => `${e.r[0]} (${e.r[1]})`).find(l => packsFor(l)?.length) || null;
    for (let k = i; k < j; k++) out.push({ ...rows[k], packs, draft: label });
    // no r = a gap, and `gap` is how many pixels short of the picture this block
    // runs - one row rather than one per 33px of shortfall
    const gap = PACK_TALL - (j - i) * ROW_PX;
    if (packs.length && gap > 0)
      out.push({ key: rows[i].key, block: rows[i].block, packs, draft: label, gap });
    i = j;
  }
  // counted once rather than re-filtered per row: three spans over a thousand
  // rows was three million comparisons on every render
  const span = new Map();
  for (const e of out)
    for (const k of [e.key.slice(0, 4), e.key.slice(0, 7), '#' + e.block])
      span.set(k, (span.get(k) || 0) + 1);
  const seen = new Set();
  // Turned on its side: a vertical label costs a 2.5rem column instead of a
  // 6rem one, and it can be read at a size that actually marks the boundary.
  // The label is placed by placeGutter(), which puts it at the middle of the part
  // of the block you can see. `top-1/2` is what it falls back to - the middle of
  // the whole block - which is also where it belongs for any block that fits on
  // screen, so nothing has to run for the common case.
  // border-y closes the block off top and bottom: the row borders stop at a
  // rowspan, so without it a year reads as open-ended. The label is absolute so
  // it can be moved without stretching anything: a table cell grows to fit its
  // content, so an in-flow box a pane tall would make one-month blocks 148px.
  const gutter = (key, label, size) => {
    if (seen.has(key)) return '';           // already spanned from an earlier row
    seen.add(key);
    return `<td rowspan="${span.get(key)}"
      class="relative border-y border-r border-neutral-800/60 p-0">
      <div class="absolute inset-x-0 top-1/2 flex -translate-y-1/2 justify-center">
        <span class="whitespace-nowrap py-2 tracking-wide [writing-mode:vertical-rl] ${size}">${label}</span></div></td>`;
  };
  /* The pack the block was sold in, cycling every 10s among that block's own -
     Play, Collector, the theme boosters. `loading="lazy"` is why 184 of these
     cost nothing: the browser fetches the ones you scroll to, and cyclePacks()
     only swaps the ones on screen, so the page is never a wall of flicking
     pictures. A block with no pack still gets the cell, or the column stops
     lining up with the rows it belongs to. */
  const packCell = (e) => {
    if (seen.has('#' + e.block)) return '';
    seen.add('#' + e.block);
    /* No border and no rounding. The picture is TRIMMED - its edges are the
       pack's own silhouette against transparency - so a border draws a rectangle
       round the empty margin instead of round the pack, which is the frame that
       appeared on every one of these. The shadow has to be `drop-shadow` for the
       same reason: box-shadow follows the box, drop-shadow follows the alpha. */
    const art = e.packs.length ? `<img src="${packUrl(e.packs[0])}" loading="lazy" alt=""
      ${packAttrs(e.packs[0])} data-packs="${e.packs.join(' ')}"
      class="h-[186px] w-[186px] object-contain drop-shadow-lg">` : '';
    // The Draft button belongs beside the pack it opens, not eight columns away
    // in a lane of its own. It hangs UNDER the art rather than over it: a block
    // with no draft data would otherwise start its picture 33px lower than its
    // neighbours, so the one thing that varies sits below the one that doesn't.
    const chip = `<div class="flex h-[33px] items-center justify-center">${DraftCell(`${e.r[0]} (${e.r[1]})`)}</div>`;
    // A pack you can't draft is still a photograph of a pack: it does not get
    // dimmed. Fading it to 60% over a near-black table greyed the picture out -
    // which is what "the Doctor Who one looks dim" turned out to be, after a
    // good deal of white balancing aimed at the wrong thing. The difference
    // shows on hover, where it matters, and in the title, which now names the
    // actual reason: a commander set is not a set that failed to be collated.
    const why = !DRAFTABLE.has(e.r[5])
      ? `${e.r[0]} is a ${e.r[5].replace(/_/g, ' ')} set - not one you draft`
      : e.r[6]
        ? `${e.r[0]} has collation, but none of it is a booster you draft`
        : `No booster collation published for ${e.r[0]} yet`;
    return `<td rowspan="${span.get('#' + e.block)}" class="border-y border-r border-neutral-800/60 p-0 align-top">${
      art && e.draft
        ? `<button onclick="draftPack(event,'${jsArg(e.draft)}')" title="Draft boosters from ${jsArg(e.draft)}${collationNote(e.draft)}"
             class="mx-auto block rounded ring-1 ring-transparent hover:ring-emerald-500">${art}</button>`
        : art ? `<span class="mx-auto block w-[186px]" title="${jsArg(why)}">${art}</span>` : ''}${chip}</td>`;
  };
  // overflow-clip, not overflow-hidden: hidden makes the panel a scroll container
  // of its own, and a sticky header sticks to the nearest one - this panel, which
  // never scrolls, so the header would simply sit still. clip rounds the corners
  // the same way without being scrollable. The pane's top padding moved in here
  // as a margin for the same reason: a header stuck at top-0 sits below padding,
  // leaving a strip of rows scrolling past above it. A margin scrolls away.
  return `<div class="${PANEL} mt-4 overflow-clip">
    <table class="w-full table-fixed text-sm">
      <thead><tr class="text-left text-[10px] font-semibold uppercase tracking-wide text-neutral-600 [&>th]:sticky [&>th]:top-0 [&>th]:z-10 [&>th]:border-b [&>th]:border-neutral-800 [&>th]:bg-neutral-900">
        <th class="w-10 px-1 py-1.5 text-center">Year</th><th class="w-10 px-1 py-1.5 text-center">Month</th>
        <th class="w-48 px-1 py-1.5 text-center">Booster</th>
        <th class="w-16 px-3 py-1.5">Code</th><th class="px-3 py-1.5">Set</th>
        <th class="w-24 px-3 py-1.5">Released</th><th class="w-14 px-3 py-1.5 text-right">Cards</th>
        <th class="w-1/4 px-3 py-1.5">Collected</th></tr></thead>
      <tbody>${out.map(e => {
        const year = gutter(e.key.slice(0, 4), e.key.slice(0, 4), 'text-xl font-semibold text-neutral-300');
        const month = gutter(e.key.slice(0, 7), MONTHS[+e.key.slice(5, 7) - 1], 'text-base text-neutral-500');
        const pack = packCell(e);
        if (!e.r) return `<tr>${year}${month}${pack}<td colspan="5" style="height:${e.gap}px"></td></tr>`;
        const [name, code, rel, total, child] = e.r;
        const owned = ownedIn(code);
        const pct = Math.round(100 * owned / total);
        const on = `${name} (${code})` === picked();
        return `<tr onclick="selectItem('${jsArg(`${name} (${code})`)}')" title="Browse ${jsArg(name)}"
          class="cursor-pointer border-b border-neutral-900 ${on ? 'bg-emerald-500/10' : 'hover:bg-neutral-800/50'}">
          ${year}${month}${pack}
          <td class="px-3 py-1.5 font-mono text-xs uppercase ${child ? 'text-neutral-600' : 'text-neutral-400'}">${code}</td>
          <td class="truncate px-3 py-1.5 ${child ? 'pl-6 text-neutral-400' : 'font-medium text-neutral-100'} ${on ? 'text-emerald-200' : ''}">${
            child ? '<span class="mr-1 text-neutral-700">&#9492;</span>' : ''}${name}</td>
          <td class="px-3 py-1.5 font-mono text-xs tabular-nums text-neutral-500">${rel}</td>
          <td class="px-3 py-1.5 text-right tabular-nums text-neutral-500">${num(total)}</td>
          <td class="px-3 py-1.5"><span class="flex items-center gap-2">${CompletionBar(pct)}
            <span class="w-8 shrink-0 text-right text-xs tabular-nums ${owned ? 'text-neutral-300' : 'text-neutral-700'}">${pct}%</span></span></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <p class="px-3 py-2 text-[11px] text-neutral-600">Indent from <code class="text-neutral-500">sets.parent_code</code>, gutter and order from release date &mdash; both already in the schema. Pack art by TCGplayer product id, from MTGJSON&rsquo;s <code class="text-neutral-500">sealedProduct</code>.</p>
  </div>`;
};

/* ======================= THE BROWSE PAGE ==============================
   Printings, Binders, Decks and Search are all this. The only difference is
   what the selector lists - and Search lists nothing, because it IS all
   cards. Filter, sort and view sit below on every one of them. */
/* Derived from the same rows the selector lists, so the bar and the top-right
   numbers can never disagree - they did: the bar said 264 cards for a set the
   stats called 145. */
const listRow = () => (LISTS[P.tab] || []).find(r => r[0] === picked());
/* A set is named two ways: bare ("Modern Horizons 3") in a header, and
   disambiguated ("Modern Horizons 3 (MH3)") by the table, because two sets can
   share a name. Resolve either - matching only one form is why the Boosters
   button never appeared for a set picked from the table, while every scripted
   check that passed the bare name said it did. */
const setRow = (label = picked()) => {
  if (!label) return null;
  const m = /\(([^)]+)\)\s*$/.exec(label);
  return SETS.find(r => (m ? r[1] === m[1].toUpperCase() : r[0] === label)) || null;
};
/* HOW MUCH OF A SET YOU HAVE, COUNTED. This was column 4 of sets.js, and that
   column was `hash(code)` - 20,197 cards over 502 sets, so a collection holding
   nothing reported 19% collected and drew a Collected bar on half the table.
   Same class of thing as the four mock binders: a number that reads as your
   collection and is arithmetic on a string.
   Counted over DISTINCT PRINTINGS rather than copies: "collected" against a set
   of 291 cards asks how many of them you have, and owning four of one card is
   not four cards of the 291. Memoised on the lists' identity because the set
   table asks 986 times per render and the answer only moves when a holding does. */
/* Invalidated explicitly rather than keyed on something derived: the set table
   asks 986 times per render, and a key made of list lengths would miss a card
   added to a binder that already exists - which is exactly what an import does. */
let OWNED = null, OWNED_PRINT = null, OWNED_NAME = null;
const holdingsChanged = () => { OWNED = null; OWNED_PRINT = null; OWNED_NAME = null; };
/* TWO COUNTS, BECAUSE THE QTY COLUMN ASKS TWO QUESTIONS AT ONCE. "Do I own this
   card" and "do I own THIS PRINTING of it" are different, and a list of
   printings is exactly where they come apart: eight rows of Lightning Bolt with
   one copy between them read as eight cards you do not own.
   Built together in one pass over the holdings and invalidated with the rest,
   for the reason ownedIn is: the details list asks per row, 240 times a render.
   Copies, not distinct printings - this is "how many have I got", where
   `ownedIn` above is "how much of this set have I seen", and those are the two
   different questions that made the set column a hash in the first place. */
const ownedIndex = () => {
  if (OWNED_PRINT) return;
  OWNED_PRINT = new Map(); OWNED_NAME = new Map();
  for (const list of [LISTS.binders, LISTS.decks]) for (const row of list) {
    if (!Array.isArray(row[4])) continue;
    for (const c of row[4]) {
      const q = c.qty || 0;
      if (!(q > 0)) continue;
      OWNED_PRINT.set(printKey(c), (OWNED_PRINT.get(printKey(c)) || 0) + q);
      if (c.n) OWNED_NAME.set(c.n, (OWNED_NAME.get(c.n) || 0) + q);
    }
  }
};
/* [copies of THIS printing, copies of this card in any printing]. The row's own
   `qty` counts too: a card drawn INSIDE a deck or binder is a holding, and its
   count is on the row rather than in the index whenever the row is a draft that
   has not been saved. Max rather than sum, so a saved holding is not counted
   twice, and `all` can never read below `here`. */
const ownedOf = (c) => {
  ownedIndex();
  const here = Math.max(c.qty || 0, OWNED_PRINT.get(printKey(c)) || 0);
  return [here, Math.max(here, OWNED_NAME.get(c.n) || 0)];
};
const ownedIn = (code) => {
  if (!OWNED) {
    OWNED = new Map();
    for (const list of [LISTS.binders, LISTS.decks]) for (const row of list) {
      if (!Array.isArray(row[4])) continue;
      for (const c of row[4]) {
        if (!c.set || !(c.qty > 0)) continue;
        if (!OWNED.has(c.set)) OWNED.set(c.set, new Set());
        OWNED.get(c.set).add(`${c.num}/${c.lang || 'en'}`);
      }
    }
  }
  return OWNED.get(code)?.size || 0;
};
const STATS = {
  printings: sel => {
    const r = sel && setRow();
    const pct = (owned, total) => `${total ? Math.round(100 * owned / total) : 0}%`;
    if (r) return [[num(r[3]), 'cards'], [pct(ownedIn(r[1]), r[3]), 'collected']];
    const owned = SETS.reduce((t, x) => t + ownedIn(x[1]), 0);
    return [[num(SETS.length), `sets &middot; ${pct(owned, SETS.reduce((t, x) => t + x[3], 0))} collected`]];
  },
  binders: sel => {
    if (!(sel && listRow())) return [[String(LISTS.binders.length), 'binders']];
    // what the binder holds, then what the view could draw of it - Unsorted is
    // the whole catalogue minus the filed cards, and no page renders 100k cards
    const held = scopedCards().length, drawn = CARDS().length;
    const p = binderPages(GROUPS()).length;
    return [[num(held), 'cards'],
            [String(p), `page${p === 1 ? '' : 's'}${held > drawn ? ` of the first ${num(drawn)}` : ''}`]];
  },
  decks: sel => {
    const r = sel && listRow();
    return r ? [[num(r[1]), `cards &middot; ${r[2]}`]]
             : [[String(LISTS.decks.length), 'decks']];
  },
  search: () => [[game().total, `cards in ${game().label}`]],
};

/* ======================= DRAFT BOOSTERS ===============================
   Not a shop and not a collection: this draws a pool to build a draft deck out
   of. Two shapes, chosen before anything is drawn:

     complete    - open all N boosters, keep the lot. Solitaire sealed.
     round robin - open them one at a time and take ONE card from each. There
                   are no other players, so the other N-1 boosters still in
                   flight lose a card every time you pick, weighted to the good
                   ones: by the time a booster reaches you it has been picked
                   over exactly as many times as picks have happened.

   Wizards publishes no collation. MTGJSON carries the community's
   reverse-engineered sheets (198 of the 868 sets in data/AllPrintings.json.gz)
   and the real app reads `set.booster`; a set without it offers no button at
   all, which is 670 sets and is the honest answer. The recipes are measured out
   of that file - Modern Horizons 3's Play and Collector boosters and Zendikar's
   Draft booster, weights included.

   The sheets are REAL and they are fetched: boosters/<CODE>.json, generated by
   gen-boosters.mjs straight out of MTGJSON's `set.booster`. A hand-written
   rarity-tier table stood here - nine sheets of invented weights and three pack
   recipes measured by hand - and it was a plausible imitation of a booster
   rather than a booster. The file carries, per set and per booster kind, the
   weighted pack recipes and every sheet's per-card weight, so a pack is dealt
   the way the collation deals it: pick a recipe by weight, then fill each slot
   from its sheet by that card's own weight on it. */
const BOOSTER_LABEL = { play: 'Play Booster', draft: 'Draft Booster',
                        collector: 'Collector Booster', default: 'Booster' };
const packLabel = (k) => BOOSTER_LABEL[k] || 'Booster';
let PACK_INDEX = null;            // code -> [kinds], from boosters/index.json
const COLLATION = new Map();      // code -> the set's collation, fetched on open
/* PARENT COLLATION. A handful of sets are reprints or subsets that print
   inside another set's boosters and never get their own `set.booster` block —
   TSB is the Timeshifted subset of TSP, H1R / H2R the Timeshifts sheets of
   MH1 / MH2, 4BB / FBB / BCHR the foreign-border reprints of 4ED / 3ED / CHR,
   PLST the supplementary cards that rode in MKM-era Collector Boosters, and
   SLX the Universes Within subset of MKM. None of them has a published
   collation, so drafting them deals from the parent set's booster file. The
   alias is a set name → set code pointer, not a copy: every card drawn still
   carries the PARENT'S set code on its identity, which is the truth about
   where it was printed. Sets with no parent and no collation (J25, MBC, the
   2026 unreleased) stay as `[]` and the page names the gap. */
const PARENT_COLLATION = {
  TSB: 'TSP', H1R: 'MH1', H2R: 'MH2',
  '4BB': '4ED', FBB: '3ED', BCHR: 'CHR',
  PLST: 'MKM', SLX: 'MKM',
};
const collationFor = (code) => PARENT_COLLATION[code] || code;
/* Sheets name cards as "SET:number", so the join to the catalogue is the
   printing's own identity and no MTGJSON uuid has to be carried on 107k rows.
   SET matters as much as number: the List and Special Guest slots deal cards
   from other sets entirely, which is 16% of all sheet entries. */
let PRINTING_AT = null;
const printingAt = (key) => {
  if (!PRINTING_AT) {
    PRINTING_AT = new Map();
    for (const c of ALL()) PRINTING_AT.set(`${c.set}:${c.num}`, c);
  }
  return PRINTING_AT.get(key);
};
async function loadBoosters(code, seed) {
  if (seed) { COLLATION.set(code, seed); render(); return; }
  if (COLLATION.has(code) || typeof fetch !== 'function') return;
  // The alias is resolved at fetch time, not at call time, so COLLATION is
  // keyed by the REQUESTED code — the page asks "4BB" and gets 4BB's window.
  const file = collationFor(code);
  try {
    const res = await fetch(`boosters/${packFile(file)}.json`);
    if (!res.ok) return;
    COLLATION.set(code, (await res.json()).kinds);
    render();
  } catch { /* no collation reachable is the same as none published */ }
}
/* SETTLED, not merely loaded. Until this answers, `packsFor` can only report the
   one kind a set is drafted with - so a fan drawn before it lands is six copies
   of the same wrapper, and lands as a different fan the moment it arrives. That
   was visible: you clicked Draft, got six of the booster you clicked, and watched
   them shuffle into an assortment. Failure therefore sets `{}` rather than
   leaving null, because "there is no index" is an answer and null is the absence
   of one - and Fan waits on the difference. */
async function loadPackIndex(seed) {
  if (seed) { PACK_INDEX = seed; return; }
  if (PACK_INDEX || typeof fetch !== 'function') return;
  try {
    const res = await fetch('boosters/index.json');
    PACK_INDEX = res.ok ? await res.json() : {};
  } catch { PACK_INDEX = {}; }     // offline is a supported state, and is settled
  render();
}

const MODES = [
  ['robin', 'Draft', '3 boosters, one card taken from each and the rest passed on', 3],
  ['complete', 'Sealed', '6 boosters, opened all at once and every card kept', 6],
  ['pull', 'Booster pull', 'open one at a time, as many as you like &mdash; no format, no limit', 1],
];
const modeRow = (m) => MODES.find(([k]) => k === m);
const packsForMode = (label, mode) => {
  const all = packsFor(label) || [];
  // draft and sealed are played with the booster the set is DRAFTED with, which
  // is what BOOSTER already reports; only a pull may reach for a Collector
  return mode === 'pull' ? all : all.slice(0, 1);
};
/* Whether a set can be drafted is TWO facts, and neither is its size or its
   symbol - 986 paper sets share 334 symbols and 453 sub-sets reuse their
   parent's, so a token set draws the same icon as the expansion it hangs off.

     set_type   Scryfall's, and it splits cleanly: 113 of 118 expansions and 23
                of 25 core sets print boosters, against 0 of 212 token sets and
                1 of 296 promo sets. commander is big (median 331 cards) but is
                a fixed product - 2 of 45.
     booster    MTGJSON's `set.booster`, the community's reverse-engineered
                collation. 182 of these 986 sets have it; 8 more (`PARENT_COLLATION`)
                draft from a parent set's booster file. A set can be perfectly
                draftable and still not have it yet: TRK ships 2026-11-13 and
                nobody has opened enough packs to work it out.

   So three answers, not two: null = not a set you open; [] = a set you open that
   has no collation published yet; a list = the boosters it prints. Play Boosters
   replaced Draft Boosters on 2024-04-19. */
const DRAFTABLE = new Set(['expansion', 'core', 'masters', 'draft_innovation']);
/* Which booster a set is drafted with is READ, not inferred. The date rule this
   replaced ("Play Boosters after 2024-04-19") is the published changeover, but
   MTGJSON has Murders at Karlov Manor shipping `play` on 2024-02-09 with no
   `draft` config at all, so the rule mislabelled it. BOOSTER carries what the
   collation actually says; a set with a booster block but neither config -
   a commander deck's `set` booster, say - is not something you draft. */
const packsFor = (label) => {
  const r = setRow(label);
  if (!r || (!DRAFTABLE.has(r[5]) && !(r[1] in PARENT_COLLATION))) return null;
  if (r[4] && !(r[1] in PARENT_COLLATION)) return null;
  // a set with a parent collation is draftable regardless of its own `has-booster`
  // flag — the alias points at a real booster file the page can fetch
  const aliased = r[1] in PARENT_COLLATION;
  if (!aliased && !r[6]) return [];
  const kind = BOOSTER[collationFor(r[1])]?.[0];
  if (!kind) return [];
  /* The generated index says which kinds the set actually has a sheet for, so
     "and a Collector Booster" is read rather than assumed from the era - 49 of
     the 179 drafted sets have one, not every play-era set. The variant names
     are also PACK_ART's keys, so the art follows the collation. An aliased
     set (PLST, TSB, H1R, etc.) reports the parent set's kinds — what the
     collation actually populated. */
  const has = PACK_INDEX?.[collationFor(r[1])];
  return has ? [kind, ...has.filter((k) => k !== kind)] : [kind];
};
/* "472 cards on the sheets, rarest 1 in 971 packs" - the collation in the one
   place it costs no layout. A count of PRINTINGS, not of the set: the sheets
   list showcase and borderless separately, so it can exceed a set's card count
   and is deliberately not shown as a percentage. */
const collationNote = (label) => {
  const r = setRow(label), c = r && BOOSTER[r[1]];
  if (!c) return '';
