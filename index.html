const artSide = (c, i) => (i && SIDED.has(c.layout) ? 'back' : 'front');
const artKey = c => c.energy ? 'ptcgart' : 'sfart';
/* `q` is the size, and it defaults to the configured one rather than reading it
   directly, because one caller needs a DIFFERENT size at the same time: the
   anatomy page's compare mode puts the whole printed card beside the drawn one,
   and a whole card is `normal` while the art window is `art_crop`. Everything
   else passes nothing and gets whatever Config says. */
const artQ = c => CFG.src[artKey(c)].q;
const artCdn = (c, i, q = artQ(c)) => c.energy
  ? `https://images.pokemontcg.io/${c.art_id}${q === 'hires' ? '_hires' : ''}.png`
  : `https://cards.scryfall.io/${q}/${artSide(c, i)}/${c.art_id[0]}/${c.art_id[1]}/${c.art_id}.${
      q === 'png' ? 'png' : 'jpg'}`;
const artLocal = (c, i, q = artQ(c)) => c.energy
  ? `art/ptcg/${q}/${c.art_id}.png`
  : `art/sf/${q}/${artSide(c, i)}/${c.art_id[0]}/${c.art_id[1]}/${c.art_id}.${q === 'png' ? 'png' : 'jpg'}`;
const artUrl = (c, i, q) => CFG.src[artKey(c)].at === 'local' ? artLocal(c, i, q) : artCdn(c, i, q);
/* LOCAL MEANS LOCAL. This used to re-point a missing local file at the CDN, and
   with 449 of 107,606 crops on disk that made Local the SLOWER setting: a failed
   local request and then a network one, on ~99.6% of cards, while the Config
   band said in green that nothing on the page needs the network.
   The fallback was written as a kindness and it is the wrong one - it makes an
   un-run download invisible, which is precisely what the status band exists to
   make visible. A file that was never fetched now draws as absent, the same
   answer the language pips give for an index that was never built. */
const artAttrs = (c, i, q) => CFG.src[artKey(c)].at === 'local'
  ? ' onerror="this.onerror=null;this.hidden=true"' : '';

/* The whole printed card, for the printings a frame has nothing to say about.
   `art_crop` is the illustration alone, so it is the one configured size that
   cannot be used here; the other four are whole cards already and are honoured,
   because someone who set `large` for the art window wants large here too.
   Pokémon has only whole-card sizes, so its setting always passes through. */
const WHOLE_CARD = new Set(['small', 'normal', 'large', 'png']);
const cardQ = c => (c.energy || WHOLE_CARD.has(artQ(c)) ? artQ(c) : 'normal');
const PrintedFace = (c, i) => `<img src="${artUrl(c, i, cardQ(c))}" loading="lazy"${
  artAttrs(c, i, cardQ(c))} alt="${jsArg(c.n)}" class="h-full w-full rounded-lg object-cover">`;

/* The vendored Mana font carries far more than the five colours, and the rest of
   these codepoints were read off it rather than guessed - rendered as a grid and
   looked at. Digits run consecutively from {0} at E605 up to {15}, so a number is
   arithmetic, not a table.

   What is deliberately NOT here: hybrids ({U/P}, {2/W}). The font draws those by
   halving two glyphs in CSS, not with one codepoint, so they keep the grey disc
   and show their text - which is why {U/P} is in the mock data. */
const SYMBOL = { X: '', Y: '', Z: '', P: '', S: '',
                 T: '', Q: '', E: '' };
const glyphOf = t => MANA[t] || SYMBOL[t]
  || (/^\d+$/.test(t) && +t <= 15 ? String.fromCodePoint(0xe605 + +t) : '');
const PIP_DISC = 'inline-flex shrink-0 items-center justify-center rounded-full border border-black/40 leading-none';
/* {W/U}, {2/R}, {G/P} - A SPLIT PIP IS TWO GLYPHS, NOT A MISSING ONE. The font
   has no single codepoint for these, which is why they fell through to the grey
   disc and printed the characters "W/U" on 1,501 printings and in the rules text
   of 287 more. That is not a gap in the font: it composes them from the two
   glyphs it does have, at opposite corners of a disc split down the diagonal -
   exactly what the Mana font's own CSS does with `::before`, `::after` and
   `.ms-split`. Offsets are percentages of the disc rather than em, so one recipe
   serves every size the page asks for, from the 16px list pip to a card face.

   Phyrexian is the case that needs no split: {G/P} is one Φ on a green disc, and
   only the four Phyrexian hybrids ({R/W/P} and friends) put Φ in both halves. */
const pipBg = c => MTG[c] || '#cdc6bf';   // generic for the 2 of a twobrid
const pipInk = c => INK[c] || '#1c1917';
const splitPip = (t, box) => {
  const parts = t.split('/');
  const phy = parts[parts.length - 1] === 'P';
  const cols = phy ? parts.slice(0, -1) : parts;
  const [a, b] = cols;
  const split = `linear-gradient(135deg,${pipBg(a)} 0%,${pipBg(a)} 50%,${pipBg(b)} 50%,${pipBg(b)} 100%)`;
  // {G/P} - one Φ on the colour's own disc, and nothing to split
  if (!b) return `<span class="${PIP_DISC} ${box}"
      style="background:${pipBg(a)};color:${pipInk(a)}"><i class="ms">${SYMBOL.P}</i></span>`;
  /* {R/W/P} - checked against the printed symbol rather than assumed from the
     other two families: it is ONE Φ centred across the split, not a Φ in each
     half. Four cards in the catalogue have one and all four would have been
     wrong. */
  if (phy) return `<span class="${PIP_DISC} ${box}"
      style="background:${split};color:#1c1917"><i class="ms">${SYMBOL.P}</i></span>`;
  return `<span class="${PIP_DISC} ${box} relative" style="background:${split}">
    <i class="ms absolute left-[10%] top-[6%] text-[0.62em]" style="color:${pipInk(a)}">${glyphOf(a)}</i>
    <i class="ms absolute bottom-[6%] right-[10%] text-[0.62em]" style="color:${pipInk(b)}">${glyphOf(b)}</i>
  </span>`;
};
/* One pip renderer for every size. `box` carries the dimensions and the glyph's
   size; `small` is the text size for the fallback, which has up to three
   characters to fit where a glyph would have been. */
const pipOf = (t, box = 'h-4 w-4 text-[8.5px]', small = 'text-[8px]') => {
  if (t.includes('/')) return splitPip(t, box);
  const g = glyphOf(t);
  return g
    ? `<span class="${PIP_DISC} ${box}"
         style="background:${MTG[t] || '#cdc6bf'};color:${INK[t] || '#1c1917'}"><i class="ms">${g}</i></span>`
    : `<span class="${PIP_DISC} ${box} ${small} bg-neutral-300 px-0.5 font-bold text-neutral-900">${t}</span>`;
};
const costPip = t => pipOf(t);
/* The same pip on the card face, sized off the face rather than off nothing:
   the list rows keep the px default because they have no card box to measure. */
const facePip = t => pipOf(t, 'h-[1.45em] w-[1.45em] text-[0.77em]', 'text-[0.73em]');
/* Rules text is written with the symbols inline - "{T}: Add {G}" - and printing
   the braces is not rendering them. Pips size in em so they follow textFit down
   as the box gets tighter. Only angle brackets are escaped, not ampersands: the
   mock rows carry entities like &mdash; in their text and type lines, and
   escaping those would print them literally. */
const symbolise = s => String(s ?? '')
  .replace(/[<>]/g, m => (m === '<' ? '&lt;' : '&gt;'))
  .replace(/\{([^{}]{1,6})\}/g, (_, t) => pipOf(t.toUpperCase(), 'h-[1.2em] w-[1.2em] text-[0.68em] align-[-0.15em]', 'text-[0.55em]'));
const energyPip = t => `<span class="inline-flex h-[1.45em] w-[1.45em] shrink-0 items-center justify-center rounded-full border border-black/40 text-[0.82em] font-bold text-black/80"
  style="background:${PKM_FRAME[t] || '#8c8c8c'}">${t[0]}</span>`;
/* Mana value: generic pips count as their number, everything else as one - with
   the twobrid exception this missed. {2/R} is worth TWO, so Flame Javelin
   ({2/R}{2/R}{2/R}) is a six-mana card the filter was ranging at three, along
   with the other 61 cards that carry one.

   NOT switched to the catalogue's own `cmc`, which was the obvious move and is
   wrong twice: it is the COMBINED value of both halves of a split card (Dusk //
   Dawn reads 9, not the 4 you cast), and it is 0 on every reversible card. The
   arithmetic here answers "what does this face cost", which is the question the
   filter and the card page are both asking. */
const manaValue = c => (c.cost || []).reduce((t, x) => {
  const two = /^(\d+)\//.exec(x);
  return t + (two ? +two[1] : /^\d+$/.test(x) ? +x : x === 'X' ? 0 : 1);
}, 0);
/* Shrink to fit without measuring, the way a paper card does - but the steps are
   MEASURED, not guessed. Each threshold is the length at which that size starts
   to overflow the rules box in the grid, read off the rendered page: 12px goes
   over at 144 characters, 11px at 207, 10px at 274, 9px at 372, and the rest
   follow the same 1/size² curve. A first pass pitched by eye put 120 of 240
   cards over their box, which is worse than text that is merely small.
   Roughly a tenth is left as headroom, because the box grows and shrinks with
   the column count and the ladder cannot see it.

   The very longest cards (oracle text reaches 1,489 characters) still clip: no
   readable size fits that in this box, so they bottom out rather than pretend.

   The steps are `em`, not px, and the face anchors one root size to its own
   width in `cqw`. Px meant a card drawn at 200% zoom was twice the box with the
   same 11px type in it - the shrink-to-fit had shrunk to fit a card that no
   longer existed. Sizing off the container makes zoom, the column count and a
   binder pocket all the same question, which is the caveat this comment used to
   carry: the ladder can now see the box. */
const textFit = n => n > 560 ? 'text-[0.55em]' : n > 430 ? 'text-[0.64em]' : n > 300 ? 'text-[0.73em]'
  : n > 240 ? 'text-[0.82em]' : n > 180 ? 'text-[0.91em]' : n > 125 ? 'text-[1em]'
  : n > 108 ? 'text-[1.09em]' : 'text-[1.18em]';
/* A NEWLINE COSTS SPACE THAT ITS CHARACTERS DO NOT. The ladder above was
   measured against PARAGRAPHS, where the text fills each line to the end and
   the character count is the height. A forced break leaves the tail of the
   previous line empty - half a line on average - so text with many short lines
   is taller than the same number of characters flowing.

   It shows up on Levelers, whose bands are one line each. Measured at a 400px
   card: **4 of 279 banded cards overflow, and all four are Levelers of 7-8
   lines carrying only 164-240 characters**, while sixty ordinary cards with
   more than 200 characters of paragraph overflow none. The ladder was not too
   generous, it was being asked the wrong question.

   12 is half a line: the box runs 24-28 characters across at these sizes, and
   half of one is what a break throws away. Not a step on the ladder and not a
   new size - the same ladder, given the length the text actually behaves as. */
const BREAK_COST = 12;
const fitLen = (s = '') => s.length + BREAK_COST * Math.max(0, s.split('\n').length - 1);
/* The title and type bars shrink the same way rather than ellipsing. A name is
   worth more whole and small than clipped at full size - "Hanweir, the Writhing
   Township" tells you which card it is; "Hanweir, the Writh…" makes you open it.
   Both bars share their row with something else, so the length that matters is
   the text plus what sits beside it: the cost pips on the title, the set symbol
   on the type line. `truncate` stays underneath as the backstop for the name no
   step is small enough for. */
const nameFit = n => n > 40 ? 'text-[0.68em]' : n > 34 ? 'text-[0.77em]' : n > 28 ? 'text-[0.86em]'
  : n > 23 ? 'text-[1em]' : n > 19 ? 'text-[1.09em]' : 'text-[1.18em]';
const typeFit = n => n > 44 ? 'text-[0.59em]' : n > 36 ? 'text-[0.68em]' : n > 30 ? 'text-[0.77em]' : n > 25 ? 'text-[0.82em]' : 'text-[0.91em]';

/* The only field a card must have is its NAME. Everything else - set, number,
   language, finish, cost, type, rarity, artist, art - is unknown until the line
   is matched to a printing, and /resolve proves it: it draws this frame from a
   scanned line before any of that exists. So every slot below degrades on its
   own, and nothing is invented to fill one. A grey frame with a name in it is a
   card; a frame that says "Common" because rarity was missing is a lie. */
/* `fit` sizes the card off its container's HEIGHT instead of its width, for the
   one place that has a fixed amount of room and a fixed number of cards to put
   in it. Everywhere else the card fills its column and the page grows. */
/* Built once: MockCard looks a set up per card, and 240 linear scans of 986 rows
   per render is a scan too many. */
const SET_BY_CODE = new Map(SETS.map(r => [r[1], r]));
/* Column 7 is the icon OVERRIDE and column 1 is the code - 986 sets resolve to
   336 distinct symbols this way, which is why the local mirror is a megabyte
   rather than three. gen-symbols.mjs derives its file list with the same
   expression, and check.mjs asserts the two agree. */
/* Conflux's set code is CON, and Windows has reserved that name - with any
   extension - since DOS. Node writes `boosters/CON.json` happily and nothing can
   then read it back, so the file on disk carries a trailing underscore and every
   place that names one has to agree: here, gen-boosters.mjs, gen-symbols.mjs and
   serve.py. Declared here rather than beside the boosters, because the set
   symbols hit it too: `sym/con.svg` is the console device, and node "wrote" it
   334 times without ever creating a file - the fetch reported success and git
   then refused to add a path that does not exist. */
const RESERVED_NAME = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;
const packFile = (code) => RESERVED_NAME.test(code) ? `${code}_` : code;
const setIcon = (code) => {
  const r = code && SET_BY_CODE.get(code.toUpperCase());
  return r ? (r[7] || r[1].toLowerCase()) : '';
};
/* Which symbols were actually written, so "not published" can be told from "not
   fetched yet". Scryfall serves none for a few codes we carry (MBC, FRC), and a
   symbol is a CSS MASK rather than an <img> - there is no `onerror` to fall back
   with, and a mask whose file 404s renders as a solid coloured square. With the
   list, those sets get the plain rarity disc the page already draws for a card
   whose set it does not know. Null until it lands, and null is optimistic: the
   worst case is a square for one render, against a symbol-less first paint for
   every set if it were the other way. */
let SYM_INDEX = null;
async function loadSymIndex(seed) {
  // a seed always wins, and null is a seed: the harness has to be able to put
  // the "not settled yet" state back after testing the settled one
  if (seed !== undefined) { SYM_INDEX = seed; return; }
  if (SYM_INDEX || typeof fetch !== 'function') return;
  try {
    const res = await fetch('sym/index.json');
    SYM_INDEX = res.ok ? new Set(await res.json()) : new Set();
  } catch { SYM_INDEX = new Set(); }
  render();
}
const setIconUrl = (code) => {
  const i = setIcon(code);
  if (!i) return '';
  // the CDN serves `con.svg` fine - it is only the local FILE that cannot exist
  if (CFG.src.sfsym.at !== 'local') return `https://svgs.scryfall.io/sets/${i}.svg`;
  return !SYM_INDEX || SYM_INDEX.has(i) ? `sym/${packFile(i)}.svg` : '';
};
/* The set symbol, inked by rarity - which is how a real card tells you both at
   once, in the one place on the frame that carries them. It is an external SVG,
   so it cannot be recoloured as an image; it is a MASK over a rarity-coloured
   box instead, which tints the shape and needs no CORS.

   Falls back to the plain disc, which is all Pokémon can have (no Scryfall icon
   exists for those sets) and all an unmatched line deserves: a card whose set is
   unknown must not borrow a symbol. */
const rarityMark = (c) => {
  const url = c.energy ? '' : setIconUrl(c.set);
  const tip = `${c.set ? `${c.set} &middot; ` : ''}${c.rar ? rarityName(c.rar) : 'rarity unknown'}`;
  const ink = c.rar ? RARITY_DOT[c.rar] : '#8c8c8c';
  return url
    ? `<span class="inline-block h-3 w-3 shrink-0 ${c.rar ? '' : 'opacity-40'}" title="${tip}"
         style="background:${ink};-webkit-mask:url('${url}') center/contain no-repeat;mask:url('${url}') center/contain no-repeat"></span>`
    : `<span class="inline-block h-2 w-2 shrink-0 rounded-full border border-black/40 ${c.rar ? '' : 'opacity-40'}"
         title="${tip}" style="${c.rar ? `background:${ink}` : ''}"></span>`;
};

/* THE FIVE PLATES, each buildable on its own, because the anatomies need them
   in different orders and different numbers. A split card wants two title
   plates and two rules plates over one art window; a full-art card wants all
   five over the art rather than beside it; a Saga wants its rules plate banded.
   Pulling them out of one template is what makes those four lines each instead
   of four copies of the whole card.

   `f` is the FACE being drawn and `c` is the printing it belongs to - they are
   the same object for an ordinary card, and differ for everything with two
   faces. Set, rarity, collector number and finish are printing facts, so they
   always come off `c`; name, cost, type, text and P/T are face facts. */
/* THE TURN INDICATOR, in the top-left of the title bar, which is where the
   printed card puts it. It says which way the card turns and into what, and it
   is the one thing the flip control cannot: a corner button says "there is
   another side", the mark says "this is a werewolf and it is daytime".

   Two marks and not eight. `sunmoondfc` is 381 of the 580 named printings and
   Unicode has exactly the sun and crescent it prints; the other six - compass,
   spark, Eldrazi, fan, convert, upside-down - have no character that is
   actually them, so inventing one each would be fabrication wearing fidelity's
   clothes. They get the generic triangle a modern DFC prints, and the tooltip
   names the effect off `c.dfc`, which is the source's own word. */
const DFC_MARK = { sunmoondfc: ['&#9728;', '&#9790;'] };   // sun, crescent moon
const TURN_MARK = ['&#9650;', '&#9660;'];                  // the modern DFC triangle
const turnMark = (c, i) => {
  if (!SIDED.has(c.layout) || !c.faces) return '';
  // the named effect if there is one, else the layout - an MDFC is not a
  // transform, and both words are the ones /anatomy already files it under
  const kind = c.dfc ? c.dfc.replace(/dfc$/, '') : c.layout;
  return `<span title="${jsArg(`${kind} - turn the card over`)}" aria-hidden="true"
    class="shrink-0 text-[0.85em] leading-none opacity-70">${(DFC_MARK[c.dfc] || TURN_MARK)[i ? 1 : 0]}</span>`;
};

/* `nameCls` pins the type where the plate is NOT a card: nameFit sizes a name
   to fill the plate it is on, which is right on a card and wrong down a column
   of identical widths, where it made every title a different size. The card
   passes nothing and keeps the fit. */
const TitlePlate = (f, c, plate, cls = '', i = 0, nameCls = '') => `
  <div class="flex items-center justify-between gap-1 rounded-md px-1.5 py-0.5 mottle ${cls}" style="${plate.title}">
    ${turnMark(c, i)}
    <span class="truncate font-bold leading-tight ${nameCls
      || nameFit((f.n || '').length + 2 * ((f.cost || []).length + (c.hp ? 3 : 0)))}">${f.n}</span>
    <span class="flex shrink-0 items-center gap-0.5">${c.hp
      ? `<span class="text-[1em] font-bold">${c.hp} HP</span>`
      : (f.cost || []).map(facePip).join('')}</span>
  </div>`;

const TypePlate = (f, c, plate, cls = 'relative z-10 -my-2.5') => `
  <div class="${cls} flex items-center gap-1 rounded-md px-1.5 py-0.5 font-semibold ${
    typeFit((f.type || UNK).length + 3)} mottle" style="${plate.type}">
    <span class="min-w-0 flex-1 truncate">${f.type || UNK}</span>
    ${rarityMark(c)}
  </div>`;

/* A Saga's rules box is not a paragraph, it is a numbered sequence, and the
   same is true of a Class's levels and a Leveler's bands. The source writes
   them as one string with the steps on their own lines, so the box splits on
   the newline it already has rather than on a parser: chapter marks go in a
   gutter down the left, which is where the card prints them. */
const CHAPTER = /^([IVX]+(?:,\s*[IVX]+)*)\s*(?:-|-)\s*/;
/* A LEVEL IS A BAR, NOT A GUTTER MARK, and it is at the other end of the line.
   The old pattern looked for `Level 1` at the START of a line in title case, and
   neither of the two things that write one does that:

     Class    `{1}{U}{B}: Level 2` - a cost first, the level LAST.
     Leveler  `LEVEL 1-4` on its own line, in capitals, followed by a bare
              `0/6` which is that band's power and toughness.

   So of the three BANDED layouts only Saga actually banded, and 61 Levelers and
   69 Classes drew as a run-on paragraph with their levels and P/Ts loose in it.
   Printed, both are a shaded bar across the full width with everything below it
   belonging to that level - which is what this draws, rather than the Saga's
   left-hand chapter gutter.

   The band P/T needed nothing from gen-cards.mjs, which is what the issue
   assumed: it is already IN the oracle text, one line under its marker. That it
   was a loose `0/6` floating in a paragraph is the same fault, not a second. */
const BAND = /^(?:(\{.+\}):\s*)?level\s+([\d+-]+)$/i;
const BAND_PT = /^[\d*+-]+\/[\d*+-]+$/;
const BandedText = (text) => {
  const lines = (text || '').split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const band = lines[i].match(BAND);
    if (band) {
      const pt = BAND_PT.test(lines[i + 1] || '') ? lines[++i] : '';
      out.push(`<div class="mt-0.5 flex items-center gap-1 rounded-sm bg-black/25 px-1 font-bold">
        ${band[1] ? `<span class="shrink-0">${symbolise(band[1])}:</span>` : ''}
        <span class="min-w-0 flex-1 uppercase">Level ${band[2]}</span>
        ${pt ? `<span class="shrink-0 rounded-sm border border-black/30 bg-black/20 px-1">${pt}</span>` : ''}
      </div>`);
      continue;
    }
    const m = lines[i].match(CHAPTER);
    out.push(!m ? `<p class="whitespace-pre-line">${symbolise(lines[i])}</p>`
      : `<div class="flex gap-1"><span class="w-[3.2em] shrink-0 border-r border-black/40 pr-1 text-right font-bold">${
          m[1]}</span><span class="min-w-0 flex-1">${symbolise(lines[i].slice(m[0].length))}</span></div>`);
  }
  return out.join('');
};

/* `room` is this box's CAPACITY relative to an ordinary card's rules box, and
   it exists because textFit's ladder was measured against that box and nothing
   else. Give the ladder a different box without telling it and it picks the
   wrong step: too big and the text overruns, too small and it shrinks a card
   that had room to spare.

   The numbers are derived, not chosen. Type size is set in `cqw`, so it follows
   the card's WIDTH; characters that fit therefore go as
   (box width x box height) / (font size)^2, with font size proportional to the
   card width. Every value below is that quantity over the standard card's own
   0.95W x 0.35W at 4.91cqw, with about a tenth held back the way the base
   ladder already does.

   THEY WERE ALL TOO SMALL. The first set was picked by eye against the STACKED
   frames - one narrow rules box at the bottom of the card - and then the frames
   underneath them were rebuilt: a Saga became two columns, a Plane and the
   full-art treatments became overlays with most of the card to play with. The
   divisors were never revisited, so a Saga's track column, which is now HALF
   AGAIN the standard box, was still being told to shrink as though it were half
   the size. Above 1 is normal here and was previously unreachable. */
/* The face's flavour first, the card's second - because a two-faced card is
   printed with different flavour on each side and a single-faced one has only
   the card. `faceAt` returns the card itself when there are no faces, so the
   two are the same object there and this collapses to `c.flav`. */
const flavOf = (f, c) => f.flav || c.flav || '';
const RulesPlate = (f, c, plate, { banded = false, cls = 'mt-2.5 flex-1', room = 1 } = {}) => {
  const atk = (c.atk || []).map(a => a.n + (a.t || '')).join(' ');
  const flav = flavOf(f, c);
  const size = textFit((fitLen(f.text) + atk.length + fitLen(flav)) / room);
  return `
  <div class="${cls} flex flex-col justify-between overflow-hidden rounded-sm px-1 py-0.5 leading-snug mottle ${size}" style="${plate.box}">
    <div>
      ${!f.text ? '' : banded ? BandedText(f.text) : `<p class="whitespace-pre-line">${symbolise(f.text)}</p>`}
      ${(c.atk || []).map(a => `
        <div class="mt-0.5 flex items-baseline justify-between gap-1">
          <span class="flex items-center gap-0.5">${(a.cost || []).map(energyPip).join('')}<span class="ml-0.5 font-semibold">${a.n}</span></span>
          ${a.dmg ? `<span class="font-bold">${a.dmg}</span>` : ''}</div>
        ${a.t ? `<p class="opacity-80">${symbolise(a.t)}</p>` : ''}`).join('')}
    </div>
    ${!flav ? '' : `<div><hr class="my-1 border-black/50"><p class="italic opacity-70">${flav}</p></div>`}
  </div>`;
};

// The collector bar carries the printing, so it is drawn once per CARD even
// when the card has two faces - except for power/toughness and loyalty, which
// belong to whichever face is showing.
/* POWER/TOUGHNESS OVERLAPS THE RULES BOX, because that is where it is printed:
   a box in the bottom-right corner of the frame, straddling the text box's lower
   edge and the bottom rail. It was a third item INSIDE the collector line, which
   put it in the flow - the same height as the set code, in the same bar, with
   the illustrator credit shuffling left to make room for it.
   `bottom` with an auto height is what makes it overlap without arithmetic: the
   box is anchored to the bottom rail and grows UPWARD out of it. Loyalty is the
   same corner and the same rule; a planeswalker prints it as a shield rather
   than a box, which is the only difference. Both take the frame surface, since
   the printed box is part of the frame rather than part of the text panel. */
const CORNER = 'absolute bottom-[-0.2em] right-0 z-20 shrink-0 border border-black/45 px-[0.4em] py-[0.12em] text-[1.5em] font-bold leading-none shadow-[0_1px_2px_rgba(0,0,0,.5)]';
const FootPlate = (f, c, plate) => `
  <div class="relative mt-0 flex items-center justify-between gap-1 rounded-sm px-1 py-0.5 text-[0.73em] mottle" style="${plate.foot}">
    <span class="truncate">${[
      c.set && `<span class="uppercase">${c.set}${c.num ? ` ${c.num}` : ''}</span>`,
      c.lang && `<span class="${c.lang === 'en' ? '' : 'font-bold'}">${c.lang}</span>`,
      c.art && `Illus. ${c.art}`,
    ].filter(Boolean).join(' &middot; ') || '<span class="opacity-40">no printing</span>'}</span>
    ${f.pt ? `<span class="${CORNER} rounded-[3px]" style="${plate.title}">${f.pt}</span>` : ''}
    ${f.loy ? `<span class="${CORNER} rounded-full px-[0.55em]" style="${plate.title}">${f.loy}</span>` : ''}
    ${c.retreat ? `<span class="flex shrink-0 items-center gap-0.5" title="Retreat cost">${
      Array.from({ length: c.retreat }, () => energyPip('Colorless')).join('')}</span>` : ''}
  </div>`;

/* THE BREAKOUT ART. `framed` and `showcase` put the illustration in a window
   with the frame around it; the other four do not, and each fails differently
   if it is drawn as though it did:
     extendedart  the art is the whole card and the plates float on top of it.
     borderless   there is no black edge to run out to; the wrapper drops it.
     fullart      the art is the whole card and the plates float on top of it.
     textless     the same, with no rules plate at all. */
/* THE CROP'S SHAPE IS NOT IN THE CATALOGUE, AND IT IS NOT ONE SHAPE. Scryfall
   crops an ordinary card 626x457 landscape, a Saga 312x752 portrait, a token
   684x722 square-ish, an Ikoran mutate 745x505, a full-art land 626x747 - and
   nothing in the bulk data says which you are about to get. Only the image
   does, after it has loaded.

   That is survivable in the art WINDOW, whose 5/3.52 is within a few percent of
   the common landscape crop. It is not survivable when the art is the whole
   card: `object-cover` fits a 1.37-wide crop to a 0.71-tall card by matching
   HEIGHT, so it scales the image 2x and throws away 49% of its width. That is
   the "misscaled" full art - the picture is not merely cropped, it is zoomed
   into the middle of itself.

   `whole` is the fix, and it is CSS doing the arithmetic precisely because the
   ratio cannot be known in advance: the illustration is `contain`ed, so all of
   it is visible whatever shape it is, over a `cover`ed copy of itself that is
   blurred and scaled out to fill whatever contain leaves. A portrait crop
   covers ~85% of the card and the seam is invisible; a landscape one keeps the
   whole picture instead of half of it. One rule, no branch, nothing to know. */
/* THE ART WINDOW ALWAYS ASKS FOR THE CROP, whatever the size chip says. Those
   five sizes are not five qualities of one picture: `art_crop` is the
   illustration alone, and `small`/`normal`/`large`/`png` are the WHOLE PRINTED
   CARD, frame and rules text included. Passing the configured size through to
   here put an entire card inside the art window of a drawn one - every card on
   the page, at any setting but the default. Config's own row already said
   art_crop was "the only pixels this frame draws"; it was a label, not a rule,
   and this makes it the rule. The size chip governs what is fetched for the
   places that genuinely show a whole card: an unframable printing, and the
   anatomy page's compare column. */
/* `natural` - THE WINDOW TAKES THE CROP'S SHAPE INSTEAD OF THE CROP TAKING THE
   WINDOW'S. The ordinary card drew its art at a fixed `aspect-[5/3.52]` (1.42)
   and covered the crop into it; the crop it is always given is 1.37, so every
   card on the page lost a sliver off the top and bottom of its illustration for
   no reason but a number picked before the shape was known.
   It needs no measuring and no catalogue field, which is the point: an `<img>`
   with `height:auto` already knows its own ratio, so the browser does the
   arithmetic once the picture lands. What that buys beyond the missing sliver
   is that the plates below it move with the art - a taller crop pushes the type
   bar DOWN, which is where a printed type bar sits, and the rules box takes
   whatever is left rather than being the fixed remainder of a fixed sum.
   The clamp is the whole risk, and it is why min/max are here: a 312x752 Saga
   crop that reaches an ordinary frame would be 2.4x the card's width tall and
   would push everything else off the bottom edge. Percentages of the card's own
   height, so there is nothing to keep in step with the container units. */
const ArtWindow = (c, i, cls, mode) => `
  <div class="${cls} ${mode === 'whole' ? 'relative' : ''} overflow-hidden ${
    mode === 'bleed' ? '' : 'rounded border border-black/20'} bg-black/10">
    ${/* `bleed` is `natural` without the window's own edge: the illustration is
          running past the frame's side rails, so a border and a rounded corner
          there would be drawing the rail this treatment is defined by not
          having. */''}
    ${!c.art_id ? '<div class="flex h-full w-full items-center justify-center text-[0.82em] italic opacity-50">no art loaded</div>'
      : mode === 'natural' || mode === 'bleed'
        ? `<img src="${artUrl(c, i, 'art_crop')}" alt="" loading="lazy"${artAttrs(c, i, 'art_crop')}
             class="block h-auto w-full">`
      : mode === 'whole'
        ? `<img src="${artUrl(c, i, 'art_crop')}" alt="" aria-hidden="true" loading="lazy"${artAttrs(c, i, 'art_crop')}
             class="absolute inset-0 h-full w-full scale-110 object-cover blur-md">
           <!-- Anchored TOP, not centred. Centring splits the leftover between
                both ends and puts half the blur across the top of the card,
                which is the half you can see; the bottom half is under the type
                line and the rules box already. Top-anchored, the sharp art
                starts at the card's edge and the soft part lands behind the
                plates. -->
           <img src="${artUrl(c, i, 'art_crop')}" alt="" loading="lazy"${artAttrs(c, i, 'art_crop')}
             class="relative h-full w-full object-contain object-top">`
        : `<img src="${artUrl(c, i, 'art_crop')}" alt="" loading="lazy"${artAttrs(c, i, 'art_crop')} class="h-full w-full ${
          c.energy ? 'object-cover object-[50%_22%]' : 'object-cover'}">`}
  </div>`;

/* One physical side of a card: the five plates in their normal order, with the
   treatment deciding whether the art is a window between them or a sheet
   behind them. Two of these stacked is a transform; one is everything else. */
/* SAGAS AND CLASSES ARE TWO-COLUMN CARDS. The printed article runs the
   illustration as a tall strip down one side with the numbered track beside it
   and the type line ACROSS THE BOTTOM - not the stacked title/art/type/rules of
   an ordinary card, which is what these were drawn as until the side-by-side
   made it obvious.

   The source agrees, and that is the part worth knowing: Scryfall's `art_crop`
   for a Saga or a Class is **312x752**, a portrait strip, where an ordinary
   card's is 626x457 landscape. So the column is sized by the crop's own aspect
   rather than a percentage picked by eye, and the art fills it without cropping.

   Saga puts the art on the RIGHT and reads its chapters down the left; a Class
   is the mirror, art LEFT and levels down the right. Both checked against the
   scans. Which one it is comes off the TYPE LINE, not the layout, for the same
   reason the banding does: 127 printings are a Saga on the front of a card
   whose layout says `transform`. */
const TRACKED = /\b(Saga|Class)\b/;
const isTracked = (f, layout) => layout === 'saga' || layout === 'class' || TRACKED.test(f.type || '');
const TrackSide = (c, i, bg, plate) => {
  const f = faceAt(c, i);
  const artLeft = /\bClass\b/.test(f.type || '');
  /* A WIDTH, not the crop's aspect ratio. Sizing the column by `aspect-[312/752]
     h-full w-auto` is circular - the row's height comes from the flex fill and
     the column's width would come from that height - and the browser resolved it
     by letting the strip overrun the track, which then spilled its text across
     the art. 42% of the card gets there anyway: the row is ~72% of a 5/7 card's
     height, so 0.42 / (0.72 x 1.4) = 0.417, against the crop's own 0.415. */
  const art = `<div class="w-[42%] shrink-0">${ArtWindow(c, i, 'h-full w-full')}</div>`;
  /* 1.3, and it is above 1 on purpose. The track column runs 0.55W wide by
     almost the full 1.0W between the title and the type line - 0.55W squared
     against the standard box's 0.3325, so 1.65 on area alone. The chapter
     gutter eats 3.2em of that width on every numbered line, which is what
     takes it back to 1.3. This was 0.45 while the frame was still stacked, and
     0.45 is why every Saga on the page was set two steps smaller than the
     ordinary cards beside it. */
  const flav = flavOf(f, c);
  const track = `<div class="flex min-w-0 flex-1 flex-col overflow-hidden rounded-sm px-1 py-0.5 leading-snug mottle ${
    textFit((fitLen(f.text) + fitLen(flav)) / 1.3)}" style="${plate.box}">
      ${BandedText(f.text)}
      ${!flav ? '' : `<div><hr class="my-1 border-black/50"><p class="italic opacity-70">${flav}</p></div>`}
    </div>`;
  return `
  <div class="flex h-full w-full flex-col overflow-hidden rounded p-1.5 text-[4.91cqw] mottle ${c.foil ? 'foil' : ''}"
    style="background-color:${bg};color:${ink(lum(bg))}">
    ${TitlePlate(f, c, plate, '', i)}
    <div class="my-1 flex min-h-0 flex-1 gap-1">${artLeft ? art + track : track + art}</div>
    ${TypePlate(f, c, plate, '')}
    ${FootPlate(f, c, plate)}
  </div>`;
};

const CardSide = (c, i, bg, plate, treat, layout) => {
  const f = faceAt(c, i);
  /* A full-art Saga has no columns to put anything in - the art is the card -
     so the treatment wins there and the track frame only applies to the ones
     that actually have a frame. */
  if (isTracked(f, layout) && !OVERLAID.has(treat)) return TrackSide(c, i, bg, plate);
  /* Planes and Schemes are printed full-bleed - the illustration runs to all
     four edges and the title, type and rules sit ON it - even though Scryfall
     reports them as `framed`, because `full_art` is a flag about the frame and
     these have no frame to flag. Checked against the scans: every Plane in the
     sample is edge-to-edge art. So the layout forces the treatment here rather
     than the treatment being taken at its word. */
  const over = OVERLAID.has(treat) || LANDSCAPE.has(layout) && layout !== 'split';
  /* The art window is sized as a RATIO OF THE CARD'S WIDTH, so a card that is
     read sideways needs its own: 5/3.52 inside a 7/5 box is taller than the
     whole card, which is exactly what a Plane looked like - a title bar, an
     illustration, and its rules pushed off the bottom edge. */
  const wide = LANDSCAPE.has(layout);
  /* 7/1.8, not the 7/2.3 tried first. A Plane's rules run two or three
     sentences and the shrink ladder bottoms out at 0.55em - below that the text
     is not worth reading - so past a point the only way to fit them is to give
     the box the height rather than take it off the type. The art is still half
     the card, which is what the printed card does. */
  /* `natural` IS A FACT ABOUT THE SOURCE, NOT THE LAYOUT. It works because
     Scryfall's `art_crop` is the illustration alone, so the window taking its
     shape shows all of it. pokemontcg.io has no such endpoint - it serves the
     WHOLE printed card - so a Pokémon window that took its picture's shape
     would draw an entire card, frame and all, inside the art slot. It keeps the
     fixed box and crops into it, which is what the offset below is for. */
  const art = over
    ? `<div class="absolute inset-0">${ArtWindow(c, i, 'h-full w-full rounded-none border-0', 'whole')}</div>`
    : wide ? ArtWindow(c, i, 'my-1 w-full shrink-0 aspect-[7/1.8]')
    : c.energy ? ArtWindow(c, i, 'my-1 w-full shrink-0 aspect-[5/3.52]')
    /* `-mx-1.5` cancels the frame's own padding and nothing more. The black
       edge outside it is `p-[3.5%]` on the wrapper and stays - a printed
       extended-art card still has one; what it does not have is the coloured
       frame between that edge and the picture. */
    : BLEED.has(treat) ? ArtWindow(c, i, '-mx-1.5 my-1 shrink-0 min-h-[30%] max-h-[52%]', 'bleed')
    : ArtWindow(c, i, 'my-1 w-full shrink-0 min-h-[36%] max-h-[58%]', 'natural');
  /* The type plate tucks up under the art window's lower edge on a portrait
     card, which is what the negative margin is for. A landscape card has less
     than half the height to spend, so the same overlap is a collision rather
     than a tuck - it sat on top of the rules box. */
  const tight = over || wide;
  return `
  <div class="relative flex h-full w-full flex-col overflow-hidden rounded p-1.5 text-[4.91cqw] mottle ${c.foil ? 'foil' : ''}"
    style="background-color:${bg};color:${ink(lum(bg))}">
    ${over ? art : ''}
    <div class="relative flex h-full w-full flex-col">
      ${TitlePlate(f, c, plate, '', i)}
      ${over ? '' : art}
      <!-- THE SPACER GOES HERE, not after the rules box. On a full-art card the
           printed article puts the title at the top and everything else in the
           BOTTOM half, so the illustration is unobstructed through the middle -
           which is the entire reason to print one. Stacking all four plates
           under the title covered the top third of the art and left the bottom
           two-thirds empty, i.e. exactly the wrong half of the card. -->
      ${over ? '<div class="flex-1"></div>' : ''}
      ${TypePlate(f, c, plate, tight ? 'mt-1' : 'relative z-10 -my-2.5')}
      ${treat === 'textless'
        ? (over ? '' : '<div class="flex-1"></div>')
        : RulesPlate(f, c, plate, {
            /* Off the TYPE LINE as well as the layout, because a Saga is not
               always `layout: saga`. Kumano Faces Kakkazan is `transform` with a
               Saga on its front, and there are 205 more like it - keying off the
               layout alone left their chapter marks as a run-on paragraph. */
            banded: BANDED.has(layout) || /\b(Saga|Class)\b/.test(f.type || ''),
            cls: over ? 'mt-1 max-h-[45%] flex-none' : tight ? 'mt-1 flex-1' : 'mt-2.5 flex-1',
            /* Overlaid, the box may run to 45% of the card's height against the
               standard 0.35W - on a portrait card that is 0.63W, most of twice
               the room (1.5). On a LANDSCAPE one the same 45% is only 0.32W,
               because the card is shorter, which lands back at about parity. */
            room: over ? (wide ? 0.5 : 1.5) : 1,
          })}
      ${FootPlate(f, c, plate)}
    </div>
  </div>`;
};

/* Two faces printed on ONE side, which is three different pictures:
     split      the card is turned ninety degrees and read as two half-cards
                side by side under one illustration. Scryfall's crop is of the
                whole card, so it is drawn once across the top rather than
                invented twice.
     adventure  one card with its rules box halved - the adventure on the left
                with its own name, cost and type, the creature's rules on the
                right. `prepare` prints the same way.
     flip       the second face is the same card upside down, so it is drawn
                upside down: rotate-180 on the lower block, which is what the
                printed card does to the reader. */
const PairedSide = (c, bg, plate, treat, layout) => {
  const [a, b] = c.faces;
  /* The second spell is turned, and the card is not. Everything above it is an
     ordinary portrait card; the aftermath half is a block across the bottom
     with its contents laid out in the TRANSPOSED box and rotated into place -
     laid out at 46cqw wide by the card's inner width tall, so that rotating it
     ninety degrees leaves a footprint exactly the size of the block.

     `calc(93cqw - 12px)` is that inner width and it is arithmetic, not a
     guess: the black edge is `p-[3.5%]` on the wrapper, which is what cqw is
     measured against, and the frame inside it adds `p-1.5` - 100% - 7% - 12px.
     Anything short of it insets the half; anything over it clips, because the
     wrapper hides its overflow.

     CLOCKWISE, read off the scan rather than reasoned about: on the printed
     card the second spell's TITLE is at the right-hand edge and its rules run
     down the left, so the half's top edge ends up on the right, which is
     rotate(90deg). Anti-clockwise puts the title on the wrong side.

     Both halves have their own illustration and the catalogue already has
     them: an aftermath `art_crop` is the two panels side by side in ONE image
     (Dusk // Dawn is 1024x231, two 512-wide panels), so the halves ask for the
     same picture anchored to opposite ends rather than for two files. Each
     panel's 2.22 is within a few percent of the 5/2.3 box it goes in, so
     covering costs a sliver either way. */
  if (aftermath(c)) return `
    <div class="flex h-full w-full flex-col overflow-hidden rounded p-1.5 text-[4.91cqw] mottle ${c.foil ? 'foil' : ''}"
      style="background-color:${bg};color:${ink(lum(bg))}">
      ${TitlePlate(a, c, plate)}
      ${ArtWindow(c, 0, 'my-1 w-full shrink-0 aspect-[5/2.3] [&_img]:object-left')}
      ${TypePlate(a, c, plate, '')}
      ${RulesPlate(a, c, plate, { cls: 'mt-1 flex-1', room: 0.4 })}
      <div class="relative mt-1 h-[50cqw] w-full shrink-0">
        <div class="absolute left-1/2 top-1/2 flex h-[calc(93cqw-12px)] w-[50cqw] -translate-x-1/2 -translate-y-1/2 rotate-90 flex-col">
          ${TitlePlate(b, c, plate)}
          ${ArtWindow(c, 0, 'my-1 w-full shrink-0 aspect-[5/2.3] [&_img]:object-right')}
          ${TypePlate(b, c, plate, '')}
          ${RulesPlate(b, c, plate, { cls: 'mt-1 flex-1', room: 0.4 })}
        </div>
      </div>
      ${FootPlate(a, c, plate)}
    </div>`;
  if (layout === 'split') return `
    <div class="flex h-full w-full flex-col overflow-hidden rounded p-1.5 text-[3.4cqw] mottle ${c.foil ? 'foil' : ''}"
      style="background-color:${bg};color:${ink(lum(bg))}">
      <!-- 7/1.7, not the 7/2.2 first drawn. A split card is landscape, so it has
           only 0.714W of height to divide, and an art strip at 7/2.2 was taking
           44% of it and squeezing both rules columns into what was left - which
           showed up as four of six samples clipping. The lever is the strip, not
           the type size: the printed card's art is nearer a third of the card,
           and taking 10% of the height off it gives the columns beneath about a
           third more room. -->
      ${ArtWindow(c, 0, 'mb-1 w-full shrink-0 aspect-[7/1.7]')}
      <div class="flex min-h-0 flex-1 gap-1.5">
        ${[a, b].map(f => `<div class="flex min-w-0 flex-1 flex-col">
          ${TitlePlate(f, c, plate)}
          ${TypePlate(f, c, plate, 'mt-1')}
          ${RulesPlate(f, c, plate, { cls: 'mt-1 flex-1', room: 0.5 })}</div>`).join('')}
      </div>
      ${FootPlate(a, c, plate)}
    </div>`;
  if (layout === 'flip') return `
    <div class="flex h-full w-full flex-col overflow-hidden rounded p-1.5 text-[4.91cqw] mottle ${c.foil ? 'foil' : ''}"
      style="background-color:${bg};color:${ink(lum(bg))}">
      ${TitlePlate(a, c, plate)}
      ${TypePlate(a, c, plate, 'mt-1')}
      ${RulesPlate(a, c, plate, { cls: 'mt-1 flex-1', room: 0.65 })}
      ${ArtWindow(c, 0, 'my-1 w-full shrink-0 aspect-[5/2.6]')}
      <div class="rotate-180">
        ${TitlePlate(b, c, plate)}
        ${TypePlate(b, c, plate, 'mt-1')}
        ${RulesPlate(b, c, plate, { cls: 'mt-1 flex-1', room: 0.65 })}
      </div>
      ${FootPlate(a, c, plate)}
    </div>`;
  // adventure and prepare: one frame, a rules box split in two
  return `
    <div class="flex h-full w-full flex-col overflow-hidden rounded p-1.5 text-[4.91cqw] mottle ${c.foil ? 'foil' : ''}"
      style="background-color:${bg};color:${ink(lum(bg))}">
      ${TitlePlate(a, c, plate)}
      ${ArtWindow(c, 0, 'my-1 w-full shrink-0 aspect-[5/3.52]')}
      ${TypePlate(a, c, plate)}
      <div class="mt-2.5 flex min-h-0 flex-1 gap-1">
        <div class="flex min-w-0 flex-1 flex-col rounded-sm" style="${plate}">
          ${TitlePlate(b, c, plate, 'text-[0.85em]')}
          ${TypePlate(b, c, plate, 'mt-0.5 text-[0.85em]')}
          ${RulesPlate(b, c, plate, { cls: 'mt-0.5 flex-1', room: 0.4 })}
        </div>
        ${RulesPlate(a, c, plate, { cls: 'min-w-0 flex-1', room: 0.5 })}
      </div>
      ${FootPlate(a, c, plate)}
    </div>`;
};

/* `side` opens the card on that face instead of the front. Only the anatomy
   page's compare mode passes it: a two-sided card has to be checked a side at a
   time against the printed article, and a flip you have to remember to click on
   both halves is a comparison that goes out of step. The button still works
   afterwards - this sets the starting state, it does not replace it. */
const MockCard = (c, fit, side) => {
  const layout = c.layout || 'normal';
  const treat = c.treat || 'framed';
  const bg = frameOf(c);
  const plate = plateOf(c, bg);
  const wide = LANDSCAPE.has(layout);
  const sided = SIDED.has(layout) && twoFaced(c);
  /* Nothing for a frame to hold, so the scan IS the render. It still goes
     through the same wrapper and the same flip button - an art series card has
     two genuinely different sides and turning it over is the point of it.
     No art id and there is no scan to fall back TO, so the empty frame stands:
     that is the mock rows and anything hand-built, never the catalogue.
     Two reasons, one path: `framable` is DERIVED (this card has no cost, no
     type and no rules, so a frame has nothing to say) and UNALIGNED is
     DECLARED (this class cannot be drawn by the shared geometry, so it is not
     drawn). Both end at the printed card, which is why they share the branch. */
  const scan = (!framable(c) || unaligned(c)) && !!c.art_id;
  const paired = PAIRED.has(layout) && twoFaced(c) && !scan;
  const draw = (i, dbg, dplate) => (scan ? PrintedFace(c, i) : CardSide(c, i, dbg, dplate, treat, layout));
  /* The black edge is padding on a wrapper, not a border: border-width takes no
     percentage, so the real component's fixed 7.84px (3.5% of its fixed w-56) can't
     follow a card that's now as wide as its grid track. Percentage padding resolves
     against width, so it stays 3.5% at any size. A borderless printing is exactly
     the card that has none of it. */
  // a scan already carries its own printed border, so the wrapper adds none
  const edge = treat === 'borderless' || scan ? 'p-0' : 'p-[3.5%]';
  // ...and an aftermath split is the one `split` that is read the right way up
  const turned = wide && !aftermath(c);
  const body = paired ? PairedSide(c, bg, plate, treat, layout)
    : sided
      /* Both sides are DRAWN, one is hidden, and the corner button swaps which:
         no state, no re-render, and it works identically in the grid, the binder
         and the draw window because the card carries its own flip. The back's
         frame colour is its own - a transform's back is routinely a different
         colour from its front, and inheriting the front's was the tell. */
      ? `<div class="side-a h-full w-full">${draw(0, bg, plate)}</div>
         <div class="side-b h-full w-full">${(() => {
           const back = faceAt(c, 1);
           const bbg = frameOf({ col: back.col, energy: c.energy });
           return draw(1, bbg, plateOf(c, bbg));
         })()}</div>
         <!-- In the ART WINDOW's top corner, not the title bar's: the title bar's
              right end is where the mana cost is drawn, and the first position
              tried put the button straight on top of it. Below the title plate is
              illustration under every treatment there is, including the full-art
              ones where the illustration is the whole card. -->
         <button onclick="event.stopPropagation();this.closest('[data-anat]').classList.toggle('flipped')"
           title="Turn the card over" aria-label="Turn the card over"
           class="anat-flip absolute right-[7%] top-[15%] z-20 flex h-[8%] w-[8%] cursor-pointer items-center justify-center rounded-full border border-black/40 bg-black/60 text-[0.6em] text-white">&#8635;</button>`
      : draw(0, bg, plate);
  return `
  <div title="${jsArg(c.n)}" data-anat="${layout}/${treat}" style="container-type:inline-size"
    class="relative ${turned ? 'aspect-[7/5]' : 'aspect-[5/7]'} ${fit ? 'h-full w-auto' : 'w-full'} overflow-hidden rounded-lg bg-black/70 ${edge} shadow-lg ${side ? 'flipped' : ''}">
    ${body}
  </div>`;
};

const Card = c => `
  <div class="flex flex-col gap-1">
    <a onclick="openCard('${jsArg(c.n)}','${jsArg(printKey(c))}')" class="cursor-pointer">${MockCard(c)}</a>
    <div class="flex justify-between text-xs text-neutral-400">
      <span class="truncate">${c.qty ? `&times;${c.qty}` : '<span class="text-neutral-700">none</span>'}</span>
      <span class="tabular-nums">${money(c.usd)}</span></div>
  </div>`;

/* Compact is the card's title line and nothing else: the name and the mana
   cost, which is exactly what the top of the mockup draws - plus how many you
   own. It is the layout for reading a deck or a binder as a list, not for
   telling two printings apart.
   Details is the full identity key with the anatomy columns; that's the pair. */
/* A COMPACT ROW IS THE CARD'S TITLE PLATE, drawn by the same function the card
   draws it with - `TitlePlate` over `plateOf`, inside the frame colour, inside
   the black edge. Not a list row styled to look like one: a copy is how the two
   come to disagree, and this row had already drifted to flat neutral-200 text
   on a neutral-900 rule while the card carried the colour.

   What the colour buys is a list you can read at a glance rather than one you
   have to read: a green card is green here too, gold is multicolour, grey is
   colourless - the same rule, because it is the same call.

   The cost-pip fallback is gone with it. The old row drew colour identity pips
   when a card had no cost, which the frame now says on its own - a land is a
   grey plate whether or not it has anything to spend.

   EVERY PRINTING HAS A NAME, checked rather than assumed: 0 of 107,347 are
   without one, including all 3,250 art-series "Card" printings and every
   full-art. So there is no set-and-number fallback here - it would be a branch
   that never runs. */
/* QTY IS A COLUMN EVERYWHERE, on the same argument as the price beside it: how
   many you own is a fact about a card you are looking at, not about the tab you
   arrived from. It used to be drawn only on Binders and Decks - so the same
   printing said "×4" in a deck and nothing at all in Search, and the card page
   needed a separate Holdings band to answer a question the list refused to.
   Zero reads as "none" rather than ×0: the difference between a card you have
   none of and a card you have four of is the whole point of the column, and a
   column of ×0 down a search result reads as a broken count. */
/* THE LANGUAGE PIPS, and a dim one is a CLAIM - which is the whole reason this
   reads `lmask` and not `lang`. Scryfall's set pages carry this column and can,
   because their database holds every language of every printing; ours is built
   from `default-cards`, which is one row per printing and measured, 0 of
   107,347 set/number pairs carry a second language row. Drawn off `lang` the
   column would have shown one lit pip and eighteen dim on every card in the
   app - i.e. "never printed in Japanese" about the 61,628 printings that were.
   So it is drawn off the index gen-langs.mjs builds from `all-cards` (63,990
   printings in more than one language), and where that index has not been
   built the mask is 0 and the column is ABSENT rather than dim: not knowing and
   knowing it is English-only are different answers, and only one of them is
   safe to draw as a row of grey.
   Capped at the languages worth a column. The tail is 49 Phyrexian printings
   and single cards in Latin, Hebrew and Arabic - real, and a pip each for them
   would be sixteen columns of nothing to carry four cards. They still filter;
   this is the column, not the vocabulary. */
/* THE CODE, NOT TWO LETTERS OF IT - the one deviation from the ask, and it is
   `zhs` and `zht` that force it: truncated they are both "zh", two adjacent
   pips that cannot be told apart while claiming to be different answers.
   Simplified and Traditional Chinese are 40,870 and 23,582 printings, so it is
   not a corner. Every other code is already two characters. */
const PIP_LANGS = 11;
const langPips = (c) => {
  const shown = LANGS.slice(0, PIP_LANGS);
  if (!c.lmask) return `<span class="w-[9.5rem] shrink-0 text-center font-mono text-[9px] text-neutral-800"
    title="Not known - this catalogue was built without the language index. Run gen-langs.mjs.">&mdash;</span>`;
  const has = shown.filter((_, i) => c.lmask & (1 << i));
  return `<span class="flex w-[9.5rem] shrink-0 gap-px font-mono text-[9px] leading-none"
    title="Printed in ${has.map(langName).join(', ') || 'no language on record'}">${
    shown.map((l, i) => `<span class="w-[1.6em] shrink-0 rounded-[2px] py-px text-center ${(c.lmask & (1 << i))
      ? 'bg-neutral-700 text-neutral-100' : 'text-neutral-800'}">${l}</span>`).join('')}</span>`;
};

const QtyCell = c => `<span class="w-10 shrink-0 text-right text-xs tabular-nums ${
  c.qty ? 'text-neutral-300' : 'text-neutral-700'}" title="Copies you own">${
  c.qty ? `×${c.qty}` : 'none'}</span>`;

const TitleRow = c => `
  <div onclick="openCard('${jsArg(c.n)}','${jsArg(printKey(c))}')" title="Open ${jsArg(c.n)}"
    class="flex cursor-pointer items-center gap-2 p-1 text-sm hover:brightness-125">
    <div class="min-w-0 flex-1 rounded-md bg-black/80 p-[2px]">
      <div class="rounded-[5px] p-[2px]" style="background:${frameOf(c)}">
        ${/* A FIXED LINE BOX, because the card's own sizing does not survive being
             listed. `nameFit` shrinks a long name so it fills the plate - right on
             a card, where the plate is the width of that card - but in a column of
             identical widths it made every row a different height, and the pips
             (1.45em of a font size that is itself variable) moved the baseline
             with them. The height is 1.9em: the tallest pip a row can draw is
             1.45em of nameFit's largest 1.18em, which is 1.71em. */''}
        ${TitlePlate(faceAt(c, 0), c, plateOf(c), 'h-[1.9em]', 0, 'text-[0.95em]')}
      </div>
    </div>
    ${QtyCell(c)}</div>`;


/* Details is the identity key - set, language, collector number, finish -
   plus the anatomy columns you would otherwise open the card to read.
   Everything Compact leaves out. */
/* THE PRINTING'S OWN FACTS BELONG HERE TOO, and their absence is what made
   Details look broken on the card page. Type, rarity and mana value are facts
   about the ORACLE: down a list of printings of one card they are the same
   string repeated, so the row spent its whole width saying nothing and left
   eight hundred pixels of gap between the name and the first column that
   changed. What actually differs printing to printing - which set, when, whose
   art, and the layout|treatment class the frame is drawn from - was on no
   screen at all.
   Adding them here rather than giving the card page its own table: they are
   details of a card, and Search wants them for the same reason. Set NAME beside
   the code because "MH2" is a code you either know or don't, and the code is
   already in the identity key two columns left. */
const setFact = (c, i) => SET_BY_CODE.get(String(c.set || '').toUpperCase())?.[i] || '';
/* ONE COLUMN TABLE, READ BY BOTH THE HEADER AND THE ROW. Details had no header
   at all - eighteen unlabelled columns you had to decode from their contents -
   and the row typed every width inline, which is how a header and a body come
   to disagree about where a column is. Declared once here: label, weight, how
   the cell reads, and how it draws.

   WIDTHS ARE PERCENTAGES OF THE ROW, NOT rem. Fixed widths do not add up to a
   window: at 1280 they left the name column a wasteland and at 1920 they left
   the price hanging off the right. The weight IS roughly the character count
   the column has to hold, so the percentages fall out of the content rather
   than being tuned by eye, and every cell truncates.

   NOTHING IS CONCATENATED. Three columns were two facts glued together with a
   separator and had to be read apart again: the class was "normal | framed",
   which is a layout AND a treatment, and the type line was "Creature - Human
   Wizard", which is a type AND its subtypes. Two facts in one cell cannot be
   scanned down a column, which is the only reason a column exists. */
const qtyCell = (c) => {
  const [here, all] = ownedOf(c);
  /* TWO NUMBERS, because a list of printings is where "do I own this card" and
     "do I own THIS printing" come apart: eight rows of Lightning Bolt with one
     copy between them read as eight cards you do not own. Left is this exact
     printing, right is the card in any printing - so `0 | 5` is "not this one,
     five elsewhere" and `1 | 1` is "this row is the copy". */
  if (!all) return '<span class="text-neutral-700">&mdash;</span>';
  return `<span class="tabular-nums ${here ? 'text-emerald-300' : 'text-neutral-500'}">${here}</span>
    <span class="px-0.5 text-neutral-700">|</span>
    <span class="tabular-nums ${here === all ? 'text-neutral-500' : 'text-amber-400/90'}">${all}</span>`;
};
const DETAIL_COLS = [
  // key        label        weight  align      cell
  ['qty',      'Qty',          7, 'right', c => qtyCell(c)],
  ['set',      'Set',          4, 'left',  c => `<span class="font-mono uppercase">${c.set || ''}</span>`],
  ['setname',  'Set name',    13, 'left',  c => setFact(c, 0)],
  ['num',      '#',            4, 'right', c => `<span class="font-mono tabular-nums">${c.num ?? ''}</span>`],
  ['lang',     'Lang',         3, 'left',  c => `<span class="font-mono ${
    (c.lang || 'en') === 'en' ? '' : 'text-amber-400'}">${c.lang || ''}</span>`],
  /* The PRINTING's finishes, not the holding's foil flag: `foil` is 0 on every
     catalogue row, so this could only ever say "nonfoil" - including on the
     12,396 printings that are foil-ONLY. */
  ['finish',   'Finish',       7, 'left',  c => `<span class="${
    /^(Nonfoil|Normal)$/.test(finishesOf(c)) ? '' : 'text-amber-300'}">${finishesOf(c).toLowerCase()}</span>`],
  ['cost',     'Cost',         6, 'left',  c => `<span class="flex gap-0.5">${
    (c.cost || []).map(costPip).join('') || pips(c.col || '')}</span>`],
  ['name',     'Name',        13, 'left',  c => `<span class="text-neutral-200">${c.n}</span>`],
  ['type',     'Type',         8, 'left',  c => typeHead(c).trim()],
  ['subtype',  'Subtype',      8, 'left',  c => typeTail(c).trim()],
  ['rarity',   'Rarity',       5, 'left',  c => rarityName(c.rar)],
  ['mv',       'MV',           3, 'right', c => `<span class="tabular-nums">${c.hp || manaValue(c)}</span>`],
  ['released', 'Released',     6, 'left',  c => `<span class="font-mono tabular-nums">${setFact(c, 2)}</span>`],
  ['artist',   'Artist',       8, 'left',  c => c.art || ''],
  ['layout',   'Layout',       5, 'left',  c => `<span class="font-mono">${c.layout || 'normal'}</span>`],
  ['treat',    'Treatment',    6, 'left',  c => `<span class="font-mono">${c.treat || 'framed'}</span>`],
  ['langs',    'Printed in',   9, 'left',  c => langPips(c)],
  ['price',    'Price',        5, 'right', c => `<span class="tabular-nums">${money(c.usd)}</span>`],
];
const DETAIL_TOTAL = DETAIL_COLS.reduce((t, x) => t + x[2], 0);
const detailPct = w => `${(100 * w / DETAIL_TOTAL).toFixed(3)}%`;
const DETAIL_CELL = 'min-w-0 shrink-0 truncate px-1';
/* STICKY, and it belongs to the LIST rather than the row - a header drawn per
   row is 240 headers. It sits at the top of the scrolling pane, which is what
   makes eighteen columns readable at row 200 instead of only at row 1.
   `pad` and `after` are here because the two lists that draw Details wrap the
   row differently: the card page's band pads OUTSIDE a fixed marker column to
   the right of every row, so without the same padding and an invisible copy of
   that marker the header's columns sit a marker's width off the ones below. */
const DetailHead = (pad = '', after = '') => `
  <div class="sticky top-0 z-10 flex items-center gap-3 border-b border-neutral-700 bg-neutral-950 ${pad}
              text-[10px] font-semibold uppercase tracking-wide text-neutral-500">
    <span class="flex min-w-0 flex-1 items-center px-2 py-1">${DETAIL_COLS.map(([, label, w, align]) =>
      `<span class="${DETAIL_CELL} ${align === 'right' ? 'text-right' : ''}"
        style="width:${detailPct(w)}" title="${label}">${label}</span>`).join('')}</span>${after}
  </div>`;
const KeyRow = (c, detail = false) => {
  /* Compact keeps the identity key and the name, which is what it has always
     been: enough to tell two printings apart and nothing else. Details is every
     column. Both read the one table, so a column cannot exist in one and be a
     different width in the other. */
  const cols = detail ? DETAIL_COLS
    : DETAIL_COLS.filter(([k]) => ['qty', 'set', 'num', 'lang', 'finish', 'cost', 'name', 'price'].includes(k));
  const total = cols.reduce((t, x) => t + x[2], 0);
  return `
  <div onclick="openCard('${jsArg(c.n)}','${jsArg(printKey(c))}')" title="Open ${jsArg(c.n)}"
    class="flex cursor-pointer items-center border-b border-neutral-900 px-2 py-1.5 text-xs text-neutral-500 hover:bg-neutral-900/60">
    ${cols.map(([, label, w, align, cell]) => `<span class="${DETAIL_CELL} ${
      align === 'right' ? 'text-right' : ''}" style="width:${(100 * w / total).toFixed(3)}%"
      title="${label}">${cell(c)}</span>`).join('')}
  </div>`;
};

/* ======================= HEADER ======================================= */
/* Search last: Printings, Binders and Decks are where you make a selection, and
   every one of those selections flows into Search. */
/* Search last: Printings, Binders and Decks are where you make a selection, and
   every one of those selections flows into Search. Import isn't here - it's a
   rare one-off, so it sits with the cog on the right. */
const NAV = [['printings','Printings'], ['binders','Binders'], ['decks','Decks'], ['search','Search']];
/* "Card Collector" sits in exactly the same place on every screen, the main
   included - so nothing jumps when you pick a game. The game mark appears to
   its right once chosen, between the wordmark and the tabs; it's square, so it
   occupies the same slot whichever game it is. Clicking either goes back to
   the main, which is the only place the game changes. Cog top-right. */
const TopNav = (section, stats = '') => `
  <header class="shrink-0 border-b border-neutral-800 bg-neutral-900/80">
    <nav class="flex items-center gap-4 px-4">
      <a href="#/home" title="${P.game ? `${GAMES[P.game].label} - back to Card Collector to change game` : 'Card Collector'}"
         class="flex shrink-0 items-center gap-3 py-2">
        <span class="text-lg font-bold tracking-tight text-neutral-100">Card Collector</span>
        ${P.game ? GameMark(P.game) : ''}</a>
      ${!P.game ? '' : NAV.map(([k, l]) => `<a href="#/${k}" onclick="goTab('${k}')" title="${
        l} - clears the current selection" class="border-b-2 px-1 py-3 text-sm font-medium ${k === section
        ? 'border-emerald-500 text-white' : 'border-transparent text-neutral-300 hover:text-white'}">${l}</a>`).join('')}
      ${stats || '<span class="ml-auto"></span>'}
      ${/* THE BADGE IS A COUNT, and it was the literal 3 on every screen of an
             app that had never imported anything. An amber pip in the nav means
             "there is work waiting for you here"; saying so when there is none
             is the same fiction as a Collected bar over an empty collection. It
             appears when there is something to resolve and not otherwise. */''}
      ${!P.game ? '' : `<a href="#/io" title="Import" class="flex shrink-0 items-center gap-1.5 rounded-full px-2 py-1 text-sm font-medium ${
        section === 'io' ? 'bg-emerald-500/10 text-emerald-300 ring-1 ring-emerald-500' : 'text-neutral-400 hover:bg-neutral-800 hover:text-white'}">Import${
        UNRESOLVED.length ? `<span class="rounded-full bg-amber-500 px-1.5 text-[10px] font-bold text-neutral-950">${UNRESOLVED.length}</span>` : ''}</a>`}
      <a href="#/config" title="Config" aria-label="Config"
         class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-lg
                ${section === 'config' ? 'bg-emerald-500/10 text-emerald-300 ring-1 ring-emerald-500' : 'text-neutral-400 hover:bg-neutral-800 hover:text-white'}">⚙</a>
    </nav></header>`;

const DebugBand = () => !DEBUG ? '' : `
  <pre class="mt-6 overflow-x-auto rounded-xl border border-sky-900/60 bg-sky-950/20 p-4 text-[11px] leading-relaxed text-sky-200">
<span class="text-sky-500">tab</span>      ${P.tab}   <span class="text-sky-500">game</span> ${P.game}
<span class="text-sky-500">scope</span>    ${esc(scopeLabel())}   <span class="text-sky-500">selector</span> ${selectorOpen() ? 'open' : 'collapsed'}
<span class="text-sky-500">sort</span>     ${esc(P.sort.map(t => t.f === 'BREAK' ? '--BREAK--' : t.f + (t.d === 'a' ? ' asc' : ' desc')).join(', ')) || '(none)'}
<span class="text-sky-500">grouping</span> ${esc(grouping().map(t => t.f).join(', ') || '(none)')}
<span class="text-sky-500">view</span>     ${P.view ?? '(none)'}   <span class="text-sky-500">rows</span> ${keyed() ? 'identity key' : 'card'}
<span class="text-sky-500">sql</span>      select c.set_id, c.collector_number, h.finish, h.quantity, c.name
         from cards c join holdings h on h.card_id = c.id
         where h.container_id = $1
         order by cc.value asc, c.rarity_tier desc, c.name asc</pre>`;

/* The app is a flex column filling the viewport: header, subheader, then one
   scrolling pane. Whoever is active owns the scrollbar - which is why an open
   selector can take over the window. */
const Frame = (section, { desc = '', stats = '', sub = '', body }) => `${TopNav(section, stats)}
  ${sub}
  <main data-scroll="pane" class="min-h-0 flex-1 overflow-y-auto px-6 py-5">
    ${desc ? `<p class="mb-4 max-w-3xl text-sm text-neutral-400">${desc}</p>` : ''}
    ${body}
    ${DebugBand()}
    <button onclick="DEBUG=!DEBUG;render()" class="${BTN_SECONDARY} mt-4">${DEBUG ? 'Hide' : 'Show'} debug</button>
  </main>`;

/* ======================= THE SELECTOR =================================
   A second header, spanning the window like the first. Collapsed it names the
   selection and carries its numbers and Export. Open, it fills the rest of the
   window and takes the scrollbar off the view beneath. Search never opens -
   it has nothing to select - but it keeps the bar, so Export lives in the same
   place on every page. */

/* A set name can carry an apostrophe ("Assassin's Creed"), which ends the
   string early inside an inline handler and silently breaks the row. Escape
   for JS first, then for the attribute. */
const jsArg = v => String(v).replace(/\\/g, '\\\\').replace(/&/g, '&amp;')
  .replace(/"/g, '&quot;').replace(/'/g, "\\&#39;");

const SelectorRow = (name, a, b, on) => `
  <button onclick="selectItem('${jsArg(name)}')"
    class="flex flex-col gap-0.5 rounded-lg border px-3 py-2 text-left ${on
      ? 'border-emerald-500 bg-emerald-500/10' : 'border-neutral-800 bg-neutral-900/60 hover:border-neutral-600'}">
    <span class="text-sm font-medium ${on ? 'text-emerald-200' : 'text-neutral-100'}">${name}</span>
    <span class="text-[11px] text-neutral-500">${a}</span>
    <span class="text-[10px] text-neutral-600">${b}</span></button>`;

/* Binders describe themselves by page shape, decks by their written-down
   counts: a deck list is a list of cards, so 60/23 will be true of it the day
   membership lands. A binder's card count would not be - it holds whatever the
   collection puts in it. */
const listLine = (row) => P.tab === 'binders'
  ? `${row[2][0]} &times; ${row[2][1]} pockets &middot; ${row[2][0] * row[2][1]} a page`
  : `${num(row[1])} cards &middot; ${row[2]}`;
/* AN EMPTY LIST SAYS WHAT IT IS WAITING FOR. With the four mock binders and
   four mock decks gone the tab rendered as a blank page under a bar reading
   "All binders" - which looks like a bug rather than a state, and it is the
   FIRST thing you see on a fresh app. Both routes in are named, because both
   are real: an import, or a draft you keep. */
const EMPTY_LIST = {
  binders: ['No binders yet', 'A binder arrives from an import: Collectr\'s Portfolio Name, Deckbox\'s tags, a Moxfield folder. The grouping step decides what each one becomes.'],
  decks: ['No decks yet', 'A deck arrives from an import, or from keeping a draft &mdash; open boosters on a set and the pool becomes a deck.'],
};
const SelectorList = () => {
  if (P.tab === 'printings') return SetList();
  const rows = LISTS[P.tab] || [];
  if (!rows.length) {
    const [title, why] = EMPTY_LIST[P.tab] || ['Nothing here yet', ''];
    return `<div class="mt-4 rounded-lg border border-dashed border-neutral-800 px-4 py-10 text-center">
      <p class="text-sm text-neutral-400">${title}</p>
      <p class="mx-auto mt-1 max-w-md text-[11px] text-neutral-600">${why}</p>
      <div class="mt-4 flex flex-wrap justify-center gap-1.5">
        <a href="#/io" class="${BTN_PRIMARY}">Import a file</a>
        <a href="#/printings" class="${BTN_SECONDARY}">Open boosters</a></div>
    </div>`;
  }
  return `<div class="mt-4 grid gap-2 [grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))]">
    ${rows.map(row => SelectorRow(row[0], listLine(row), P.tab === 'binders' ? row[1] : row[3],
      row[0] === picked())).join('')}</div>`;
};

/* Export belongs to a definite thing, so it rides in the bar exactly when the
   scope is definite: Search (all cards) or one selected set/binder/deck. While
   you're still choosing, there is nothing to export. */
/* Import decides what a group BECOMES, once. Everything after that happens
   here, on the binder or deck itself - which is only a true statement if the
   controls exist, so they do. Only on a keyed scope: you don't edit a set. */
const EditInline = () => `
  <span class="flex shrink-0 items-center gap-1.5">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Edit</span>
    <button class="${BTN_SECONDARY}">Add cards</button>
    <button class="${BTN_SECONDARY}">Arrange</button>
    <button class="${BTN_DANGER}">Remove</button></span>`;

// A select, not chips: there are ten formats (docs/import-formats.md) and the
// bar has to stay one line tall next to the name, its numbers and Clear.
const ExportInline = () => `
  <span class="flex shrink-0 items-center gap-1.5">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Export</span>
    <select class="${FIELD} py-0.5 text-xs">${['CSV', ...EXPORTERS].map(f => `<option>${f}</option>`).join('')}</select>
    <button class="${BTN_PRIMARY}">Download</button></span>`;

/* Only the NAME toggles the selector - it can't be one big <button> wrapping
   everything, because a <button>/<select> inside a <button> is invalid and the
   parser closes the outer one early, spilling Export onto a second row. */
const Selector = () => {
  const one = tab().one;
  const sel = picked();
  const open = !!one && selectorOpen();
  const definite = !one || !!sel;   // Search, or something actually picked
  // eyebrow + name (+ chevron where there's something to expand) and nothing
  // else - the numbers live in the top bar, so the bar never contradicts them.
  // Search's bar takes the same classes minus the hover, or it renders 4px
  // shorter than the others and the row visibly steps between tabs.
  const HIT = '-mx-2 flex min-w-0 items-center gap-3 rounded px-2 py-0.5 text-left';
  /* A capped list has to say it is capped, or 240 of 107,214 printings reads as
     the whole catalogue. Silent when everything is on screen, which is every
     view running on the mocks. */
  const CardCount = () => {
    /* Of the FILTERED list, not the scope. Reporting "240 of 107,347" beside a
       list narrowed to sixty was the same class of lie as the invented counts:
       the number you are shown a slice of has to be the number the slice came
       from. Absent when everything is on screen, because then there is nothing
       to say. */
    const all = filtered().length, shown = CARDS().length, scope = scopedCards().length;
    if (shown >= all) return '';
    return `<span title="Showing the first ${num(shown)} of ${num(all)}${
        all < scope ? ` matching (${num(scope)} in scope)` : ''} &mdash; scroll to the end for more"
      class="shrink-0 text-[11px] text-neutral-500">${num(shown)} <span class="text-neutral-600">of ${num(all)}</span></span>`;
  };
  const label = `
    <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">${one || 'scope'}</span>
    <span class="truncate text-base font-semibold ${sel || !one ? 'text-neutral-100' : 'text-neutral-400'}">${sel || (one ? tab().all : scopeLabel())}</span>

/* Colour combos, laid out as the deleted ComboSlicer.tsx already

const COMBOS = [
  ['C','Colourless',12], ['W','White',24], ['U','Blue',22], ['B','Black',19], ['R','Red',21], ['G','Green',20],
  ['WU','Azorius',4], ['WB','Orzhov',3], ['WR','Boros',2], ['WG','Selesnya',5], ['UB','Dimir',4],
  ['UR','Izzet',3], ['UG','Simic',2], ['BR','Rakdos',4], ['BG','Golgari',3], ['RG','Gruul',2],
  ['WUB','Esper',1], ['WUR','Jeskai',1], ['WUG','Bant',0], ['WBR','Mardu',1], ['WBG','Abzan',2],
  ['WRG','Naya',1], ['UBR','Grixis',2], ['UBG','Sultai',1], ['URG','Temur',0], ['BRG','Jund',1],

const BUCKETS = [[5, 'All', 1], [4, 'Quad', 1], [3, 'Tri', 2], [2, 'Dual', 5], [1, 'Mono', 6]];

/* Card anatomy: the filter is the shape of a card, not a bag of options - so
   it's rendered from the game's spec. No free-text box: every element is an
   enumerated value with a count, because a typed string is a guess and a chip
   is a fact. Rarely-browsed groups collapse into "Other", matching
   FilterSidebar's documented order (slicers, then Other). */
/* THE FACET COUNTS ARE COUNTED, not typed. They were written for the 18 mock
   rows and read as plausible for a year - Standard 41, Creature 58, Elf 9 -
   and against a real catalogue they are simply false: the page holds 107,347
   printings, 50,601 of them creatures. Worse than a wrong number, they were
   wrong in a way that looks right, which is the only kind that survives.

   Counted over the CURRENT SCOPE, not the catalogue, because the scope is what
   the filter filters: open a drafted deck and the sidebar should describe those
   84 cards. That is also what made the fault obvious - a Hobbit draft insisting
   it held 92 Modern-legal cards.

// FORMATS, CARD_TYPES, RARITIES and FINISHES are declared at the top of the

   you would file with the creatures or the artifacts.

   types and "Other", where Other held 18,544 printings - 17% of the catalogue
   and its second-largest bucket - filing 6,909 lands and 2,178 tokens in with
   emblems, schemes, planes and dungeons. As the first term of the default
   order that made the largest group on the page a bucket of things that are
   not each other, and the six names it split out are already the Type chips in

   named for what the division IS. Creature-vs-Instant is Type's question. */

/* ONE DEFINITION OF WHAT A CHIP MEANS, read by the counter and by the filter.

  Rarity: (c, v) => c.rar === RAR_OF.get(v),

function toggleChip(group, value) {

  // "is anything picked in this group" stays a plain key count
  sel[value] = sel[value] === 1 ? -1 : sel[value] === -1 ? 0 : 1;

const chipState = (group, value) => {

/* An empty box is not a zero. Both ends are independently optional - "3 and up"

function setRange(group, end, raw) {

function clearFilter() { P.filter = langFilter(emptyFilter()); P.filterDraft = langFilter(emptyFilter()); P.page = PAGE; render(); }

const matchesFilter = (c, f, skip) => {
  for (const g in f.chips) if (g !== skip && !chipMatch(c, g, f.chips[g])) return false;

  if (skip !== 'Colour' && !comboMatch(c.col || '', f)) return false;

/* Keyed on the scope AND the filter, because both change what the answer is.

let FACETS = null, FACETS_OF = null, FACETS_KEY = null;

  /* Counted with every OTHER group applied and this one's own terms ignored, so
