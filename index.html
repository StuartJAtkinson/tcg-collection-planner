<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Collector - UI format draft</title>
<link rel="stylesheet" href="./draft.css">
</head>
<!-- The app owns the viewport: header and subheader are fixed-height rows and
     whichever pane is active scrolls inside itself. That's what lets an open
     selector fill the window and take over the scrollbar. -->
<!-- The whole UI renders at 0.8. `zoom` rather than a transform, because zoom is
     a layout property: the boxes really are smaller, so everything still flows,
     wraps and scrolls as itself. The height is divided back out - vh units are
     viewport-relative and zoom does NOT scale them, so a plain h-screen inside
     would render at 80% of the window and leave a fifth of it blank. -->
<body class="h-[125vh] overflow-hidden bg-neutral-950 text-neutral-100 [zoom:0.8]">
<div id="app" class="flex h-full flex-col"></div>

<script src="sets.js"></script>
<!-- Shared with the generators, loaded the same way sets.js is: the pack trim
     runs here live and in gen-packs.mjs on the way to disk, and SIDED/framable
     are read by gen-art.mjs to decide what to fetch. One copy, so they cannot
     drift apart. -->
<script src="trim.js"></script>
<script src="anatomy.js"></script>
<script>
/* ============================================================================
   UI FORMAT DRAFT - no data, no queries, no server. Every number is fake.

   FOUR SURFACES. That's the whole app.

     ⚙ Config        top-left, standard app position
     Printings       the set list (scryfall.com/sets shape: sub-sets indented
                     under their parent). Fixed sort - block date, then sub-set
                     date, newest first. Click a set → Search, scoped to it.
     Search          ONE page. Everything that isn't Config/Printings/Import is
                     this page with a different scope:
                         Game → (Set | Binder | Deck | All) → card anatomy
                     Binders and Decks in the nav call the same function.
     Import          one alias table, not nine parsers. Export is the same map
                     run backwards, and lives in each page's subheader.

   SORT carries a BREAK element. Everything left of the break is the grouping;
   the layout decides what a break means:
     grid → new row · compact/text → rule · binder → new page · deck → section
   ========================================================================= */

/* ---- design tokens: the source of truth, and the only one --------------
   These were lifted verbatim from app/components/chip.ts, which no longer
   exists. They are not a copy of anything now. */
const CHIP_NEUTRAL = 'inline-flex items-center justify-between gap-1 cursor-pointer whitespace-nowrap rounded-full border border-neutral-700 px-3 py-1 text-xs text-neutral-300 hover:border-neutral-500';
const CHIP_PLUS    = 'inline-flex items-center justify-between gap-1 cursor-pointer whitespace-nowrap rounded-full border border-emerald-500 bg-emerald-500/10 px-3 py-1 text-xs text-emerald-300';
const CHIP_MINUS   = 'inline-flex items-center justify-between gap-1 cursor-pointer whitespace-nowrap rounded-full border border-rose-500 bg-rose-500/10 px-3 py-1 text-xs text-rose-300';
const BTN_PRIMARY  = 'cursor-pointer rounded-full border border-emerald-600 bg-emerald-600 px-3 py-1 text-xs font-semibold text-white hover:bg-emerald-500';
const BTN_SECONDARY= 'cursor-pointer rounded-full border border-neutral-700 px-3 py-1 text-xs text-neutral-300 hover:border-neutral-500';
const BTN_PRIMARY_LG   = 'cursor-pointer rounded-full border border-emerald-600 bg-emerald-600 px-4 py-1.5 text-sm font-semibold text-white hover:bg-emerald-500';
const BTN_SECONDARY_LG = 'cursor-pointer rounded-full border border-neutral-700 px-4 py-1.5 text-sm text-neutral-300 hover:border-neutral-500';
const BTN_DANGER   = 'cursor-pointer rounded-full border border-red-900/60 bg-red-900/60 px-3 py-1 text-xs text-red-200 hover:border-red-700 hover:bg-red-800/70';
const FIELD        = 'rounded border border-neutral-700 bg-neutral-950 px-2 py-1.5 text-sm text-neutral-100';
const PANEL        = 'rounded-xl border border-neutral-800 bg-neutral-900/50';

/* Counts are exact while an exact count is worth reading, and abbreviated once
   it isn't: nobody reconciles 107,565 against a bar, and the comma grouping was
   costing more width than the extra digits were worth. */
const num = n => n < 10000 ? String(n) : `${Math.round(n / 100) / 10}k`;

/* THE CLOSED VOCABULARIES, DECLARED ONCE AND READ EVERYWHERE. Each of these was
   written down twice - once here for the filter to count against, and again
   inside the anatomy spec with a made-up number beside it - and two of the four
   copies had already drifted apart: the spec's Legality listed eight formats to
   FORMATS' nine (no Historic) and its Rarity four to RARITIES' five (no
   Special), so the sidebar offered a different vocabulary from the one the
   filter, the sort and the card page use.
   They are up here rather than beside `facetCounts` because GAMES needs them and
   GAMES is the first thing this file declares. An open vocabulary - subtypes,
   keywords, artists - is NOT written down anywhere: it is taken from the data,
   most common first, because any hand-picked list of hundreds is a sample
   presented as a vocabulary. */
const FORMATS = ['Standard', 'Pioneer', 'Modern', 'Legacy', 'Vintage', 'Commander', 'Pauper', 'Brawl', 'Historic'];
const CARD_TYPES = ['Creature', 'Instant', 'Sorcery', 'Artifact', 'Enchantment', 'Planeswalker', 'Land', 'Battle'];
const RARITIES = [['Common', 1], ['Uncommon', 2], ['Rare', 3], ['Mythic', 4], ['Special', 5]];
const FINISHES = ['Nonfoil', 'Foil', 'Etched'];
const PKM_CARDS = 21904;
/* The spec wants [label, count] pairs and a closed vocabulary has no count worth
   writing down: an invented one is a lie the moment the catalogue loads, and a
   zero reads as "none of these" rather than "not counted yet". `facetCounts`
   fills them in for real; ChipGroup draws no number when there isn't one. */
const vocab = xs => xs.map(x => [Array.isArray(x) ? x[0] : x]);

/* One entry per game - this is the whole "ready for another TCG" claim. The
   anatomy is a spec, not markup: adding a game is data, not a new component.
   `sort` differs too (mana/colour vs hp/type); the selector, break and the
   display types are universal. */
const GAMES = {
  mtg: {
    label: 'Magic', total: num(MTG_CARDS),
    sets: `${num(SETS.length)} sets &middot; ${num(MTG_CARDS)} cards`,
    sort: ['kind','name','set','release','number','rarity','mana','colour','price','language'],
    anatomy: [
      /* LANGUAGE FIRST, and it is the one group that arrives already set --
         see langFilter(). Search is 107,347 printings and 104,713 of them are
         English, so opening on "every language at once" makes the first screen
         of every query a pile of near-duplicates and makes the app do the work
         of ordering them. It is the top group because it is the one you change
         to widen rather than to narrow, which is the opposite of every group
         below it.
         THE NOTE IS LOAD-BEARING, because "language" means two different things
         two columns apart and both are true. This group counts the CATALOGUE
         ROW's language - en 104,713, es 1,207, ja 651 - while the Printed in
         column counts what the printing was ISSUED in, where ja is 61,628. The
         filter cannot be made to mean the second: `default-cards` is one row per
         printing, so there is no Japanese row to select. Only a label can tell
         them apart, and without one they read as a contradiction. */
      ['chips', 'Language', [], { cols: 3, note: 'the row&rsquo;s own, not every language it exists in' }],
      ['chips', 'Legality', vocab(FORMATS), { cols: 2, note: 'legal in' }],
      ['combos'],
      ['range', 'Mana value', null, { symbols: true }],
      ['chips', 'Type', vocab(CARD_TYPES), { cols: 3 }],
      // the four open ones: a placeholder here is a sample, so the list is empty
      // until facetCounts reads the real thing out of whatever is in scope
      ['chips', 'Subtype', [], { cols: 3, note: 'from the type line' }],
      ['chips', 'Keywords', [], { cols: 2 }],
      ['chips', 'Rarity', vocab(RARITIES), { cols: 2 }],
      ['range', 'Power', null, { other: true }],
      ['range', 'Toughness', null, { other: true }],
      ['chips', 'Finish', vocab(FINISHES), { cols: 3, other: true }],
      ['chips', 'Artist', [], { cols: 2, other: true }],
    ],
  },
  pokemon: {
    label: 'Pok&eacute;mon', total: num(PKM_CARDS), sets: `162 sets &middot; ${num(PKM_CARDS)} cards`,
    sort: ['name','set','number','rarity','hp','type','price','language'],
    /* THE SAME TREATMENT MAGIC'S SIDEBAR GOT, and this was the last of it left
       in the app. Every chip here carried a hardcoded count - Legality 74/148/
       252, ten energy types, Card type, Stage, Rarity, Finish - which reads as
       measured and is typed. There is no Pokemon catalogue yet, so nothing can
       count them, and a number nobody counted is the mock-binder problem in a
       sidebar. The VOCABULARIES are real and stay: energy types and evolution
       stages are facts about Pokemon, not a sample of them, so `vocab` strips
       the counts and leaves the chips - facetCounts fills them in for real the
       day a catalogue lands, and ChipGroup draws no number until then.
       ILLUSTRATOR IS THE EXCEPTION and goes empty, for the reason Magic's
       Artist is empty: three names out of thousands is a sample presented as a
       vocabulary, which is a different lie from an invented count. */
    anatomy: [
      ['chips', 'Language', [], { cols: 3 }],
      ['chips', 'Legality', vocab(['Standard', 'Expanded', 'Unlimited']), { cols: 2, note: 'legal in' }],
      ['chips', 'Type', vocab(['Grass', 'Fire', 'Water', 'Lightning', 'Psychic', 'Fighting',
        'Darkness', 'Metal', 'Colorless', 'Dragon']), { cols: 3, note: 'energy' }],
      ['range', 'HP'],
      ['chips', 'Card type', vocab(['Pok&eacute;mon', 'Trainer', 'Energy']), { cols: 3 }],
      ['chips', 'Stage', vocab(['Basic', 'Stage 1', 'Stage 2', 'V', 'ex']), { cols: 3, note: 'evolution' }],
      ['chips', 'Rarity', vocab(['Common', 'Uncommon', 'Rare', 'Holo Rare', 'Illustration Rare']), { cols: 2 }],
      ['range', 'Retreat cost', null, { other: true }],
      ['chips', 'Finish', vocab(['Normal', 'Holofoil', 'Reverse holo']), { cols: 3, other: true }],
      ['chips', 'Illustrator', [], { cols: 2, other: true }],
    ],
  },
};

/* Magic's mark is the real one, out of the Mana font the repo already ships
   (public/fonts/mana.woff2) - the planeswalker symbol, Magic's icon-form logo.
   The MAGIC wordmark is in there too (ms-watermark-mtg) but it's a wide lockup
   that turns to mush at 32px. Pokémon has no glyph in that font, so its
   pokéball is drawn in CSS. */
const GameMark = (g, size = 'h-8 w-8 text-2xl') => g === 'pokemon'
  ? `<span class="${size} inline-flex shrink-0 items-center justify-center rounded-full border-2 border-neutral-950 bg-gradient-to-b from-red-500 from-50% to-neutral-100 to-50% shadow"><span class="h-1/4 w-1/4 rounded-full border-2 border-neutral-950 bg-white"></span></span>`
  : `<span class="${size} inline-flex shrink-0 items-center justify-center text-amber-400"><i class="ms ms-watermark-planeswalker"></i></span>`;

/* ---- the one state object --------------------------------------------
   Every browse tab has the same shape: a SELECTOR band under the header, then
   filter / sort / view. The selector is expanded (the list of sets, binders or
   decks) until you pick one, at which point it collapses to a subheader with
   the title and its numbers. Clicking that subheader re-opens it. Search is the
   one tab with nothing to select - it IS all cards. */
const TABS = {
  printings: { label: 'Printings',     one: 'set',    all: 'All sets',    keyed: false },
  binders:   { label: 'Binders',       one: 'binder', all: 'All binders', keyed: true  },
  decks:     { label: 'Decks',         one: 'deck',   all: 'All decks',   keyed: true  },
  io:        { label: 'Import' },
  search:    { label: 'Search' },
};
/* what each tab's selector lists: [name, line1, line2] */
/* Binders carry their page SHAPE as data, not as prose in the description: the
   binder layout lays out that many pockets, and the layout row states it. A real
   binder is bought as 3x3 or 4x3 and the collection is arranged to it, so it is
   a property of the binder rather than a display preference. */
/* A binder used to state its own size ("3016 cards &middot; 336 pages") and the
   page then drew 18. A binder has no membership stored anywhere, so its size is
   not a fact about the binder - it is a count of whatever the tab is showing,
   and every binder reports the same pool until membership exists. Written-down
   counts only look right; these move with the data and with the x by y. */
/* NOTHING IS COLLECTED UNTIL SOMETHING SAYS SO. These were four binders and
   four decks of invented furniture - "Bant Exalted, 60, 27 distinct, modern ·
   4 missing" - which read as a collection while being nothing of the sort: no
   binder had a membership stored anywhere, so opening one showed the same 18
   mock cards as every other, and the counts beside the names were prose. A real
   import lands beside that and you cannot tell which half is yours.
   `BINDER_RULE` went with them, and by its own argument: it gave each mock
   binder a predicate over the catalogue (the Alara sets, twenty duals,
   twenty-five Commander staples, and Unsorted as the remainder) explicitly as a
   stand-in, its comment saying "the real answer is holdings, which arrive with
   the Collectr import". They have arrived, so a rule that dresses catalogue
   cards up as a collection is now the thing standing between you and seeing
   your own. A container holds its stored membership - index 4, the shape a
   kept draft has always used - and nothing until it has one.
   check.mjs seeds its own lists where a test needs one, which is the right way
   round: a fixture belongs to the test that depends on it. */
const LISTS = { binders: [], decks: [] };

/* HOW A COLLECTION IS FILED, and now the default everywhere rather than the
   binder's private arrangement: main type, colour, rarity high to low, then the
   break - so a group is one kind of card, in one colour, at one rarity - and
   inside it, release order, set, collector number. Release before set because a
   release is the block, so a set and its sub-sets stay together instead of being
   split by their codes.

   This is a DEPARTURE from "a fresh page applies nothing on your behalf", taken
   deliberately and on request. The argument for that rule was that an order you
   did not choose is misleading on a QUERY, where it decides what you see first -
   and it still is, which is why Clear still clears to nothing rather than back
   to this. What changed is the judgement that an unordered catalogue is worse:
   107,347 printings in payload order is not a neutral starting point either, it
   is just an arbitrary one that reads as random. */
const DEFAULT_SORT = () => [{ f: 'kind', d: 'a' }, { f: 'colour', d: 'a' }, { f: 'rarity', d: 'd' },
  { f: 'BREAK' }, { f: 'release', d: 'a' }, { f: 'set', d: 'a' }, { f: 'number', d: 'a' }];

/* A page of results, not a limit. The list used to be sliced here and say
   so in the count; this is how many are on screen right now, and reaching the
   end of them fetches the next page until there are none left. */
const PAGE = 240;
const emptyFilter = () => ({ chips: {}, range: {}, colours: [], comboMode: 'contained', cost: [] });
/* THE ONE FILTER THAT ARRIVES ALREADY SET, and the second deliberate departure
   from "a fresh page applies nothing on your behalf" - the first was
   DEFAULT_SORT, on the same argument and it is worth repeating. The rule exists
   because a narrowing you did not choose hides cards and does not say so. This
   one says so loudly: it is the TOP group in the sidebar, lit, with the count
   beside it, and one click widens it.
   What it buys is the thing that made Search slow to read rather than slow to
   run. 104,713 of 107,347 printings are English, and 63,990 exist in more than
   one language, so an unfiltered query's first screen is the same card in six
   languages before it is six cards. Narrowing to one language is what makes the
   page a list of CARDS again.
   Written as a function over an existing filter so changing the default
   re-seeds what is already there rather than only what comes next. */
const langFilter = (f) => {
  const had = f.chips.Language;
  // only re-seed a group that is untouched or holds exactly one default: a
  // language you picked yourself is a choice and outranks the setting
  if (had && !(Object.keys(had).length === 1 && LANGS.includes(Object.keys(had)[0]) && Object.values(had)[0] === 1)) return f;
  f.chips.Language = { [P.lang]: 1 };
  return f;
};

/* THE LANGUAGES THE APP FILES UNDER, measured off the catalogue rather than
   declared: 19 codes over 107,347 printings, English on 104,713 of them. The
   order is most-printed first, which is also the order the pip column draws in.
   `lang-index.json` may widen this at build time - see LANG_INDEX - and where
   it does, the wider list wins, because a language nothing in default-cards was
   catalogued in is still a language cards were printed in. */
let LANGS = ['en', 'es', 'ja', 'fr', 'it', 'zhs', 'ph', 'de', 'qya', 'dw', 'ru', 'zht', 'pt', 'grc', 'sa', 'he', 'ko', 'ar', 'la'];
const LANG_NAME = { en: 'English', es: 'Spanish', ja: 'Japanese', fr: 'French', it: 'Italian',
  zhs: 'Simplified Chinese', zht: 'Traditional Chinese', ph: 'Phyrexian', de: 'German',
  qya: 'Quenya', dw: 'Dwarvish', ru: 'Russian', pt: 'Portuguese', grc: 'Ancient Greek',
  sa: 'Sanskrit', he: 'Hebrew', ko: 'Korean', ar: 'Arabic', la: 'Latin' };
const langName = l => LANG_NAME[l] || l;

const P = {
  game: null,
  /* THE DEFAULT LANGUAGE, chosen on the main page and read by everything
     downstream. It is one setting rather than a per-page one because it is a
     fact about YOU - which language you collect in - not about the tab you are
     on, and it was previously the literal 'en' in four places that each thought
     they were the only one.
     What reads it: Search opens narrowed to it, the import files a row that
     carries no language column under it, and the card page prefers a printing
     in it. Persisted, because being asked twice for the same answer is the
     thing localStorage is for. */
  lang: 'en',
  tab: 'search',
  // Selections do NOT survive navigation: clicking a tab always lands you on
  // its full list with nothing chosen. A remembered selection means the tab
  // shows you something different depending on where you'd been, which is the
  // kind of hidden state that makes a page feel like it's arguing with you.
  pick: { printings: null, binders: null, decks: null },
  open: true,      // is the selector band expanded?
  compare: false,  // #/anatomy only: draw each sample beside its printed scan
  // how many across, per layout - the thing Zoom was a percentage of. Defaults
  // are what auto-fill drew at a 1920 window, so the page opens as it always did
  cols: { compact: 6, grid: 6 },
  dims: [3, 3],    // page shape for binders when none is picked to own it
  across: 4,       // binder pages shown side by side; even, because a page faces one
  // filed on arrival - see DEFAULT_SORT for why this is not "applies nothing"
  sort: DEFAULT_SORT(),        // applied - what the results are actually ordered by
  sortDraft: DEFAULT_SORT(),   // staged - what you're building on the bar
  view: null,
  ask: null,             // the one question the bar's Draft button asks
  draw: null,            // a drawn pool, or null - set pages only
  card: null,            // the card you clicked through to, or null
  print: null,           // which of its printings is on show - null is the earliest
  // how the card page draws every printing of the card. There was a second one
  // of these for a Holdings band; that band was the same cards listed twice and
  // is folded into this list, which carries your quantity and where it is
  prints: 'details',
  matched: false,        // has that card been matched to a printing yet?
  face: 'frame',         // card page image slot: our drawn frame, or the printed card
  /* THE FILTER IS TWO OBJECTS, for the reason the sort is: nothing narrows
     until you say so. `filterDraft` is what the sidebar is composing - the
     chips you have lit, the colours, the ranges - and `filter` is what the
     results are actually filtered by. Apply copies one onto the other.
     `chips` is { group: { value: 1 | -1 } }: 1 includes, -1 excludes, absent
     is off, which is the tri-state the chip styling was already drawn for. */
  filter: emptyFilter(),
  filterDraft: emptyFilter(),
  // how many of the filtered list are rendered. Not a ceiling: the pane pages
  // in more as you reach the end until every one is shown.
  page: PAGE,
};
/* A tab is also the way back. Clicking it clears whatever was selected and
   reopens the list - including the two cases an href alone can't reach: you're
   already on that tab (the hash doesn't change, so nothing fires) or you're off
   on a card page (the tab isn't the route, so the href changes it but the
   selection underneath survives). Same effect as Back, from anywhere. */
function goTab(k) {
  clearPicks();
  P.card = null;
  P.tab = k;
  if (location.hash === '#/' + k) render();   // href won't fire; do it ourselves
}
const clearPicks = () => { P.pick = { printings: null, binders: null, decks: null }; P.open = true; };
/* Every source the app pulls from, in ONE shape - because they had drifted into
   three. Card data had bulk/live chips in the data column, card art had
   hotlink/size chips over in the behaviour column, and pack art had no row at
   all. A source is four facts: what it gives, whether it's local or online,
   which variant, and what that variant costs. Local and online are named the
   same for all of them; the side that doesn't exist says why rather than going
   missing, so every row can be read the same way.
   Sizes marked GB/MB against a card count are derived, not typed - the reason
   art is hotlinked is that number, and a typed number would drift off it. */
const bytes = n => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n >= 1e6 ? Math.round(n / 1e6) + ' MB' : Math.round(n / 1e3) + ' KB';
const PACK_COUNT = Object.values(PACK_ART).reduce((n, o) => n + Object.keys(o).length, 0);
// PKM_CARDS is declared with the vocabularies at the top - GAMES prints it too,
// and it was a bare 21904 typed twice up there
/* EVERY SIZE HERE IS A NUMBER OF BYTES PER UNIT, and every one of them was
   measured - the image sizes over 24 printings sampled across the catalogue,
   the files off the disk they are sitting on. They used to be prose typed into
   the row ("372 MB · pulled 2026-08-06 04:10") and every one had drifted: the
   Scryfall row named a filename that does not exist, the prices row named a
   file that was never downloaded at all, and the font was out by a factor of
   six. A number the row DERIVES cannot drift from the thing it describes; a
   sentence about it always will. `units` is what the number is per - one for a
   file, a card count for the two image sources. */
const SOURCES = {
  scryfall: { name: 'Scryfall', gives: 'card data &middot; set list', kind: 'data', game: 'mtg',
    /* THE DEFAULT IS THE FILE THE PIPELINE ACTUALLY READS. It said `all_cards`,
       so the "is it here" status and the disk a fresh machine was told to budget
       for were both about a 392 MB file nothing reads: `gen-cards.mjs` builds
       the catalogue from `default-cards`, 78 MB. `full` stays `all_cards`
       because that IS the dearest thing you could put on this disk, which is
       what the source ordering and the offline summary are asking. */
    def: ['local', 'default_cards'], full: 'all_cards', units: 1,
    file: q => `data/scryfall-${q.replace(/_/g, '-')}.jsonl.gz`,
    /* TWO BULK FILES, TWO GENERATORS, and the second one was named nowhere a
       person would look. `all-cards` is not an optional bigger version of
       `default-cards` - it is the only file that can say which LANGUAGES a
       printing exists in, so the pip column is silently absent from any
       catalogue built without gen-langs.mjs having run over it. */
    cmd: q => (q === 'all_cards'
      ? `npm run import                # fetches data/scryfall-all-cards.jsonl.gz\nnode gen-langs.mjs             # writes data/lang-index.json - the language pips\nnode gen-cards.mjs             # folds it into cards.json.gz`
      : `npm run import   # fetches data/scryfall-${q.replace(/_/g, '-')}.jsonl.gz`),
    local: 'one bulk file, read start to finish with the network off',
    online: 'api.scryfall.com &middot; 10/s, 2/s on search &mdash; ~15 hours for a 108k catalogue',
    q: [['oracle_cards', 'one row per card', 24.5e6],
        ['default_cards', 'one row per printing &mdash; the catalogue is built from this', 77.5e6],
        ['all_cards', 'every printing in every language &mdash; needed for the language pips', 391.7e6],
        ['unique_artwork', 'one row per illustration', 37.4e6], ['rulings', 'rulings only', 5.3e6]] },
  sfart: { name: 'Scryfall images', gives: 'card art', kind: 'images', game: 'mtg',
    def: ['online', 'art_crop'], full: 'png', units: MTG_CARDS,
    file: q => `art/sf/${q}`,
    cmd: q => `node gen-art.mjs ${q} --all      # or --anatomy for the sample page only`,
    local: 'art/sf/ &mdash; one file per printing, fetched once',
    online: 'cards.scryfall.io &middot; unrated-limited, and what Scryfall asks for by default',
    /* Two different pictures, not five qualities of one. The frame always draws
       art_crop and cannot use anything else; the rest are the whole printed
       card, which is what an unframable printing and the compare column show. */
    q: [['art_crop', '626&times;457 &mdash; the illustration alone, which is what every frame draws', 75e3],
        ['small', '146&times;204 &mdash; whole card', 14e3], ['normal', '488&times;680 &mdash; whole card', 104e3],
        ['large', '672&times;936 &mdash; whole card', 169e3], ['png', '745&times;1040 &mdash; whole card', 1231e3]] },
  /* THE MOST FREQUENT REQUEST IN THE APP, and until now the only one with no
     Local side at all. A set symbol is drawn on every card AND on every row of

     <h2 class="text-lg font-semibold text-neutral-300">${title}</h2>${right}</div>`;

/* `stick` pins the header to the top of the scrolling pane. The -top-5/-mt-8/pt-8
   trio is not decoration: <main> has py-5, and a sticky top-0 pins below that
   padding, leaving a 20px strip the content scrolls through in plain sight. The
   bar starts 20px higher and pads it back, so it covers the strip and sits flush
   at rest. Change <main>'s padding and this changes with it. */
const Band = (name, body, { off = false, right = '', note = '', stick = false } = {}) => `
  <section class="${off ? 'opacity-40' : ''} mb-5">
    <div class="mb-2 flex items-center gap-2 border-b border-neutral-800 pb-1 ${
      stick ? '-top-5 -mt-8 pt-8 sticky z-10 -mx-3 bg-neutral-950/95 px-3 backdrop-blur' : ''}">
      <span class="shrink-0 text-xs font-semibold uppercase tracking-wide ${off ? 'text-neutral-600' : 'text-neutral-400'}">${name}</span>
      ${note ? `<span class="min-w-0 flex-1 truncate text-[10px] text-neutral-600">${note}</span>` : ''}
      <span class="ml-auto flex shrink-0 items-center gap-1.5">${right}</span>
    </div>${off ? '' : body}
  </section>`;

/* Chips fill the sidebar rather than wrapping ragged: a fixed column count per
   group, and each chip stretches to its cell so the counts line up in a rail
   down the right. Column counts are literal strings because Tailwind scans
   source text - an interpolated `grid-cols-${n}` would never be generated. */
const GRID = { 1: 'grid-cols-1', 2: 'grid-cols-2', 3: 'grid-cols-3', 5: 'grid-cols-5', 6: 'grid-cols-6' };
/* ONE TABLE, AND EVERY LIST ON CONFIG IS ONE. There were four hand-rolled
   tables on that page - the schema map, the alias map, the files list and the
   source rows - each with its own header markup, its own row markup and its own
   column widths, which is why no two of them lined up and why three of them had
   a header row that did not match the cells under it.
   `cols` is [label, width class]; a row is cells in the same order. `rowCls`
   exists because two of the four tint a row to mean something, and `rowAttrs`
   because one of them is a picker and its rows are clickable. */
const Table = (cols, rows, { rowCls = () => '', rowAttrs = () => '', foot = '', frame = true } = {}) => `
  <div class="${frame ? 'overflow-hidden rounded-lg border border-neutral-800' : ''}">
    <div class="flex items-baseline gap-2 border-b border-neutral-800 bg-neutral-900/60 px-2 py-1.5">
      ${cols.map(([label, w]) => `<span class="${w} shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">${label}</span>`).join('')}</div>
    ${rows.map((cells, i) => `<div ${rowAttrs(cells, i)} class="flex items-baseline gap-2 border-t border-neutral-900 px-2 py-1.5 text-[11px] ${rowCls(cells, i)}">
      ${cols.map(([, w], j) => `<span class="${w} min-w-0 truncate">${cells[j] ?? ''}</span>`).join('')}</div>`).join('')}
    ${foot ? `<p class="border-t border-neutral-800 px-2 py-1.5 text-[11px] text-neutral-600">${foot}</p>` : ''}
  </div>`;

const ChipGroup = (label, opts, note = '', cols = 2, live = false) => `
  <div class="mb-3">
    <div class="mb-1 flex items-baseline gap-2">
      <span class="text-[11px] font-semibold uppercase tracking-wide text-neutral-500">${label}</span>
      ${note ? `<span class="text-[10px] text-neutral-600">${note}</span>` : ''}
    </div>
    <div class="grid gap-1.5 ${GRID[cols] || GRID[2]}">${opts.map(o => chip(
      o[0], live ? chipState(label, o[0]) : o[1], o[2] ? count(o[2]) : '',
      live ? `toggleChip('${jsArg(label)}','${jsArg(o[0])}')` : '')).join('')}</div>
  </div>`;

/* X, Snow and Phyrexian aren't amounts, so they can't ride the from/to - but
   they are part of what a mana cost IS, so a group of their own would scatter
   the question. Three independent toggles under the range, the same contained
   sense as the colour slicer: any of them, in any combination, none by default. */
const COST_SYMBOLS = [['X', 'X in the cost', 12], ['Snow', 'Snow mana', 7], ['Phyrexian', 'Phyrexian mana', 4]];
function toggleCost(k) {
  const f = P.filterDraft;
  f.cost = f.cost.includes(k) ? f.cost.filter(x => x !== k) : [...f.cost, k];
  render();
}

/* Both ends independently optional, and a blank end is not a zero: "3 and up"
   and "up to 3" are both real questions, so an empty box is no bound at all
   rather than a bound of nothing. `live` is false for the game whose ranges
   this page has no rule for, the same as the chips. */
const RangeField = (label, lo, hi, symbols = false, live = false) => `
  <div class="mb-3">
    <div class="mb-1 text-[11px] font-semibold uppercase tracking-wide text-neutral-500">${label}</div>
    <div class="flex items-center gap-1.5 text-xs">

        live ? ` onchange="setRange('${jsArg(label)}',0,this.value)"` : ''}>
      <span class="shrink-0 text-neutral-500">to</span>
      <input class="${FIELD} min-w-0 flex-1 tabular-nums" value="${hi}"${
        live ? ` onchange="setRange('${jsArg(label)}',1,this.value)"` : ''}></div>
    ${!symbols ? '' : `<div class="mt-1.5 grid grid-cols-3 gap-1.5">
      ${COST_SYMBOLS.map(([k, name, n]) => `
        <button onclick="toggleCost('${k}')" title="${name} &mdash; ${n} cards"
          class="${P.filterDraft.cost.includes(k) ? CHIP_PLUS : CHIP_NEUTRAL}">${k}${count(n)}</button>`).join('')}

/* The real catalogue: 37.5k cards and 107k printings, generated by gen-cards.mjs
   and fetched once. It is too big to inline the way sets.js is (5.3 MB gzipped),
   so it is the one thing this page goes to the network for - serve.py sends it
   with Content-Encoding: gzip, so fetch().json() inflates it and there is no
   gunzip here. Until it lands, and in check.mjs which renders with no network at
   all, CARD_ROWS still answers: the mocks are the offline fallback now rather
   than the only data. */
let CATALOGUE = null;
// "{1}{G/P}{X}" -> ['1','G/P','X'], which is the token list costPip draws
const costTokens = (s) => (s.match(/\{[^}]+\}/g) || []).map(t => t.slice(1, -1));
/* One object per printing, built once. The oracle fields are shared by reference
   - 107k objects pointing at 37.5k strings - so this costs pointers, not text.
   `faces` is shared the same way: a transform card's two faces are built once
   per oracle, not once per printing of it. */
const EMPTY = [];   // the one "nothing here" array, shared rather than allocated
const materialiseFace = ([n, cost, type, text, pt, loy, col]) =>
  ({ n, cost: costTokens(cost), type, text, pt, loy, col });
/* The two dictionaries default to a lone empty string so an older cards.json.gz
   - one generated before either field existed - reads as "no artist, no
   flavour" rather than throwing. Absent, not invented. */
const materialise = ({ o, p, artists = [''], flavour = [''], kws = [''], langs = 0 }) => {
  /* THE VOCABULARY COMES WITH THE MASKS, because bit 3 means nothing without
     it. A catalogue built before gen-langs was run carries neither, and LANGS
     stays the list measured off the catalogue's own `lang` column - which is
     the right fallback: it is what this payload can actually answer. */
  if (Array.isArray(langs) && langs.length) LANGS = langs;
  const faceCache = new Map();
  /* One array per distinct COMBINATION of keywords, shared by every card that
     has it - 2,944 arrays for 107,347 printings, the same by-reference trick the
     oracle strings and the faces use. Split per card it would be 44,684 arrays
     of the same handful of strings. */
  const kwCache = kws.map(s => (s ? s.split('|') : EMPTY));
  return p.map(([oi, set, num, rar, art_id, usd, treat, fin, lang, art, flav, dfc, lmask]) => {
    const [n, cost, type, text, pt, col, cmc, layout, loy, faces, legal, meld, kw, rest] = o[oi];
    if (faces && !faceCache.has(oi)) faceCache.set(oi, faces.map(materialiseFace));
    /* Flavour is the one per-printing field that has to reach a FACE, and faces
       are shared by reference across every printing of an oracle - so a card
       whose faces carry their own flavour gets its own copies of them, and only
       that card. 866 printings of 107,347 pay for it; the rest keep the shared
       objects the comment above is about. */
    let fs = faces ? faceCache.get(oi) : null;
    if (fs && Array.isArray(flav)) fs = fs.map((x, k) => ({ ...x, flav: flavour[flav[k]] || '' }));
    // qty/foil are holdings, not catalogue: you own nothing until something says so
    return { n, set, num, rar, art_id, usd, col, cmc, type, text, pt, loy,
             // legal is a bitmask over FORMATS, fin one over FINISHES - both are
             // what the filter counts, and neither is a string per printing
             // both default to 0 = NOT RECORDED, never to a plausible value. An
             // older cards.json.gz without these fields reads as nine zeros and
             // three zeros, which looks like missing data because it is; `fin ?? 1`
             // read as "every printing is nonfoil", which looks like an answer
             legal: legal || 0, fin: fin || 0,
             /* Restricted is legal, at one copy - it rides in `legal` so the
                filter counts what you can play, and here so the card page can
                say which formats limit you to one. */
             rest: rest || 0,
             // the two anatomy facts, defaulted here so nothing downstream has to
             layout: layout || 'normal', treat: treat || 'framed',
             faces: fs,
             /* Both interned, both defaulting to '' - an empty collector credit
                and no italic block, which is what a card with neither looks
                like. `flav` is the CARD's, so it is empty whenever the faces
                carry their own; RulesPlate reads the face first. */
             art: artists[art] || '', flav: Array.isArray(flav) ? '' : flavour[flav] || '',
             // which mark the title bar carries and what it turns into; '' is
             // "no named indicator", which every ordinary DFC is
             dfc: dfc || '',
             // [result, partA, partB] - the group this card melds in, or null
             meld: meld || null,
             /* Scryfall's own keyword list for the card, shared by reference.
                Empty is the SAME array every time, so "has no keywords" costs
                one pointer rather than 62,663 empty arrays. */
             kw: kwCache[kw] || EMPTY,
             /* Read off the printing, not assumed. 2,634 of these are not English
                - Foreign Black Border, Rinascimento, Phyrexian, Quenya - and the
                identity key prints this beside the set and number, where a
                hardcoded 'en' read as a fact about the printing rather than a
                literal. 0 is the stored default for the 104,713 that are. */
             /* WHICH LANGUAGES THIS PRINTING EXISTS IN, as a mask over LANGS.
                0 is NOT KNOWN and is never "English only" - the two are
                different answers and the pip column draws them differently.
                Measured: 63,990 of 107,211 printings exist in more than one
                language, so `lang` above (the language this ROW was catalogued
                in) answers a different question and always did. */
             lmask: lmask || 0,
             cost: costTokens(cost), lang: lang || 'en', qty: 0, foil: 0 };
  });
};
// `seed` skips the fetch and takes the payload as given - how check.mjs, which has
// no network, exercises the catalogue paths the mocks can't reach
/* A SAVED DECK IS A SNAPSHOT, AND SNAPSHOTS GO STALE. localStorage keeps the
   card objects as they were when the draft was kept, so a deck saved before a
   field existed has no such field - and the sidebar duly reported that a Hobbit
   draft contained nothing Modern-legal, which is the same plausible-looking lie
   the hardcoded facet counts were. Prices drift the same way, more quietly.

   So the catalogue re-supplies them the moment it lands: matched on set and
   collector number, which is what identifies a printing. Anything it cannot
   match keeps the stored copy - a card from a set the catalogue no longer
   carries is still a card you drafted, and dropping it would be worse than
   letting it age. */
/* BOTH LISTS, not just decks. It was written when a deck was the only thing
   that could hold cards - a binder's membership was a predicate over the
   catalogue - and the import made binders the main thing that holds them. Left
   as it was, every imported binder kept whatever was in localStorage and never
   met the catalogue again: no prices, no faces, no rules text, and with the
   slimmed store, no card at all. */
function rehydrateDecks() {
  if (!CATALOGUE) return;
  const by = new Map(CATALOGUE.map(c => [`${c.set}/${c.num}`, c]));
  for (const d of [...LISTS.decks, ...LISTS.binders]) {
    if (!Array.isArray(d[4])) continue;
    d[4] = d[4].map(c => {
      const fresh = by.get(`${c.set}/${c.num}`);
      /* THE HOLDING IS YOURS, THE PRINTING IS THE CATALOGUE'S - and LANGUAGE is
         on the holding's side of that line, which it was not. It is a fact
         about the printing everywhere else in the app and correctly so, but the
         catalogue is built from `default-cards`: one row per printing,
         preferring English, so a Japanese copy of a card that also exists in
         English has NO row of its own to match. Matching on set/number alone
         and keeping only qty and foil rehydrated it to 'en' on every reload -
         measured, stored ja, came back en. The copy's own language now
         survives, and falls back to the printing's rather than to a literal. */
      return fresh ? { ...fresh, qty: c.qty ?? 0, foil: c.foil ?? 0, lang: c.lang || fresh.lang } : c;

}
async function loadCards(seed) {
  // a seed always wins, so a second one replaces the first - the guard below is
  // about not re-fetching, and a harness that could only seed once could not
  // test two different catalogues
  if (seed) { CATALOGUE = materialise(seed); rehydrateDecks(); render(); return; }
  if (CATALOGUE) return;
  if (typeof fetch !== 'function') return;
  try {
    const res = await fetch('cards.json.gz');
    if (!res.ok) return;                       // no catalogue generated yet; mocks stand
    CATALOGUE = materialise(await res.json());
    rehydrateDecks();
    render();
  } catch { /* offline is a supported state, not an error */ }
}
/* Two accessors, because they answer different questions. ALL is the catalogue -
   what a lookup or a count searches. CARDS is what a view may draw: every list
   here renders its whole input, which was free at 18 mocks and is a hung tab at
   107k printings, so the render path draws a PAGE of it and the count says so.
   `CARD_LIMIT` used to live here as a ceiling; it is `PAGE` now, and the
   difference is that reaching the end of a page asks for the next one. */
const ALL = () => (CATALOGUE && P.game === 'mtg') ? CATALOGUE : (CARD_ROWS[P.game] || CARD_ROWS.mtg);
/* What the current scope actually contains. Picking a set and being shown the
   first 240 cards of the catalogue is worse than showing mocks: the cards are
   real, so they read as that set's. The set case is a genuine filter - the
   printing carries its set code. Binders and decks have no membership stored
   anywhere, so they stay on the mocks rather than dress arbitrary catalogue
   cards up as their contents. A BINDER is the exception: it carries a rule
   (`BINDER_RULE`), so it can say which catalogue cards are its own. */
const scopedCards = () => {
  const mocks = CARD_ROWS[P.game] || CARD_ROWS.mtg;
  /* A CONTAINER HOLDS WHAT IS STORED ON IT - index 4, the shape a kept draft
     has always used, and now the shape an imported binder uses too. One branch
     for both tabs, because "a binder holds cards" and "a deck holds cards" were
     never two questions; they were two answers to one, and the binder's was a
     predicate over the catalogue standing in for a membership it did not have.
     Falls through to the mocks only where there is nothing picked, which is the
     empty-app state rather than a lie about a named container. */
  if (P.tab === 'decks' || P.tab === 'binders') return listRow()?.[4] || mocks;
  const all = ALL();
  // the fallback sample is a fixed dozen from a handful of sets, not a catalogue:
  // filtering it by the picked set empties the page instead of narrowing it
  if (all === mocks) return mocks;
  const r = P.tab === 'printings' && picked() ? setRow() : null;
  return r ? all.filter(c => c.set === r[1]) : all;
};
// sorted BEFORE the cap, or the order only rearranges the arbitrary first 240
/* THE FILTER FINALLY FILTERS. Everything above this line - the vocabulary, the
   counts, the tri-state styling - described a list that nothing ever narrowed:
   CARDS() sorted the scope and sliced it, and no term from the sidebar reached
   it. Memoised on the scope and the applied filter together, because a pass
   over 107k printings on every render is the one thing that would make clicking
   a chip feel worse than not having one. */
let FILTERED = null, FILTERED_OF = null, FILTERED_KEY = null;
const filtered = () => {
  const cards = scopedCards();
  const key = filterKey(P.filter);
  if (FILTERED_OF === cards && FILTERED_KEY === key) return FILTERED;
  FILTERED_OF = cards; FILTERED_KEY = key;
  FILTERED = filterOn() ? cards.filter(c => matchesFilter(c, P.filter)) : cards;

// A PAGE, NOT A CEILING: what is on screen now, extended as you reach the end
// of it until the whole filtered list is drawn. P.page is the only bound.
const CARDS = () => { const s = sortCards(filtered()); return s.length > P.page ? s.slice(0, P.page) : s; };

/* THE END OF THE LIST ASKS FOR MORE OF IT. A page is what is on screen, not a
   ceiling, so reaching the bottom of it draws the next page and keeps going
   until the whole filtered list is out. One sentinel and one observer rather
   than a scroll handler: the browser already knows when an element comes into
   view, and a scroll listener would run this arithmetic on every frame of every
   scroll on every page.

   observer would otherwise be watching a node no longer in the document, and
   the list would simply stop at 240 with no way to say why. */
let MORE = null;
/* NO DISPLAY CHOSEN IS NOT A LIST WITH AN END. A fresh page draws no cards at
   all - it asks which display you want - so a sentinel there sits on screen with
   nothing above it, comes into view immediately, and pages the entire filtered
   list in a tight render loop: 9,838 flying cards drawn in a second by a page
   nobody scrolled, and 107k if the filter is empty. There is nothing to reach
   the end of until something is drawn. */
const Sentinel = () => (!P.view || CARDS().length >= filtered().length ? ''
  : `<div data-more class="py-6 text-center text-[11px] text-neutral-600">${
      num(filtered().length - CARDS().length)} more &mdash; loading as you reach them</div>`);

  const el = document.querySelector?.('[data-more]');
  if (!el || typeof IntersectionObserver !== 'function') return;
  MORE = new IntersectionObserver((es) => {
    // guarded on the count rather than on a flag: a render that draws the same
    // page again must not step it twice
    if (!es.some(e => e.isIntersecting) || P.page >= filtered().length) return;
    P.page += PAGE;
    render();

  }, { root: el.closest('.overflow-y-auto') || null, rootMargin: '600px' });
  MORE.observe(el);
}


/* The same five plates the deleted MockCard.tsx drew, which is the anatomy of
   a real card: name+cost, art window, type line with the rarity symbol, rules
   and flavour, then the collector bar with power/toughness. Vector, font and one
   hotlinked art crop - the frame still draws without it, which is what the
   resolver needs and what a card with no printing gets.

   Grid, the card page and the kit all render THIS. A "mock card" that only the
   kit page uses is a mock of a mock. */
/* THE FRAME'S THREE SURFACES, MEASURED OFF PRINTED CARDS RATHER THAN RECALLED.
   Six printings per colour - all `normal | framed`, commons and uncommons, from
   expansion and core sets since 2015 - sampled off their own `large` scans and
   reduced by MEDIAN: the frame rail beside the art, the type bar, and the text
   box's left margin. Median rather than mean because a rail sample catches the
   odd bevel pixel and a box sample the odd letter.

   IT SETTLED TWO THINGS, AND THE DRAWN CARD HAD BOTH WRONG.

   THE TITLE BAR IS THE FRAME COLOUR. Every plate was `color-mix(45%, #000)` -
   the frame darkened by more than half - and a printed title bar is not darker
   than its frame at all: blue reads #5892cf on the rail and #6daaed on the bar,
   red #b04030 and #ba4334, white #d4c9a5 and #dad1ad. What separates it is an
   embossed EDGE, not tone, so it is a ring here and the tone matches.

   THE TYPE BAR AND THE TEXT BOX ARE PALE TINTS, on every colour INCLUDING
   black: a Swamp-frame card is #1f201c on the rail and #eae9ed in its text box.
   Darkening the frame for those two plates made every rules box in the app
   light-on-dark, which no printed Magic card is.

   Multicolour is `M` and it is measured too - #b29f69, a duller brass than the
   #cfa036 it replaces. Colourless is `C`, which is also the fallback: a colour
   this table does not know gets the artifact frame rather than an invented one. */
const SURFACE = {
  //     frame rail   type bar     text box
  W: ['#d4c9a5', '#f2f2e9', '#f5f6ef'],
  U: ['#5892cf', '#aec8e9', '#d8e6f3'],
  B: ['#1f201c', '#c3b5b2', '#eae9ed'],
  R: ['#b04030', '#efc6b4', '#eddacf'],
  G: ['#5d7f5b', '#c1cec9', '#d3e1d9'],
  C: ['#829ba6', '#cbcedc', '#d1dbe2'],
  M: ['#b29f69', '#c6b27e', '#e9ded9'],
};
// the rail is what "the frame colour" has always meant, so it stays a lookup of
// its own rather than every caller reaching for [0]
const FRAME = Object.fromEntries(Object.entries(SURFACE).map(([k, v]) => [k, v[0]]));
const PKM_FRAME = { Fire: '#e0762f', Water: '#3b7bc4', Grass: '#4caf50', Lightning: '#e5c62f',
  Psychic: '#a8567a', Fighting: '#b5573a', Colorless: '#9a9a9a', Darkness: '#4b4b52',
  Metal: '#8f9aa3', Dragon: '#6a5acd' };
const RARITY_DOT = { 1: '#3a3a3a', 2: '#c0c9d1', 3: '#d4af37', 4: '#f0713a', 5: '#a76fd1' };
/* Ink is measured, not declared. The real component keeps a DARK_FRAMES set of
   {B, Darkness, Dragon} and puts near-black on everything else - but every plate
   is 45% of the frame over black, so the blue, red and green plates are dark too
   and their names come out unreadable. Brightness of a 45%-over-black mix is 45%
   of the original, so both surfaces fall out of one function. */
const lum = h => { const n = parseInt(h.slice(1), 16);
  return (0.2126 * (n >> 16) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255; };
const ink = l => l > 0.5 ? '#1a1a1a' : '#f0f0f0';
// the dot is the same five tiers in both games; only the words differ
// Magic's tiers are RARITIES, which is what the filter chips and the sort key
// already read; writing them out again here is how the two come to disagree
const RARITY_NAME = { mtg: RARITIES.map(([n]) => n),
  pokemon: ['Common', 'Uncommon', 'Rare', 'Holo Rare', 'Illustration Rare'] };
const rarityName = r => (RARITY_NAME[P.game] || RARITY_NAME.mtg)[r - 1] || '';
// gold for multicolour, the colour itself for mono, grey for colourless - the
// same rule the real frame uses
const frameOf = c => c.energy ? (PKM_FRAME[c.energy] || FRAME.C)
  : !c.col ? FRAME.C : c.col.length > 1 ? FRAME.M : (FRAME[c.col] || FRAME.C);
const surfaceKey = col => !col ? 'C' : col.length > 1 ? 'M' : SURFACE[col] ? col : 'C';
// mixed here rather than in `color-mix`, because `lum` has to read the result to
// pick the ink and it cannot read a CSS expression
const mix = (a, b, t) => {
  const [A, B] = [parseInt(a.slice(1), 16), parseInt(b.slice(1), 16)];
  return '#' + [16, 8, 0].map(s => Math.round((A >> s & 255) * (1 - t) + (B >> s & 255) * t)
    .toString(16).padStart(2, '0')).join('');
};
/* WCAG contrast, because the ink needs a FLOOR and `lum` above is not one: it
   is a cheap brightness used to pick the better of two inks, and better is not
   the same as good enough. On the measured green frame - #5d7f5b, mid-toned,
   which is exactly what Magic's green frame is - the two inks are a dead tie at
   3.92:1 and 3.91:1, and the collector line printed on it is 0.73em. */
const CH = v => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; };
const relLum = (h) => { const n = parseInt(h.slice(1), 16);
  return 0.2126 * CH(n >> 16 & 255) + 0.7152 * CH(n >> 8 & 255) + 0.0722 * CH(n & 255); };
const contrast = (a, b) => { const [x, y] = [relLum(a), relLum(b)].sort((p, q) => q - p);
  return (x + 0.05) / (y + 0.05); };
/* One surface, its ink measured off it, and an OUTLINE where the measurement
   says the ink alone will not carry small text - which is what the printed card
   does on the same frames. Computed rather than a list of colours to except,
   because a list goes stale the next time the palette is measured and this does
   not: change a hex and the outline follows it.
   `background-color` and not the `background` shorthand, which would reset the
   background-IMAGE and take the mottle off every plate it is set on. */
const surface = (bg) => {
  const i = ink(lum(bg));
  return `background-color:${bg};color:${i}${contrast(i, bg) >= 4.5 ? ''
    : `;text-shadow:0 0 2px ${i === '#1a1a1a' ? '#ffffff' : '#000000'}`}`;
};
/* FOUR PLATES, NOT ONE, because a printed card does not use one. Written once
   and read by everything that draws a plate - the card, its back face, and the
   compact row - since two copies of this is how a green card comes to be one
   green on a card and a different green in the list.
     title  the frame colour, separated by the embossed edge the print has
     type   the pale tint measured off the type bar
     box    the paler tint measured off the text box
     foot   the frame again: the collector line is printed on the bottom rail
   `col` rather than `c.col` so a transform's BACK gets its own tints - the back
   of a card is routinely a different colour from its front, and the bg override
   was already carrying that while the tints would not have been. */
const plateOf = (c, bg = frameOf(c), col = c.col) => {
  // Pokémon has no measured table, so its two tints are derived from its own
  // frame rather than borrowed off a Magic colour that means nothing here
  const [type, box] = c.energy
    ? [mix(bg, '#ffffff', 0.55), mix(bg, '#ffffff', 0.78)]
    : SURFACE[surfaceKey(col)].slice(1);
  return { title: `${surface(bg)};box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)`,

};

/* ======================= CARD ANATOMY ==================================
   MockCard was written for the shape almost every card has: one name, one art
   window, one type line, one rules box. That is 85,145 of the catalogue's
   107,214 paper printings. The other 22,069 are a different SHAPE, and until
   `gen-cards.mjs` started carrying it they all arrived here claiming to be the
   first kind - a Saga, a split card, a transform and a full-art basic drew as
   the same rectangle with the back half of the card missing entirely.

   The shape is two independent facts, and they compose: layout × treatment is
   66 real classes, 51 of them with six or more printings. `#/anatomy` draws six
   of each, which is what that page is for.

   LAYOUT - how many faces there are and where they sit. Four cases matter,
   because they are the four that change the geometry rather than the words:

     PAIRED    two faces printed on ONE side: both readable without turning it.
     LANDSCAPE read with the card rotated ninety degrees.
     BANDED    a rules box that is a numbered sequence, not a paragraph.
   Everything not named below is single-faced and portrait - mutate, prototype,
   vanguard, host, augment and meld differ from a normal card in their RULES,
   not in their frame, so they need no case here and deliberately don't get one.

   TREATMENT - how the illustration relates to the frame. `framed` and
   `showcase` put it in a window; the rest do not, which is the "breakout art"
   problem: the art is no longer contained by the box the layout drew for it. */
// SIDED lives in anatomy.js - gen-art.mjs reads the same set to decide whether
// to fetch a second image, and a disagreement means asking for files it never wrote
const PAIRED = new Set(['split', 'adventure', 'flip', 'prepare']);
const LANDSCAPE = new Set(['planar', 'scheme', 'split']);
const BANDED = new Set(['saga', 'class', 'leveler']);

const OVERLAID = new Set(['fullart', 'textless']);
/* EXTENDED ART IS NOT A FULL-ART CARD, and drawing it as one is what put its
   type line in the middle of the illustration. It was in OVERLAID, so the art
   became the whole card and the plates floated on it with a spacer pushing them
   into the bottom half - which leaves the type bar hanging in open art with
   nothing to sit against, because an overlaid card has no base to its art.
   The printed article is an ordinary frame whose ILLUSTRATION runs out to the
   left and right edges: title at the top, art below it, type line at the base
   of the art, an opaque text box under that. Only the side rails are missing.
   The crop agrees, which is the part worth knowing: an extended-art `art_crop`
   is **1.62** wide against an ordinary printing's 1.36-1.37, measured over six

   the crop's own shape lands the type line where the print puts it without a
   number being chosen for it. */
const BLEED = new Set(['extendedart']);
// a class is layout x treatment, and it is the unit everything about the shape
// of a card is decided on - the anatomy page's rows, and UNALIGNED below
const anatomyKey = c => `${c.layout || 'normal'} | ${c.treat || 'framed'}`;
/* A CLASS THE FRAME CANNOT DRAW, DECLARED RATHER THAN NUDGED. When a printing
   comes out misaligned the tempting fix is a per-class offset - a negative
   margin here, a percentage there. That is a hardcoded alignment for a class
   whose art is NOT uniform: right for the six printings it was tuned against
   and wrong for the rest, and invisible either way because nothing on the page
   compares the two. Extended art was exactly that until this week.
   The rule instead: a class the shared geometry cannot draw is not drawn at
   all. Name it here and the app pulls the complete printed card for it, which
   cannot be misaligned because it IS the card - the same path an art-series
   printing already takes for the same reason.

   FULLART IS THE FIRST ENTRY, and it was decided by looking at #/card's Align
   display rather than by argument, which is what that display is for. Drawn, a
   full-art card gets opaque plates at fixed positions over the illustration.
   Printed, it has a translucent title bar, an ornate border, a text panel of a
   different shape, and on a full-art land almost no furniture at all - placed
   per card, per set, per promo. Checked over six samples of `normal | fullart`
   and again down the twelve printings of Laboratory Maniac: not one matched.
   That is exactly "too custom to represent programmatically", so 6,085
   printings stop being invented and start being shown.

   normal, token, transform, saga, split, meld, adventure, leveler, emblem,
   class, mutate, modal_dfc, prototype, double_faced_token - and listing all
   fourteen would be a list to keep in step with the catalogue rather than a
   decision. Where the reason is the treatment, name the treatment; where it is
   one layout's version of it, name the class.

   TEXTLESS IS THE SECOND, on the evidence the anatomy page had already
   gathered and that was offered twice before it was taken. 225 printings, and
   the name is the only thing about them that is uniform: SLD 1471 Mountain
   prints as a Windows-95 joke frame, P09 Cryptic Command as an oval-window
   promo. That is per-card furniture chosen by the printer, which is the exact
   argument that pulled fullart, and it was the last treatment still drawn as an
   overlay now extendedart has been re-flowed back into an ordinary frame.

const UNALIGNED = new Set(['fullart', 'textless']);
const unaligned = c => UNALIGNED.has(c.treat || 'framed') || UNALIGNED.has(anatomyKey(c));
// the face list only matters when there are two of them to draw
const twoFaced = c => (c.faces?.length > 1 ? c.faces : null);
const faceAt = (c, i) => c.faces?.[i] || c;
/* AN AFTERMATH CARD IS A SPLIT THAT IS NOT TURNED. Amonkhet's are `layout:

   upright across the top and the second is rotated ninety degrees below it, so
   you turn the card to read it rather than reading two halves side by side.
   Drawn as an ordinary split they came out landscape and the wrong shape.

   Scryfall does not give them a layout of their own - the tell is `keywords`
   containing "Aftermath" - and that field is not in cards.json.gz. It does not
   need to be: the keyword's own reminder text opens the back face's rules
   ("Aftermath (Cast this spell only from your graveyard...)"), so the fact is
   already in the catalogue and this costs nothing to know. Checked against the
   134 distinct split cards: 27 match, which is every one of them. */
const AFTERMATH = /^Aftermath \(/;
const aftermath = c => c.layout === 'split' && AFTERMATH.test(faceAt(c, 1).text || '');

/* NOT EVERY PRINTING IS A CARD A FRAME CAN DESCRIBE, and the rule for that is
   in anatomy.js because gen-art.mjs needs the same answer: a printing drawn as
   a whole scan needs the whole-card image fetched, not the art crop. All this
   adds is the page's own shape - a materialised card, one face or several. */
const framable = c => framableFaces(twoFaced(c) || [c]);

/* Hotlinked by default, never stored - that is what Scryfall asks for, and it

   it drops straight into the art window.

   the back off the SAME id with /back/ in place of /front/, so the back of a
   transform is one character away from its front.

   Local is `gen-art.mjs`'s output and the same fall-through the pack art
   already uses - a file that was never fetched degrades to the CDN rather than
   to a broken image, so an un-run download costs nothing but the request.
