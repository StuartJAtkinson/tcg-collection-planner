/* ======================= CARD ANATOMY ==================================
   Six of every shape of card there is, so "does the frame hold" is a thing you
   can LOOK AT rather than reason about. It is the same argument as the control
   kit one page down - a mock only the kit renders is a mock of a mock - applied
   to the half of the catalogue the mock rows never covered.

   The classes are counted off the real catalogue, not listed here. A hand-typed
   list of layouts is a list that silently stops matching the data the first
   time Wizards prints something new, and they do: `prepare` and `case` are both
   younger than this app, and neither needed a code change to appear below. */
const ANATOMY_SAMPLES = 6;
// anatomyKey lives with SIDED/PAIRED/OVERLAID - the class is the unit those
// sets are keyed on, and UNALIGNED needs it long before this page does
let ANATOMY = null, ANATOMY_OF = null;
const anatomyClasses = () => {
  const all = ALL();
  if (ANATOMY_OF === all) return ANATOMY;      // one pass per catalogue, not per render
  const total = new Map();
  for (const c of all) total.set(anatomyKey(c), (total.get(anatomyKey(c)) || 0) + 1);
  /* The six are STRIDED across the class, not taken off the front. The
     catalogue arrives in Scryfall's bulk order, which is near enough set order,
     so the first six of anything are six cards from one set printed the same
     week - which is the one sample that cannot show you whether the frame
     survives the range. Every (n/6)th printing spans it instead. */
  const seen = new Map(), out = new Map();
  for (const c of all) {
    const k = anatomyKey(c), n = total.get(k), i = seen.get(k) || 0;
    seen.set(k, i + 1);
    if (!out.has(k)) out.set(k, { k, n, s: [], nf: 0, layout: c.layout || 'normal', treat: c.treat || 'framed' });
    const e = out.get(k);
    if (!framable(c)) e.nf++;                    // how much of the class has no frame to draw
    if (e.s.length < ANATOMY_SAMPLES && i >= Math.floor(e.s.length * n / ANATOMY_SAMPLES)) e.s.push(c);
  }
  ANATOMY_OF = all;
  ANATOMY = [...out.values()].sort((a, b) => b.n - a.n);
  return ANATOMY;
};

/* What each class is SUPPOSED to look like, so a wrong render is recognisable
   as wrong. Without this the page is 51 rows of cards and no way to tell a
   layout that is drawing correctly from one that is drawing plausibly. */
const LAYOUT_NOTE = {
  // the layout is how many faces there are and where they sit; whether the art
  // is in a window is the TREATMENT's half of the line, and it said so twice -
  // "one face, art in a window · art is the whole card" on every full-art normal
  normal: 'one face, nothing unusual about its shape',
  token: 'no mana cost, no collector rarity to speak of',
  art_series: 'two sides, both of them art - the back is the signed print',
  front_card: 'a Jumpstart theme divider: a name, a picture and a colour',
  transform: 'two sides, turn it over; the back is often a different colour',
  modal_dfc: 'two sides, either one castable - neither is "the back"',
  double_faced_token: 'two sides, both tokens',
  reversible_card: 'two sides of the same card, printed twice',
  saga: 'a numbered chapter track instead of a paragraph',
  class: 'levels you pay to unlock, banded down the box',
  leveler: 'three stat bands, one per level',
  planar: 'read sideways - a plane, not a card you cast',
  scheme: 'read sideways - an Archenemy scheme',
  split: 'two half-cards side by side, read sideways',
  adventure: 'the rules box halved: the adventure on the left',
  prepare: 'same shape as an adventure - a newer name for it',
  flip: 'the second face is the same card upside down',
  meld: 'a half of a bigger card; the other half is a different printing',
  emblem: 'no cost, no type line worth the name',
  mutate: 'ordinary frame, the mutate cost is in the rules',
  prototype: 'ordinary frame, a second smaller cost in the rules',
  vanguard: 'no cost; hand and life modifiers instead of P/T',
  host: 'an Unstable host half',
  augment: 'an Unstable augment half - the name is deliberately unfinished',
  case: 'ordinary frame, three-part rules',
};
const TREAT_NOTE = {
  framed: 'art inside its window',
  showcase: 'an alternate frame, same anatomy',
  extendedart: 'art is the whole card and the text sits on top of it',
  borderless: 'no black edge at all',
  fullart: 'art is the whole card and the text sits on top of it',
  textless: 'art is the whole card and there is no rules box',
};

/* COMPARE MODE - the drawn card beside the printed one, at the same width.
   Judging "does this render well" against nothing is judging it against memory,
   and memory is generous. Side by side, an orientation that is ninety degrees
   out or a plate in the wrong third of the card is obvious at a glance.

   The printed card is `normal` (488x680, the whole card) while the art window
   is `art_crop` (the illustration alone) - two different sizes of the same id,
   needed at the same time, which is why artUrl takes an explicit one.

   A two-sided card is shown a SIDE AT A TIME rather than with a flip: two
   flips that have to be kept in step is a comparison that silently goes out of
   step. `MockCard`'s third argument opens it on the matching face. */
/* THE SCAN IS NORMALISED AND THE CARD IS NOT. Every Scryfall image is 488x680
   portrait - measured, all 24 layouts - which means a Plane, a Scheme and a
   split card, all of which you physically turn sideways to read, are served as
   that landscape card ROTATED INTO a portrait frame. Put one beside a landscape
   render and it looks like the render got the orientation wrong; it is the scan
   that is turned, and this rotates it back so the two are actually comparable.

   The numbers fall out rather than being tuned: rotated, the image's visual
   width is its unrotated HEIGHT, so to fill a container of width W it needs an
   unrotated width of W x 488/680 = 71.8%. The resulting 680/488 = 1.393 is what
   `aspect-[7/5]` (1.4) was already drawing. */
/* `q` because the two callers want different pulls: the anatomy page compares 66
   classes at once and `normal` is plenty, while Align art is looking at ONE
   card to decide whether a whole class can be drawn, and a 488px scan is not
   enough pixels to answer that. */
const ScanImage = (c, i, q = 'normal') => LANDSCAPE.has(c.layout)
  ? `<div class="relative aspect-[7/5] w-full">
       <img src="${artUrl(c, i, q)}" loading="lazy"${artAttrs(c, i, q)} alt=""
         class="absolute left-1/2 top-1/2 w-[71.8%] -translate-x-1/2 -translate-y-1/2 rotate-90 rounded-lg shadow-lg"></div>`
  : `<img src="${artUrl(c, i, q)}" loading="lazy"${artAttrs(c, i, q)} alt=""
       class="w-full rounded-lg shadow-lg">`;
const AnatomyPair = (c, i) => `
  <div class="flex min-w-0 gap-2">
    <div class="min-w-0 flex-1">${MockCard(c, false, i)}</div>
    <div class="min-w-0 flex-1">${ScanImage(c, i)}</div>
  </div>`;
const AnatomySample = (c) => {
  // comparing a scan against itself: an unframable printing IS its scan, so a
  // pair would be the same image twice
  if (!P.compare || !framable(c)) return MockCard(c);
  // every face gets its own pair: one for a single-sided card, two for a card
  // you physically turn over. PAIRED layouts are one physical side, so one pair.
  const sides = SIDED.has(c.layout) && twoFaced(c) ? [0, 1] : [0];
  return sides.map(i => AnatomyPair(c, i)).join('<div class="h-2"></div>');
};
const setCompare = v => { P.compare = v; render(); };

PAGES.anatomy = () => {
  const classes = anatomyClasses();
  const live = CATALOGUE && P.game === 'mtg';
  const six = classes.filter(c => c.n >= ANATOMY_SAMPLES).length;
  return Frame('anatomy', {
    desc: `<span class="text-neutral-200">Card anatomy.</span> Every distinct shape of card in the catalogue, ${
      ANATOMY_SAMPLES} printings of each. A class is <span class="text-neutral-300">layout &times; treatment</span> &mdash;
      how many faces there are and where they sit, crossed with how the illustration relates to the frame.
      Both are read off the source per printing; neither is inferred here.`,
    body: `
    <div class="${PANEL} mb-4 px-4 py-3 text-xs text-neutral-400">
      ${live ? `<p><span class="font-mono text-neutral-200">${classes.length}</span> classes over
        <span class="font-mono text-neutral-200">${num(ALL().length)}</span> printings &mdash;
        <span class="font-mono text-neutral-200">${six}</span> of them have ${ANATOMY_SAMPLES} printings or more,
        the rest show every printing they have.</p>`
        : `<p class="text-amber-400/90">The catalogue has not loaded, so this is the ${classes.length}-class
           view of the mock rows. Run <code>node gen-cards.mjs</code> and reload for the real ${'≈'}66.</p>`}
      <p class="mt-1.5 text-[11px] text-neutral-600">A card with two sides draws both and shows one &mdash;
        the <span class="text-neutral-400">&#8635;</span> in its top corner turns it over. Cards are strided across
        their class, not taken off the front, so six samples are six different sets rather than six from one.</p>
      <div class="mt-2 flex flex-wrap items-center gap-2">
        <span class="text-xs text-neutral-400">Show</span>
        <span onclick="setCompare(false)">${chip('drawn only', P.compare ? '' : '+')}</span>
        <span onclick="setCompare(true)">${chip('beside the printed card', P.compare ? '+' : '')}</span>
        <span class="text-[11px] text-neutral-600">${P.compare
          ? 'Left is this app, right is Scryfall&rsquo;s scan of the same printing. A two-sided card is shown a side at a time, both pairs stacked.'
          : `Needs the whole-card images: <code>node gen-art.mjs normal --anatomy</code> &mdash; 411 files, 41 MB.`}</span>
      </div>
    </div>
    ${classes.map(a => `
      <section class="${PANEL} mb-3 px-4 py-3">
        <div class="mb-2 flex flex-wrap items-baseline gap-x-3 gap-y-1">
          <span class="font-mono text-sm font-semibold text-neutral-100">${a.layout}</span>
          <span class="text-neutral-700">&times;</span>
          <span class="font-mono text-sm ${a.treat === 'framed' ? 'text-neutral-400' : 'text-sky-300'}">${a.treat}</span>
          <span class="text-xs tabular-nums text-neutral-500">${num(a.n)} printing${a.n === 1 ? '' : 's'}</span>
          ${a.s.length < ANATOMY_SAMPLES
            ? `<span class="text-[10px] text-amber-500/80">only ${a.s.length} exist${a.s.length === 1 ? 's' : ''}</span>` : ''}
          <!-- Said on the class because it is a property OF the class, not a
               fault in the render: these printings carry no cost, no type line
               and no rules, so there is nothing a frame could put in them. -->
          ${!a.nf ? '' : `<span class="rounded bg-fuchsia-500/15 px-1.5 py-0.5 text-[10px] text-fuchsia-300">${
            a.nf === a.n ? 'no frame to draw' : `${num(a.nf)} of ${num(a.n)} have no frame to draw`
            } &mdash; printed card shown</span>`}
        </div>
        <p class="mb-2.5 text-[11px] text-neutral-500">${LAYOUT_NOTE[a.layout] || 'no note written for this layout yet'}
          <span class="text-neutral-700"> &middot; </span>${TREAT_NOTE[a.treat] || a.treat}</p>
        <!-- GRID, not an interpolated grid-template-columns: build.mjs scans this
             file as TEXT, so a class name assembled at runtime is a class Tailwind
             never sees and never emits. Every arbitrary value on this page is a
             literal for that reason. -->
        <div class="grid gap-3 ${P.compare ? GRID[3] : GRID[ANATOMY_SAMPLES]}">
          ${a.s.map(c => `<div>
            ${AnatomySample(c)}
            <div class="mt-1 truncate text-[10px] text-neutral-600" title="${jsArg(c.n)}">${
              c.set} ${c.num} &middot; ${esc(c.n)}</div></div>`).join('')}
        </div>
      </section>`).join('')}`,
  });
};

/* ---- control kit ------------------------------------------------------ */
PAGES.kit = () => Frame('kit', {
  desc: '<span class="text-neutral-200">Control kit.</span> Every control, once &mdash; this page is where the tokens are defined, not a copy of them. FIELD and PANEL are the two the repo hand-rolls and has no token for.',
  body: `<div class="${PANEL} px-4 py-4">
    ${SectionHeader('Chips')}<div class="mb-5 flex gap-1.5">${chip('Neutral','')}${chip('Include','+')}${chip('Exclude','-')}${chip('With count','',count(42))}</div>
    ${SectionHeader('Buttons')}<div class="mb-5 flex gap-1.5"><button class="${BTN_PRIMARY}">Primary</button>
      <button class="${BTN_SECONDARY}">Secondary</button><button class="${BTN_DANGER}">Danger</button></div>
    ${SectionHeader('Sort row, with break')}<div class="mb-5">${SortRow()}</div>
    ${SectionHeader('Identity row')}<div class="mb-5 max-w-3xl rounded-lg border border-neutral-800">${CARDS().slice(0, 3).map(c => KeyRow(c)).join('')}</div>
    ${SectionHeader('Card frame')}<div class="mb-1 grid gap-3 [grid-template-columns:repeat(auto-fill,minmax(224px,1fr))]">${
      CARDS().slice(0, 6).map(c => MockCard(c)).join('')}</div>
    <p class="mb-5 text-[11px] text-neutral-600">The same component the grid, the card page and the binder draw &mdash; a mock only the kit renders is a mock of a mock. Ink is picked from the plate&rsquo;s luminance, so no frame colour has to be listed as &ldquo;dark&rdquo;.</p>
    ${SectionHeader('Fields')}<div class="mb-5 max-w-md">${RangeField('Range', 2, 5)}${NumberField('Number', 60, 'cards')}
      <input class="${FIELD} w-full" placeholder="Text field"></div>
    ${SectionHeader('Completion bar')}<div class="mb-5 flex max-w-md items-center gap-3">${CompletionBar(62, 84)}
      <span class="text-xs text-neutral-400">62%</span></div>
    ${SectionHeader('Colours')}<div class="mb-2 flex gap-1.5">${['W','U','B','R','G','C'].map(c => pips(c)).join('')}</div>
    <p class="text-[11px] text-neutral-600">Validated for colour-vision deficiency against the dark surface; every swatch carries its letter.</p>
  </div>`,
});

/* ---- router ---------------------------------------------------------- */

/* ======================= THE CARD ======================================
   A card page has to work BEFORE the card is known. An import - a decklist, a
   scanned shelf, a line someone typed - is flat text, and until it's matched to
   a printing the only facts are the ones in that line. So this page has two
   states and the same layout in both: unmatched shows what was parsed and what
   is therefore still unknown; matched fills the anatomy in. Nothing moves
   between the two, so you can see exactly what matching bought you.

   The anatomy fields come from the game registry, not from this page - the
   card view of a new TCG is data, the same as its filter. */
/* Every fact below is read off the card that was opened, not out of a table
   keyed by game: a page that says "Noble Hierarch, Human Druid" no matter which
   card you clicked is a picture of a card page, not a card page. Legality is the
   only fact the fixtures can't carry. */
/* THE FORMATS THIS CARD IS ACTUALLY LEGAL IN, off the same bitmask the filter
   counts. The card page printed one fixed string - "Modern · Legacy · Vintage ·
   Commander" - for every Magic card in the catalogue, which is right for **11,405
   of 107,347** and wrong for the other 89%: there are 63 real combinations, the
   commonest being Pioneer through Historic (17,398), and **9,222 cards are legal
   in nothing tracked at all** - tokens, art series, un-cards. A page that says
   otherwise is contradicting the filter one band above it, which has been reading
   the real bits since the day they were added.

   The string stays for the mocks alone, which carry no bitmask: an absent field
   is not the same as a card legal in nothing, and 0 must keep meaning nothing. */
const LEGALITY = { mtg: 'Modern &middot; Legacy &middot; Vintage &middot; Commander', pokemon: 'Unlimited' };
const legalIn = c => (c.legal === undefined
  ? LEGALITY[cardKey()]
  : FORMATS.filter((_, i) => c.legal & (1 << i))
      .map((f, i) => f + (c.rest & (1 << FORMATS.indexOf(f)) ? ' <span class="text-amber-400/80">(restricted)</span>' : ''))
      .join(' &middot; '));
// a holding is foil or it is not, so this is the first two of FINISHES rather
// than a second spelling of them - Etched is a printing's third finish, never a
// flag's second state
const FINISH = { mtg: FINISHES.slice(0, 2), pokemon: ['Normal', 'Holofoil'] };
const PKM_SETS = { BS: 'Base Set', PGO: 'Pok&eacute;mon GO', SVI: 'Scarlet &amp; Violet', BRS: 'Brilliant Stars' };

const setName = code => PKM_SETS[code] || (SETS.find(r => r[1] === code) || [])[0] || code;
/* TWO DIFFERENT QUESTIONS, AND THEY WERE ANSWERED WITH ONE FUNCTION. `finishOf`
   is a HOLDING's: the copy in your binder is foil or it is not, and `foil` is the
   flag that says so. A PRINTING's finishes are the ones it was printed in, which
   is the `fin` bitmask off the catalogue - a printing can be nonfoil AND foil,
   53,325 of them are, and 12,396 are foil-ONLY.

   Reading the holding's flag for a printing said "Nonfoil" for all 12,396 of
   those, including the Secret Lair Sol Ring in the screenshot of the very band
   that was reporting it. The flag is 0 on every catalogue row, so it could not
   have said anything else. */
const finishOf = c => FINISH[cardKey()][c.foil ? 1 : 0];
const finishesOf = c => (c.fin
  ? FINISHES.filter((_, i) => c.fin & (1 << i)).join(' &middot; ')
  : c.foil == null ? '' : finishOf(c));
const factsOf = c => {
  const [head, sub] = (c.type || '').split(' &mdash; ');
  const [pow, tou] = (c.pt || '').split('/');
  return {
    Legality: legalIn(c), Colour: c.col, Language: c.lang, Rarity: rarityName(c.rar),
    Artist: c.art, Illustrator: c.art, Finish: finishesOf(c),
    // the type line's subtypes are space-separated on the card, one fact each here
    'Mana value': c.cost ? String(manaValue(c)) : '', Type: c.energy || head, Subtype: (sub || '').split(' ').join(' &middot; '),
    // the card's own list; the mocks have none, so this is blank rather than
    // whichever of four hand-picked words happened to appear in their text
    Keywords: (c.kw || []).join(' &middot; '),
    Power: pow, Toughness: tou, HP: c.hp || '', 'Retreat cost': c.retreat ? String(c.retreat) : '',
    'Card type': !head ? '' : /Trainer/.test(head) ? 'Trainer' : /Energy/.test(head) ? 'Energy' : 'Pok&eacute;mon',
    Stage: (head.match(/Basic|Stage 1|Stage 2/) || [''])[0] + (/ ex$/.test(head) ? ' ex' : / V$/.test(head) ? ' V' : ''),
  };
};
const flatTokens = c => [['qty', c.qty || 1], ['name', c.n], c.set && ['set', c.set],
  c.num && ['number', c.num], c.foil && ['finish', 'foil'], c.lang && ['language', c.lang]].filter(Boolean);
const flatLine = c => `${c.qty || 1} ${c.n}${c.set ? ` (${c.set})` : ''}${c.num ? ` ${c.num}` : ''}${
  c.foil ? ' *F*' : ''}${c.lang ? ` [${c.lang}]` : ''}`;
// the printings the flat line could mean - same name, different identity key,
// which is why matching is a choice and not a lookup
/* EVERY PRINTING OF THE CARD, OUT OF THE CATALOGUE. This was four invented rows
   - the same set in another language, the opposite finish at a made-up multiple
   of the price, and a hardcoded reprint - under a heading that said "every
   printing of this card". The catalogue has had the real ones all along: a name
   is 1 to 864 rows in it, and inventing four was both wrong and smaller than the
   truth for 1,077 cards.

   Sorted the way the collection is filed - release, set, collector number - so a
   card's printings read as its history. Memoised on the name because it is a
   scan of 107k rows and the page redraws on every click. */
const printKey = c => `${c.set}/${c.num}/${c.lang || 'en'}`;
let PRINTS = null, PRINTS_OF = null, PRINTS_NAME = null;
const printingsOf = (name) => {
  const all = ALL();
  if (PRINTS_OF === all && PRINTS_NAME === name) return PRINTS;
  const order = c => `${SORT_KEY.release(c)}|${SORT_KEY.set(c)}|${numKey(c)}`;
  PRINTS_OF = all; PRINTS_NAME = name;
  PRINTS = all.filter(c => c.n === name)
    .sort((a, b) => (order(a) < order(b) ? -1 : order(a) > order(b) ? 1 : 0));
  return PRINTS;
};
/* YOUR COPIES, AND ONLY THE ONES THAT EXIST. This invented two rows - a binder
   called "Alara block" and a deck called "Bant Exalted" - for every card in the
   catalogue, so a card you have never owned reported two copies in places that
   do not exist.

   The one membership this app actually knows is a deck kept from a draft: the
   pool rides on the deck row at index 4. Binders have none stored anywhere, so
   they cannot be searched and are not guessed at. Matched on the PRINTING, not
   the name - a foil Alpha and a Commander reprint are different things to own,
   which is what the identity key is for - and grouped by deck so one row is one
   place holding n copies. */
/* WHERE EVERY COPY OF THIS PRINTING IS, keyed by the printing rather than by
   the card. `heldOf` answers "which containers hold this NAME", which is what a
   separate Holdings band needed; the printings list needs the other cut - for
   THIS row, how many and where - because the row is already the printing. */
const heldByPrint = (name) => {
  const by = new Map();
  for (const [kind, where, c] of heldOf(name)) {
    const k = printKey(c);
    if (!by.has(k)) by.set(k, { qty: 0, at: [] });
    const e = by.get(k);
    e.qty += c.qty || 0;
    e.at.push(`${kind} ${where}`);
  }
  return by;
};
const heldOf = (name) => {
  const out = [];
  /* BOTH LISTS, because both hold cards the same way now. This searched decks
     alone and said so - "binders have no membership stored anywhere, so they are
     not searched rather than guessed at" - which was true while a binder's
     contents were a predicate over the catalogue. Membership is index 4 on
     either, so a copy in a binder is a copy you own and was going unreported. */
  for (const [kind, list] of [['binder', LISTS.binders], ['deck', LISTS.decks]]) {
    for (const d of list) {
      const pool = Array.isArray(d[4]) ? d[4] : null;
      if (!pool) continue;
      const by = new Map();
      for (const c of pool) {
        if (c.n !== name) continue;
        const k = `${printKey(c)}/${c.foil ? 'f' : ''}`;
        const at = by.get(k);
        if (at) at.qty = (at.qty || 1) + (c.qty || 1);
        else by.set(k, { ...c, qty: c.qty || 1 });
      }
      for (const c of by.values()) out.push([kind, d[0], c]);
    }
  }
  return out;
};

/* OPENED FROM THE CATALOGUE MEANS MATCHED, and that this said otherwise was the
   bug behind a page of em dashes: clicking a real printing in a real list landed
   on "unmatched - everything unknown until this line is matched", which is the
   IMPORT story told about a card that was never imported. That story is still
   here and still true of a flat line; it is reached by the Unmatch button now,
   rather than by looking at a card.

   `key` is which printing you clicked, so opening Sol Ring from a list of 131
   lands on the one you were looking at rather than the oldest. */
function openCard(name, key) {
  P.card = name; P.print = key || null; P.matched = true;
  location.hash = '#/card'; render();
}
function pickPrinting(key) { P.print = key; render(); }
function setMatched(v) { P.matched = v; render(); }

const cardKey = () => (P.game === 'pokemon' ? 'pokemon' : 'mtg');
// the whole catalogue, not the rendered slice: opening a card by name has to
// find it whether or not a list happened to draw it
/* The printing you picked, else the card's earliest - never "whichever the
   catalogue happened to list first", which is payload order and reads as random
   when a name has 864 of them. */
const openedCard = () => {
  const ps = printingsOf(P.card);
  return (P.print && ps.find(c => printKey(c) === P.print)) || ps[0] || ALL()[0];
};
const cardName = () => openedCard().n;

const Fact = (label, value, known) => `
  <div class="flex items-baseline gap-2 border-b border-neutral-900 py-1">
    <span class="w-28 shrink-0 text-[11px] font-semibold uppercase tracking-wide text-neutral-500">${label}</span>
    <span class="min-w-0 flex-1 text-sm ${known ? 'text-neutral-200' : 'text-neutral-700'}">${value}</span></div>`;

const CardFacts = () => {
  const facts = factsOf(openedCard());
  return game().anatomy.map(x => {
    const label = x[0] === 'combos' ? 'Colour' : x[1];
    const raw = facts[label];
    if (!P.matched) return Fact(label, '&mdash;', false);
    return Fact(label, label === 'Colour' ? `<span class="flex gap-0.5">${pips(raw)}</span>` : (raw || '&mdash;'), !!raw);
  }).join('');
};

const FlatSource = () => { const toks = flatTokens(openedCard()); return `
  <div class="${PANEL} p-3">
    <div class="mb-2 flex items-baseline gap-2">
      <span class="text-[11px] font-semibold uppercase tracking-wide text-neutral-500">Source line</span>
      <span class="text-[10px] text-neutral-600">as imported, never rewritten</span></div>
    <code class="block rounded bg-neutral-950 px-2 py-1.5 font-mono text-xs text-neutral-300">${flatLine(openedCard())}</code>
    <div class="mt-2 flex flex-wrap gap-1.5">
      ${toks.map(([k, v]) => `
        <span class="${CHIP_NEUTRAL} gap-1"><span class="text-[10px] uppercase tracking-wide text-neutral-600">${k}</span>${v}</span>`).join('')}
    </div>
    <p class="mt-2 text-[11px] text-neutral-500">${P.matched
      ? 'Matched. Everything else on this page comes from the catalogue, not from the line.'
      : `${toks.length} facts, and none of them is the card. Everything else stays unknown until this line is matched to a printing.`}</p>
  </div>`; };

/* Scrolls rather than truncates: a name is 1 to 864 printings and the five basic
   lands are all over 800, so "the first ten and a count" would hide the whole
   question on exactly the cards that have most of it. */
/* THE PRINTINGS ARE A LIST OF CARDS, so they get the list's three displays -
   the same switch, the same renderers, the same qty column. It was a bespoke
   table of its own with hand-picked columns, which is how a page comes to
   disagree with the rest of the app about what a card looks like; the holdings
   band directly beneath it had already been converted and the two sat there
   contradicting each other.
   Clicking a row is `openCard(name, key)`, which on this page IS pickPrinting:
   same name, new printing, same route. So the ordinary card renderers need no
   card-page special case to be clickable here. */
/* THE HOLDINGS BAND IS GONE, FOLDED IN HERE. It was a second list of the same
   cards under the same page - "your copies" - from back when the printings list
   had no quantity column and could not answer the question. Qty is a column
   everywhere now, so the band was the same answer given twice, and the two could
   disagree.
   What the band carried that a Qty column does not is WHERE the copy is, so the
   row carries that: a printing you hold names its containers. And the rows are
   DECORATED with your real quantities first, which is what made the band look
   necessary - `printingsOf` hands back catalogue rows, and a catalogue row's qty
   is 0 by construction, so the Qty column read "none" on a card sitting in your
   binder. */
const Candidates = () => {
  const here = printKey(openedCard());
  const held = heldByPrint(P.card);
  const mark = (c) => {
    if (!P.matched) return `<button onclick="event.stopPropagation();setMatched(true);pickPrinting('${jsArg(printKey(c))}')"
      class="${BTN_SECONDARY} shrink-0">Match</button>`;
    const h = held.get(printKey(c));
    /* FIXED WIDTH, ALWAYS DRAWN - this is a COLUMN, and it was neither. The
       container name was rendered only on rows you hold and sized to whatever
       it said, so the marker was a different width on every row; the row's card
       cell is `flex-1`, so it took what was left and every column inside it
       landed somewhere else. A held row visibly shunted its own
       type/rarity/qty/price out of line with the rows above it. */
    return `<span class="flex shrink-0 items-baseline gap-2">
      <span class="w-28 shrink-0 truncate text-[10px] text-neutral-400" title="${
        h ? jsArg(h.at.join(', ')) : 'Where your copies are'}">${h ? h.at.join(', ') : ''}</span>
      <span class="w-16 shrink-0 text-right text-xs font-medium ${
        printKey(c) === here ? 'text-emerald-400' : 'text-neutral-800'}">${printKey(c) === here ? 'showing' : ''}</span></span>`;
  };
  // taller for the two that draw cards: 26rem of card is a row and a half,
  // where it is a dozen rows
  const tall = P.prints === 'grid' || P.prints === 'align';
  // your quantity, on the catalogue row, before anything draws it
  const rows = printingsOf(P.card).map(c => (held.has(printKey(c))
    ? { ...c, qty: held.get(printKey(c)).qty } : c));
  return `<div data-scroll="printings" class="${tall ? 'max-h-[44rem]' : 'max-h-[26rem]'} overflow-y-auto">${
    BandList(rows, P.prints, mark, c => printKey(c) === here)}</div>`;
};

/* MELD, and the honest thing to say about it. The other two anatomy relations
   are turns - one card, two sides, a flip control - and this is not one: two
   cards are exiled and become a THIRD, whose printed back spans both of them.
   So there is no "other side" to show, and offering the result as one would be
   a lie; what the card needs is to name the group and let you walk to it.
   `openCard` already does the walking, so this is three names and two links. */
const MeldBand = () => {
  const c = openedCard();
  if (!c.meld) return '';
  const [result, ...parts] = c.meld;
  const link = n => `<a onclick="openCard('${jsArg(n)}')"
    class="cursor-pointer font-medium text-neutral-200 underline decoration-neutral-700 underline-offset-2 hover:decoration-neutral-400">${n}</a>`;
  const isResult = c.n === result;
  return Band('meld', `
    <div class="${PANEL} p-3 text-sm text-neutral-400">
      ${isResult
        ? `Melded from ${parts.map(link).join(' <span class="text-neutral-600">+</span> ')}.`
        : `Melds with ${parts.filter(n => n !== c.n).map(link).join(' and ')} into ${link(result)}.`}
      <p class="mt-2 text-[11px] text-neutral-600">Three cards, not two sides &mdash; ${
        isResult ? 'this one is printed across the backs of the other two' : 'its printed back is half of the result'
      }, so there is nothing here to turn over.</p>
    </div>`, { note: 'what this card belongs to' });
};

/* THE SAME THREE DISPLAYS AS THE LIST, DRAWN BY THE SAME RENDERERS. A printing
   is a card, so the thing to draw is a card - `TitleRow`, `KeyRow` and `Card`
   already draw one three ways, and writing a fourth here is how the card page
   comes to disagree with the list about what a card looks like. What the band
   adds is what the list has no column for: which printing is showing, and where
   your copies of it are.
   `content-visibility` because this is the one list with no paging: a basic land
   is 864 printings, and in grid that is 864 mock cards in a 26rem scroller. The
   browser skips the ones it is not showing; the rows are cheap enough to leave
   alone. */
function setBand(k, v) { P[k] = v; render(); }
const BandSwitch = (k, extra = []) => `<span class="flex items-center gap-1.5">${
  [...Object.entries(CARD_VIEWS).map(([v, o]) => [v, o.icon, '']), ...extra]
    .map(([v, icon, title]) => DisplayChip(v, icon, v === P[k], `setBand('${k}','${v}')`, title)).join('')}</span>`;

/* `P.cols.grid`, not `colsOf()`. colsOf answers for the LIST's current layout,
   and the card page has no layout - P.view is null there, so it answered 1 and
   drew a single card the width of the band. The grid count is the one you set
   for grids; capped at 6 because this band is a column of the page, not the
   whole pane. */
/* ALIGN ART - every printing of this card drawn beside its own high-quality
   pull, so a misalignment you noticed on one card can be pinned to a printing
   and then to that printing's CLASS. The anatomy page asks the same question
   across all 66 classes with six samples each; this asks it down one card,
   which is the shape the question actually arrives in ("this card looks wrong").
   The verdict it feeds is UNALIGNED, and the point of the label on every tile
   is that the answer is per CLASS and never per printing: a fix that lands one
   card and breaks its siblings is the hardcoded alignment this is here to
   avoid. A class already declared unalignable says so and shows the printed
   card once, because there are no longer two things to compare. */
/* THE NUMBERS, BECAUSE THIS IS THE DEBUG VIEW. It showed two pictures and a
   class name, which tells you THAT a card is wrong and nothing about why - and
   "why" here is always one of a handful of facts that are already computed and
   were simply not on screen. Every one of these decides something:
     verdict   drawn, or pulled, and which rule made that call
     geometry  overlaid or windowed, the art aspect the frame assumed, and the
               black edge - the three numbers a misalignment is usually in
     source    the exact URL each half is pulling, so a wrong picture can be
               told from a wrongly-placed one
     natural   the crop's real pixel size, read off the image once it loads.
               This is the fact nothing else in the app can know: the shape is
               NOT in the catalogue, Scryfall returns 626x457, 312x752, 684x722
               and more, and it is the usual reason a frame looks stretched. */
const alignFacts = (c) => {
  const over = OVERLAID.has(c.treat || 'framed') || LANDSCAPE.has(c.layout) && c.layout !== 'split';
  return [
    ['verdict', unaligned(c) ? 'pulled &mdash; class declared unalignable'
      : !framable(c) ? 'pulled &mdash; no cost, type or rules for a frame to hold'
      : 'drawn'],
    ['layout', `${c.layout || 'normal'} &middot; ${c.treat || 'framed'}`],
    ['geometry', `${over ? 'overlaid' : 'windowed'} &middot; art ${
      LANDSCAPE.has(c.layout) ? '7/1.8' : over ? 'full card'
        : c.energy ? '5/3.52' : `the crop's own (clamped 36-58%)`} &middot; edge ${
      c.treat === 'borderless' ? '0' : '3.5%'}${aftermath(c) ? ' &middot; aftermath (upright)' : ''}`],
    ['sided', `${twoFaced(c) ? `${c.faces.length} faces` : '1 face'}${SIDED.has(c.layout) ? ' &middot; turns over' : ''}${
      PAIRED.has(c.layout) ? ' &middot; both on one side' : ''}`],
    ['crop', artUrl(c, 0, 'art_crop')],
    ['card', artUrl(c, 0, cardQ(c))],
  ];
};
const AlignList = (cs, right, on = () => false) => `
  <div class="grid gap-3 p-1" style="grid-template-columns:repeat(${Math.min(P.cols.grid || 3, 3)},minmax(0,1fr))">
    ${cs.map((c) => {
      const off = unaligned(c) || !framable(c);
      return `<div class="rounded-lg border ${on(c) ? 'border-emerald-600' : 'border-neutral-800'} bg-neutral-950/60 p-2"
        style="content-visibility:auto;contain-intrinsic-size:auto 26rem">
        <div class="mb-1.5 flex items-baseline gap-2 text-[10px]">
          <span class="shrink-0 font-mono uppercase text-neutral-300">${c.set} ${c.num}</span>
          <span class="min-w-0 flex-1 truncate font-mono ${off ? 'text-amber-400/90' : 'text-neutral-600'}"
            title="${off ? 'This class is not drawn - the printed card is pulled instead' : 'layout | treatment - the unit the verdict applies to'}">${anatomyKey(c)}</span>
          ${right(c)}
        </div>
        ${off
          ? ScanImage(c, 0, 'large')
          : `<div class="flex min-w-0 gap-2">
              <div class="min-w-0 flex-1">${MockCard(c)}</div>
              <div class="min-w-0 flex-1">${ScanImage(c, 0, 'large')}</div></div>
             <p class="mt-1 text-center text-[10px] text-neutral-600">drawn &middot; printed</p>`}
        <dl class="mt-1.5 grid gap-x-2 border-t border-neutral-900 pt-1.5 font-mono text-[10px] [grid-template-columns:4.5rem_1fr]">
          ${alignFacts(c).map(([k, v]) => `
            <dt class="text-neutral-600">${k}</dt>
            <dd class="min-w-0 truncate ${k === 'verdict' && off ? 'text-amber-400/90' : 'text-neutral-400'}"
              title="${jsArg(String(v).replace(/&[a-z]+;/g, ' '))}">${v}</dd>`).join('')}
          <dt class="text-neutral-600">natural</dt>
          ${/* Read off the loaded image, because the crop's shape is the one fact
                the catalogue does not carry and cannot be derived. `onload` fires
                per image; it writes into its own sibling and clears itself. */''}
          <dd class="text-neutral-400"><img src="${artUrl(c, 0, 'art_crop')}" alt="" class="hidden"
            onload="this.parentNode.textContent=this.naturalWidth+'&times;'+this.naturalHeight+' ('+(this.naturalWidth/this.naturalHeight).toFixed(2)+')'"
            onerror="this.parentNode.textContent='no crop'">&mdash;</dd>
        </dl>
      </div>`;
    }).join('')}</div>`;

const BandList = (cs, view, right, on = () => false) => {
  if (view === 'align') return AlignList(cs, right, on);
  const cell = (CARD_VIEWS[view] || CARD_VIEWS.compact).draw;
  return view === 'grid'
    ? `<div class="grid gap-3 p-1" style="grid-template-columns:repeat(${Math.min(P.cols.grid || 6, 6)},minmax(0,1fr))">
        ${cs.map(c => `<div class="flex flex-col gap-1 rounded ${on(c) ? 'ring-1 ring-emerald-500' : ''}"
          style="content-visibility:auto;contain-intrinsic-size:auto 16rem">
          ${cell(c)}
          <div class="flex items-center justify-between gap-2 text-xs">${right(c)}</div>
        </div>`).join('')}</div>`
    : `<div class="${PANEL} overflow-hidden">
        ${/* No border here: KeyRow draws its own rule and TitleRow deliberately
              has none, exactly as they do in the list. A border on the wrapper
              doubled the first and invented the second. */''}
        ${view === 'details' && cs.length
          ? DetailHead('px-2', `<span class="invisible" aria-hidden="true">${right(cs[0])}</span>`) : ''}
        ${cs.map(c => `<div class="flex items-center gap-3 px-2 ${
          on(c) ? 'bg-emerald-500/10' : ''}" style="content-visibility:auto;contain-intrinsic-size:auto 2.2rem">
          <span class="min-w-0 flex-1">${cell(c)}</span>
          ${right(c)}
        </div>`).join('')}</div>`;
};


/* Where the old /preview page lands. It existed because nothing in the app ever
   drew the frame next to the real card, so there was no way to see whether the
   frame was faithful. That's a question about ONE card, and this is the page for
   one card - so the two representations share the image slot and a toggle flips
   between them. It stops being a QA tool and becomes the thing a collector
   actually wants: is this the printing I'm holding?

   Frame is always available, because it is drawn from what the catalogue knows.
   Photo needs a printing, so it is only offered once the line is matched - which
   is the same rule as everything else on this page. */
const FACES = [['frame', 'Frame'], ['photo', 'Photo']];
function setFace(f) { P.face = f; render(); }
const CardFace = () => {
  const c = openedCard();
  // an unmatched line knows one thing: the name. The frame draws exactly that.
  const face = P.matched ? P.face : 'frame';
  return `
    <div class="flex items-center gap-1.5">
      ${FACES.map(([f, label]) => `<button onclick="setFace('${f}')" ${!P.matched && f === 'photo' ? 'disabled' : ''}
        class="${face === f ? CHIP_PLUS : CHIP_NEUTRAL} ${!P.matched && f === 'photo' ? 'cursor-not-allowed opacity-40' : ''}">${label}</button>`).join('')}
      <span class="ml-auto text-[10px] text-neutral-600">${face === 'photo' ? 'as printed' : 'as catalogued'}</span>
    </div>
    ${face === 'photo'
      ? `<div class="flex aspect-[5/7] w-full flex-col items-center justify-center rounded-lg border border-dashed border-neutral-700 bg-neutral-900/40 p-3 text-center">
          <span class="text-[11px] text-neutral-500">printed-card image</span>
          <span class="mt-1 font-mono text-[10px] uppercase text-neutral-600">${c.set} ${c.num} &middot; ${c.lang}</span>
          <span class="mt-2 text-[10px] text-neutral-700">hotlinked, never stored</span></div>`
      : MockCard(P.matched ? c : { n: cardName() })}
    <p class="text-[11px] text-neutral-600">${P.matched
      ? 'Same frame the grid and the binder draw. Nothing here is page-specific.'
      : 'A name is the whole record. Every other slot is empty rather than guessed &mdash; a frame that says &ldquo;Common&rdquo; because rarity was missing is a lie.'}</p>`;
};

PAGES.card = () => Frame(P.tab, {
  stats: Stats([[P.matched ? money(openedCard().usd) : '&mdash;', 'market'],
    [String(heldOf(P.card).reduce((t, [, , c]) => t + (c.qty || 0), 0)), 'owned']]),
  sub: `
    <div class="shrink-0 border-b border-neutral-800 bg-neutral-900/40">
      <div class="flex w-full flex-nowrap items-center gap-3 px-4 py-2">
        <a href="#/${P.tab}" onclick="goTab('${P.tab}')" class="${BTN_SECONDARY} shrink-0">&larr; Back</a>
        <span class="-mx-2 flex min-w-0 items-center gap-3 rounded px-2 py-0.5">
          <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">card</span>
          <span class="truncate text-base font-semibold text-neutral-100">${cardName()}</span>
          <span class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide ${P.matched
            ? 'bg-emerald-500/10 text-emerald-300' : 'bg-amber-500/10 text-amber-300'}">${P.matched ? 'matched' : 'unmatched'}</span>
        </span>
        <span class="ml-auto flex shrink-0 items-center gap-3">
          ${P.matched ? `<button onclick="setMatched(false)" class="${BTN_SECONDARY}">Unmatch</button>` : ''}
          ${ExportInline()}</span>
      </div></div>`,
  body: `
    <div class="flex flex-wrap items-start gap-6">
      <div class="w-[16rem] shrink-0 space-y-4">
        ${CardFace()}
        ${FlatSource()}
      </div>
      <div class="min-w-0 flex-1 space-y-5">
        ${Band('anatomy', CardFacts(), { note: P.matched ? 'from the catalogue' : 'unknown until matched' })}
        ${MeldBand()}
        ${Band(P.matched ? 'printings' : 'candidates', Candidates(), {
          note: `${num(printingsOf(P.card).length)} in the catalogue &mdash; ${P.matched
            ? 'click one to show it' : 'what the line could mean, and the identity key is what tells them apart'}`,
          right: BandSwitch('prints', [['align', '&#8660;',
            'Every printing drawn beside its own high-quality pull &mdash; for deciding whether a CLASS of card can be drawn at all']]) })}
      </div>
    </div>`,
});

const ORDER = ['home', 'printings', 'binders', 'decks', 'io', 'search', 'card', 'config', 'kit', 'anatomy', 'draw'];
let lastRoute = null;
function render() {
  // ORDER is the whitelist, not just a list: an unknown hash lands on home
  // instead of invoking whatever PAGES happens to inherit (#/toString).
  const k = location.hash.replace('#/', '');
  // no game chosen yet = there is nothing else to show, and a page that needs
  // state it hasn't got is not a route either - #/draw typed cold is a set list
  let route = !P.game ? 'home' : ORDER.includes(k) ? k : 'home';
  // #/draw typed cold is a set list: the page IS the question and the boosters,
  // and with neither there is nothing for it to be
  if (route === 'draw' && !P.ask && !P.draw) route = 'printings';
  // Navigating anywhere drops every selection - a tab always opens on its full
  // list. Compared against lastRoute so that picking an item, which re-renders
  // the same route, doesn't immediately clear itself.
  /* Opening boosters must not cost you your place in the set table - that was
     the whole argument for it being a band rather than a route, and it survives
     the move by exempting the two crossings instead. */
  if (route !== lastRoute && route !== 'draw' && lastRoute !== 'draw') {
    clearPicks();
    /* The binder used to be seeded with this arrangement on arrival and have it
       taken back on the way out, because it was the one tab that filed itself
       and everywhere else started empty. Now every tab starts filed, so there is
       nothing left for that special case to do and it is gone - along with the
       "did they touch it" bookkeeping it needed to avoid carrying a six-term
       order onto Search as something nobody had asked for. */
  }
  const sameRoute = route === lastRoute;
  lastRoute = route;
  // the route owns the tab; the selection within it is state
  if (TABS[route]) P.tab = route;
  // a display the new tab doesn't offer can't stay selected - it falls to that
  // tab's default, which is a real one only where there is nothing to choose
  if (!views().some(([v]) => v === P.view)) P.view = defaultView();
  /* The draw grid's sideways scroll is state, and innerHTML is not: turning
     over one card in an 84-card pool re-renders, and without this you are back
     at card 1 every time - 8,617px from the card you just clicked. The reveal
     sweep renders once per card, so it would be fighting this eighty-four
     times over. Carried across by hand because the element is replaced, not
     updated; there is nothing for the browser to preserve it on. */
  const wasAt = document.querySelector('[data-draw-scroll]')?.scrollLeft || 0;
  /* THE SAME ARGUMENT, VERTICALLY, AND THE PAGING DEPENDS ON IT. Reaching the
     end of the list re-renders it one page longer, and innerHTML hands back a
     fresh <main> scrolled to the top - so every page-in threw you back to card
     one, which is an infinite scroll you cannot scroll. The list only ever grows
     at its end, so the offset that was true before the render is still true
     after it. Within a route only: arriving at a tab starts at the top, because
     that is where a list you have not read yet begins. */
/* EVERY scroller on the page, not just the main pane. The card page's printings
     band is a scroll box of its own - 864 rows for a basic land - and picking a
     printing re-renders, so clicking one near the bottom threw the list back to
     the top and took the row you were aiming at with it. Keyed, because there is
     more than one now and `querySelector` would keep answering with the first. */
  // optional-called: check.mjs renders against a stubbed DOM that has no
  // querySelectorAll, the same reason measureSpread guards its own lookup
  const wasDown = sameRoute
    ? [...(document.querySelectorAll?.('[data-scroll]') || [])].map(e => [e.dataset.scroll, e.scrollTop])
    : [];
  document.getElementById('app').innerHTML = PAGES[route]();
  if (wasAt) {
    const box = document.querySelector('[data-draw-scroll]');
    if (box) box.scrollLeft = wasAt;
  }
  for (const [k, top] of wasDown) {
    if (!top) continue;
    const el = document.querySelector(`[data-scroll="${k}"]`);
    if (el) el.scrollTop = top;
  }
  document.title = 'Draft - ' + route;
  measureGutter();
  measureSpread();
  watchMore();
  /* Saved here rather than in each of the five mutators: one call site cannot
     miss one. render() runs when you click, not per frame - the deal and the
     reveal sweep write to the DOM directly and were made not to re-render - so
     the stringify is nowhere near a hot path. */
  saveState();
}
addEventListener('hashchange', render);
// capture, because scroll doesn't bubble - the pane is a different element on
// every page, and this way nothing has to be re-bound after a render
addEventListener('scroll', placeGutter, true);
addEventListener('resize', () => { measureGutter(); measureSpread(); });
setInterval(cyclePacks, 1000);   // ticks; each pack has its own turn inside it
// before the first paint: what was chosen last time IS the starting state, and
// painting the defaults first would flash them
loadState();
/* ...and the default language is seeded HERE as well as in pickGame, because a
   reload does not go through pickGame. It was only in pickGame, so the filter
   was in force on the session you picked the game in and silently absent on
   every one after it - the sidebar's top group unlit, 137.3k rows, and no way
   to tell that from having widened it yourself. Seeded after loadState so the
   saved language is the one that gets applied. */
langFilter(P.filter); langFilter(P.filterDraft);
render();
// after the first paint, not before it: the page is useful on the mocks while
// 5 MB is in flight, and re-renders itself when the real catalogue lands
loadCards();
loadPackIndex();   // 3.4 KB: which booster kinds each set actually has
loadSymIndex();    // 3 KB: which set symbols are on disk, vs never published
loadDisk();        // what serve.py can see on disk, for Config's Local column
</script>
</body>
</html>
