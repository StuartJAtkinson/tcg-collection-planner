/* The pack column is a fixed 186px SQUARE, so every booster presents the same
   target whatever shape its photograph is — the wrapper is 0.525 wide, so it
   fills the square's height at 98px across and the rest is margin. Sized by the
   picture, never by the block: a block with fewer rows than the picture needs
   gets GAP ROWS rather than taller rows, because stretching six sets' worth of
   row height to fit one picture leaves the names floating in nothing.
   Six rows because a row is 33px at its shortest and 6 x 33 > 186; the gap rows
   carry that 33px themselves, or an empty row collapses to nothing and the image
   stretches the real ones after all. */
const PACK_ROWS = 7;
/* The picture IS the Draft button — same call, same argument, a target you can
   hit. stopPropagation because the row underneath selects the set on click, and
   a draft that also navigates is two answers to one press. */
const draftPack = (ev, label) => { ev.stopPropagation(); draftSet(label); };
/* MTGJSON annotates every one of these `category: "booster_pack"`, and then
   separates them by `subtype` — which is the same string as the collation code:
   Theros Beyond Death ships draft (15 cards), collector (14) and five theme
   (35) under that one category, and a theme booster is a rigid 35-card carton
   that photographs like a deck box, not a wrapper. Magic drafts one specific
   thing: Draft Boosters before 2024-04-19, Play Boosters after. So a set you can
   draft shows the packs you would draft it WITH — which is what packsFor already
   names — and everything else is left with whatever it has, since for a
   commander set the collector pack is the only pack there is. */
const packArt = (code, kinds) => {
  const all = PACK_ART[code] || {};
  const drafted = (kinds || []).map(k => all[k]).filter(Boolean);
  return drafted.length ? drafted : kinds ? [] : Object.values(all);
};
/* WHERE THE PACK PHOTOGRAPHS COME FROM, AND WHAT STILL HAS TO BE DONE TO THEM.
   MTGJSON has the product id; TCGplayer's CDN has the photograph. 200w is the
   smallest it serves — four times what the set column shows, and still 26 KB —
   and it is a Config choice like every other source's, not a constant in here.

   Online, they arrive as JPEGs on a white card, so every one has to be trimmed
   IN THE BROWSER: fetched as an origin (or the pixels are unreadable), flood
   filled from its border ring to alpha, handed back as a data URL. That is a
   canvas pass per photograph per page, forever, for a picture that never changes.

   Local, none of it happens. `gen-packs.mjs` does the SAME trim once at download
   time and writes a PNG that already carries the alpha, so the local path is a
   plain <img>: no crossorigin, no onload, no retry dance. Which one you get is
   the Config row's own Local/Online chip and nothing else — and the quality is
   in the filename, so switching size switches file rather than silently serving
   the one that happens to be on disk. */
const packLocal = () => CFG.src.tcg.at === 'local';
const packCdn = id => `https://tcgplayer-cdn.tcgplayer.com/product/${id}_${CFG.src.tcg.q}.jpg`;
const packUrl = id => packLocal() ? `packs/${id}_${CFG.src.tcg.q}.png` : packCdn(id);
const packAttrs = (id) => packLocal() ? `onerror="packMissing(this, '${id}')"`
  : 'crossorigin="anonymous" onload="trimPack(this)" onerror="packRetry(this)"';
/* Set to Local, but that file has not been fetched yet. An un-run download
   should degrade to the online behaviour rather than to a broken image, so it
   falls through to the CDN and trims live — the attributes are swapped rather
   than the handlers assigned, because assigning would leave the inline ones
   attached as well and both would fire. */
function packMissing(img, id) {
  img.setAttribute('onerror', 'packRetry(this)');
  img.setAttribute('onload', 'trimPack(this)');
  img.crossOrigin = 'anonymous';
  img.src = packCdn(id);
}

const SetList = () => {
  // The gutter groups by the BLOCK's release date, not each row's own: a
  // sub-set can ship months after its parent (Final Fantasy Scene Box, six
  // months after Final Fantasy), and a rowspan over rows that aren't next to
  // each other overlaps the next one and shears the table sideways. Grouping by
  // the block makes every run contiguous by construction — and it's what the
  // gutter means anyway, since the block is what came out that month.
  const rows = [];
  for (const r of SETS) {
    const prev = rows[rows.length - 1];
    rows.push(r[5] && prev ? { r, key: prev.key, block: prev.block } : { r, key: r[2], block: r[1] });
  }
  // One entry per printed row, gap rows included, so every rowspan is a count.
  // A block's art is its own and its sub-sets': the pack usually belongs to the
  // parent, but a Commander sub-set prints its own.
  const out = [];
  for (let i = 0; i < rows.length;) {
    let j = i;
    while (j < rows.length && rows[j].block === rows[i].block) j++;
    const kinds = packsFor(`${rows[i].r[0]} (${rows[i].r[1]})`);
    const packs = [...new Set(rows.slice(i, j).flatMap(e => packArt(e.r[1], kinds)))];
    // the set the picture drafts: the one in this block that has collation, which
    // is not always the parent — and is nothing at all for a set nobody has
    // collated, where the picture stays a picture
    const label = rows.slice(i, j).map(e => `${e.r[0]} (${e.r[1]})`).find(l => packsFor(l)?.length) || null;
    for (let k = i; k < j; k++) out.push({ ...rows[k], packs, draft: label });
    for (let k = j - i; packs.length && k < PACK_ROWS; k++)
      out.push({ key: rows[i].key, block: rows[i].block, packs, draft: label });   // no r = a gap
    i = j;
  }
  // counted once rather than re-filtered per row: three spans over a thousand
  // rows was three million comparisons on every render
  const span = new Map();
  for (const e of out)
    for (const k of [e.key.slice(0, 4), e.key.slice(0, 7), '#' + e.block])
      span.set(k, (span.get(k) || 0) + 1);
  const seen = new Set();
  // Turned on its side: a vertical label costs a 2.5rem column instead of a
  // 6rem one, and it can be read at a size that actually marks the boundary.
  // The label is placed by placeGutter(), which puts it at the middle of the part
  // of the block you can see. `top-1/2` is what it falls back to — the middle of
  // the whole block — which is also where it belongs for any block that fits on
  // screen, so nothing has to run for the common case.
  // border-y closes the block off top and bottom: the row borders stop at a
  // rowspan, so without it a year reads as open-ended. The label is absolute so
  // it can be moved without stretching anything: a table cell grows to fit its
  // content, so an in-flow box a pane tall would make one-month blocks 148px.
  const gutter = (key, label, size) => {
    if (seen.has(key)) return '';           // already spanned from an earlier row
    seen.add(key);
    return `<td rowspan="${span.get(key)}"
      class="relative border-y border-r border-neutral-800/60 p-0">
      <div class="absolute inset-x-0 top-1/2 flex -translate-y-1/2 justify-center">
        <span class="whitespace-nowrap py-2 tracking-wide [writing-mode:vertical-rl] ${size}">${label}</span></div></td>`;
  };
  /* The pack the block was sold in, cycling every 10s among that block's own —
     Play, Collector, the theme boosters. `loading="lazy"` is why 184 of these
     cost nothing: the browser fetches the ones you scroll to, and cyclePacks()
     only swaps the ones on screen, so the page is never a wall of flicking
     pictures. A block with no pack still gets the cell, or the column stops
     lining up with the rows it belongs to. */
  const packCell = (e) => {
    if (seen.has('#' + e.block)) return '';
    seen.add('#' + e.block);
    /* No border and no rounding. The picture is TRIMMED — its edges are the
       pack's own silhouette against transparency — so a border draws a rectangle
       round the empty margin instead of round the pack, which is the frame that
       appeared on every one of these. The shadow has to be `drop-shadow` for the
       same reason: box-shadow follows the box, drop-shadow follows the alpha. */
    const art = e.packs.length ? `<img src="${packUrl(e.packs[0])}" loading="lazy" alt=""
      ${packAttrs(e.packs[0])} data-packs="${e.packs.join(' ')}"
      class="h-[186px] w-[186px] object-contain drop-shadow-lg">` : '';
    // The Draft button belongs beside the pack it opens, not eight columns away
    // in a lane of its own. It hangs UNDER the art rather than over it: a block
    // with no draft data would otherwise start its picture 33px lower than its
    // neighbours, so the one thing that varies sits below the one that doesn't.
    const chip = `<div class="flex h-[33px] items-center justify-center">${DraftCell(`${e.r[0]} (${e.r[1]})`)}</div>`;
    // A pack you can't draft is still a photograph of a pack: it does not get
    // dimmed. Fading it to 60% over a near-black table greyed the picture out —
    // which is what "the Doctor Who one looks dim" turned out to be, after a
    // good deal of white balancing aimed at the wrong thing. The difference
    // shows on hover, where it matters, and in the title, which now names the
    // actual reason: a commander set is not a set that failed to be collated.
    const why = !DRAFTABLE.has(e.r[6])
      ? `${e.r[0]} is a ${e.r[6].replace(/_/g, ' ')} set — not one you draft`
      : e.r[7]
        ? `${e.r[0]} has collation, but none of it is a booster you draft`
        : `No booster collation published for ${e.r[0]} yet`;
    return `<td rowspan="${span.get('#' + e.block)}" class="border-y border-r border-neutral-800/60 p-0 align-top">${
      art && e.draft
        ? `<button onclick="draftPack(event,'${jsArg(e.draft)}')" title="Draft boosters from ${jsArg(e.draft)}${collationNote(e.draft)}"
             class="mx-auto block rounded ring-1 ring-transparent hover:ring-emerald-500">${art}</button>`
        : art ? `<span class="mx-auto block w-[186px]" title="${jsArg(why)}">${art}</span>` : ''}${chip}</td>`;
  };

  // of its own, and a sticky header sticks to the nearest one — this panel, which
  // never scrolls, so the header would simply sit still. clip rounds the corners
  // the same way without being scrollable. The pane's top padding moved in here
  // as a margin for the same reason: a header stuck at top-0 sits below padding,
  // leaving a strip of rows scrolling past above it. A margin scrolls away.
  return `<div class="${PANEL} mt-4 overflow-clip">
    <table class="w-full table-fixed text-sm">
      <thead><tr class="text-left text-[10px] font-semibold uppercase tracking-wide text-neutral-600 [&>th]:sticky [&>th]:top-0 [&>th]:z-10 [&>th]:border-b [&>th]:border-neutral-800 [&>th]:bg-neutral-900">
        <th class="w-10 px-1 py-1.5 text-center">Year</th><th class="w-10 px-1 py-1.5 text-center">Month</th>
        <th class="w-48 px-1 py-1.5 text-center">Booster</th>
        <th class="w-16 px-3 py-1.5">Code</th><th class="px-3 py-1.5">Set</th>
        <th class="w-24 px-3 py-1.5">Released</th><th class="w-14 px-3 py-1.5 text-right">Cards</th>
        <th class="w-1/4 px-3 py-1.5">Collected</th></tr></thead>
      <tbody>${out.map(e => {
        const year = gutter(e.key.slice(0, 4), e.key.slice(0, 4), 'text-xl font-semibold text-neutral-300');
        const month = gutter(e.key.slice(0, 7), MONTHS[+e.key.slice(5, 7) - 1], 'text-base text-neutral-500');
        const pack = packCell(e);
        if (!e.r) return `<tr>${year}${month}${pack}<td colspan="5" class="h-[33px]"></td></tr>`;
        const [name, code, rel, total, owned, child] = e.r;
        const pct = Math.round(100 * owned / total);
        const on = `${name} (${code})` === picked();
        return `<tr onclick="selectItem('${jsArg(`${name} (${code})`)}')" title="Browse ${jsArg(name)}"
          class="cursor-pointer border-b border-neutral-900 ${on ? 'bg-emerald-500/10' : 'hover:bg-neutral-800/50'}">
          ${year}${month}${pack}
          <td class="px-3 py-1.5 font-mono text-xs uppercase ${child ? 'text-neutral-600' : 'text-neutral-400'}">${code}</td>
          <td class="truncate px-3 py-1.5 ${child ? 'pl-6 text-neutral-400' : 'font-medium text-neutral-100'} ${on ? 'text-emerald-200' : ''}">${
            child ? '<span class="mr-1 text-neutral-700">&#9492;</span>' : ''}${name}</td>
          <td class="px-3 py-1.5 font-mono text-xs tabular-nums text-neutral-500">${rel}</td>
          <td class="px-3 py-1.5 text-right tabular-nums text-neutral-500">${num(total)}</td>
          <td class="px-3 py-1.5"><span class="flex items-center gap-2">${CompletionBar(pct)}
            <span class="w-8 shrink-0 text-right text-xs tabular-nums ${owned ? 'text-neutral-300' : 'text-neutral-700'}">${pct}%</span></span></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <p class="px-3 py-2 text-[11px] text-neutral-600">Indent from <code class="text-neutral-500">sets.parent_code</code>, gutter and order from release date &mdash; both already in the schema. Pack art by TCGplayer product id, from MTGJSON&rsquo;s <code class="text-neutral-500">sealedProduct</code>.</p>
  </div>`;
};

/* ======================= THE BROWSE PAGE ==============================
   Printings, Binders, Decks and Search are all this. The only difference is
   what the selector lists — and Search lists nothing, because it IS all
   cards. Filter, sort and view sit below on every one of them. */
/* Derived from the same rows the selector lists, so the bar and the top-right
   numbers can never disagree — they did: the bar said 264 cards for a set the
   stats called 145. */
const listRow = () => (LISTS[P.tab] || []).find(r => r[0] === picked());
/* A set is named two ways: bare ("Modern Horizons 3") in a header, and
   disambiguated ("Modern Horizons 3 (MH3)") by the table, because two sets can
   share a name. Resolve either — matching only one form is why the Boosters
   button never appeared for a set picked from the table, while every scripted
   check that passed the bare name said it did. */
const setRow = (label = picked()) => {
  if (!label) return null;
  const m = /\(([^)]+)\)\s*$/.exec(label);
  return SETS.find(r => (m ? r[1] === m[1].toUpperCase() : r[0] === label)) || null;
};
const STATS = {
  printings: sel => {
    const r = sel && setRow();
    return r ? [[num(r[3]), 'cards'], [`${Math.round(100 * r[4] / r[3])}%`, 'collected']]
             : [[num(SETS.length), `sets &middot; ${Math.round(
                 100 * SETS.reduce((t, x) => t + x[4], 0) / SETS.reduce((t, x) => t + x[3], 0))}% collected`]];
  },
  binders: sel => {
    if (!(sel && listRow())) return [[String(LISTS.binders.length), 'binders']];
    // what the binder holds, then what the view could draw of it — Unsorted is
    // the whole catalogue minus the filed cards, and no page renders 100k cards
    const held = scopedCards().length, drawn = CARDS().length;
    const p = binderPages(GROUPS()).length;
    return [[num(held), 'cards'],
            [String(p), `page${p === 1 ? '' : 's'}${held > drawn ? ` of the first ${num(drawn)}` : ''}`]];
  },
  decks: sel => {
    const r = sel && listRow();
    return r ? [[num(r[1]), `cards &middot; ${r[2]}`]]
             : [[String(LISTS.decks.length), 'decks']];
  },
  search: () => [[game().total, `cards in ${game().label}`]],
};

/* ======================= DRAFT BOOSTERS ===============================
   Not a shop and not a collection: this draws a pool to build a draft deck out
   of. Two shapes, chosen before anything is drawn:

     complete    — open all N boosters, keep the lot. Solitaire sealed.
     round robin — open them one at a time and take ONE card from each. There
                   are no other players, so the other N-1 boosters still in
                   flight lose a card every time you pick, weighted to the good
                   ones: by the time a booster reaches you it has been picked
                   over exactly as many times as picks have happened.

   Wizards publishes no collation. MTGJSON carries the community's
   reverse-engineered sheets (198 of the 868 sets in data/AllPrintings.json.gz)
   and the real app reads `set.booster`; a set without it offers no button at
   all, which is 670 sets and is the honest answer. The recipes are measured out
   of that file — Modern Horizons 3's Play and Collector boosters and Zendikar's
   Draft booster, weights included.

   The sheets are REAL and they are fetched: boosters/<CODE>.json, generated by
   gen-boosters.mjs straight out of MTGJSON's `set.booster`. A hand-written
   rarity-tier table stood here — nine sheets of invented weights and three pack
   recipes measured by hand — and it was a plausible imitation of a booster
   rather than a booster. The file carries, per set and per booster kind, the
   weighted pack recipes and every sheet's per-card weight, so a pack is dealt
   the way the collation deals it: pick a recipe by weight, then fill each slot
   from its sheet by that card's own weight on it. */
const BOOSTER_LABEL = { play: 'Play Booster', draft: 'Draft Booster',

const packLabel = (k) => BOOSTER_LABEL[k] || 'Booster';
let PACK_INDEX = null;            // code -> [kinds], from boosters/index.json
const COLLATION = new Map();      // code -> the set's collation, fetched on open
/* Sheets name cards as "SET:number", so the join to the catalogue is the
   printing's own identity and no MTGJSON uuid has to be carried on 107k rows.
   SET matters as much as number: the List and Special Guest slots deal cards
   from other sets entirely, which is 16% of all sheet entries. */
let PRINTING_AT = null;
const printingAt = (key) => {
  if (!PRINTING_AT) {
    PRINTING_AT = new Map();
    for (const c of ALL()) PRINTING_AT.set(`${c.set}:${c.num}`, c);
  }
  return PRINTING_AT.get(key);
};
/* Conflux's set code is CON, and Windows has reserved that name — with any
   extension — since DOS. Node writes `boosters/CON.json` happily and nothing can
   then read it back, so the file on disk carries a trailing underscore and every
   place that names one has to agree: here, gen-boosters.mjs, and serve.py. */
const RESERVED_NAME = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;
const packFile = (code) => RESERVED_NAME.test(code) ? `${code}_` : code;
async function loadBoosters(code, seed) {
  if (seed) { COLLATION.set(code, seed); render(); return; }
  if (COLLATION.has(code) || typeof fetch !== 'function') return;
  try {
    const res = await fetch(`boosters/${packFile(code)}.json`);
    if (!res.ok) return;
    COLLATION.set(code, (await res.json()).kinds);
    render();
  } catch { /* no collation reachable is the same as none published */ }
}
/* SETTLED, not merely loaded. Until this answers, `packsFor` can only report the
   one kind a set is drafted with — so a fan drawn before it lands is six copies
   of the same wrapper, and lands as a different fan the moment it arrives. That
   was visible: you clicked Draft, got six of the booster you clicked, and watched
   them shuffle into an assortment. Failure therefore sets `{}` rather than
   leaving null, because "there is no index" is an answer and null is the absence
   of one — and Fan waits on the difference. */
async function loadPackIndex(seed) {
  if (seed) { PACK_INDEX = seed; return; }
  if (PACK_INDEX || typeof fetch !== 'function') return;
  try {
    const res = await fetch('boosters/index.json');
    PACK_INDEX = res.ok ? await res.json() : {};
  } catch { PACK_INDEX = {}; }     // offline is a supported state, and is settled
  render();

const MODES = [
  ['robin', 'Draft', '3 boosters, one card taken from each and the rest passed on', 3],
  ['complete', 'Sealed', '6 boosters, opened all at once and every card kept', 6],
  ['pull', 'Booster pull', 'open one at a time, as many as you like &mdash; no format, no limit', 1],

const modeRow = (m) => MODES.find(([k]) => k === m);
const packsForMode = (label, mode) => {
  const all = packsFor(label) || [];
  // draft and sealed are played with the booster the set is DRAFTED with, which
  // is what BOOSTER already reports; only a pull may reach for a Collector
  return mode === 'pull' ? all : all.slice(0, 1);
};
/* Whether a set can be drafted is TWO facts, and neither is its size or its
   symbol — 986 paper sets share 334 symbols and 453 sub-sets reuse their
   parent's, so a token set draws the same icon as the expansion it hangs off.

     set_type   Scryfall's, and it splits cleanly: 113 of 118 expansions and 23
                of 25 core sets print boosters, against 0 of 212 token sets and
                1 of 296 promo sets. commander is big (median 331 cards) but is
                a fixed product — 2 of 45.
     booster    MTGJSON's `set.booster`, the community's reverse-engineered
                collation. 187 of these 986 sets have it. A set can be perfectly
                draftable and still not have it yet: TRK ships 2026-11-13 and
                nobody has opened enough packs to work it out.

   So three answers, not two: null = not a set you open; [] = a set you open that
   has no collation published yet; a list = the boosters it prints. Play Boosters
   replaced Draft Boosters on 2024-04-19. */
const DRAFTABLE = new Set(['expansion', 'core', 'masters', 'draft_innovation']);
/* Which booster a set is drafted with is READ, not inferred. The date rule this
   replaced ("Play Boosters after 2024-04-19") is the published changeover, but
   MTGJSON has Murders at Karlov Manor shipping `play` on 2024-02-09 with no
   `draft` config at all, so the rule mislabelled it. BOOSTER carries what the
   collation actually says; a set with a booster block but neither config —
   a commander deck's `set` booster, say — is not something you draft. */
const packsFor = (label) => {
  const r = setRow(label);
  if (!r || r[5] || !DRAFTABLE.has(r[6])) return null;
  if (!r[7]) return [];
  const kind = BOOSTER[r[1]]?.[0];
  if (!kind) return [];
  /* The generated index says which kinds the set actually has a sheet for, so
     "and a Collector Booster" is read rather than assumed from the era — 49 of
     the 179 drafted sets have one, not every play-era set. The variant names
     are also PACK_ART's keys, so the art follows the collation. */
  const has = PACK_INDEX?.[r[1]];
  return has ? [kind, ...has.filter((k) => k !== kind)] : [kind];
};
/* "472 cards on the sheets, rarest 1 in 971 packs" — the collation in the one
   place it costs no layout. A count of PRINTINGS, not of the set: the sheets
   list showcase and borderless separately, so it can exceed a set's card count
   and is deliberately not shown as a percentage. */
const collationNote = (label) => {
  const r = setRow(label), c = r && BOOSTER[r[1]];
  if (!c) return '';
  const [kind, cards, rarest] = c;
  // `default` is MTGJSON's unnamed config — the sets that predate the vocabulary
  const named = { play: 'Play Booster', draft: 'Draft Booster', default: 'Booster' }[kind];
  return ` — ${named} · ${cards} cards on the sheets · rarest 1 in ${rarest} packs`;

/* A draw has to survive re-render: every click repaints the whole page, and a
   pack that reshuffled under the cursor would be a slot machine. Seed in, same
   pack out — which is also why the seed is on screen. */
const rng = (seed) => () => (
  seed = Math.imul(seed ^ (seed >>> 15), seed | 1) ^ (seed + Math.imul(seed ^ (seed >>> 7), seed | 61)),
  ((seed ^ (seed >>> 14)) >>> 0) / 4294967296);
// `total` is the sheet's OWN stated total where there is one: summing 400
// weights per slot per pack is work the file already did, and MTGJSON's total
// is authoritative where the two ever disagree
const pickWeighted = (pairs, r, total) => {
  let n = r * (total ?? pairs.reduce((t, [, w]) => t + w, 0));
  for (const [v, w] of pairs) if ((n -= w) < 0) return v;
  return pairs[pairs.length - 1][0];
};
/* A pack, dealt the way the collation deals it: pick a recipe by weight, then
   fill each of its slots from the named sheet by that card's own weight on that

   on two of them carries a different weight on each.

   have to invent cards, which is exactly what this replaced. */
function drawPack(kind, seed, setName) {
  const row = setRow(setName);
  const cfg = row && COLLATION.get(row[1])?.[kind];
  if (!cfg) return null;
  const rand = rng(seed);
  const recipe = pickWeighted(cfg.recipes.map(([w, c]) => [c, w]), rand());
  const out = [];
  for (const [name, n] of Object.entries(recipe)) {
    const sheet = cfg.sheets[name];
    if (!sheet) continue;
    const entries = Object.entries(sheet.cards);

  P.draw.shownAll = [];
  P.draw.all = true;
}

/* OPENING THE NEXT ONE IS THE SAME EVENT AS OPENING THE FIRST. There used to be
   a `Next booster` button, which made the second pack a different kind of thing
   from the first: one you clicked a picture to get, one you clicked a word. Now
   the sidebar's fan is the control — the packs you have not opened are still
   there, still clickable, and clicking one runs this whole routine again against

   exists, so it advances rather than being created, and `seen` survives because

       from a number. */

         the one Open all takes, and stepping the pack counter here opened exactly
         one booster and called it the lot. */

       opened. Open all tears all six where they stand — they are the fan and
       that is the shot — but their cards come off a single stack at the front
       booster's anchor rather than six stacks strung out across the fan. Six
       origins means five of them are right of the grid's first slot, and cards
       from those have to fly left to reach it; one origin at the front cannot.
       Single open gets here already correct: openBoosterAt has walked the pack
       you clicked to that same front slot. */

       shot — but the pile they feed still forms out on the stage rather than
       inside the column, for the same reason the single open walks out there:
       cards crossing the sidebar on their way out look like a mistake. */

    const one = unzoom(els[0].getBoundingClientRect());

      ? { left: stage.left + stage.w / 2 - one.w / 2, top: stage.top + stage.h / 2 - one.h / 2,
          w: one.w, h: one.h }

      // motion simply does not read against it
      g.style.cssText = `position:absolute;left:${at.left}px;top:${at.top}px;width:${at.w}px;`
        // bottom centre, so the stack splays from its base exactly as the fan of
        // boosters does — and so the grow-to-full-size reads as rising out of it
        + `transform:scale(${GHOST_SCALE});transform-origin:50% 100%;`
        + 'box-shadow:0 10px 30px rgba(0,0,0,.7);outline:1px solid rgba(255,255,255,.10);';
      root.appendChild(g);

       stagger reads as "they all burst", a slow one as a parade, and the parade
       is the fly's job. Waited on by asking them, so the margin is however long
       the fade actually took rather than ten milliseconds of hope. */
    const stagger = els.length > 1 ? 60 : 0;
    els.forEach((el, i) => tearOpen(el, i * stagger));
    /* A floor as well as a ceiling. Asking the elements is the accurate answer
       WHEN THERE IS ONE — but an element carrying no animation answers
       "finished" instantly and truthfully, and a stage that can collapse to
       nothing is not a stage. The floor is the fade's own length from
       foil.css plus the stagger it was dealt. */
    await atLeast(settled(els, (els.length - 1) * stagger + OPEN_MS),
                  (els.length - 1) * stagger + 700);
    await beat();

    /* STAGE 2 — the draw is painted, and then given a frame to lay itself out.
       flyGhosts measures every slot in it; measuring a DOM the browser has not
       laid out yet is the same mistake as measuring a moving booster. */
    P.ask = null; render();
    /* HIDDEN IN THE SAME TICK THEY ARE PAINTED IN. flyGhosts hides these too, and
       used to be the only thing that did — but it runs two frames and a beat
       later, and the browser paints in between. So the cards appeared in their
       slots, vanished, and then flew in: the arrival happened before the journey.
       render() is synchronous and no paint can land between it and this line. */
    hideSlots();
    await laid();
    await beat();
    flyGhosts(root, ghosts, all);

// opacity, not display: the slots keep their boxes, so the grid is at its final

const hideSlots = () => qsa('[data-card-id]')
  .forEach((el) => { el.style.transition = 'none'; el.style.opacity = '0'; });

function flyGhosts(root, ghosts, all) {

     timer, whichever gets there first. */

     come up UNDERNEATH the ghosts first (identical picture, so nothing flickers),
     then the ghosts go, and only then does the reveal sweep begin. Done together
     the fly's last frame and the sweep's first render land on the same frame and
     the arrival is never seen at all — the cards simply are there. */

    if (over) return;

    // move it. Every stage of this now travels the same way.

     they came out to fly they were above the whole page — including the rail
     they are supposed to be dealt FROM, which put the cards on top of the
     boosters and made the pile look like it was behind its own output.

     Moving the root into the draw itself is what makes that impossible rather
     than merely unlikely: inside the shell's stacking context a z-index of 20
     cannot reach the rail's 50 whatever else happens, while still clearing the
     card grid, which claims no layer at all. It stays `position: fixed`, and
     fixed is still measured against the viewport in here — `zoom` on <body>
     does not create a containing block the way a transform would, which is the
     one property of this that had to be checked rather than assumed. */

  if (shell) shell.appendChild(root);
  root.style.zIndex = '20';
  const paths = [];
  for (const { g, at, id } of ghosts) {
    const el = slots.get(id);
    if (!el) { g.remove(); continue; }
    const r = unzoom(el.getBoundingClientRect());
    // Re-anchored to the slot it is going to, then thrown back to the booster
    // it came from: identical pixels on screen, but now one transform from
    // home, so the loop below only has to walk that transform to zero.
    const s = GHOST_SCALE * Math.min(at.w / r.w, at.h / r.h);
    const dx = (at.left + at.w / 2) - (r.left + r.w / 2);
    const dy = (at.top + at.h / 2) - (r.top + r.h / 2);
    g.style.left = `${r.left}px`; g.style.top = `${r.top}px`;
    g.style.width = `${r.w}px`; g.style.height = `${r.h}px`;

     reason: the ghosts are position:fixed and the grid underneath SCROLLS, so
     every slot moves left by the scroll delta while its ghost is in the air. A
     transition cannot be told that mid-flight; a loop just subtracts it. */
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  /* NOTHING MOVES LEFT. The deal used to scroll the grid to chase its own
     frontier, and because the ghosts are `position: fixed` while their slots
     are not, every card that had already landed had to be translated left by
     the scroll delta to stay glued to its slot. The arithmetic was right and
     the motion was wrong: what you saw was the dealt cards sliding backwards
     under the ones still arriving.

     So the deal does not scroll at all. Cards leave the pile and travel right,
     full stop — a card bound for a slot past the edge simply flies off it, which
     is still rightward. The scroll is the REVEAL's to do afterwards, and it
     runs left to right for the same reason. */
  /* ONE AT A TIME OFF THE STACK, not all at once. The capture is unambiguous
     about this: the backs sit as a tilted pile where the pack burst and cards
     PEEL OFF IT, one every four or five frames, each flying out to its place
     while the rest wait their turn — the pile visibly shrinks as it goes. Sent
     together they read as a spray, and you cannot see that they came from
     anywhere; sent in order there is a stack being dealt from, which is the
     whole thing being depicted.

     Each card therefore carries its own clock offset, and z-index descends so
     the one still to leave is on top of the pile rather than under it. */
  const lead = (i) => i * DEAL_MS;
  const span = FLY_MS + lead(paths.length - 1);
  /* A FAN, not N cards at one point — the same shape the boosters make, because
     it is the same gesture. Stacked exactly on top of each other they are
     indistinguishable from a single card and the deal looks like one card
     endlessly cloning itself; splayed, there is visibly a stack, and it visibly
     shrinks as it is dealt from. Same pivot as the booster fan (bottom centre,
     set on the ghosts themselves) so it splays from its base rather than pinwheeling.

     THE FAN OPENS ONE WAY, LEFT. Every offset here washes out as the card flies
     — it is multiplied by (1 - kt) so the card still lands exactly on its slot —
     which means the offset IS the direction of travel, backwards. A card sitting
     right of the anchor, or rotated the other way, unwinds LEFT. So the whole
     fan is held at or behind the anchor and rotated one way only, and rightward
     travel is arithmetic rather than something to keep re-measuring.

     `k` runs 0 at the front of the pile to 1 at the back, so the fan tightens as
     it is dealt away instead of the survivors keeping a gap where a card was. */
  const last = Math.max(1, paths.length - 1);
  paths.forEach((p, i) => {
    p.g.style.zIndex = String(paths.length - i);   // the next to leave, on top
    const k = i / last;
    p.rot = -k * 22;                               // NEVER POSITIVE
    p.px = -k * 34;                                // NEVER POSITIVE
    p.py = -k * 26 - i * 0.6;                      // and a little thickness with it

  const BOB = 8, BOB_MS = 900;
  const t0 = performance.now();
  const tick = (now) => {
    const t = now - t0;

    // the heap breathes: one offset, shared, so it moves as a body and not as
    // N cards that happen to be near each other
    const bob = Math.sin((t / BOB_MS) * Math.PI * 2) * BOB;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      const kt = ease(Math.max(0, Math.min(1, (t - lead(i)) / FLY_MS)));
      const rest = 1 - kt;
      p.g.style.transform =
        `translate(${(p.dx + p.px) * rest}px, ${(p.dy + p.py + bob) * rest}px) `
        + `rotate(${p.rot * rest}deg) scale(${p.s + (1 - p.s) * kt})`;
    }
    if (t < span && !over) return requestAnimationFrame(tick);

    if (over) return;
    for (const p of paths) p.g.style.transform = 'translate(0px, 0px) scale(1)';
    slots.forEach((el) => { el.style.transition = ''; el.style.opacity = '1'; });
    done();

  setTimeout(land, span + 400);          // the way out when no frames arrive
}

const PoolGrid = (cards, down) => Pane(`
  <div ${SCROLL_KEEP} class="${TWO_ROWS}">
    ${cards.map((c) => down && !P.draw.shownAll.includes(c.id) ? PoolBack(c) : PoolFace(c)).join('')}
  </div>`);

/* KEEP OR BIN, at the foot of the list it is deciding the fate of.
   Keep is DEAD until the draw is finished, because a pool is not a pool until you
   have seen it: half a sealed deck kept at booster three is six packs of cards
   you never looked at, and the button offering it there is offering you a mistake.
   Finished means every card turned over — or in round robin, every pick made,
   which is the same statement in that mode's own terms. */
const drawDone = () => {
  if (P.draw.mode === 'robin') return P.draw.picked.length >= P.draw.n;
  const seen = new Set(P.draw.seen || []);
  const deck = allDrawn();
  return deck.length > 0 && deck.every((c) => seen.has(c.id));
};
const KeepOrBin = () => {
  const ready = drawDone();
  const left = P.draw.mode === 'robin' ? P.draw.n - P.draw.picked.length
    : allDrawn().filter((c) => !(P.draw.seen || []).includes(c.id)).length;
  return `
    <div class="shrink-0 border-t border-neutral-800 pt-2">
      ${ready ? '' : `<p class="mb-1.5 text-[10px] leading-snug text-neutral-600">${left} still to ${
        P.draw.mode === 'robin' ? 'pick' : 'turn over'} &mdash; keep opens when the draw is done.</p>`}
      <div class="flex gap-1.5">
        <button ${ready ? 'onclick="keepDraw()"' : 'disabled'}
          class="${BTN_PRIMARY} flex-1 ${ready ? '' : 'cursor-not-allowed opacity-40'}">Keep as deck</button>
        <button onclick="discardDraw()" class="${BTN_DANGER}"
          title="Bin this draw and choose again">Discard</button>
      </div>
    </div>`;
};
/* Discard goes back to the QUESTION, not out of the window. You binned the pool,
   not the set — the next thing you want is another draw of it, and being thrown
   back to the set table to find the same row again is a step nobody asked for.
   Close is still the way out; that one is unchanged. */
function discardDraw() {
  const set = P.draw && P.draw.set;
  if (!set) return leaveDraw();
  P.draw = null;
  P.ask = { set, mode: null, kind: null };
  render();
}

/* The boosters, in the same window the question was asked in. It was its own
   route; clicking Draft on a set therefore navigated, which is the one thing it
   should not do — you want to open a pack and still be looking at the table you
   opened it from. */
const DrawBanner = () => {
  if (!P.draw) return '';
  if (!dealt()) return `
    <div data-draw class="${DRAW_SHELL} items-center justify-center">
      <p class="text-sm text-neutral-400">Fetching the collation for ${P.draw.set}&hellip;</p>
      <p class="mt-1 text-[11px] text-neutral-600">The sheets are per set &mdash; every card's own
        weight on every sheet &mdash; so they are fetched when you open one, not carried on every page.</p>
      <button onclick="closeDraw()" class="${BTN_SECONDARY} mt-4">Close</button>
    </div>`;
  const cards = drawn();
  const robin = P.draw.mode === 'robin';
  const pull = P.draw.mode === 'pull';
  const done = P.draw.shown.length >= cards.length;
  const last = P.draw.pack + 1 >= P.draw.n;
  const over = pull ? false : robin ? P.draw.picked.length >= P.draw.n : (done && last);
  const head = (title, note, right) => `
    <div class="mb-2 flex shrink-0 items-center gap-2 border-b border-neutral-800 pb-1">
      <span class="text-xs font-semibold uppercase tracking-wide text-neutral-400">${title}</span>
      <span class="text-[10px] text-neutral-600">${note}</span>
      <span class="ml-auto flex shrink-0 items-center gap-1.5">${right}</span>
    </div>`;
  const body = P.draw.pack < 0 ? `
      ${head('select a booster', `${P.draw.n} to open &mdash; click one in the fan`, '')}
      ${Beside(`<div class="flex min-h-0 flex-1 items-center justify-center">
        <p class="max-w-xs text-center text-sm leading-relaxed text-neutral-600">
          Click a booster to tear it open.<br>Its cards land here, face down.</p></div>`)}`
    : over ? `
      ${head('the pool', `${pool().length} cards from ${P.draw.n} boosters, mythic first
        &mdash; keeping it makes a deck you can edit like any other`, '')}
      ${Beside(PoolGrid([...pool()].sort((a, b) => (b.rar - a.rar) || (b.foil - a.foil)), false))}`
    : P.draw.all ? (() => {
      const deck = poolOrder();
      const left = deck.filter((c) => !P.draw.shownAll.includes(c.id)).length;
      return `
      ${head('the draw', `${P.draw.n} boosters combined &middot; ${deck.length} cards${
        left ? ` &middot; <span class="text-amber-400">${left} still face down</span> &mdash; the rares are at the end` : ''}`,
        '')}
      ${Beside(PoolGrid(deck, true))}`;
    })() : `
      ${!P.draw.picked.length ? '' : `
        <div class="mb-3 flex shrink-0 items-center gap-2">
          <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">taken</span>
          <span class="flex min-w-0 gap-1 overflow-x-auto">${P.draw.picked.map((c) => `
            <span class="w-10 shrink-0">${MockCard(c)}</span>`).join('')}</span></div>`}
      ${head(pull ? `booster ${P.draw.pack + 1}` : `booster ${P.draw.pack + 1} of ${P.draw.n}`,
        `${cards.length} cards${robin
          ? ` &mdash; ${P.draw.pack} already taken by the other ${P.draw.n - 1} drafters. Turn them all over, then take one.`
          : ' &mdash; click one to turn it over'}`,
        `${done && !last && !robin ? '<span class="text-[10px] text-neutral-600">click the next booster in the fan</span>' : ''}`)}
      ${Beside(Pane(`<div ${SCROLL_KEEP} class="${TWO_ROWS} content-evenly" style="${fitRows(cards.length)}">
        ${cards.map((c, i) => {
          const up = P.draw.shown.includes(i);
          // No slot label here: "Rare / mythic" printed under a face-down card
          // tells you what it is before you turn it over, which is the one thing
          // a reveal cannot do. The pool view labels them — nothing left to give away.
          const take = robin && done;
          // same id shape allDrawn() mints (`pack:slot`), because the fly
          // measures its targets by it and one booster is still a pack
          const at = `data-card-id="${P.draw.pack}:${i}"`;
          return up
            ? (take
              ? `<button ${at} onclick="pickCard(${i})" title="Take this card"
                   class="block h-full cursor-pointer rounded-lg transition hover:-translate-y-1 hover:ring-2 hover:ring-emerald-400">${MockCard(c, true)}</button>`
              : `<span ${at} class="block h-full">${MockCard(c, true)}</span>`)
            : `<button ${at} onclick="revealAt(${i})" title="Turn over"
                 class="block h-full cursor-pointer transition hover:-translate-y-1 hover:brightness-125">${PackBack(true)}</button>`;
        }).join('')}
      </div>`))}
      ${!(robin && done) ? '' : `<p class="mt-2 shrink-0 text-center text-[11px] text-emerald-400">Take one &mdash; the rest passes on.</p>`}`;
  return `
    <div data-draw class="${DRAW_SHELL}">
      <div class="mb-3 flex shrink-0 flex-nowrap items-center gap-3">
        <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">${
          pull ? 'pulling' : robin ? 'drafting' : 'sealed'}</span>
        <span class="truncate text-base font-semibold text-neutral-100">${P.draw.set}</span>
        <span class="shrink-0 text-xs text-neutral-500">${pull ? '' : `${P.draw.n} &times; `}${
          packLabel(P.draw.kind)} &middot; seed ${P.draw.seed}</span>
        <span class="ml-auto flex shrink-0 items-center gap-3">
          <span class="text-xs text-neutral-500"><span class="font-semibold tabular-nums text-neutral-200">${
            num(pool().length)}</span> ${robin ? 'picked' : 'cards'}</span>
          <button onclick="reDraw()" class="${BTN_SECONDARY}">Draw again</button>
          ${ExportInline()}
          <button onclick="closeDraw()" class="${BTN_SECONDARY}">Close</button></span>
      </div>
      <div class="flex min-h-0 flex-1 flex-col">${body}</div>
    </div>`;
};
/* The route itself. Typed cold it is not a page at all — there is no set and no
   question — so render() sends it to the set list rather than painting an empty

/* ======================= THE CARD ======================================
   A card page has to work BEFORE the card is known. An import — a decklist, a
   scanned shelf, a line someone typed — is flat text, and until it's matched to
   a printing the only facts are the ones in that line. So this page has two
   states and the same layout in both: unmatched shows what was parsed and what
   is therefore still unknown; matched fills the anatomy in. Nothing moves
   between the two, so you can see exactly what matching bought you.

   The anatomy fields come from the game registry, not from this page — the
   card view of a new TCG is data, the same as its filter. */
/* Every fact below is read off the card that was opened, not out of a table
   keyed by game: a page that says "Noble Hierarch, Human Druid" no matter which
   card you clicked is a picture of a card page, not a card page. Legality is the
   only fact the fixtures can't carry. */
const LEGALITY = { mtg: 'Modern &middot; Legacy &middot; Vintage &middot; Commander', pokemon: 'Unlimited' };
const FINISH = { mtg: ['Nonfoil', 'Foil'], pokemon: ['Normal', 'Holofoil'] };
const PKM_SETS = { BS: 'Base Set', PGO: 'Pok&eacute;mon GO', SVI: 'Scarlet &amp; Violet', BRS: 'Brilliant Stars' };
// a second printing in another set — the row that makes the set code load-bearing
const REPRINT = { mtg: ['Modern Masters 2015', 'MM2', '167'], pokemon: ['Celebrations', 'CEL', '5'] };

const setName = code => PKM_SETS[code] || (SETS.find(r => r[1] === code) || [])[0] || code;
const finishOf = c => FINISH[cardKey()][c.foil ? 1 : 0];
const factsOf = c => {
  const [head, sub] = (c.type || '').split(' &mdash; ');
  const [pow, tou] = (c.pt || '').split('/');
  const kw = (game().anatomy.find(x => x[1] === 'Keywords') || [])[2] || [];
  return {
    Legality: LEGALITY[cardKey()], Colour: c.col, Language: c.lang, Rarity: rarityName(c.rar),
    Artist: c.art, Illustrator: c.art, Finish: c.foil == null ? '' : finishOf(c),
    // the type line's subtypes are space-separated on the card, one fact each here
    'Mana value': c.cost ? String(manaValue(c)) : '', Type: c.energy || head, Subtype: (sub || '').split(' ').join(' &middot; '),
    Keywords: kw.filter(([k]) => (c.text || '').includes(k)).map(([k]) => k).join(' &middot; '),
    Power: pow, Toughness: tou, HP: c.hp || '', 'Retreat cost': c.retreat ? String(c.retreat) : '',
    'Card type': !head ? '' : /Trainer/.test(head) ? 'Trainer' : /Energy/.test(head) ? 'Energy' : 'Pok&eacute;mon',
    Stage: (head.match(/Basic|Stage 1|Stage 2/) || [''])[0] + (/ ex$/.test(head) ? ' ex' : / V$/.test(head) ? ' V' : ''),
  };
};
const flatTokens = c => [['qty', c.qty || 1], ['name', c.n], c.set && ['set', c.set],
  c.num && ['number', c.num], c.foil && ['finish', 'foil'], c.lang && ['language', c.lang]].filter(Boolean);
const flatLine = c => `${c.qty || 1} ${c.n}${c.set ? ` (${c.set})` : ''}${c.num ? ` ${c.num}` : ''}${
  c.foil ? ' *F*' : ''}${c.lang ? ` [${c.lang}]` : ''}`;
// the printings the flat line could mean — same name, different identity key,
// which is why matching is a choice and not a lookup
const candidatesOf = c => [
  [setName(c.set), c.set, c.num, c.lang, finishOf(c), c.usd],
  [setName(c.set), c.set, c.num, c.lang === 'en' ? 'de' : 'en', finishOf(c), c.usd * 0.9],
  [setName(c.set), c.set, c.num, c.lang, FINISH[cardKey()][c.foil ? 0 : 1], c.usd * (c.foil ? 0.35 : 2.8)],
  [...REPRINT[cardKey()], c.lang, FINISH[cardKey()][0], c.usd * 0.75],
];
const holdingsOf = c => [['binder', cardKey() === 'mtg' ? 'Alara block' : 'Unsorted', c.qty || 1],
  ['deck', cardKey() === 'mtg' ? 'Bant Exalted' : 'Lost Box', 1]];

function openCard(name) { P.card = name; P.matched = false; location.hash = '#/card'; render(); }
function setMatched(v) { P.matched = v; render(); }

const cardKey = () => (P.game === 'pokemon' ? 'pokemon' : 'mtg');
// the whole catalogue, not the rendered slice: opening a card by name has to
// find it whether or not a list happened to draw it
const openedCard = () => ALL().find(c => c.n === P.card) || ALL()[0];
const cardName = () => openedCard().n;

const Fact = (label, value, known) => `
  <div class="flex items-baseline gap-2 border-b border-neutral-900 py-1">

const CardFacts = () => {
  const facts = factsOf(openedCard());
  return game().anatomy.map(x => {
    const label = x[0] === 'combos' ? 'Colour' : x[1];
    const raw = facts[label];
    if (!P.matched) return Fact(label, '&mdash;', false);
    return Fact(label, label === 'Colour' ? `<span class="flex gap-0.5">${pips(raw)}</span>` : (raw || '&mdash;'), !!raw);

};

const FlatSource = () => { const toks = flatTokens(openedCard()); return `

const Candidates = () => `

        <span class="w-16 shrink-0 text-right tabular-nums text-neutral-500">${money(usd)}</span>
        ${P.matched && !i
          ? '<span class="w-16 shrink-0 text-right text-xs font-medium text-emerald-400">matched</span>'
          : `<button onclick="setMatched(true)" class="${BTN_SECONDARY} w-16 shrink-0">Match</button>`}</div>`).join('')}
  </div>`;

const Holdings = () => `
  <div class="${PANEL} overflow-hidden">
    ${holdingsOf(openedCard()).map(([kind, where, qty]) => `
      <div class="flex items-center gap-3 border-b border-neutral-900 px-3 py-2 text-sm">
        <span class="w-14 shrink-0 text-[10px] uppercase tracking-wide text-neutral-600">${kind}</span>
        <span class="min-w-0 flex-1 truncate text-neutral-200">${where}</span>
        <span class="w-6 shrink-0 font-mono text-xs text-neutral-500">${openedCard().lang}</span>
        <span class="w-16 shrink-0 text-xs text-neutral-500">${finishOf(openedCard())}</span>
        <span class="w-8 shrink-0 text-right tabular-nums text-neutral-300">&times;${qty}</span></div>`).join('')}
    <p class="px-3 py-2 text-[11px] text-neutral-600">Holdings are the irreplaceable half &mdash; they survive a re-import, the catalogue does not.</p>
  </div>`;

/* Where the old /preview page lands. It existed because nothing in the app ever
   drew the frame next to the real card, so there was no way to see whether the
   frame was faithful. That's a question about ONE card, and this is the page for
   one card — so the two representations share the image slot and a toggle flips
   between them. It stops being a QA tool and becomes the thing a collector
   actually wants: is this the printing I'm holding?

   Frame is always available, because it is drawn from what the catalogue knows.
   Photo needs a printing, so it is only offered once the line is matched — which
   is the same rule as everything else on this page. */
const FACES = [['frame', 'Frame'], ['photo', 'Photo']];
function setFace(f) { P.face = f; render(); }
const CardFace = () => {
  const c = openedCard();
  // an unmatched line knows one thing: the name. The frame draws exactly that.

    <div class="flex items-center gap-1.5">

    </div>

const ORDER = ['home', 'printings', 'binders', 'decks', 'io', 'search', 'card', 'config', 'kit', 'draw'];
let lastRoute = null;
function render() {
  // ORDER is the whitelist, not just a list: an unknown hash lands on home
  // instead of invoking whatever PAGES happens to inherit (#/toString).
  const k = location.hash.replace('#/', '');
  // no game chosen yet = there is nothing else to show, and a page that needs
  // state it hasn't got is not a route either — #/draw typed cold is a set list
  let route = !P.game ? 'home' : ORDER.includes(k) ? k : 'home';
  // #/draw typed cold is a set list: the page IS the question and the boosters,
  // and with neither there is nothing for it to be
  if (route === 'draw' && !P.ask && !P.draw) route = 'printings';
  // Navigating anywhere drops every selection — a tab always opens on its full
  // list. Compared against lastRoute so that picking an item, which re-renders
  // the same route, doesn't immediately clear itself.
  /* Opening boosters must not cost you your place in the set table — that was
     the whole argument for it being a band rather than a route, and it survives
     the move by exempting the two crossings instead. */
  if (route !== lastRoute && route !== 'draw' && lastRoute !== 'draw') {
    clearPicks();
    /* A binder is ARRANGED — filing it is what putting it in order means — so
       the Binders tab lands on an arrangement instead of an empty bar. The one
       departure from "a fresh page applies nothing on your behalf", and
       deliberate: an order you did not ask for is misleading on a QUERY, where
       it decides what you see first, and is just the shelf on a binder, where
       the cards are the same cards either way.

       Seeded on arrival and taken back on the way out — but only if it was
       never touched. Setting it once and leaving it set carried a six-term
       order onto Search as something the user had never asked for. */
    if (route === 'binders') {
      if (!P.sort.length && !P.sortDraft.length) {
        P.sort = BINDER_SORT.map(t => ({ ...t }));
        P.sortDraft = BINDER_SORT.map(t => ({ ...t }));
      }
    } else if (lastRoute === 'binders' && sortTerms(P.sort) === sortTerms(BINDER_SORT)
               && !sortDirty()) {
      P.sort = [];
      P.sortDraft = [];
    }
  }
  lastRoute = route;
  // the route owns the tab; the selection within it is state
  if (TABS[route]) P.tab = route;
  // a display the new tab doesn't offer can't stay selected — it falls to that
  // tab's default, which is a real one only where there is nothing to choose
  if (!views().some(([v]) => v === P.view)) P.view = defaultView();
  /* The draw grid's sideways scroll is state, and innerHTML is not: turning
     over one card in an 84-card pool re-renders, and without this you are back
     at card 1 every time — 8,617px from the card you just clicked. The reveal
     sweep renders once per card, so it would be fighting this eighty-four
     times over. Carried across by hand because the element is replaced, not
     updated; there is nothing for the browser to preserve it on. */
  const wasAt = document.querySelector('[data-draw-scroll]')?.scrollLeft || 0;
  document.getElementById('app').innerHTML = PAGES[route]();
  if (wasAt) {
    const box = document.querySelector('[data-draw-scroll]');
    if (box) box.scrollLeft = wasAt;
  }
  document.title = 'Draft — ' + route;
  measureGutter();
}
addEventListener('hashchange', render);
// capture, because scroll doesn't bubble — the pane is a different element on
// every page, and this way nothing has to be re-bound after a render
addEventListener('scroll', placeGutter, true);
addEventListener('resize', measureGutter);
setInterval(cyclePacks, 1000);   // ticks; each pack has its own turn inside it
render();
// after the first paint, not before it: the page is useful on the mocks while
// 5 MB is in flight, and re-renders itself when the real catalogue lands
loadCards();
loadPackIndex();   // 3.4 KB: which booster kinds each set actually has
</script>
</body>
</html>
