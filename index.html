    const shut = here.filter((_, j) => !P.draw.shown.includes(j));
    if (shut.length) {
      P.draw.shown = here.map((_, j) => j);
      markSeen(...here.map((_, j) => `${P.draw.pack}:${j}`));
      render();
      await beat(HOLD);
      // render() replaced the fan, so the element clicked is gone; the pack has
      // not advanced, so the same seat in the new fan is the same booster
      el = document.querySelectorAll('[data-booster]')[at];
      if (!el) return;
    }
  }
  await settled([el], 800);          // it has to have stopped before it is opened
  el.style.zIndex = '99';
  await onstage(el);
  flyOpen([el], false);
}
/* IT COMES OUT ONTO THE STAGE BEFORE IT OPENS. A pack torn where it stands in the
   column bursts INSIDE the sidebar, and every card then has to cross the fan, the
   Reveal all button and the tally on its way out - which reads as sloppy because
   it is: the cards are passing through furniture they are supposed to be dealt
   beside. So the one you clicked steps out into the card area first and grows to
   the size the moment deserves, and everything after that happens in open space.

   The move is measured off the UNTRANSFORMED box (`offsetLeft/Top`) and not off a
   rect, because the booster is rotated: a rect answers where the corner ended up,
   while what is wanted is where the centre would be with the rotation unwound -
   which is exactly where it is going, since it squares up on the way. */
async function onstage(el) {
  const shell = document.querySelector('[data-draw]');
  const box = el.offsetParent && el.offsetParent.parentElement;
  if (!shell || !box) return;
  const stage = unzoom(shell.getBoundingClientRect());
  const col = unzoom(box.getBoundingClientRect());
  const par = unzoom(el.offsetParent.getBoundingClientRect());
  const cx = par.left + el.offsetLeft + el.offsetWidth / 2;
  const cy = par.top + el.offsetTop + el.offsetHeight / 2;
  const clear = col.left + col.w + 24;                 // past the column, with a gap
  const to = { x: clear + (stage.left + stage.w - clear) / 2, y: stage.top + stage.h / 2 };
  const grow = Math.max(1, (stage.h * 0.5) / Math.max(1, el.offsetHeight));
  // 50% 50% for this one move: the fan pivots on its base because that is how a
  // fan opens, but a pack walking out to be opened travels by its middle
  el.style.transformOrigin = '50% 50%';
  el.style.transition = 'transform 520ms cubic-bezier(.22, 1, .36, 1)';
  el.style.transform = `translate(${to.x - cx}px, ${to.y - cy}px) scale(${grow.toFixed(3)})`;
  await beat(560);
  el.style.transition = '';            // throttled tabs serve no frames; see openBoosterAt
}
function openAllBoosters() {
  const els = packEls('[data-booster]');
  if (els.length) return flyOpen(els, true);
  // no fan to tear (a set with no pack photographs) - the draw still combines
  openTheLot();
  render();
}
// six packs at once is not "the next pack" six times: there is no next, the whole
// draw is simply open, and every card in it is face down until you turn it over
function openTheLot() {
  P.draw.pack = 0;
  P.draw.shown = [];
  P.draw.shownAll = [];
  P.draw.all = true;
}

/* OPENING THE NEXT ONE IS THE SAME EVENT AS OPENING THE FIRST. There used to be
   a `Next booster` button, which made the second pack a different kind of thing
   from the first: one you clicked a picture to get, one you clicked a word. Now
   the sidebar's fan is the control - the packs you have not opened are still
   there, still clickable, and clicking one runs this whole routine again against
   the next pack in the draw. `cont` is the only difference: the draw already
   exists, so it advances rather than being created, and `seen` survives because
   the object is mutated rather than replaced. */
async function flyOpen(els, all) {
  if (P.opening) return;
  const cont = !P.ask && !!P.draw;
  if (!P.ask && !cont) return;
  P.opening = true;                  // one open at a time, however fast you click
  try {
    /* STAGE 0 - the boosters have to have STOPPED. Picking a mode walks them to
       the left over half a second, and a click landing in the middle of that
       measures a rect the booster is still leaving: the placeholders then spawn
       beside the pack rather than inside it. Asked of the elements, not assumed
       from a number. */
    await settled(els, 800);

    // The draw, computed and held: the count of placeholders is the count of
    // cards, and only a dealt pack knows that. Nothing is painted yet, so the
    // wrappers we are about to measure are still on screen.
    let cards;
    if (cont && all) {
      /* OPEN ALL IS NOT "NEXT PACK" SIX TIMES. It used to be reached only from the
         question, where no draw existed yet and the `else` below built one with
         `all` set. A draw now exists the moment a mode is picked, so this arm is
         the one Open all takes, and stepping the pack counter here opened exactly
         one booster and called it the lot. */
      openTheLot();
      cards = allDrawn();
    } else if (cont) {
      // a pull has no length, so opening another lengthens it; every other mode
      // already knows how many it holds and only moves along
      openNext();
      cards = (drawn() || []).map((c, j) => ({ ...c, id: `${P.draw.pack}:${j}` }));
    } else {
      const [, , , n] = modeRow(P.ask.mode);
      P.draw = { ...P.ask, n, pack: 0, shown: [], shownAll: [], picked: [], seen: [], all,
                 seed: Date.now() & 0xffff };
      cards = all ? allDrawn() : (drawn() || []).map((c, j) => ({ ...c, id: `0:${j}` }));
    }
    if (!cards.length) { P.ask = null; render(); return; }
    /* ONE PILE, at the FRONT of the fan, whichever pack or packs are being
       opened. Open all tears all six where they stand - they are the fan and
       that is the shot - but their cards come off a single stack at the front
       booster's anchor rather than six stacks strung out across the fan. Six
       origins means five of them are right of the grid's first slot, and cards
       from those have to fly left to reach it; one origin at the front cannot.
       Single open gets here already correct: openBoosterAt has walked the pack
       you clicked to that same front slot. */
    /* Open all tears its six where they stand - they are the fan and that is the
       shot - but the pile they feed still forms out on the stage rather than
       inside the column, for the same reason the single open walks out there:
       cards crossing the sidebar on their way out look like a mistake. */
    const stage = unzoom(document.querySelector('[data-draw]').getBoundingClientRect());
    const one = unzoom(els[0].getBoundingClientRect());
    const at = all
      ? { left: stage.left + stage.w / 2 - one.w / 2, top: stage.top + stage.h / 2 - one.h / 2,
          w: one.w, h: one.h }
      : one;
    const root = document.createElement('div');
    root.style.cssText = 'position:fixed;inset:0;z-index:39;pointer-events:none;';
    document.body.appendChild(root);
    const ghosts = cards.map((c) => {
      const wrap = document.createElement('div');
      wrap.innerHTML = PackBack(false);
      const g = wrap.firstElementChild;
      // a lift and a rim: a bare card back is neutral-900 on neutral-950 and the
      // motion simply does not read against it
      g.style.cssText = `position:absolute;left:${at.left}px;top:${at.top}px;width:${at.w}px;`
        // bottom centre, so the stack splays from its base exactly as the fan of
        // boosters does - and so the grow-to-full-size reads as rising out of it
        + `transform:scale(${GHOST_SCALE});transform-origin:50% 100%;`
        + 'box-shadow:0 10px 30px rgba(0,0,0,.7);outline:1px solid rgba(255,255,255,.10);';
      root.appendChild(g);
      return { g, at, id: c.id };
    });

    /* STAGE 1 - the wrappers go. Staggered only when there are several: a tight
       stagger reads as "they all burst", a slow one as a parade, and the parade
       is the fly's job. Waited on by asking them, so the margin is however long
       the fade actually took rather than ten milliseconds of hope. */
    const stagger = els.length > 1 ? 60 : 0;
    els.forEach((el, i) => tearOpen(el, i * stagger));
    /* A floor as well as a ceiling. Asking the elements is the accurate answer
       WHEN THERE IS ONE - but an element carrying no animation answers
       "finished" instantly and truthfully, and a stage that can collapse to
       nothing is not a stage. The floor is the fade's own length from
       foil.css plus the stagger it was dealt. */
    await atLeast(settled(els, (els.length - 1) * stagger + OPEN_MS),
                  (els.length - 1) * stagger + 700);
    await beat();

    /* STAGE 2 - the draw is painted, and then given a frame to lay itself out.
       flyGhosts measures every slot in it; measuring a DOM the browser has not
       laid out yet is the same mistake as measuring a moving booster. */
    P.ask = null; P.dealing = true; render();
    /* HIDDEN IN THE SAME TICK THEY ARE PAINTED IN. flyGhosts hides these too, and
       used to be the only thing that did - but it runs two frames and a beat
       later, and the browser paints in between. So the cards appeared in their
       slots, vanished, and then flew in: the arrival happened before the journey.
       render() is synchronous and no paint can land between it and this line. */
    hideSlots();
    await laid();
    await beat();
    flyGhosts(root, ghosts, all);
  } finally {
    P.opening = false;
  }
}

// opacity, not display: the slots keep their boxes, so the grid is at its final
// width before anything moves and the scroll has nothing to bounce off
const hideSlots = () => qsa('[data-card-id]')
  .forEach((el) => { el.style.transition = 'none'; el.style.opacity = '0'; });

/* THE DEAL'S OWN WAY TO FINISH EARLY. `land()` already exists as the ending the
   loop reaches and as the timer's way out when a background tab serves no
   frames; Skip to End is a third caller of the same thing, so it is a handle on
   it rather than a second ending. Cleared when the deal is over, which is what
   makes the button safe to press twice. */
let SKIP = null;
function skipDeal() { const end = SKIP; if (end) end(); }

function flyGhosts(root, ghosts, all) {
  /* The fly is decoration; the cards arriving is not. Chrome serves no frames
     to a background tab, so an rAF loop there simply never runs - and since the
     loop is what hands the real cards their opacity back, without a way out
     you switch tabs mid-open and come back to an empty pane behind frozen
     placeholders. Hence: one guarded finish, reachable from the loop or from a
     timer, whichever gets there first. */
  let over = false;
  /* STAGE 4 - the handover, in three beats rather than one tick. The real cards
     come up UNDERNEATH the ghosts first (identical picture, so nothing flickers),
     then the ghosts go, and only then does the reveal sweep begin. Done together
     the fly's last frame and the sweep's first render land on the same frame and
     the arrival is never seen at all - the cards simply are there. */
  const done = async () => {
    if (over) return;
    over = true;
    SKIP = null;
    await beat();
    root.remove();
    /* Rendered HERE and nowhere earlier. The ghosts fly to rects measured off
       the real slots, so a render mid-flight replaces the very elements `land`
       has to hand their opacity back to, and the cards stay invisible behind
       finished placeholders. Once the root is gone there is nothing pointing at
       them any more. */
    P.dealing = false;
    render();
    if (!all) return;
    await beat(HOLD);
    // left to right, because the deal left the view at the left and did not
    // move it. Every stage of this now travels the same way.
    revealSequential(false);
  };
  if (!P.draw) { done(); return; }
  const slots = new Map([...document.querySelectorAll('[data-card-id]')]
    .map((el) => [el.dataset.cardId, el]));
  if (!slots.size) { done(); return; }
  hideSlots();
  const box = [...slots.values()][0].closest('[data-draw-scroll]');
  /* THE CARDS FLY UNDER THE FURNITURE. They were parented to <body>, so once
     they came out to fly they were above the whole page - including the rail
     they are supposed to be dealt FROM, which put the cards on top of the
     boosters and made the pile look like it was behind its own output.

     Moving the root into the draw itself is what makes that impossible rather
     than merely unlikely: inside the shell's stacking context a z-index of 20
     cannot reach the rail's 50 whatever else happens, while still clearing the
     card grid, which claims no layer at all. It stays `position: fixed`, and
     fixed is still measured against the viewport in here - `zoom` on <body>
     does not create a containing block the way a transform would, which is the
     one property of this that had to be checked rather than assumed. */
  const shell = document.querySelector('[data-draw]');
  if (shell) shell.appendChild(root);
  root.style.zIndex = '20';
  const paths = [];
  for (const { g, at, id } of ghosts) {
    const el = slots.get(id);
    if (!el) { g.remove(); continue; }
    const r = unzoom(el.getBoundingClientRect());
    // Re-anchored to the slot it is going to, then thrown back to the booster
    // it came from: identical pixels on screen, but now one transform from
    // home, so the loop below only has to walk that transform to zero.
    const s = GHOST_SCALE * Math.min(at.w / r.w, at.h / r.h);
    const dx = (at.left + at.w / 2) - (r.left + r.w / 2);
    const dy = (at.top + at.h / 2) - (r.top + r.h / 2);
    g.style.left = `${r.left}px`; g.style.top = `${r.top}px`;
    g.style.width = `${r.w}px`; g.style.height = `${r.h}px`;
    g.style.transform = `translate(${dx}px, ${dy}px) scale(${s})`;
    paths.push({ g, dx, dy, s });
  }
  if (!paths.length) { done(); return; }
  /* One rAF loop for all of them rather than N CSS transitions, for one
     reason: the ghosts are position:fixed and the grid underneath SCROLLS, so
     every slot moves left by the scroll delta while its ghost is in the air. A
     transition cannot be told that mid-flight; a loop just subtracts it. */
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  /* NOTHING MOVES LEFT. The deal used to scroll the grid to chase its own
     frontier, and because the ghosts are `position: fixed` while their slots
     are not, every card that had already landed had to be translated left by
     the scroll delta to stay glued to its slot. The arithmetic was right and
     the motion was wrong: what you saw was the dealt cards sliding backwards
     under the ones still arriving.

     So the deal does not scroll at all. Cards leave the pile and travel right,
     full stop - a card bound for a slot past the edge simply flies off it, which
     is still rightward. The scroll is the REVEAL's to do afterwards, and it
     runs left to right for the same reason. */
  /* ONE AT A TIME OFF THE STACK, not all at once. The capture is unambiguous
     about this: the backs sit as a tilted pile where the pack burst and cards
     PEEL OFF IT, one every four or five frames, each flying out to its place
     while the rest wait their turn - the pile visibly shrinks as it goes. Sent
     together they read as a spray, and you cannot see that they came from
     anywhere; sent in order there is a stack being dealt from, which is the
     whole thing being depicted.

     Each card therefore carries its own clock offset, and z-index descends so
     the one still to leave is on top of the pile rather than under it. */
  const lead = (i) => i * DEAL_MS;
  const span = FLY_MS + lead(paths.length - 1);
  /* A FAN, not N cards at one point - the same shape the boosters make, because
     it is the same gesture. Stacked exactly on top of each other they are
     indistinguishable from a single card and the deal looks like one card
     endlessly cloning itself; splayed, there is visibly a stack, and it visibly
     shrinks as it is dealt from. Same pivot as the booster fan (bottom centre,
     set on the ghosts themselves) so it splays from its base rather than pinwheeling.

     THE FAN OPENS ONE WAY, LEFT. Every offset here washes out as the card flies
     - it is multiplied by (1 - kt) so the card still lands exactly on its slot -
     which means the offset IS the direction of travel, backwards. A card sitting
     right of the anchor, or rotated the other way, unwinds LEFT. So the whole
     fan is held at or behind the anchor and rotated one way only, and rightward
     travel is arithmetic rather than something to keep re-measuring.

     `k` runs 0 at the front of the pile to 1 at the back, so the fan tightens as
     it is dealt away instead of the survivors keeping a gap where a card was. */
  const last = Math.max(1, paths.length - 1);
  paths.forEach((p, i) => {
    p.g.style.zIndex = String(paths.length - i);   // the next to leave, on top
    const k = i / last;
    p.rot = -k * 22;                               // NEVER POSITIVE
    p.px = -k * 34;                                // NEVER POSITIVE
    p.py = -k * 26 - i * 0.6;                      // and a little thickness with it
  });
  const BOB = 8, BOB_MS = 900;
  const t0 = performance.now();
  const tick = (now) => {
    const t = now - t0;

    // the heap breathes: one offset, shared, so it moves as a body and not as
    // N cards that happen to be near each other
    const bob = Math.sin((t / BOB_MS) * Math.PI * 2) * BOB;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      const kt = ease(Math.max(0, Math.min(1, (t - lead(i)) / FLY_MS)));
      const rest = 1 - kt;
      p.g.style.transform =
        `translate(${(p.dx + p.px) * rest}px, ${(p.dy + p.py + bob) * rest}px) `
        + `rotate(${p.rot * rest}deg) scale(${p.s + (1 - p.s) * kt})`;
    }
    if (t < span && !over) return requestAnimationFrame(tick);
    land();
  };
  const land = () => {
    if (over) return;
    for (const p of paths) p.g.style.transform = 'translate(0px, 0px) scale(1)';
    slots.forEach((el) => { el.style.transition = ''; el.style.opacity = '1'; });
    done();
  };
  SKIP = land;
  requestAnimationFrame(tick);
  setTimeout(land, span + 400);          // the way out when no frames arrive
}
/* THE SIDEBAR IS THE FAN AND THE TALLY. It was briefly a column of 186px pack
   thumbnails, which was a second and smaller account of something the cards were
   already saying; it is now the two things the card area cannot hold.

   TOP: the fan itself, the same six boosters in the same order, painted in the
   state it settled into rather than re-walked - see `Fan(mode, live)`. Which
   ones are spent is the fade, so the progress the thumbnails were for is carried
   by the picture that was going to be there anyway.

   BOTTOM: every card turned over so far, rarest first, as Compact rows - name
   and mana cost, which is all Compact ever was. It accumulates across boosters
   (`markSeen`), so moving to the next pack does not throw away what the last one
   gave you, which is the one thing the grid genuinely cannot show: the grid is
   THIS booster, the list is the draw.

   And it is a fixed width. That is the point of putting both here: the card area
   is then the same shape for one booster as for a combined draw, so the stack
   can be dealt into it without the animation having to know which view it is
   flying into. `relative z-50` for the same reason the old rail had it - the
   ghosts fly at z-20 inside this shell, and a positioned overlay would otherwise
   paint straight over an unpositioned column. */
const DrawTitleRow = (c) => `
  <div onclick="openCard('${jsArg(c.n)}','${jsArg(printKey(c))}')" title="Open ${jsArg(c.n)}"
    class="flex cursor-pointer items-center gap-2 border-b border-neutral-900 px-2 py-1
           text-xs hover:bg-neutral-900/60">
    ${rarityMark(c)}
    <span class="min-w-0 flex-1 truncate text-neutral-200">${c.n}</span>
    <span class="flex shrink-0 gap-0.5">${(c.cost || []).map(costPip).join('') || pips(c.col || '')}</span>
  </div>`;
const RevealedList = () => {
  const seen = new Set(P.draw.seen || []);
  // rarest first, the same order the pool itself is dealt in - so the thing you
  // are hoping for is at the top of the list rather than buried in the commons
  const cards = allDrawn().filter((c) => seen.has(c.id))
    .sort((a, b) => (b.rar - a.rar) || (b.foil - a.foil) || a.n.localeCompare(b.n));
  if (!cards.length) return `<p class="px-2 py-2 text-[11px] leading-snug text-neutral-600">
    Nothing turned over yet. Every card you reveal lands here, rarest first, and stays
    as you work through the boosters.</p>`;
  return `
    <div class="mb-1 flex items-baseline gap-2 border-b border-neutral-800 px-2 pb-1">
      <span class="text-[10px] font-semibold uppercase tracking-wide text-neutral-600">revealed</span>
      <span class="text-[10px] tabular-nums text-neutral-500">${cards.length}</span></div>
    ${cards.map(DrawTitleRow).join('')}`;
};
const DrawSide = () => {
  const fan = Fan(P.draw.mode, false);
  /* The two things the question used to ask under the chooser, asked here instead
     - and only while nothing is open, because both change what a pack IS and a
     pack you have already turned over cannot be re-collated. */
  const fresh = P.draw.pack < 0;
  const kinds = fresh ? packsForMode(P.draw.set, P.draw.mode) : [];
  const pick = P.draw.mode === 'pull' && kinds.length > 1 ? `
    <div class="shrink-0">
      <p class="mb-1 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">which booster</p>
      <div class="flex flex-wrap gap-1">${kinds.map((k) => `
        <button onclick="setPackKind('${k}')" class="${P.draw.kind === k ? CHIP_PLUS : CHIP_NEUTRAL}">${
          packLabel(k)}</button>`).join('')}</div>
    </div>` : '';
  const all = fresh && P.draw.mode === 'complete' ? `
    <button onclick="openAllBoosters()" class="${BTN_SECONDARY} shrink-0"
      title="Tear all six at once">Open all</button>` : '';
  return `
  <div class="relative z-50 flex w-[280px] shrink-0 flex-col gap-2 border-r border-neutral-800 pr-3">
    <!-- Everything in Fan is measured in cqh, but the only fixed dimension of this
         column is its WIDTH - so the box's height is what has to be solved for, and a
         plain percentage of the pane overflows the column the taller the window gets.
         Measured against the sidebar's 268px of usable width, as a multiple of the
         box's own height: a sealed SIX comes out 1.10 wide, a pull 1.02, a draft three
         0.86. Sized for the widest, so no mode can overflow and the narrower ones land
         inside it - the count matters more than the step, which is why the pull is not
         the widest despite being stepped hardest. The percentage is the cap for a short
         window, not the ruler - and it is a VIEWPORT unit rather than a percentage so that
         this box and the ask's compute identically. A percentage resolves against each
         one's own parent, and those differ, which put the two fans 7px and 24px apart
         and made clicking a booster jump the thing that was supposed to stay put. -->
    ${!fan ? '' : `<div class="shrink-0 [container-type:size]" style="height: min(228px, 26vh)">${
      fan}</div>`}
    ${pick}${all}
    <!-- ONE BUTTON, TWO JOBS, AND NEVER BOTH AT ONCE. While the cards are being
         dealt the only useful verb is "stop waiting": the capture reads Skip to
         End there, and only once they are all down does it become Reveal All.
         Ours offered Reveal all throughout, including mid-fly, where pressing it
         fought the animation - reveal() guards on P.opening, and that goes false
         the moment flyGhosts is CALLED rather than when it finishes, because it
         is not awaited. P.dealing is the flag that actually spans the deal.
         Skip also has to exist for Open all, the case that most needs it (84
         cards) and the one that offers no Reveal all at all, so these are two
         conditions rather than one label swap. -->
    ${P.dealing ? `
      <button onclick="skipDeal()" data-reveal class="${BTN_SECONDARY} shrink-0"
        title="Put every card straight into its slot">Skip to End</button>`
      : fresh || P.draw.mode === 'robin' || P.draw.all || drawDone() ? '' : `
      <button onclick="reveal()" data-reveal class="${BTN_SECONDARY} shrink-0"
        title="Skip the filler &mdash; commons and uncommons turn themselves over">Reveal all</button>`}
    <div class="min-h-0 flex-1 overflow-y-auto">${RevealedList()}</div>
    ${KeepOrBin()}
  </div>`;
};
// the sidebar holds still at one width; the cards take everything else
const Beside = (grid) => `<div class="flex min-h-0 flex-1 gap-3">${DrawSide()}${grid}</div>`;

/* THE QUESTION IS NOW ONLY THE QUESTION. It used to grow a second half once a
   mode was picked - a player-count strip, a kind picker, an "Open all" - because
   picking a mode left you on this page with nothing to do. It doesn't any more:
   answering it opens the draw, and the two controls that were real (which booster
   a pull pulls, and Open all) moved into the sidebar where the boosters are. */
const DrawAsk = () => !P.ask ? '' : `
  <div data-draw class="${DRAW_SHELL}">
      <div class="mb-4 flex shrink-0 items-baseline gap-3">
        <span class="text-[10px] font-semibold uppercase tracking-wide text-neutral-600">Opening boosters</span>
        <span class="truncate text-lg font-semibold text-neutral-100">${P.ask.set}</span>
        <button onclick="cancelDraw()" class="${BTN_SECONDARY} ml-auto shrink-0">Close</button>
      </div>
      <p class="mb-3 shrink-0 text-sm font-semibold text-neutral-300">What are you opening them for?</p>
      <div class="grid min-h-0 flex-1 gap-4 sm:grid-cols-3">
        ${MODES.map(([m, label, what, n]) => `
          <div class="flex min-h-0 flex-col gap-3">
            <button onclick="setPackMode('${m}')"
              class="shrink-0 rounded-xl border border-neutral-800 bg-neutral-900/60 p-4 text-left
                     transition hover:border-neutral-600">
              <span class="block text-base font-semibold text-neutral-100">${label}</span>
              <span class="mt-1 block text-2xl font-bold tabular-nums text-neutral-400">${
                m === 'pull' ? '&infin;' : n}<span class="ml-1 text-[11px] font-normal uppercase tracking-wide text-neutral-600">${
                m === 'pull' ? 'no limit' : 'boosters'}</span></span>
              <span class="mt-2 block text-[11px] leading-snug text-neutral-500">${what}</span>
            </button>
            <!-- Three comparable previews, so all three sit centred in their own
                 panel and none of them is clickable: the choice on this page is
                 the FORMAT, and a booster you can click before you have made it is
                 a second answer to a question with one. -->
            <div class="flex flex-1 items-center justify-center overflow-hidden rounded-xl
                 border border-neutral-800 bg-neutral-900/40 p-3 [container-type:size]">${Fan(m)}</div>
          </div>`).join('')}
      </div>
  </div>`;

// face down until you turn it over - the only reason a reveal reads as a reveal
const PackBack = (fit) => `
  <div class="aspect-[5/7] ${fit ? 'h-full w-auto' : 'w-full'} rounded-lg border border-neutral-800 bg-neutral-900
    [background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03)_0_6px,transparent_6px_12px)]"></div>`;

/* The same shape as a booster - cards at the size you can read them, filling the
   pane - except there are eighty of them, so it scrolls down instead of sizing
   its rows to fit. `down` is what's still face down; in a finished round robin
   that's nothing, because you chose every card in it. */
/* TWO ROWS, running left to right. A booster laid out down the page is a list
   of cards; laid out across, in two rows the height of the window, it is a pack
   you are opening - the cards stay as big as the window allows however many
   there are, and more of them just means further to scroll. Columns hug their
   card (`auto-cols-min` against a card that is `h-full w-auto` inside a row of
   definite height), so nothing has to know how many cards a booster holds. */
const TWO_ROWS = 'grid min-h-0 flex-1 auto-cols-min grid-flow-col grid-rows-2 gap-2 overflow-x-auto overflow-y-hidden pb-2';
/* A SINGLE PACK FITS THE WINDOW, because fourteen cards is seven columns of two
   and there is no reason to scroll for that. The card takes whichever of the two
   limits runs out first - half the pane's height, or a seventh of its width -
   and both are container units, so nothing is measured, nothing is told the
   window resized, and no count is hard-coded: the columns fall out of the cards
   in hand.

   Only where the grid holds ONE booster. A combined draw is eighty-four cards
   over forty-two columns, and shrinking that to fit turns every card into a
   stamp - that one is meant to scroll, and still does. The flag is passed rather
   than inferred from a card count, because "this is one pack" is something the
   caller knows and a threshold would only be guessing at. */
const GAP = 8;                                    // gap-2, in px
const fitRows = (n) => {
  const cols = Math.ceil(n / 2);
  /* BOTH axes are stated, and that is not belt and braces. Left as
     `auto-cols-min`, the column width is the card's min-content, the card's
     width comes from its aspect ratio off its height, and its height is a
     percentage of the row - which is circular, so the browser gives up and
     falls back to an intrinsic size. Measured: a 250px row with a 201px card
     sitting in it and a third of the pane empty below. Give the column a
     definite width and the row a definite height and there is nothing to
     resolve: the card fills the cell exactly.
     1.4 is 7/5, the card's own aspect, turned from a width back into a height. */
  return `--ch: min(calc((100cqh - ${GAP}px) / 2),`
    + ` calc((100cqw - ${(cols - 1) * GAP}px) / ${cols} * 1.4));`
    + ' grid-template-rows: var(--ch) var(--ch); grid-auto-columns: calc(var(--ch) / 1.4);';
};
// the grid in a box that can be asked its own size - cqh/cqw need a size container
const Pane = (grid) => `<div class="flex min-h-0 flex-1 [container-type:size]">${grid}</div>`;
// what render() carries the sideways scroll across on - see there for why
const SCROLL_KEEP = 'data-draw-scroll';
// `data-card-id` lets the sequential reveal scroll the freshly flipped card
// into view - a CSS scrollIntoView lands smoother than tracking positions.
/* The two faces of a pool slot, named because the reveal sweep swaps one for
   the other IN PLACE - it cannot re-render the page to turn over one card. */
const PoolBack = (c) => `<button data-card-id="${c.id}" onclick="revealOne('${c.id}')" title="Turn over"
  class="block h-full cursor-pointer transition hover:-translate-y-1 hover:brightness-125">${PackBack(true)}</button>`;
const PoolFace = (c) => `<a data-card-id="${c.id}" onclick="openCard('${jsArg(c.n)}')"
  class="block h-full cursor-pointer">${MockCard(c, true)}</a>`;
const PoolGrid = (cards, down) => Pane(`
  <div ${SCROLL_KEEP} class="${TWO_ROWS}">
    ${cards.map((c) => down && !P.draw.shownAll.includes(c.id) ? PoolBack(c) : PoolFace(c)).join('')}
  </div>`);

/* KEEP OR BIN, at the foot of the list it is deciding the fate of.
   Keep is DEAD until the draw is finished, because a pool is not a pool until you
   have seen it: half a sealed deck kept at booster three is six packs of cards
   you never looked at, and the button offering it there is offering you a mistake.
   Finished means every card turned over - or in round robin, every pick made,
   which is the same statement in that mode's own terms. */
const drawDone = () => {
  if (P.draw.mode === 'robin') return P.draw.picked.length >= P.draw.n;
  const seen = new Set(P.draw.seen || []);
  const deck = allDrawn();
  return deck.length > 0 && deck.every((c) => seen.has(c.id));
};
const KeepOrBin = () => {
  const ready = drawDone();
  const left = P.draw.mode === 'robin' ? P.draw.n - P.draw.picked.length
    : allDrawn().filter((c) => !(P.draw.seen || []).includes(c.id)).length;
  return `
    <div class="shrink-0 border-t border-neutral-800 pt-2">
      ${ready ? '' : `<p class="mb-1.5 text-[10px] leading-snug text-neutral-600">${left} still to ${
        P.draw.mode === 'robin' ? 'pick' : 'turn over'} &mdash; keep opens when the draw is done.</p>`}
      <div class="flex gap-1.5">
        <button ${ready ? 'onclick="keepDraw()"' : 'disabled'}
          class="${BTN_PRIMARY} flex-1 ${ready ? '' : 'cursor-not-allowed opacity-40'}">Keep as deck</button>
        <button onclick="discardDraw()" class="${BTN_DANGER}"
          title="Bin this draw and choose again">Discard</button>
      </div>
    </div>`;
};
/* Discard goes back to the QUESTION, not out of the window. You binned the pool,
   not the set - the next thing you want is another draw of it, and being thrown
   back to the set table to find the same row again is a step nobody asked for.
   Close is still the way out; that one is unchanged. */
function discardDraw() {
  const set = P.draw && P.draw.set;
  if (!set) return leaveDraw();
  P.draw = null;
  P.ask = { set, mode: null, kind: null };
  render();
}

/* The boosters, in the same window the question was asked in. It was its own
   route; clicking Draft on a set therefore navigated, which is the one thing it
   should not do - you want to open a pack and still be looking at the table you
   opened it from. */
const DrawBanner = () => {
  if (!P.draw) return '';
  if (!dealt()) return `
    <div data-draw class="${DRAW_SHELL} items-center justify-center">
      <p class="text-sm text-neutral-400">Fetching the collation for ${P.draw.set}&hellip;</p>
      <p class="mt-1 text-[11px] text-neutral-600">The sheets are per set &mdash; every card's own
        weight on every sheet &mdash; so they are fetched when you open one, not carried on every page.</p>
      <button onclick="closeDraw()" class="${BTN_SECONDARY} mt-4">Close</button>
    </div>`;
  const cards = drawn();
  const robin = P.draw.mode === 'robin';
  const pull = P.draw.mode === 'pull';
  const done = P.draw.shown.length >= cards.length;
  const last = P.draw.pack + 1 >= P.draw.n;
  const over = pull ? false : robin ? P.draw.picked.length >= P.draw.n : (done && last);
  const head = (title, note, right) => `
    <div class="mb-2 flex shrink-0 items-center gap-2 border-b border-neutral-800 pb-1">
      <span class="text-xs font-semibold uppercase tracking-wide text-neutral-400">${title}</span>
      <span class="text-[10px] text-neutral-600">${note}</span>
      <span class="ml-auto flex shrink-0 items-center gap-1.5">${right}</span>
    </div>`;
  const body = P.draw.pack < 0 ? `
      ${head('select a booster', `${P.draw.n} to open &mdash; click one in the fan`, '')}
      ${Beside(`<div class="flex min-h-0 flex-1 items-center justify-center">
        <p class="max-w-xs text-center text-sm leading-relaxed text-neutral-600">
          Click a booster to tear it open.<br>Its cards land here, face down.</p></div>`)}`
    : over ? `
      ${head('the pool', `${pool().length} cards from ${P.draw.n} boosters, mythic first
        &mdash; keeping it makes a deck you can edit like any other`, '')}
      ${Beside(PoolGrid([...pool()].sort((a, b) => (b.rar - a.rar) || (b.foil - a.foil)), false))}`
    : P.draw.all ? (() => {
      const deck = poolOrder();
      const left = deck.filter((c) => !P.draw.shownAll.includes(c.id)).length;
      return `
      ${head('the draw', `${P.draw.n} boosters combined &middot; ${deck.length} cards${
        left ? ` &middot; <span class="text-amber-400">${left} still face down</span> &mdash; the rares are at the end` : ''}`,
        '')}
      ${Beside(PoolGrid(deck, true))}`;
    })() : `
      ${!P.draw.picked.length ? '' : `
        <div class="mb-3 flex shrink-0 items-center gap-2">
          <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">taken</span>
          <span class="flex min-w-0 gap-1 overflow-x-auto">${P.draw.picked.map((c) => `
            <span class="w-10 shrink-0">${MockCard(c)}</span>`).join('')}</span></div>`}
      ${head(pull ? `booster ${P.draw.pack + 1}` : `booster ${P.draw.pack + 1} of ${P.draw.n}`,
        `${cards.length} cards${robin
          ? ` &mdash; ${P.draw.pack} already taken by the other ${P.draw.n - 1} drafters. Turn them all over, then take one.`
          : ' &mdash; click one to turn it over'}`,
        `${done && !last && !robin ? '<span class="text-[10px] text-neutral-600">click the next booster in the fan</span>' : ''}`)}
      ${Beside(Pane(`<div ${SCROLL_KEEP} class="${TWO_ROWS} content-evenly" style="${fitRows(cards.length)}">
        ${cards.map((c, i) => {
          const up = P.draw.shown.includes(i);
          // No slot label here: "Rare / mythic" printed under a face-down card
          // tells you what it is before you turn it over, which is the one thing
          // a reveal cannot do. The pool view labels them - nothing left to give away.
          const take = robin && done;
          // same id shape allDrawn() mints (`pack:slot`), because the fly
          // measures its targets by it and one booster is still a pack
          const at = `data-card-id="${P.draw.pack}:${i}"`;
          return up
            ? (take
              ? `<button ${at} onclick="pickCard(${i})" title="Take this card"
                   class="block h-full cursor-pointer rounded-lg transition hover:-translate-y-1 hover:ring-2 hover:ring-emerald-400">${MockCard(c, true)}</button>`
              : `<span ${at} class="block h-full">${MockCard(c, true)}</span>`)
            : `<button ${at} onclick="revealAt(${i})" title="Turn over"
                 class="block h-full cursor-pointer transition hover:-translate-y-1 hover:brightness-125">${PackBack(true)}</button>`;
        }).join('')}
      </div>`))}
      ${!(robin && done) ? '' : `<p class="mt-2 shrink-0 text-center text-[11px] text-emerald-400">Take one &mdash; the rest passes on.</p>`}`;
  return `
    <div data-draw class="${DRAW_SHELL}">
      <div class="mb-3 flex shrink-0 flex-nowrap items-center gap-3">
        <span class="shrink-0 text-[10px] font-semibold uppercase tracking-wide text-neutral-600">${
          pull ? 'pulling' : robin ? 'drafting' : 'sealed'}</span>
        <span class="truncate text-base font-semibold text-neutral-100">${P.draw.set}</span>
        <span class="shrink-0 text-xs text-neutral-500">${pull ? '' : `${P.draw.n} &times; `}${
          packLabel(P.draw.kind)} &middot; seed ${P.draw.seed}</span>
        <span class="ml-auto flex shrink-0 items-center gap-3">
          <span class="text-xs text-neutral-500"><span class="font-semibold tabular-nums text-neutral-200">${
            num(pool().length)}</span> ${robin ? 'picked' : 'cards'}</span>
          <button onclick="reDraw()" class="${BTN_SECONDARY}">Draw again</button>
          ${ExportInline()}
          <button onclick="closeDraw()" class="${BTN_SECONDARY}">Close</button></span>
      </div>
      <div class="flex min-h-0 flex-1 flex-col">${body}</div>
    </div>`;
};
/* The route itself. Typed cold it is not a page at all - there is no set and no
   question - so render() sends it to the set list rather than painting an empty
   shell; see there. */
PAGES.draw = () => P.ask ? DrawAsk() : DrawBanner();

const BrowsePage = () => {
  // an open selector owns the window, so there is no page beneath to render -
  // clipping one we'd never see costs nodes for nothing
  if (tab().one && selectorOpen()) return `${TopNav(P.tab, Stats(STATS[P.tab](picked())))}${Selector()}`;
  return Frame(P.tab, {
    stats: Stats(STATS[P.tab](picked())),
    sub: Selector(),
    /* A binder carries no filter. It was MADE by one - a set binder, or a fixed
       combination chosen once - so narrowing it afterwards asks a question the
       binder has already answered. Looking for a card is what Search and
       Printings are; a binder is where you go to see what you put in it. */
    body: `<div class="flex flex-wrap items-start gap-6">
      ${P.tab === 'binders' ? '' : `<div class="${PANEL} w-[21rem] shrink-0 px-3 pt-3 pb-3">
        ${Band('filter', AnatomyFilter(), {
          /* Apply-gated, the same as the sort bar: clicking chips composes a
             filter and nothing narrows until you say so. Dimmed when the draft
             and the applied filter already agree, which is the only honest
             state for a button that would do nothing. */
          right: `<button onclick="applyFilter()" class="${BTN_PRIMARY_LG} ${
              filterDirty() ? '' : 'opacity-40'}">Apply</button><button onclick="clearFilter()"
              class="${BTN_SECONDARY_LG} ${filterDirty() || filterOn() ? '' : 'opacity-40'}">Clear</button>`,
          stick: true,
        })}
      </div>`}
      <div class="min-w-0 flex-1">
        ${Band('sort', SortRow())}
        ${Band('view', Results() + Sentinel(), { note: !P.view ? 'not chosen yet'
          : views().length < 2 ? `${P.view} &mdash; the only layout here`
          : `${P.view} &mdash; picked on the sort bar` })}
      </div>
    </div>`,
  });
};
// the tab comes from the router, so these are the same function four times over
PAGES.search = PAGES.printings = PAGES.binders = PAGES.decks = () => BrowsePage();

/* ======================= IMPORT / EXPORT ==============================
   One alias table, not nine parsers. Export runs the same map backwards. */
// the apps whose exports we read - a different thing from SOURCES, which is
// where the catalogue itself comes from
const EXPORTERS = ['Moxfield','Deckbox','Dragonshield','ManaBox','Cardsphere','Delver Lens','Helvault','Archidekt','Collectr','Deckstats'];
/* Verified from Archidekt's own importer bundle - see docs/import-formats.md.
   Numbers are the column's position in that app's export; '-' means absent. */
/* LANGUAGE HAS A COLUMN, and this said otherwise for as long as the row has
   existed. `NO COLUMN YET` described the DELETED Postgres app's `cards` table,
   which had no `lang` - that app is gone, and the schema map two bands down this
   same page has listed `mtg_card_printings - uuid, lang, finishes, promo` the
   whole time, so the page contradicted itself in two places.
   Language is not merely storable, it is already everywhere: read off the
   printing rather than assumed (2,634 of 107,347 are not English, across 19
   languages), part of `printKey`, a column in Details, a row on the card page,
   a facet in the sidebar, and a token on the import line - `1 Sol Ring (CMR) 700
   [en]`. The one thing it genuinely is not is a fact about a HOLDING; see
   ISSUES.md, because that is a real gap and not this row's business.
   External uid is gone. Nine importers each carry their own id and none of them
   identifies a card - set, collector number and language do, which is why they
   are the key. Carrying a column purely to hand it back on export is a column
   this app has no use for. */
/* COLLECTR'S COLUMN is read off a real export (2,796 rows, 20 portfolios), not
   from documentation, and it is the odd one out in two ways worth having in the
   table rather than in a footnote:
     - it gives the set by NAME and never by code, so it is the only source with
       nothing in `set code`. Matching it means resolving "10th Edition" against
       SETS, which is a lookup the other five can skip.
     - it carries NO language column, in a table where five of the other six do.
   It also blanks the collector number on 936 of those 2,796 rows, which is why
   `set name + product name` has to be a workable match on its own. */
const CANON = [
  ['quantity',         'holdings.quantity',        '1','1','1','7','1','1','11',  1],
  ['card name',        'cards.name',               '3','3','2','1','3','2','4',   1],
  ['set code',         'sets.code',                '4','5','4','2','-','-','-',   1],
  ['set name',         'sets.name',                '-','4','5','3','4','3','3',   1],
  ['collector number', 'cards.collector_number',   '10','6','3','4','-','5','5',  1],
  ['finish / variant', 'holdings.finish',          '7','9','7','5','7','4','7',   1],
  ['condition',        'holdings.condition',       '5','7','8','14','5','-','9',  1],
  ['language',         'mtg_card_printings.lang',  '6','8','9','15','6','-','-',  1],
  ['grouping / tags',  'containers',               '-','18','-','-','-','-','1',  1],
];
const COLS = ['Moxfield','Deckbox','DragShield','ManaBox','Cardsphere','Delver','Collectr'];
/* WHAT AN IMPORT LEFT UNDECIDED. Empty, because nothing has been imported --
   and that is the whole point of it being a list rather than the literal 3 that
   used to be painted into the nav badge, the IO tab's stat and the heading of
   the resolve section. A row lands here when it matches more than one printing:
   `line` is what was typed, `candidates` are the printings it could mean with a
   confidence, `why` names the field that was ambiguous. */
const UNRESOLVED = [];
let IMPORT_ROWS = 0;      // rows in the last file read, for the "N of M"
// the grouping column's distinct values in that file: [name, rows, becomes]
const IMPORT_GROUPS = [];
let IMPORT_NAME = '';     // the file you chose, so the page can say which one
let IMPORT_MATCHED = [];  // [{ card, group }] - rows that resolved to one printing
let IMPORT_MISSED = 0;    // rows that matched no printing at all
let IMPORT_OTHER = 0;     // rows for a different game, skipped rather than missed
let IMPORT_SKIPPED = 0;   // ambiguous rows YOU declined - a decision, not a failure

/* CSV, AND IT HAS TO BE A REAL ONE. Collectr quotes any field containing a
   comma - card names do, constantly ("Sen Triplets, Alpha", every "X, the Y"
   legend) - and doubles a quote inside a quoted field. Splitting on commas
   reads "Kroxa, Titan of Death's Hunger" as two columns and silently shifts
   every column after it, which is the failure mode that looks like a matching
   bug rather than a parsing one.
   ponytail: a character loop rather than a regex. The regex forms of this are
   all subtly wrong on the doubled-quote case, and this is twenty lines that are
   obviously right. */
const parseCsv = (text) => {
  const rows = [];
  let row = [], field = '', quoted = false;
  const s = text.replace(/^﻿/, '');          // Excel writes a BOM; it is not part of the first header
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (quoted) {
      if (ch !== '"') { field += ch; continue; }
      if (s[i + 1] === '"') { field += '"'; i++; continue; }   // "" is one literal quote
      quoted = false; continue;
    }
    if (ch === '"') { quoted = true; continue; }
    if (ch === ',') { row.push(field); field = ''; continue; }
    if (ch === '\r') continue;
    if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; continue; }
    field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  // a trailing newline is not a row of one empty field
  return rows.filter(r => r.some(v => v.trim() !== ''));
};

/* WHICH COLUMN IS WHICH, by header text first and by CANON's positions second.
   Header text is what actually identifies a file - Collectr writes "Market
   Price (As of 2026-08-16)", so the date has to not matter - and the positional
   map is the fallback the table already documents for exports whose headers are
   unfamiliar. */
/* MOST SPECIFIC PATTERN FIRST, WITHIN EACH FIELD, and a column is claimed once.
   Both rules were bought with a real failure rather than reasoned about:
   `category` was in the set-name list and Collectr's second column is
   `Category`, holding "Magic: The Gathering" on all 2,796 rows. It matched
   before the actual `Set` column three places later, so every row resolved to
   no set, fell through to matching on NAME alone, and 119 of 144 sample rows
   came back ambiguous with nine candidate printings each. A file that imports
   as a pile of decisions looks like a matching problem and is a column-mapping
   one.
   So `category` is gone - it names the GAME, not the set - and the two rules
   stop the next one of these: a bare `set` cannot be taken while `set name` is
   still on the table, and a column already spoken for cannot be read twice. */
const HEADER_ALIAS = {
  quantity: [/^(quantity|qty|count|amount)$/],
  'card name': [/^(product ?name|card ?name)$/, /^(name|title)$/],
  'set code': [/^(set ?code|edition ?code|expansion ?code)$/, /^set_?id$/],
  'set name': [/^set ?name$/, /^(edition|expansion)$/, /^set$/],
  'collector number': [/^(collector ?number|card ?number)$/, /^(number|card ?no\.?|cn)$/],
  'finish / variant': [/^(variance|finish|variant)$/, /^(foil|printing|is ?foil)$/],
  condition: [/^card ?condition$/, /^(condition|cond)$/],
  language: [/^(language|lang)$/],
  // read for one purpose only: telling another game's rows apart from a row
  // this catalogue simply does not have. It is NOT a set name - that was the
  // bug above - and nothing else looks at it
  category: [/^(category|game|tcg)$/],
  'grouping / tags': [/^(portfolio ?name|folder ?name)$/, /^(folder|tags?|binder|deck|list)$/],
};
const mapColumns = (head) => {
  const norm = head.map(h => h.trim().toLowerCase().replace(/\s+/g, ' '));
  const at = {}, taken = new Set();
  // one full pass per specificity tier, across ALL fields, so an exact match on
  // any field outranks a loose match on any other
  const tiers = Math.max(...Object.values(HEADER_ALIAS).map(p => p.length));
  for (let t = 0; t < tiers; t++) {
    for (const [field, pats] of Object.entries(HEADER_ALIAS)) {
      if (field in at || !pats[t]) continue;
      const i = norm.findIndex((h, k) => !taken.has(k) && pats[t].test(h));
      if (i >= 0) { at[field] = i; taken.add(i); }
    }
  }
  return at;
};

/* WHAT A ROW MEANS, resolved against the catalogue rather than trusted. The key
   is set + collector number + language, which is what identifies a printing -
   but Collectr gives the set by NAME and blanks the collector number on 936 of
   its 2,796 rows, so set + name has to work on its own. Three attempts, most
   specific first, and a row that matches more than one printing is a decision
   rather than a guess. */
const SET_BY_NAME = () => (SET_BY_NAME.m ||= new Map(SETS.map(r => [r[0].toLowerCase(), r[1]])));
/* COLLECTR NAMES SETS ITS OWN WAY, and the ways are systematic rather than
   arbitrary - which is the difference between a short list of NORMALISATIONS
   and a fuzzy matcher. Every step below was bought with a row count off the
   real 2,796-row export, worst first, and nothing is here that did not pay:
     (M15)             the parenthetical IS the set code, handed over free   214
     Universes Beyond: a prefix Scryfall does not use                        236
     10th Edition      Scryfall spells the ordinal: "Tenth Edition"          210
     Commander: X      Scryfall says "X Commander"                            56
   Measured end to end: 2,547 of 2,607 Magic rows resolve their set, 97.7%.
   THE REMAINING 60 STAY UNRESOLVED ON PURPOSE. They are a long tail of promo
   sets - Buy-A-Box Promos, FNM Promos, Media Promos, Coldsnap Theme Deck
   Reprints - where the name maps to no single set and guessing one would file
   cards under a printing you do not own. That is what the resolve step is for. */
const ORDINAL = { '4th': 'Fourth', '5th': 'Fifth', '6th': 'Sixth', '7th': 'Seventh',

const SET_NORM = [
  x => x,
  x => x.replace(/^Universes Beyond:\s*/i, ''),
  x => x.replace(/\s*\([^)]*\)\s*$/, ''),
  x => x.replace(/^(\d+)(st|nd|rd|th)\s+Edition$/i, (_, n, o) => `${ORDINAL[n + o.toLowerCase()] || n} Edition`),
  x => x.replace(/^Commander:\s*(.+)$/i, '$1 Commander'),

const setCodeOf = (name) => {
  const s = (name || '').trim();
  if (!s) return '';
  const paren = /\(([A-Za-z0-9]{2,6})\)\s*$/.exec(s);
  if (paren && SET_BY_CODE.get(paren[1].toUpperCase())) return paren[1].toUpperCase();
  // applied CUMULATIVELY: "Universes Beyond: X (Y)" needs two of them
  let t = s;
  for (const step of SET_NORM) {
    t = step(t);
    const hit = SET_BY_NAME().get(t.trim().toLowerCase());

const FOIL_WORD = /^(foil|holo|holofoil|etched|foil etched|rainbow foil)$/i;
function resolveRow(v) {
  const code = (v['set code'] || '').toUpperCase() || setCodeOf(v['set name']);
  const num = (v['collector number'] || '').trim();
  const name = (v['card name'] || '').trim();
  const lang = (v.language || '').trim().toLowerCase() || P.lang;
  const pool = ALL();
  /* THE SIX ROWS THAT RESOLVED TO NOTHING WERE TWO FAULTS, NOT SIX ODDITIES, and
     both are the same shape: the row's name is a PREFIX of the catalogue's.
       - Collectr writes the variant into the product name - "Herald's Horn
         (Extended Art)", "Insidious Bookworms (Version 2)", "Frogkin Kidnapper
         (No PW Symbol)". 39 rows in the export end in a parenthetical; they only
         bite when the set did not resolve, because set+number never reads a name.
       - A transform card is named by its FRONT FACE where the catalogue carries
         both - "Grizzled Outcasts" against "Grizzled Outcasts // Krallenhorde
         Wantons". 4,926 catalogue rows have a // name, so this one is wide.
     As written FIRST and reduced second, never the reverse: "Insidious Bookworms
     (Version 2)" must not match Version 1 while an exact row still exists. */
  const bare = name.replace(/\s*\([^)]*\)\s*$/, '').trim();
  const isName = (c, n) => n && (c.n === n || String(c.n).split(' // ')[0] === n);
  let hits = code && num ? pool.filter(c => c.set === code && c.num === num) : [];
  for (const n of hits.length ? [] : [name, bare]) {
    if (code) hits = pool.filter(c => c.set === code && isName(c, n));
    if (!hits.length) hits = pool.filter(c => isName(c, n));
    if (hits.length) break;
  }
  if (!hits.length) return { hits: [], lang };
  // a language the row named narrows it, when the catalogue has such a row
  const inLang = hits.filter(c => (c.lang || 'en') === lang);
  return { hits: inLang.length ? inLang : hits, lang };
}

/* THE FILE, READ. This is what "Choose file" and "Run" were missing: the input
   had no onchange and the button no onclick, so every section below them
   described a mapping that nothing executed. Reading is separate from applying
   - the groups and the unresolved rows are shown first, and nothing is written
   into a binder or a deck until Apply, which is what the bar has always said. */
async function readImport(file) {
  if (!file) return;
  IMPORT_NAME = file.name;
  IMPORT_GROUPS.length = 0; UNRESOLVED.length = 0; IMPORT_MATCHED = [];
  IMPORT_MISSED = 0; IMPORT_OTHER = 0; IMPORT_SKIPPED = 0;
  const rows = parseCsv(await file.text());
  if (rows.length < 2) { IMPORT_ROWS = 0; render(); return; }
  const at = mapColumns(rows[0]);
  const body = rows.slice(1);
  IMPORT_ROWS = body.length;
  const groups = new Map();
  for (const r of body) {
    const v = {};
    for (const f in at) v[f] = (r[at[f]] ?? '').trim();
    /* ANOTHER GAME'S ROWS ARE SKIPPED, NOT MISSED. The real export is 2,796
       rows and 189 of them are YuGiOh - a Magic catalogue cannot match those
       and should not be reporting them as cards it failed to find, which reads
       as a matching bug. Counted separately and named on the page. */
    if (v.category && !/magic/i.test(v.category)) { IMPORT_OTHER++; continue; }
    const { hits, lang } = resolveRow(v);
    const group = v['grouping / tags'] || '(no group)';
    if (!hits.length) { IMPORT_MISSED++; continue; }
    // the FINISH is the holding's, not the printing's - one printing is issued
    // in several and which one you own is the thing the row is telling you
    const hold = { qty: Math.max(1, +v.quantity || 1),
      foil: FOIL_WORD.test(v['finish / variant'] || '') ? 1 : 0, lang };
    if (hits.length > 1) {
      /* THE HOLDING'S OWN FACTS RIDE ALONG, because picking a candidate now
         writes a real holding: without them a foil Japanese copy came back from
         the resolve step as a nonfoil English one, which is the rehydrate bug
         again in a different place. `line` is what the row LOOKS like, `hold` is
         what is yours. */
      UNRESOLVED.push({ line: { ...hits[0], ...hold, n: v['card name'] },
        why: `${hits.length} printings match`, hold, group,
        // ponytail: the top 6 are drawn, not all of them - 154 rows x every hit
        // is a few thousand card frames in one render. A row that cannot be
        // settled from six stays in the list, exactly as it did before.
        candidates: hits.slice(0, 6).map(c => [c, Math.round(100 / hits.length)]) });
      continue;
    }
    IMPORT_MATCHED.push({ group, card: { ...hits[0], ...hold } });
    groups.set(group, (groups.get(group) || 0) + 1);
  }
  /* GROUP KIND DEFAULTS, by size. > 300 rows is "everything that didn't fit
     anywhere else" — unsorted, left as '' so the row says "→ skipped" until
     you name it. > 100 is a single large binder (a portfolio, a deckbox, a
     folder). ≤ 100 is a deck (the median deck is 60 cards; "Mono-Red Burn"
     was 74 in the sample). The thresholds are read at import time, not
     stored — change any of them before pressing Apply. */
  const kindFor = c => c > 300 ? '' : c > 100 ? 'binder' : 'deck';
  for (const [n, c] of [...groups].sort((a, b) => b[1] - a[1])) IMPORT_GROUPS.push([n, c, kindFor(c)]);
  render();
}
/* THE ONE THING YOU COULD DO WITH AN AMBIGUOUS ROW WAS LEAVE IT. The section
   rendered 154 rows with ranked candidates, and its tiles and its Skip button
   had no handlers - the same defect as the inert Run button, one screen down.
   Both directions are a DECISION and both remove the row: picking writes the
   holding you meant, Skip records that you declined. Skip is counted apart from
   IMPORT_MISSED on purpose - "no printing matched" and "I chose not to file
   this" are different outcomes and a single number would hide which. */
function resolveUnresolved(i, ci) {
  const u = UNRESOLVED[i];
  if (!u) return;
  UNRESOLVED.splice(i, 1);
  if (ci < 0) IMPORT_SKIPPED++;
  else {
    IMPORT_MATCHED.push({ group: u.group, card: { ...u.candidates[ci][0], ...u.hold } });
    /* The group may not be on the page yet: IMPORT_GROUPS is built from rows
       that resolved, so a portfolio whose every row was ambiguous had no line
       to send anywhere. Resolving the first one is what creates it. */
    const g = IMPORT_GROUPS.find(x => x[0] === u.group);
    if (g) g[1]++; else IMPORT_GROUPS.push([u.group, 1, 'binder']);

   along. A group set to nothing is skipped rather than filed under a name you
   did not choose, and a name that already exists is added TO rather than
   replaced - importing the same portfolio twice is a top-up, not a rebuild. */
/* CLEAR HOLDINGS, scoped to the rows an import landed in. Holdings live on the
   `row[4]` of each binder/deck entry, so "clear holdings" means emptying those
   arrays AND dropping the containers the import made - their `r[3]` is
   literally 'imported', the same field a draft-tagged row uses for its origin
   line. A binder tagged '4 × 4 pockets' (or a deck tagged '4 × Pack · sealed')
   is one YOU made; it stays, just empty. The reset of r[1]/r[2] keeps a
   hand-made deck's selector line from lying about a card count that just
   hit zero. No reload, because the in-memory state already has what

const clearHoldings = () => {
  const total = [...LISTS.decks, ...LISTS.binders].reduce((n, r) => n + (r[4]?.length || 0), 0);
  if (!total) return;
  if (!confirm(`Clear ${total} holding${total === 1 ? '' : 's'} across every binder and deck? The containers the import made go with them; anything you made yourself stays, just empty.`)) return;

  LISTS.binders = LISTS.binders.filter(r => r[3] !== 'imported');
  for (const r of LISTS.decks) { r[1] = 0; r[2] = '0 distinct'; }
  for (const r of LISTS.binders) { r[1] = 0; r[2] = [...P.dims]; }

  saveState();
  render();

    if (!k) continue;
    const list = k === 'deck' ? LISTS.decks : LISTS.binders;
    let row = list.find(r => r[0] === group);

       literal. A binder describes itself by PAGE SHAPE and a deck by its
       counts, and `listLine` reads index 2 as a [cols, rows] PAIR for binders -
       so a blank there rendered nineteen imported binders as "undefined ×

       which is what a binder you have not measured yet is.

       the membership and the membership is what just changed. */
    if (!row) {

    // is more copies of it, not a second entry

  for (const r of LISTS.decks) if (made.has(r[0])) {
    r[1] = r[4].reduce((n, c) => n + (c.qty || 0), 0);
    r[2] = `${new Set(r[4].map(c => c.n)).size} distinct`;

/* One row per source, and the row now answers three questions in the order

     2. where from?      Local / Online, the choice
     3. what will it cost, and what do I type to get it?

   side that had drifted from the truth on five of the eight rows. "Is it here"
   was not answerable at all, which is the question that decides whether the
   app works on a train. */
/* Asked PER QUALITY, not per source. It used to answer only for the size that
   happened to be selected, so switching Scryfall images from art_crop to png
   made a directory holding 107k crops read "not fetched" - true of png,
   useless as an answer, and it hid the one thing the row is for: which of these
   five have I actually got. onDisk already took a quality; nothing asked it. */
const DiskChip = (k, q = CFG.src[k].q) => {
  const s = SOURCES[k], have = onDisk(k, q);
  if (have === null) return `<span class="text-neutral-600"
    title="serve.py answers this; run it, or this is check.mjs with no server">not checked</span>`;
  if (!have) return `<span class="text-neutral-700" title="${esc(s.file(q))}">&mdash;</span>`;
  // a directory that holds a tenth of what it should is not "on disk", and
  // saying so is the whole reason the count is carried through from serve.py
  const part = have.of && have.n < have.of;
  return `<span class="${part ? 'text-amber-500/90' : 'text-emerald-400/90'}"
    title="${esc(s.file(q))} &mdash; ${bytes(have.bytes)}, ${ago(have.mtime)}">${
    have.of ? `${num(have.n)} of ${num(have.of)}` : 'on disk'} &middot; ${bytes(have.bytes)}</span>`;
};

   you could not read down a column to see which sizes are on the disk, because
   there were no columns, and the disk answer only ever described the ONE size
   that happened to be selected.

/* DEFAULT LANGUAGE SITS WITH THE GAME, because it is the same kind of decision:

function setLang(l) {
